When you compose, start with one of these as a foundation, then add a melody over it.","listen":["Listen for a short pattern that keeps repeating, usually in the bass or guitar.","Listen for one low note that never seems to stop.","Notice whether the repeating part stays the same while the parts above it change."],"example":"The piece is built on a repeating bass **ostinato** with a **drone** on D underneath, while the melody above changes each time it is repeated."},"Pitch devices>Riff":{"what":["A riff is a short, catchy musical pattern that repeats many times through a song. It is often only one or two bars long.","Riffs are usually played by the guitar, bass guitar or keyboard, sometimes by a horn section. 'Riff' is the word used in rock, pop, funk and jazz. A classical musician would call the same idea an ostinato."],"use":"A riff can be the most memorable part of a song, even more than the vocal tune. The guitar riff in Deep Purple's Smoke on the Water is a famous example. When you compose, write a two-bar pattern on the low strings of a guitar or bass using a few notes, add some syncopation and repeat it.","listen":["Listen for a short pattern you could hum after hearing it once or twice.","Notice which instrument plays it, often electric guitar or bass.","Check whether it comes back between the verses or keeps going under the singing."],"example":"The song opens with a syncopated bass guitar **riff** that repeats under the verse, which makes the song instantly recognisable and keeps it driving forward."},"Pitch devices>Ostinato":{"what":["An ostinato is a short pattern that repeats over and over while other music happens above or around it. 'Ostinato' comes from the Italian word for stubborn.","A melodic ostinato repeats pitches as well as rhythm. A rhythmic ostinato repeats only a rhythm, as on a drum. Ostinato is the general term, used in classical and world music; 'riff' is the pop and rock name for a similar idea."],"use":"Ostinatos hold a piece together and build tension. The bass line of Pachelbel's Canon is a famous melodic ostinato: the same eight notes repeat while the violins play above. In class, an ostinato is an easy part to add on xylophone or boomwhackers. Make one by choosing three or four notes from the scale and repeating them in a one-bar pattern.","listen":["Listen for a pattern that repeats exactly, many times in a row.","Notice whether it is pitched (a tune) or only a rhythm.","Hear the other parts changing while the ostinato stays the same."],"example":"The xylophones play a one-bar melodic **ostinato** under the whole piece, which keeps the music steady while the recorder melody changes above it."},"Pitch devices>Drone":{"what":["A drone is a long note, or two notes, held or repeated underneath the music for a long time, often for the whole piece. Usually the notes are the tonic and the 5th above it (D and A, for example).","The drone does not change while the melody moves above it, so some melody notes blend with it and others clash and then resolve."],"use":"Drones are a key sound in bagpipe music, where drone pipes sound under the chanter melody, and the didgeridoo (yidaki) is played with a continuous drone. Indian classical music uses a drone from the tanpura. When you compose, hold the tonic and 5th on a low instrument and improvise a tune above.","listen":["Listen for a low hum that never stops or changes pitch.","Notice the melody moving freely above that one sound.","Listen for moments where the melody clashes with the drone and then settles."],"example":"Under the melody the bagpipes hold a **drone** on the same low notes for the whole piece, which gives the music a steady, ancient-sounding background."},"Pitch>Ways of notating pitch":{"what":["There is more than one way to write pitch down. Staff notation shows exact pitches on five lines with a clef. Tablature (TAB) shows where to put your fingers on a guitar or bass. Graphic notation uses shapes and pictures.","Each method suits different players and different music. Staff notation shows the most detail, TAB is quick for guitarists and graphic notation suits experimental pieces and sound effects."],"use":"Pianists, orchestras and choirs read staff notation, rock guitarists and bassists often read TAB, and composers of experimental or film soundscapes may use graphic scores. When you compose, choose the notation that the performer can read and that fits your music.","listen":["As you listen, follow the score with your finger to connect sound and symbols.","Notice that higher sounds are written higher in staff notation and in graphic notation.","Compare how the same tune looks in staff notation and in TAB."],"example":"The guitarist reads the riff from **TAB**, while the singer reads the melody in **staff notation**, so each performer has the notation that suits their instrument."},"Ways of notating pitch>Staff notation":{"what":["Staff notation writes notes on a staff (or stave) of five lines and four spaces. The higher the note sits on the staff, the higher the pitch. A clef at the start tells you which notes the lines and spaces stand for.","The treble clef is used for higher instruments and voices (flute, violin, right hand of piano). The bass clef is used for lower ones (bass guitar, cello, left hand of piano). Staff notation also shows rhythm, so it gives the full picture of a tune."],"use":"Staff notation is the standard way music is written across the world, from orchestras to school bands and choirs. Guitar music sometimes uses a treble clef with a small 8 underneath, which means the notes sound an octave lower than written. Practise reading it a little each day: knowing the lines and spaces in both clefs makes everything easier.","listen":["Follow the notes up and down the staff while the music plays.","Check that when the line of notes rises, you hear the pitch rise.","Notice that long notes (minims, semibreves) look different from short ones (quavers)."],"example":"In **staff notation** the melody climbs from the bottom line of the treble staff to the top, and you can hear it rise in pitch as it builds to the climax.","fig":[{"file":"ref_grand_staff.png","caption":"Treble and bass staves joined as a grand staff: middle C sits between them"}]},"Ways of notating pitch>Tablature (TAB)":{"what":["Tablature (TAB) is a way of writing music for fretted string instruments like guitar, bass and ukulele. Each horizontal line is a string, with the highest-sounding string at the top. The numbers tell you which fret to press. A 0 means play the string open.","TAB tells you where to play, not the note name. Basic TAB often does not show rhythm, so you need to know how the song goes or read it with staff notation."],"use":"Guitarists and bassists use TAB because it is fast to read and shows exactly where to put each finger, and it is common in online song sites and guitar books. Guitar TAB has six lines and bass TAB has four. When you write a riff, check you can play it before writing the fret numbers in TAB.","listen":["Listen for which string a note is on: lower strings sound lower.","Notice open strings (0) ringing, often low and full.","Higher fret numbers on the same string give higher pitches."],"example":"The riff is written in **TAB** on the bottom two strings, using frets 0 and 3, which gives the guitar part a low, heavy sound."},"Ways of notating pitch>Graphic notation":{"what":["Graphic notation uses shapes, lines, colours and pictures instead of standard notes. Usually height shows pitch (higher on the page is higher in pitch), width shows how long a sound lasts and size shows how loud it is.","There are no fixed rules. Each graphic score comes with a key that explains what its symbols mean, and performers make some choices for themselves."],"use":"Graphic notation is used by 20th-century and contemporary composers for sounds that standard notation cannot show well, such as slides, clusters, electronic sounds and sound effects. It is great for class compositions using voices, found sounds or technology. When you make one, draw a time line across the page and create a key for your symbols.","listen":["Follow the shapes from left to right with your finger as the music plays.","Match rising lines to sliding pitches and big shapes to loud sounds.","Notice that performances of the same graphic score can sound different each time."],"example":"In the class **graphic score** a long rising line shows the voices sliding upward while growing dots show short sounds getting louder, so the performers know the shape of the music without reading notes."},"Elements of Music>Texture":{"what":["Texture is about the layers of sound in a piece and how they fit together. A layer is one musical line, like the vocal melody, the strummed chords or the drum part.","When you describe texture you talk about three things: how many layers there are (density), what job each layer does (its role) and how the layers relate to each other (the type of texture, such as monophonic, homophonic or polyphonic)."],"use":"Composers change the texture to shape a piece. A song might open with one instrument, add the band for the chorus, then drop back to a single voice at the end. When you compose or arrange, plan which layers play in each section so the music builds up and thins out on purpose.","listen":["Count the layers you can hear at one moment, then count again in the next section.","Pick out which layer has the tune and which layers are backing it up.","Notice when an instrument drops out or joins in, because that is where the texture changes."],"example":"In the chorus the **texture** becomes **thicker** as lead guitar joins the vocals, keyboard, bass and drums, and the **homophonic** backing makes the melody sound bigger than in the verse.","fig":[{"file":"ex_texture_graph.png"}]},"Texture>Density":{"what":["Density is how thick or thin the music sounds. It depends mostly on how many layers are playing at once, but also on how busy each layer is and how close together the notes sit.","A few layers give a thin texture. Lots of layers give a thick texture. Most music sits somewhere in between and moves up and down as the piece goes on."],"use":"Changing density is one of the easiest ways to create contrast. Pop songs often keep the verse fairly thin and make the chorus thick so it hits harder. Film composers start thin for a quiet scene and pile on layers for a big moment. In your own pieces, try adding one layer at a time to build towards a climax.","listen":["Listen for the moment when the drums or bass come in, as that usually thickens the sound a lot.","Compare the start of the piece with the loudest section and count the difference in layers."],"example":"The **density** grows from **thin** to **thick** across the excerpt, starting with a solo piano and adding bass, drums and strings until the full band plays in the final chorus.","fig":[{"file":"rm_s4_tex_thin_thick.png","caption":"The same tune: thin with one layer, then thick with three layers"}]},"Density>Thin":{"what":["A thin texture has only one or a few layers, so there is lots of space in the sound. A solo flute, one person singing on their own or a singer with a single quiet guitar all sound thin.","Thin does not mean bad or weak. It means you can hear every line clearly."],"use":"Composers use a thin texture for gentle, lonely, calm or personal moments, and for intros and outros. It is also used just before a big section so the next part feels bigger by contrast. When you perform in a thin texture every note is exposed, so your tuning and timing need to be extra careful.","listen":["Listen for a single instrument or voice with very little or nothing behind it.","Notice if you can easily follow each part on its own.","Check whether the bass and drums have dropped out, which often makes the sound thin."],"example":"The intro has a **thin** texture, with just a solo flute playing the melody, which makes the opening sound lonely and quiet.","fig":[{"file":"rm_s4_tex_thin_thick.png","caption":"The same tune: thin with one layer, then thick with three layers"}]},"Density>Thick":{"what":["A thick texture has many layers playing at the same time, so the sound is full and rich. A full orchestra, a rock band with backing singers or a big choir singing in parts all make thick textures.","Every instrument you add makes the texture thicker. Doubling a part (two instruments playing the same line) also makes it sound fuller."],"use":"Composers use thick textures for powerful, exciting or grand moments, like the final chorus of a song or the climax of a film cue. Ravel's Bolero is a famous example: it starts with one instrument playing the tune over a quiet snare drum and keeps adding instruments until the whole orchestra plays. In your own music, save the thickest texture for the most important section.","listen":["Listen for many instruments or voices sounding at once, so you can no longer pick each one out easily.","Notice extra layers such as backing vocals, strings or a second guitar joining in.","Check if the sound feels fuller and bigger even when the volume stays about the same."],"example":"In the final chorus the texture is **thick**, as backing vocals, strings and a second guitar join the band, which makes the ending sound grand and powerful.","fig":[{"file":"ex_orchestra_layout.png","caption":"A full orchestra can make a very thick texture"}]},"Density>Texture graph":{"what":["A texture graph (also called a layer diagram) is a chart that shows which instruments are playing in each section of a piece. Each row is one instrument and each column is one section. A coloured block means that instrument is playing.","Count the blocks in a column to see how many layers are playing. More blocks means a thicker texture."],"use":"Teachers and composers use texture graphs to see the shape of a whole piece at a glance. When you analyse a song, make your own graph while you listen: write the sections across the top, the instruments down the side and colour in a block each time you hear one play. When you compose, sketch a graph first to plan where the music builds and where it drops back.","listen":["Listen through once just for the section changes, then once for each instrument.","Mark the exact section where each instrument enters or drops out.","Count the coloured blocks in each column to compare thin and thick sections."],"example":"The **texture graph** shows the density building from one layer in the intro to five layers in the **chorus**, then dropping back to one layer in the outro."},"Texture>Roles of layers":{"what":["Each layer in a piece has a job, or role. The three main roles are melodic (the tune), harmonic (the chords that support the tune) and rhythmic (the beat and groove that keep everyone together).","Some layers do more than one job. A bass line plays the lowest note of each chord, so it helps the harmony, and it also locks in with the drums to drive the rhythm."],"use":"Almost every band and ensemble shares out these roles. In a rock band the singer has the melody, the guitar and keyboard play chords and the bass and drums hold the groove. When you arrange a piece for your class, make sure each role is covered so the music feels complete.","listen":["Find the melody first: it is usually the part you could sing back.","Listen underneath it for the chords that change every bar or two.","Listen for the steady beat and groove, usually from drums, percussion and bass."],"example":"In the verse the vocals carry the **melodic** layer, the acoustic guitar provides the **harmonic** layer with strummed chords, and the bass and drums form the **rhythmic** layer with a steady groove."},"Roles of layers>Melodic":{"what":["The melodic layer is the tune. It is the main line that grabs your attention and the part you would sing or hum if someone asked you how the song goes.","Usually the melody is on top (the highest part), but not always. Sometimes a cello or bass instrument has the tune in a low register while other instruments play above it."],"use":"In songs the singer usually has the melodic layer, and instruments take it over in solos or instrumental breaks. In orchestral music the tune is often passed between instruments, for example from the violins to a flute. When you perform the melody, play it a little louder than the backing so it stands out.","listen":["Ask yourself which part you could sing back after one listen.","Listen for the line that moves the most and has the most interesting shape.","Notice when the tune passes from one instrument to another."],"example":"In the second verse the **melodic** layer moves from the voice to the violin, which gives the tune a new, softer tone colour."},"Roles of layers>Harmonic":{"what":["The harmonic layer is the chords and accompaniment that sit underneath the melody and support it. A chord is three or more notes played together.","Chords can be played as block chords (all the notes at once, like a strummed guitar) or as broken chords (one note at a time, like a piano playing a repeating pattern)."],"use":"Guitar, piano, keyboard, ukulele and string sections often play the harmonic layer. The chords set the mood: major chords tend to sound bright and minor chords darker. When you accompany a singer, try both ways of playing the chords and choose the one that suits the style.","listen":["Listen under the melody for notes that change together every bar or two.","Notice whether the chords are strummed or held (block) or rippled one note at a time (broken).","Listen for whether the chords sound bright (major) or sad (minor)."],"example":"The piano plays the **harmonic** layer as broken chords in quavers, which gives a gentle, flowing support under the vocal melody.","fig":[{"file":"rm_s4_tex_block_broken.png","caption":"The same chords two ways: block chords (all notes at once) and broken chords (one note at a time)"}]},"Roles of layers>Rhythmic":{"what":["The rhythmic layer keeps the beat and creates the groove. It is usually played by the drum kit and other percussion, and the bass line often joins in by locking its rhythm with the bass drum.","This layer tells your body where the beat is. It is the part that makes you want to tap your foot or nod your head."],"use":"In pop, rock and dance music the drum kit and bass guitar form the rhythm section. In other music the rhythmic layer might be clapsticks, tabla, a shaker or a strummed guitar with a strong pattern. When you compose, write a short repeating drum pattern first and build the other layers on top of it.","listen":["Tap along with the music and notice which instrument you are following.","Listen for the bass drum on the strong beats and the snare drum on beats 2 and 4.","Notice if the bass player's rhythm matches the bass drum."],"example":"The drums and bass form the **rhythmic** layer, with a steady backbeat on beats 2 and 4 that gives the song a strong, danceable groove.","fig":[{"file":"ex_backbeat.png","caption":"A rock drum pattern: hi-hat on every quaver, bass drum on beats 1 and 3, snare on beats 2 and 4"}]},"Texture>Types of texture":{"what":["Types of texture describe how the layers relate to each other. In unison and monophonic textures there is only one melody line. In a homophonic texture there is one melody with chords underneath. In a polyphonic texture two or more different melodies happen at the same time.","The key question is how many separate tunes you can hear, and whether the other parts are tunes or just backing."],"use":"Composers often switch between types to keep music interesting. A choir piece might start in unison, change to homophonic harmony, then finish with voices entering one after another in a polyphonic section. When you arrange, try changing the type of texture in one section to give contrast.","listen":["Listen for how many different tunes are going at once.","Decide whether the extra parts are tunes of their own or chords backing up one tune.","Notice if everyone suddenly plays the same notes, which is unison."],"example":"The piece begins **monophonic** with a solo voice, becomes **homophonic** when the guitar strums chords underneath and turns **polyphonic** in the last verse when a second voice sings a different melody at the same time."},"Types of texture>Unison":{"what":["Unison means everyone sings or plays exactly the same notes at the same time. Even if there are many performers, you only hear one melody line.","When men and women sing the same tune, the notes are often an octave apart. This is still heard as unison (sometimes called singing in octaves)."],"use":"Unison gives a strong, united sound, so you hear it in anthems, chants, football songs and big riffs where the whole band plays the same line. Composers also use it to make a tune stand out clearly before they add harmony. When you perform in unison, listen hard to the people around you so you match their pitch and timing exactly.","listen":["Listen for many voices or instruments but only one tune.","Check that no one is singing a different note or a harmony part.","Notice if the sound is powerful but still clear and simple."],"example":"The opening riff is played in **unison** by the guitar, bass and keyboard, which makes it sound strong and unified."},"Types of texture>Monophonic":{"what":["A monophonic texture is a single melody line with no accompaniment at all. There are no chords and no backing, just one tune.","It can be one person (a solo singer or solo flute) or a group in unison, as long as they all perform the same single line."],"use":"Monophonic texture is common in chant, lullabies, solo bugle calls and the openings of songs. Composers use it to sound simple, lonely, ancient or very personal. In a composition you could open with a monophonic melody, then add chords underneath so the listener hears the change.","listen":["Listen for one tune with nothing else going on.","Check there are no chords, bass line or drums underneath.","If there are several performers, check they are all on the same line."],"example":"The song opens with a **monophonic** texture, as the singer performs the first line alone with no accompaniment, which makes it sound bare and personal."},"Types of texture>Homophonic":{"what":["A homophonic texture has one main melody supported by chords or accompaniment. The backing parts move along with the tune but are not separate tunes of their own.","A singer with a strummed guitar, a pianist playing a tune in the right hand and chords in the left, and most pop songs are all homophonic. Homophonic is the most common texture in music you hear every day."],"use":"Homophony puts the melody clearly in front, so it suits songs where the words matter. Hymns are often homophonic too, with all the voices moving in the same rhythm to make chords. When you compose a song, write the melody first, then add chords underneath to make a homophonic texture.","listen":["Find the main tune, then check that the other parts are backing it rather than playing their own tunes.","Listen for chords changing under the melody.","Notice if all the parts move in the same rhythm together, as in a hymn."],"example":"In the verse the texture is **homophonic**, with the voice singing the melody over strummed acoustic guitar chords, which keeps the words clear."},"Types of texture>Polyphonic":{"what":["A polyphonic texture has two or more independent melodies happening at the same time. Each line is a real tune that could make sense on its own, and they weave together.","A round such as Frere Jacques is polyphonic: everyone sings the same tune but starts at different times, so different parts of the tune overlap. Polyphony can also be two completely different tunes played together."],"use":"Polyphony is common in Baroque music (for example Bach), in choir music and in jazz, where several instruments improvise at once. It makes the music sound busy and interesting because your ear can follow more than one line. Try it by singing a round in groups, or by writing a second tune that moves while your first tune holds long notes.","listen":["Listen for more than one tune at once, each with its own shape and rhythm.","Try following one line, then switch your attention to another.","Notice voices coming in one after another with the same tune, as in a round."],"example":"In the final section the texture becomes **polyphonic**, as the second voice enters two bars later with the same tune, so the two lines overlap and the music sounds busier."},"Elements of Music>Structure":{"what":["Structure (also called form) is how the sections of a piece are organised: what comes first, what repeats and what is new.","It works at two levels. Macrostructure is the big plan, like verse-chorus or A B A. Microstructure is the small building blocks inside each section, like motifs, phrases and riffs. Musicians label sections with letters: A for the first idea, B for a new contrasting idea, and so on."],"use":"Every piece balances repetition (so the listener can remember it) and contrast (so it does not get boring). Composers plan a structure before they write, and performers use structure to know where they are. When you compose, decide your sections first and label them with letters.","listen":["Listen for when a new section starts: a change of tune, instruments, dynamics or words.","Notice when an earlier section comes back.","Give each section a letter as you listen and write the pattern down."],"example":"The piece is in **ternary form (A B A)**: the opening **phrase** returns after a contrasting B section in a minor key, which gives the music a sense of balance."},"Structure>Macrostructure":{"what":["Macrostructure is the big picture of a piece: the main sections and the order they come in. It is like the chapters of a book.","Common macrostructures include binary (A B), ternary (A B A), rondo (A B A C A), verse-chorus, 12-bar blues and cyclic form."],"use":"Different styles tend to use particular forms. Pop songs are usually verse-chorus, blues uses the 12-bar pattern, and a lot of classical dance music is binary or ternary. When you compose, choosing a form gives you a plan to follow.","listen":["Listen for repeats: which sections come back the same or nearly the same?","Listen for contrast: which sections sound new?","Write the sections down as letters and match the pattern to a form."],"example":"The **macrostructure** is **rondo (A B A C A)**, with the catchy A section returning between two contrasting sections."},"Macrostructure>Binary – A B":{"what":["Binary form has two contrasting sections, A and B. The B section uses different musical ideas, but it usually sounds as if it belongs with A (same style, similar instruments).","In older dance music each section is often repeated, so you hear A A B B. The A section often ends feeling unfinished and the B section brings the music home."],"use":"Binary form was used a lot in Baroque dances such as minuets and gigues, and it turns up in many folk tunes. Two balanced halves make it easy to follow. To compose in binary form, write an A section of 4 or 8 bars, then a B section of the same length that changes the melody or rhythm.","listen":["Listen for one clear change to a new section partway through.","Check that the first section does not come back at the end.","Listen for repeat signs being followed, so you hear A twice and then B twice."],"example":"The piece is in **binary form**, with each section repeated, and the B section contrasts with A by moving higher and using more quavers.","fig":[{"file":"rm_s4_str_binary.png","caption":"A short piece in binary form: section A is repeated, then section B is repeated"}]},"Macrostructure>Ternary – A B A":{"what":["Ternary form has three sections in the pattern A B A. The first section (A) is followed by a contrasting section (B), then A comes back.","The return of A gives the piece balance and makes it feel finished. The second A can be exactly the same or slightly changed (sometimes written A B A1)."],"use":"Ternary form is used in many classical pieces, songs and pieces for students. The B section often contrasts by changing key, mood, tempo or texture. To compose in ternary form, write an A section, then a B section that feels different, then repeat A.","listen":["Listen for a contrasting middle section.","Listen for the opening tune coming back at the end.","Notice what changes in the B section: key, mood, tempo or instruments."],"example":"The music is in **ternary form**, because the gentle opening melody returns after a faster, louder B section, so the piece ends calmly the way it began."},"Macrostructure>Rondo – A B A C A":{"what":["Rondo form has a main section (A) that keeps coming back between new sections. The pattern is A B A C A, and it can be longer, such as A B A C A D A.","The A section is called the refrain because it returns like a chorus. The other sections are called episodes and each one is different."],"use":"Rondo form is common in Classical music, especially the last, fast movement of concertos and sonatas, because the returning tune gives a lively, cheerful feel. When you compose a rondo, make the A section short and catchy so it is easy to recognise each time it comes back.","listen":["Listen for one catchy tune that keeps coming back.","Count how many different new sections appear between the returns.","Label every section with a letter and check for A B A C A."],"example":"The piece is in **rondo form**, as the bouncy A theme returns three times, separated by a calm B section and a minor-key C section."},"Macrostructure>Verse–chorus":{"what":["Verse-chorus form is the structure of most pop and rock songs. Verses tell the story and change their words each time. The chorus repeats the same words and tune and contains the hook (the catchiest part).","A typical plan is intro, verse, chorus, verse, chorus, bridge, chorus, outro. Many songs also have a pre-chorus, a short section that builds from the verse into the chorus."],"use":"Songwriters use this form because the repeated chorus is easy to remember and sing along to. The chorus is usually louder, higher and thicker in texture than the verse. When you write a song, write the chorus first, then write verses that lead into it.","listen":["Listen for the section whose words repeat exactly each time: that is the chorus.","Listen for sections with the same tune but new words: those are the verses.","Notice a section that sounds different and only happens once, usually the bridge."],"example":"The song is in **verse-chorus form**, with the **chorus** returning three times, and each chorus has a thicker texture than the verse before it."},"Macrostructure>12-bar blues":{"what":["The 12-bar blues is a chord pattern that lasts 12 bars and repeats for the whole song. It uses three chords: I, IV and V (in C major these are C, F and G).","The usual pattern is I I I I, IV IV I I, V IV I I. Each time through the 12 bars is called a chorus or a cycle. The lyrics often follow an A A B pattern: a line is sung, repeated, then answered."],"use":"The 12-bar blues comes from African-American music and is the base of a lot of blues, rock and roll, early rock and jazz. Because everyone knows the chords, musicians can improvise solos over it. When you perform it, count the bars carefully and listen for the change to chord V in bar 9.","listen":["Count the bars in groups of four and listen for the chord change in bar 5.","Listen for the strongest change in bar 9, when chord V arrives.","Notice the lyrics: a line sung twice, then a different answering line."],"example":"The song follows a **12-bar blues** pattern, with chord IV arriving in bar 5 and chord V in bar 9, and the singer's line is repeated before an answering line, which follows the A A B blues lyric pattern."},"Macrostructure>Cyclic":{"what":["Cyclic form is built on a pattern or loop that repeats around and around for most or all of a piece. The pattern might be a chord loop, a riff, an ostinato or a rhythm cycle.","Interest comes from what is added on top of the loop: new melodies, new instruments, changes in dynamics or texture."],"use":"Cyclic structures are common in many musics of the world, such as Indonesian gamelan, West African drumming and Indian music, as well as in loop-based pop, hip hop and electronic dance music. Pachelbel's Canon is built on the same short bass line repeated over and over. To compose a cyclic piece, make a two- or four-bar loop and layer new parts over it each time it repeats.","listen":["Listen for a short pattern that keeps coming back without stopping.","Count how long the loop is in bars or beats.","Notice what changes on top of the loop each time it repeats."],"example":"The track uses a **cyclic** structure, with the same four-chord loop repeating throughout, while new layers are added on top to build the excitement.","fig":[{"file":"ex_melodic_ostinato.png","caption":"A one-bar pattern that repeats over and over can be the loop a cyclic piece is built on"}]},"Structure>Song sections":{"what":["Songs are built from sections that each have a job. The intro sets the mood, verses tell the story, the chorus carries the hook, the bridge brings contrast and the outro wraps it up.","Learning to name these sections by ear is one of the most useful listening skills you can have, because it lets you describe where things happen."],"use":"Songwriters arrange these sections in different orders, but most popular songs use some version of verse-chorus form. When you write or analyse a song, map out the sections first, as on a texture graph.","listen":["Listen for the repeated words and tune that mark the chorus.","Notice when the music changes key, rhythm or instruments for a bridge.","Time each section, or count its bars, to help you map the song."],"example":"After the second **chorus** the **bridge** brings a new chord pattern and a thinner texture, which sets up the final chorus as the high point of the song.","fig":[{"file":"ex_texture_graph.png"}]},"Song sections>Intro":{"what":["The intro (short for introduction) is the opening section of a song, before the singer starts the first verse. It usually lasts a few bars.","It often uses the chords or riff from the verse or chorus, so it prepares the listener for what is coming."],"use":"The intro sets the mood, tempo and key, and gives the singer their starting note. Many intros start with a thin texture, such as one guitar or a drum fill, and then the band joins in. When you compose, use your intro to introduce a riff or chord pattern that comes back later.","listen":["Listen to the music before the voice comes in.","Notice which instrument starts first and what it plays.","Check if the intro tune or riff comes back later in the song."],"example":"The **intro** begins with a solo piano playing the chorus chords, which sets a calm mood before the voice enters."},"Song sections>Verse":{"what":["A verse is a section of a song that has the same melody each time but different words. The verses tell the story or describe the situation.","Verses are often lower and quieter than the chorus, so the chorus can lift above them."],"use":"Songwriters use verses to give new information, then return to the chorus to repeat the main message. Many songs have two or three verses. When you write a song, keep the verse tune simple and leave room for the words, then save your biggest ideas for the chorus.","listen":["Listen for the same tune coming back with new words.","Notice that the verse usually comes straight after the intro.","Compare the dynamics and texture of the verse with the chorus."],"example":"In the **verse** the melody stays in a low, narrow range and the texture is thin, so the words of the story are easy to hear."},"Song sections>Chorus":{"what":["The chorus is the section with the same melody and the same words each time it comes back. It contains the hook, the short catchy idea that sticks in your head.","The chorus often includes the title of the song. It usually comes after each verse."],"use":"Songwriters make the chorus stand out so it is easy to remember and sing along to. It is often higher, louder and thicker in texture than the verse, with backing vocals and extra instruments. When you write a song, make your chorus melody short, repeated and easy to sing.","listen":["Listen for words and a tune that repeat exactly each time.","Notice if the music gets louder, higher or fuller when the section starts.","Listen for the song title in the lyrics."],"example":"The **chorus** is louder and higher than the verse, and backing vocals join on the hook, which makes it the most memorable part of the song."},"Song sections>Bridge":{"what":["The bridge is a contrasting section that usually happens only once, often after the second chorus. It brings something new so the song does not become too predictable.","The bridge may use new chords, a new melody, a change of key or a different texture. In some styles it is called the middle eight because it is often eight bars long."],"use":"Songwriters use the bridge to give a break from the verse and chorus and to build tension before the last chorus. It might be quieter and thinner, or it might build up strongly. When you write a song, try new chords or a different rhythm in your bridge.","listen":["Listen for a section that sounds new and does not come back.","Notice new chords, a new tune or a different mood.","Check whether it comes just before the final chorus."],"example":"The **bridge** moves to minor chords and drops to just voice and piano, which builds tension before the last chorus."},"Song sections>Outro (coda)":{"what":["The outro is the closing section of a song. In classical music the same idea is called a coda, an Italian word meaning tail.","An outro may repeat the chorus or hook, slow down, fade out or end with a final chord."],"use":"Composers use the outro to wind the music down or to finish with a big ending. A fade-out (getting softer until silent) is a common pop ending, while a coda in classical music might repeat the last chord several times. When you compose, plan how your piece will end instead of just stopping.","listen":["Listen for the music after the last chorus.","Notice if it fades out, slows down or ends on a strong final chord.","Check whether the outro reuses music from the intro."],"example":"The **outro** repeats the hook while the instruments drop out one by one, and the song fades out, which gives a gentle ending."},"Structure>Microstructure":{"what":["Microstructure is the small building blocks inside the big sections. These include motifs (tiny ideas of a few notes), phrases (musical sentences), riffs and ostinatos (short repeated patterns) and call and response.","Small ideas join to make phrases, phrases join to make sections, and sections join to make the whole piece."],"use":"Composers get a lot of music out of very small ideas by repeating and changing them. When you compose, start with a short motif and develop it into a phrase rather than trying to write a whole tune at once.","listen":["Listen for short ideas that keep coming back.","Notice where the music seems to breathe or pause, which marks the end of a phrase.","Listen for a short pattern that loops underneath the tune."],"example":"The melody is built from a short **motif** that is repeated and moved higher, and the two **phrases** sound like a question and an answer."},"Microstructure>Motif":{"what":["A motif is a short musical idea, often just a few notes, that is used and developed through a piece. It has a recognisable rhythm, shape or both.","Composers develop a motif by repeating it, moving it higher or lower (a sequence), changing its rhythm or giving it a new ending. The opening of Beethoven's Symphony No. 5 is a famous example: a four-note motif that is then repeated a step lower."],"use":"Motifs hold a piece together because the listener keeps hearing the same idea in new ways. Film composers often give a character their own motif. When you compose, write a motif of three to five notes and try repeating it, moving it up a step and changing the last note.","listen":["Listen for a short, catchy rhythm or shape that you hear more than once.","Notice if it comes back on a higher or lower note.","Listen for the motif being passed to different instruments."],"example":"The opening **motif** of three rising notes is repeated, then moved up a step as a **sequence**, which builds tension through the phrase.","fig":[{"file":"rm_s4_str_motif_dev.png","caption":"One motif developed: repeated, moved higher, then given a new ending"}]},"Microstructure>Phrase":{"what":["A phrase is a musical sentence. It is a complete musical idea, often 2 or 4 bars long, that ends with a sense of pause, like a full stop or comma in writing.","Phrases often come in pairs. The first (question) phrase sounds unfinished. The second (answer) phrase ends on the home note so it sounds finished. A curved line called a phrase mark can show where a phrase starts and ends."],"use":"Singers and wind players breathe at the ends of phrases, and good performers shape each phrase so it rises and falls like speech. Composers balance phrases so they feel even. When you compose, write a question phrase that ends on a note other than the home note, then an answer phrase that ends on it.","listen":["Listen for points where the melody seems to stop or breathe.","Count the bars in each phrase.","Decide whether each phrase sounds unfinished (a question) or finished (an answer)."],"example":"The melody is made of two four-bar **phrases**: the first ends unfinished on the second note of the scale, and the answering phrase ends on the home note, which makes the tune sound balanced and complete."},"Microstructure>Riff / ostinato":{"what":["A riff and an ostinato are both short patterns that repeat over and over. Ostinato is the Italian word, meaning stubborn, and is used for any repeated pattern in any style. Riff is the word used in rock, pop, jazz and blues, usually for a catchy pattern on guitar, bass or keyboard.","An ostinato can be rhythmic (just a rhythm) or melodic (a short tune)."],"use":"Riffs give a song its identity, and often you recognise a rock song from its riff within a few seconds. Ostinatos hold a piece together, like the snare drum pattern that repeats all through Ravel's Bolero. In class ensembles an ostinato is a great part for beginners, and when you compose you can build a whole piece on one.","listen":["Listen for a short pattern that you hear again and again without a break.","Count how many beats or bars the pattern lasts before it starts again.","Notice which instrument plays it: bass, guitar, keyboard or percussion."],"example":"The bass guitar plays a two-bar **riff** that repeats throughout the verse, which gives the song a driving, catchy groove.","fig":[{"file":"ex_ostinato.png"}]},"Microstructure>Call and response":{"what":["Call and response is when a leader sings or plays a phrase (the call) and a group or another instrument answers with a phrase (the response). It works like a musical conversation.","The response might copy the call exactly, change it slightly or be a different answer each time."],"use":"Call and response comes from African musical traditions and is central to African-American music such as gospel, work songs, blues and jazz. It is also used in pop songs between a lead singer and backing singers, and between instruments in a band. In class you can practise it by having one student play a short call and the group play the answer.","listen":["Listen for a solo phrase followed by an answer from a group or another instrument.","Notice whether the answer copies the call or changes it.","Listen for the back-and-forth pattern repeating through the section."],"example":"The lead singer and backing vocals use **call and response**, as each line from the soloist is answered by the group, which makes the chorus sound like a conversation."},"Structure>Signs that change the order":{"what":["Some signs in written music tell you to jump to a different place instead of just reading left to right. They let composers avoid writing the same music out twice.","The main ones are the repeat sign, 1st and 2nd time bars, D.C. (go back to the start), Fine (the end) and the coda sign (jump to the ending section). Another one, D.S. (Dal Segno), means go back to the sign."],"use":"These signs save paper and make the structure easier to see. Before you play a piece, scan the music for these signs and work out the road map, so you know exactly where to jump.","listen":["When following a score, listen for the moment the music goes back to the start of a section.","Notice when the second time through ends differently, a sign of 1st and 2nd time bars.","Listen for a jump to a new ending section after a repeat."],"example":"The score uses **repeat signs** and **1st and 2nd time bars**, so the A section is heard twice with a different ending the second time."},"Signs that change the order>Repeat sign":{"what":["A repeat sign is a thick and thin double bar line with two dots. When you reach an end repeat sign (dots on the left), go back and play the section again.","If there is a start repeat sign (dots on the right) earlier in the music, go back to that point. If there is none, go back to the very beginning."],"use":"Repeat signs are used in almost every kind of written music, from simple class pieces to orchestral parts. Binary form pieces often repeat each section. When you play, look for the start repeat sign so you know where to jump back to.","listen":["Listen for a passage being played twice in a row.","Follow the score and notice where the music jumps back.","Count how many times the section is heard."],"example":"Each half of the piece is marked with a **repeat sign**, so the listener hears the A section twice before the B section, which makes the opening tune easy to remember.","fig":[{"file":"ex_repeat_both.png"}]},"Signs that change the order>1st and 2nd time bars":{"what":["1st and 2nd time bars (also called volta brackets) give a repeated section two different endings. The first time through, play the bar under bracket 1 and repeat. The second time, skip bracket 1 and play bracket 2 instead.","The 1st time ending usually leads back to the start. The 2nd time ending usually sounds more finished or moves on to new music."],"use":"These brackets are common in songs, where the music for each verse is the same apart from the last bar or two. When you play, the trick is remembering to skip the 1st time bar on the repeat.","listen":["Listen for a section that is played twice but ends differently the second time.","Notice that the first ending leads back and the second ending sounds final."],"example":"The A section is repeated with **1st and 2nd time bars**, so the first time it ends on an unfinished note and the second time it ends on the home note."},"Signs that change the order>Da Capo (D.C.)":{"what":["Da Capo, written D.C., is Italian for from the head. It means go back to the beginning of the piece and play again.","D.C. usually comes with an instruction about where to stop. D.C. al Fine means go back to the beginning and stop at the word Fine. D.C. al Coda means go back to the beginning, play until the To Coda sign, then jump to the Coda section."],"use":"Composers use D.C. to bring back the opening without writing it out again, which is a quick way to show ternary form (A B A). When you see D.C. in your music, find the Fine or To Coda sign before you start so you know where to stop or jump.","listen":["Listen for the opening music returning near the end.","Notice whether it stops partway through (al Fine) or jumps to a new ending (al Coda)."],"example":"The B section ends with **D.C. al Fine**, so the A section is played again and the piece finishes at **Fine**, which gives it a ternary A B A structure.","fig":[{"file":"rm_s4_str_dc_al_coda.png","caption":"D.C. al Coda: play to the end, go back to the start, jump at To Coda to the Coda"}]},"Signs that change the order>Fine":{"what":["Fine (say fee-neh) is Italian for end. It marks the place where the piece finishes, even if it is not at the end of the page.","You only stop at Fine after you have jumped back with D.C. or D.S. The first time through, you play past it. D.C. al Fine means go back to the beginning and stop at Fine."],"use":"Fine lets composers finish a piece in the middle of the page, which is useful for ternary form, where A comes back at the end. When you see Fine, find the D.C. or D.S. instruction later in the music so you know the full road map.","listen":["Listen for the opening section returning and the piece stopping at the end of that section.","Notice that the final ending sounds complete, often on the home note."],"example":"After the **D.C. al Fine** the opening section is repeated and the piece ends at **Fine** on the home note C, which makes the ending sound complete."},"Signs that change the order>Coda":{"what":["A coda is the ending section of a piece. Coda is Italian for tail. It is marked by the coda sign, a circle with a cross through it.","In D.C. al Coda or D.S. al Coda, you go back, play until you see To Coda with the coda sign, then jump straight to the section marked Coda and play to the end."],"use":"Composers use a coda to give the piece a proper ending that is different from the sections before it, often by repeating the final chord or slowing down. Many pop arrangements and band parts use the coda sign to show the outro. Before you play, find both coda signs so you know where to jump from and where to land.","listen":["Listen for a new ending section that has not been heard before.","Notice when the music skips part of a repeated section and jumps to the end."],"example":"The piece finishes with a short **coda** that repeats the last phrase more slowly, which gives a calm and final ending.","fig":[{"file":"rm_s4_str_dc_al_coda.png","caption":"D.C. al Coda: play to the end, go back to the start, jump at To Coda to the Coda"}]},"Bar lines>Final bar line":{"what":["The final bar line is made of a thin line followed by a thick line. It shows the very end of the piece.","It is different from a plain double bar line, which is two thin lines and only marks the end of a section. If the thick line has two dots in front of it, it is a repeat sign, not the end."],"use":"Every complete score should end with a final bar line, so add one to your compositions. Performers see it and know there is nothing more to play, unless a direction such as D.C. al Fine sends them back.","listen":["The music comes to a clear stop with no more bars to follow.","Often a slowing down (rit.) or a long held note leads to it."],"example":"The piece finishes on a held tonic chord at the **final bar line**, and the slowing tempo before it makes the ending feel complete.","fig":[{"file":"rm_s4_dur_barlines.png","caption":"Compare: the double bar line (two thin lines) ends a section, the final bar line (thin and thick) ends the piece"}]},"Changing tempo>a tempo":{"what":["A tempo is Italian for 'in time'. It tells you to go back to the original speed after the music has slowed down or sped up.","You usually see it a few bars after a rit., rall. or accel. Without it, players would not know whether to stay at the new speed or return to the old one."],"use":"Composers use a tempo to bring the music back on track after a moment of slowing down, often at the start of a new phrase or section. Performers watch for it so the whole group snaps back to the same speed together. If you write a rit. at the end of a phrase in your own piece, put a tempo where the next phrase starts.","listen":["Listen for the music slowing down at the end of a phrase.","Then notice the next phrase starting at the old, steady speed again."],"example":"The verse slows down with a rit. into the chorus, then returns **a tempo**, so the chorus arrives with fresh energy.","fig":[{"file":"rm_s4_a_tempo.png","caption":"The music slows down at rit., then goes back to the first speed at a tempo"}]},"Rests (silence)>Semiquaver rest":{"what":["A semiquaver rest is a quarter of a beat of silence, the same length as a semiquaver. It looks like a quaver rest with two flags instead of one.","Four semiquaver rests would fill one crotchet beat, but you will normally see one semiquaver rest mixed in with semiquaver notes."],"use":"Semiquaver rests make short, choppy rhythms. They are common in funk, hip hop and fast drum patterns, where a tiny gap makes the groove feel tighter. In your own rhythms, try swapping one note in a group of four semiquavers for a rest and clap the difference.","listen":["Listen for a fast run of notes with a tiny gap in it.","Notice rhythms that feel clipped or jumpy rather than smooth."],"example":"The bass riff is broken up by **semiquaver rests**, and the tiny gaps between the notes make the groove sound tight and funky."},"Accidentals>Enharmonic notes":{"what":["Enharmonic notes are two different names for the same sound. On a keyboard, F sharp and G flat are the same black key, so they are enharmonic. C sharp and D flat are another pair.","Which name you use depends on the key. In G major the note is called F sharp, but in a flat key it might be written as G flat."],"use":"Musicians choose the name that makes the music easiest to read in that key, so a scale uses each letter name once. You will meet enharmonic names when you read chord charts (a C sharp chord and a D flat chord sound the same) and when you play from different parts.","listen":["You cannot hear the difference: enharmonic notes sound exactly the same.","Look at the key signature to work out why a composer chose one name over the other."],"example":"The black key between F and G is written as F sharp in the G major section and as G flat in the later flat key, so these **enharmonic** notes look different on the page but sound the same.","fig":[{"file":"rm_s4_enharmonic.png","caption":"Enharmonic pairs: each pair is written two ways but played on the same key"},{"file":"ref_keyboard.png","caption":"Each black key has two names, one sharp and one flat"}]},"Pitch devices>Sequence":{"what":["A sequence is a short melodic pattern that is repeated straight away, starting on a higher or lower note. The shape of the pattern stays the same, only the starting pitch changes.","A pattern that moves up step by step is a rising sequence. One that moves down is a falling sequence."],"use":"Sequences make a melody longer without adding a brand new idea, so the music sounds connected. A rising sequence builds energy and a falling one helps the music settle. In your own melodies, write a four-note pattern, then repeat it one step higher and one step higher again.","listen":["Listen for the same little tune heard two or three times in a row.","Notice whether each repeat starts higher or lower than the one before."],"example":"In the bridge the melody uses a rising **sequence**, repeating the same four-note pattern one step higher each time, which builds tension before the last chorus.","fig":[{"file":"s5_sequence.png","caption":"A sequence: the same pattern repeated at a new pitch"}]},"Song sections>Pre-chorus":{"what":["A pre-chorus is a short section that comes between the verse and the chorus. It acts like a ramp that lifts the song up into the chorus.","It usually has its own melody and words, and the chords often change to build tension. Not every song has one."],"use":"Songwriters use a pre-chorus to make the chorus feel like a big arrival. The tension often builds through rising melody, more instruments, a drum build or holding back the bass. When you write a song, try a two or four bar pre-chorus that climbs higher than the verse.","listen":["Listen for a change after the verse that is not yet the chorus.","Notice the energy building: rising melody, louder drums or a held chord.","Check whether the chorus feels bigger because of it."],"example":"The **pre-chorus** builds tension with a rising melody and a snare drum build, so the chorus feels like a big release when it arrives."},"Signs that change the order>Dal Segno (D.S.)":{"what":["Dal Segno, written D.S., is Italian for 'from the sign'. It tells you to go back to the segno sign and play from there, not from the very beginning.","It is usually followed by al Fine (stop at Fine) or al Coda (jump to the Coda when you reach the To Coda sign)."],"use":"D.S. saves space on the page when part of a piece repeats but the introduction does not. In a song, the sign is often placed at the start of the first verse so the intro is only played once. When you read music, find the sign before you start so you know where to jump back to.","listen":["Listen for a section that returns without the introduction coming back.","Notice an ending that arrives after a section has been played twice."],"example":"After the second section the score is marked **D.S. al Fine**, so the performers jump back to the sign instead of the beginning and the introduction is not repeated.","fig":[{"file":"rm_s4_ds_segno.png","caption":"D.S. al Fine: go back to the sign, then stop at Fine"}]}},"5":{"Elements of Music>Texture":{"what":["Texture is about the layers of sound in a piece and how they fit together. At Stage 5 you go further than saying thick or thin: you name each layer, say what job it does (melody, harmony, rhythm or bass line) and explain how the layers interact.","Textural devices are the ways parts relate to each other, such as unison, doubling, imitation, canon, call and response, counter-melody and contrary motion."],"use":"Composers change texture to mark new sections, build to a climax or create contrast. A song might start with one voice and guitar, add drums and bass in the chorus, then strip back to unison voices at the end. When you compose, plan how many layers each section has and how they relate.","listen":["Count the layers and name the instrument playing each one.","Decide each layer's role: melody, harmony, rhythm or bass.","Listen for parts that copy, answer, double or move against each other.","Notice how the texture changes between sections."],"example":"The verse is a thin **homophonic** texture of voice and piano, but in the chorus a violin **counter-melody** is added and the bass is **doubled** an octave lower, so the texture becomes thicker and richer.","fig":[{"file":"ex_texture_graph.png","caption":"A texture graph: count the layers in each section to see the texture change"}]},"Texture>Beyond thick or thin":{"what":["Saying a texture is 'thick' or 'thin' is a start, but at Stage 5 it is not enough for a strong answer. Name each layer (which instrument or voice), give its role (melodic, harmonic, rhythmic or bass) and say how the layers interact: do they double, imitate, answer or move against each other?","This works because it proves to the marker that you heard the detail as well as the general effect."],"use":"Use a simple order in your answers: count the layers, name and describe each one from top to bottom, then name the textural device and its effect. A texture graph or quick sketch while you listen helps you keep track. Practise on songs you know before trying unfamiliar excerpts.","listen":["Start with the most obvious layer (usually the melody), then listen for the bass at the bottom.","Then listen for what fills the middle: chords, riffs or a counter-melody.","Finally ask how the layers relate to each other."],"example":"The texture has four layers: the vocal **melody**, sustained **harmony** chords on synth, a **rhythmic** hi-hat pattern and a **bass** line that **doubles** the kick drum rhythm.","fig":[{"file":"tex_roles.png","caption":"Roles of layers: melodic (top), harmonic (middle), bass line (bottom)"}]},"Texture>Textural devices":{"what":["Textural devices are the ways two or more parts relate to each other. Some parts play the same thing (unison, doubling), some copy each other (imitation, canon), some take turns (call and response) and some move independently (counter-melody, contrary motion).","Naming the device tells the listener exactly how the layers interact."],"use":"Composers choose devices for effect: unison for strength, imitation and canon for interest and complexity, call and response for a sense of conversation. When you compose, take a simple melody and try two or three devices to see how each changes it.","listen":["Ask whether the parts are the same, copying, answering or different.","Listen for the timing: do parts start together or one after another?","Check the direction each line moves in."],"example":"The verse uses **call and response** between the singer and the backing vocals, then in the chorus the voices come together in **unison**, which makes the chorus sound strong and united."},"Textural devices>Unison":{"what":["Unison means everyone plays or sings exactly the same notes at the same time, at the same pitch. It is one melody line, even if many people perform it.","If the same tune is played an octave apart (for example men and women singing together), it is often called octave unison or doubling at the octave."],"use":"Unison is powerful because all the energy goes into one line, so it sounds strong, bold and united. Football crowds, anthems and school songs are often sung in unison, and orchestras use it for dramatic openings. In your own arrangements, a sudden switch to unison can make an important phrase stand out.","listen":["Listen for many performers who sound like one big line, with no harmony.","Notice whether a texture that had chords suddenly becomes one melody.","Check if it is all at one pitch or spread over octaves."],"example":"In the final chorus all the voices sing in **unison**, which makes the words very clear and gives a strong, united ending."},"Textural devices>Doubling":{"what":["Doubling is when two or more instruments play the same line at the same time. They can be at the same pitch, or an octave (or two) apart.","Doubling does not add a new part. It strengthens an existing one and changes its tone colour, because two different instruments blend into a new sound."],"use":"Composers double a melody to make it louder and richer, or to give it a new colour, for example flute and violin together. Bass lines are often doubled by cello and double bass an octave apart, and in pop the bass guitar often doubles the kick drum rhythm. Try doubling your melody an octave higher in the last chorus.","listen":["Listen for one line that sounds fuller than one instrument could make.","Try to pick out two different timbres playing the same tune.","Notice if the same notes appear in a high and low register together."],"example":"In the final verse the melody is **doubled** by flute and violin an octave apart, which makes it brighter and helps it stand out."},"Textural devices>Imitation":{"what":["Imitation is when one part copies a melody or idea from another part shortly afterwards. The copy often starts on a different pitch, and it does not have to be exact. Often only the opening few notes are copied before the part goes its own way.","If the copy is exact and continues all the way through, it becomes a canon."],"use":"Imitation makes the music feel like a conversation between parts and links the layers together. It is common in Baroque and Renaissance choral music, in fugues and in film and game music. When you compose, start a second part with the same opening shape a bar later and a few notes higher.","listen":["Listen for a short idea you have just heard coming back in another instrument.","Notice whether it comes back higher or lower.","Check if the copying stops after a few notes."],"example":"In the opening the flute plays a short rising idea and the clarinet **imitates** it a bar later a fifth higher, which makes the parts sound as if they are talking to each other."},"Textural devices>Canon":{"what":["A canon is strict imitation: the second part copies the first exactly, note for note, starting a little later, and keeps copying all the way through. The parts overlap, so you hear the same melody against itself.","A round, such as Frere Jacques or Row, Row, Row Your Boat, is a canon where each voice can go back to the start and repeat it."],"use":"Canons only work if the melody is written so it fits with itself, which is a real composing challenge. Pachelbel's Canon has three violin parts playing in canon over a repeating bass line. To compose one, write a melody over a repeating chord pattern, then check that each bar sounds good against the bar before.","listen":["Listen for the same melody starting again in another part while the first part carries on.","Count the gap between the entries, often one or two bars.","Notice the texture getting thicker as each new voice enters."],"example":"The two voices sing in **canon**, the second entering two bars after the first with exactly the same melody, so the texture builds up as the lines overlap."},"Textural devices>Call and response":{"what":["Call and response is when one part plays or sings a phrase (the call) and another part answers it (the response). The parts take turns, like a question and an answer in a conversation.","The response can copy the call, change it or be a short fixed reply that comes back every time."],"use":"Call and response has roots in West African music and is central to work songs, gospel, blues, jazz and soul. A lead singer might call and the choir answer, or a singer and a guitar might swap phrases. It is a great way to get an audience involved. When you compose, write a two-bar call and a two-bar answer that ends on the home note.","listen":["Listen for a phrase from one voice or instrument followed by a reply from another.","Notice whether the reply copies the call or stays the same each time.","Check who calls (often a soloist) and who answers (often a group)."],"example":"The lead singer and the choir use **call and response**, with each solo line answered by the full choir, which makes the song feel lively and shared.","fig":[{"file":"ex_call_response.png","caption":"A call and its response in one melody line"}]},"Textural devices>Counter-melody":{"what":["A counter-melody is a second, less important melody played at the same time as the main tune. It has its own shape and rhythm, so it is a real melody rather than a set of chords.","It usually moves when the main tune is still (for example on long notes) and stays quieter, so the main tune is still clear."],"use":"Counter-melodies make a repeat of a tune more interesting, so you often hear one added in the second verse or last chorus. Strings, brass and backing vocals often play them in pop songs, film music and marching band music. When you arrange, add a counter-melody in a different register from the main tune so they do not clash.","listen":["Listen for a second tune underneath or above the main melody.","Notice it filling the gaps or long notes in the main tune.","Check if it only appears in later sections."],"example":"In the last chorus the strings add a **counter-melody** above the vocal line, filling the long notes with a flowing tune, which makes the ending sound richer."},"Textural devices>Contrary motion":{"what":["Contrary motion is when two lines move in opposite directions at the same time: one goes up while the other goes down.","It is one of four ways two lines can move. Similar motion is both going the same way, parallel motion is both going the same way by the same interval, and oblique motion is one line staying still while the other moves."],"use":"Contrary motion keeps parts independent, so both lines can be heard clearly. It is a basic rule in writing bass lines under a melody, and a strong way to create a sense of opening out or closing in. Pianists often practise contrary-motion scales. When you compose a bass line, move it against the melody.","listen":["Follow the top line and the bottom line at the same time.","Listen for the sound spreading out (moving apart) or closing in.","Notice whether the bass goes down when the melody goes up."],"example":"In the final bars the melody rises while the bass falls in **contrary motion**, so the parts spread wider apart and the music opens out into the final chord.","fig":[{"file":"rm_s5_motion_types.png","caption":"Four ways two lines can move together: contrary, similar, parallel and oblique"}]},"Elements of Music>Duration":{"what":["Duration is about time in music: how long each sound and silence lasts, how the beats are grouped into bars and how rhythms are built on top of the beat.","In Stage 5 you go further than crotchets and quavers. You meet notes that split the beat in unusual ways (triplets, duplets, dotted rhythms), metres that change or have uneven beats (5/4, 7/8) and rhythmic devices such as polyrhythm, swing and augmentation."],"use":"Composers use duration to control energy and feel. Uneven metres make music feel off-balance or restless, swing makes it relaxed and bouncy and triplets or dotted rhythms change how a melody moves. When you compose, try changing one duration idea at a time, such as swapping even quavers for a dotted rhythm.","listen":["Find the beat first by tapping along, then count how many beats are in each bar.","Notice whether the beats split into twos or threes.","Listen for moments where the rhythm pulls against the beat or the bar length changes."],"example":"In this excerpt the **metre** changes from 4/4 to 7/8, and the **triplets** in the melody pull against the steady quavers in the bass, which makes the music feel unsettled."},"Duration>Complex note and rest values":{"what":["These are ways of dividing the beat that go beyond the simple halves and quarters you learnt in Stage 4. A triplet squeezes three notes into the time of two, a duplet stretches two notes over the time of three and a dotted rhythm splits a beat unevenly into long and short.","Each one changes how the music moves even when the beat stays the same."],"use":"These values give a melody or groove its character. Dotted rhythms sound bold and march-like, triplets sound rolling or flowing and duplets break the lilt of compound time for a moment. When you write a melody, try one bar of triplets or a dotted rhythm against plain quavers to make it more interesting.","listen":["Listen for notes that seem to fit three to a beat when the rest of the music moves in twos.","Listen for an uneven, skipping long-short pattern.","In music that lilts in threes, listen for a moment that suddenly feels straight."],"example":"In the opening the melody moves in **dotted rhythms**, then switches to **triplets** in the second phrase, so the music changes from marching to flowing."},"Complex note and rest values>Triplet":{"what":["A triplet is three notes played in the time normally taken by two of the same kind. Three quaver triplets fill one crotchet beat, and three crotchet triplets fill two crotchet beats (a minim).","Triplets are written with a small 3 above or below the notes, often with a bracket. Count quaver triplets as 'tri-pl-et' or '1-trip-let' so all three notes are even."],"use":"Triplets give a rolling, flowing feel and are common in Romantic piano music, film scores, rock ballads and drum fills. Jazz swing is based on the triplet feel. When you compose, use one triplet in a line of straight quavers to make a moment stand out, or a crotchet triplet to make a phrase feel stretched.","listen":["Tap the beat and check whether three equal notes fit into each tap.","Listen for a smooth, rolling pattern that sounds different from the straight quavers around it.","Drummers often play triplets across the toms in a fill."],"example":"In the second phrase the melody moves into quaver **triplets**, three even notes to each beat, which makes it flow more smoothly than the straight quavers in the opening."},"Complex note and rest values>Duplet":{"what":["A duplet is two notes played in the time normally taken by three of the same kind. It turns up in compound time such as 6/8, where each beat is a dotted crotchet split into three quavers.","A duplet splits that dotted crotchet beat into two equal halves instead. It is written as two quavers with a small 2 above them. It is the opposite of a triplet."],"use":"Composers use duplets to break the lilting three-feel of compound time for a moment, so a phrase sounds briefly straight or held back. You find them in jigs, folk tunes in 6/8 and classical music. When you compose in 6/8, try one duplet near the end of a phrase so the rhythm changes just before the cadence.","listen":["In music that skips along in threes (6/8), listen for a beat that suddenly splits into two even notes.","The duplet feels slightly slower and heavier than the three quavers around it."],"example":"In the last bar of the phrase the melody uses a **duplet**, two even notes across a dotted crotchet beat, which briefly breaks the lilting 6/8 feel and slows the phrase down."},"Complex note and rest values>Dotted rhythms":{"what":["A dot after a note adds half the note's value again. A dotted quaver is worth three semiquavers, so a dotted quaver followed by a semiquaver fills one crotchet beat with a long note and a short note.","Played one after another, these long-short pairs give the music a skipping or jerky feel. Count it as '1 (e and) a': the long note covers the first three quarters of the beat."],"use":"Dotted rhythms sound bold and energetic, so you hear them in marches, fanfares, national anthems, Baroque overtures and Scottish folk music (where the reversed short-long version is called a Scotch snap). When you perform, keep the short note really short and crisp. When you compose, use dotted rhythms for a proud or confident melody.","listen":["Listen for an uneven long-short, long-short pattern rather than even notes.","The short note sounds like it pushes into the next beat.","Dotted rhythms often go with a march feel and loud brass or snare drum."],"example":"The trumpet melody is built on **dotted rhythms**, crisp long-short pairs that give the opening a proud, march-like character.","fig":[{"file":"nv_dotted_crotchet.png","caption":"A dotted crotchet is worth a crotchet plus a quaver (one and a half beats)"}]},"Duration>Mixed and irregular metre":{"what":["Most music keeps the same metre all the way through, with bars of two, three or four even beats. This group covers music that breaks those habits.","Mixed (changing) metre means the time signature changes during the piece. Irregular (asymmetric) metre means each bar has beats of uneven length, grouped in 2s and 3s, as in 5/4 and 7/8."],"use":"These metres make music feel unpredictable, urgent or dance-like. They are common in Eastern European and Balkan folk music, progressive rock, film music and 20th-century classical music. Some music uses both at once. When you compose, try writing a riff in 7/8 or adding one 2/4 bar into a 4/4 song.","listen":["Count the beats in each bar. If the count keeps changing, the metre is mixed.","If the count is always five or seven, listen for long and short beats inside the bar.","If you can't tap your foot comfortably along, listen again for an uneven pattern."],"example":"The verse is in an **irregular metre** of 7/8, grouped 2 + 2 + 3, and the bridge uses **mixed metre** as the bars switch between 3/4 and 4/4, so the song never settles into a predictable pulse."},"Mixed and irregular metre>Mixed metre (changing metre)":{"what":["Mixed metre (also called changing metre) is when the time signature changes during a piece. A new time signature is written at the start of the bar where the change happens, for example 4/4, then 3/4, then 2/4.","The beat usually stays the same speed. Only the number of beats in each bar changes, so the strong first beat arrives earlier or later than you expect."],"use":"Composers use mixed metre to follow the natural rhythm of words, to surprise the listener or to make a riff feel restless. You hear it in folk songs, progressive rock, musical theatre and modern classical music such as Stravinsky. When you compose, add a bar with one beat fewer at the end of a phrase so the next phrase comes in early.","listen":["Count the beats from one strong beat to the next, and notice when the number changes.","Listen for a phrase that seems to arrive a beat early or late.","Watch for the strong accent (beat 1) shifting around."],"example":"In the chorus the music uses **mixed metre**, adding a single bar of 2/4 into the 4/4, so the next phrase arrives two beats early and catches the listener off guard."},"Mixed and irregular metre>Irregular (asymmetric) metre":{"what":["An irregular (asymmetric) metre has bars that cannot be split into equal beats. The beats fall into uneven groups of 2s and 3s, so some beats are longer than others.","5/4 (3 + 2) and 7/8 (2 + 2 + 3) are the most common. Unlike mixed metre, the time signature does not change. Every bar has the same uneven pattern."],"use":"Irregular metres give music a limping, driving or dance-like feel. They are normal in many Balkan, Greek, Turkish and Indian traditions, and turn up in jazz (Dave Brubeck's Take Five is in 5/4), progressive rock and film music. When you compose, write a drum or bass pattern in 7/8 and loop it so the uneven grouping becomes the groove.","listen":["Count the beats in each bar. Five or seven is a strong clue.","Listen for a beat that feels slightly longer than the others.","Notice where the accents fall inside the bar: they show the grouping."],"example":"The piano riff is in an **irregular metre** of 5/4, grouped 3 + 2, which gives the music a lopsided, limping feel."},"Irregular (asymmetric) metre>5/4":{"what":["5/4 has five crotchet beats in every bar. Five can't be split evenly, so the beats are usually felt as 3 + 2 (count 1 2 3 4 5 with accents on 1 and 4) or 2 + 3 (accents on 1 and 3).","The accents tell you which grouping is being used."],"use":"5/4 gives a lopsided, swaying feel. The most famous jazz example is Dave Brubeck's Take Five, and it is used in film scores and progressive rock. When you perform, count all five beats out loud at first and lean on the accented beats. When you compose, write an ostinato that groups 3 + 2 and keep it steady under the melody.","listen":["Count steadily from one strong beat to the next and see whether you land on 5.","Listen for one long and one short half to the bar.","The piano or bass often repeats a riff that makes the 3 + 2 grouping clear."],"example":"The piano vamp is in **5/4**, grouped 3 + 2, so each bar feels one beat too long and the groove sways unevenly."},"Irregular (asymmetric) metre>7/8":{"what":["7/8 has seven quavers in every bar. The quavers are grouped into uneven beats, most often 2 + 2 + 3, but also 3 + 2 + 2 or 2 + 3 + 2.","The beams in the notation show the grouping, and the accent falls on the first quaver of each group. Count it '1 2, 1 2, 1 2 3' so you feel three beats, with the last one longer."],"use":"7/8 has a driving, slightly breathless feel. It is common in Bulgarian, Macedonian and Greek dances, and turns up in progressive rock and film music. When you perform, say the counting aloud and clap the first note of each group. When you compose, set up a drum pattern in 2 + 2 + 3 and keep it the same every bar.","listen":["Count quavers from one strong beat to the next and see whether you reach seven.","Listen for two short beats and one long beat (or another uneven mix).","Notice that the music never settles into an even 'left, right' pulse."],"example":"The dance tune is in **7/8**, grouped 2 + 2 + 3, so the long third beat gives every bar a small hitch that drives the music forward."},"Duration>Rhythmic devices":{"what":["Rhythmic devices are particular tricks composers use with rhythm. Some are about where the music starts (anacrusis), some are about layers of rhythm clashing (polyrhythm, cross-rhythm), some are about style (swing) and some are abou
