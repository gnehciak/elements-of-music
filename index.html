elody."],"use":"Performers shape almost every phrase this way, even when nothing is written: a little louder as the melody climbs, a little softer as it settles. When you compose, mark the start dynamic, put a hairpin under the rising part and aim the loudest marking at your highest or most important note.","listen":["Follow the melody's shape and check if the volume rises and falls with it.","Listen for where the phrase peaks and where it fades.","Notice whether the ending is softer than the beginning."],"example":"The phrase starts **piano** and **crescendos** to **forte** at its highest note, then **diminuendos** to **pianissimo**, so it sounds like a wave rising and falling."},"Dynamics and expression>Gradual changes":{"what":["Gradual changes are dynamics that move step by step over several notes, rather than jumping suddenly. There are two: crescendo (getting louder) and diminuendo or decrescendo (getting softer).","They are written as hairpins (wedge shapes) under the stave, or as the words cresc. and dim. with a dashed line."],"use":"Gradual changes build tension and release it. A long crescendo can carry the music into a big chorus or climax, and a diminuendo is the usual way to fade a piece out. Ravel's Bolero is one long crescendo over about 15 minutes. When you compose, show where each change starts and the dynamic it should reach.","listen":["Listen for the volume rising or falling smoothly over a few seconds.","Notice where a gradual change leads: often into a new section or to the very end."],"example":"A long **crescendo** in the bridge builds tension, and the music bursts into the final chorus at **fortissimo**.","fig":[{"file":"ex_dynamics_passage.png","caption":"A crescendo hairpin opens out to f, then a diminuendo hairpin closes to pp"}]},"Gradual changes>Crescendo (cresc.)":{"what":["Crescendo means gradually getting louder. It is written either as a hairpin that opens out (<) under the notes, or as the word cresc. followed by a dashed line. The hairpin's wide end is where you should be loudest.","Most crescendos go from one dynamic marking to another, for example from p to f, so you know where you start and where you finish."],"use":"A crescendo builds excitement and tension, so you hear it before a chorus, a climax or a drop in dance music. Ravel's Bolero is famous for one huge crescendo that lasts the whole piece. When you perform, start the crescendo softer than you think, so you have room to grow.","listen":["Listen for the music growing louder over a few beats or bars.","Notice if instruments are being added, which often helps a crescendo.","Check where it leads: a new section, a big chord or a high note."],"example":"Before the final chorus the drums and strings **crescendo** over four bars, which builds excitement and makes the chorus feel like a big arrival."},"Gradual changes>Diminuendo / decrescendo (dim.)":{"what":["Diminuendo and decrescendo both mean gradually getting softer. They are written as a hairpin that closes in (>), or as the words dim. or decresc. with a dashed line.","Do not confuse the hairpin with an accent mark. An accent is a small > on one note. A diminuendo hairpin is long and stretches under several notes."],"use":"Diminuendos calm the music down, end a phrase gently or fade a piece out to silence. Many pop songs end with a fade-out, which is a diminuendo made at the mixing desk. When you perform, keep the tone steady as you get softer, so the sound does not go thin or out of tune.","listen":["Listen for the volume shrinking over a few beats or bars.","Notice if instruments drop out one by one.","Check if the music is heading towards an ending or a quiet section."],"example":"At the end of the song the band plays a long **diminuendo**, fading to silence, which leaves the listener with a calm, unfinished feeling."},"Dynamics and expression>Articulation":{"what":["Articulation is how each note starts, how long it lasts and how it joins to the next note. It is shown by small signs above or below the noteheads: dots, lines, accents, curved lines and the pause sign.","The same notes can sound completely different with different articulation, as the picture shows."],"use":"Articulation gives a melody its character. Short staccato notes sound bouncy or playful, slurred notes sound smooth and singing and accents add punch. Wind players change articulation with the tongue, string players with the bow. When you compose, choose an articulation for each phrase so the player knows the mood you want.","listen":["Listen for whether there are gaps between the notes (detached) or no gaps (smooth).","Notice any notes that are hit harder than the others.","Listen for a note that is held on longer than the beat."],"example":"The opening melody is **staccato**, which makes it sound light and cheeky, but the second phrase is **slurred** and **legato**, which gives a smooth, singing contrast.","fig":[{"file":"rm_s4_articulation_compare.png","caption":"The same four notes with four different articulations"}]},"Articulation>Staccato (dots)":{"what":["Staccato means short and detached. It is shown by a dot above or below the notehead (on the opposite side to the stem). You play the note shorter than written and leave a little gap of silence before the next one.","The dot does not change the beat. A staccato crotchet still takes one beat, you just release the sound early. Do not confuse it with a dot after the note, which makes it longer."],"use":"Staccato sounds bouncy, playful, sneaky or comic, so it is common in marches, dances and cartoon music. Violinists often play it with a short, light bow stroke, and wind players with a quick tongue. Try a melody once legato and once staccato to hear the change in character.","listen":["Listen for little gaps of silence between the notes.","Notice if the notes sound short and bouncy rather than joined.","Listen for a plucked or tapping quality in the sound."],"example":"The bassoon plays a **staccato** tune in the low register, and the short, bouncy notes make the music sound comical."},"Articulation>Accent":{"what":["An accent tells you to play a note with extra emphasis, so it stands out from the notes around it. It is written as a small > sign above or below the notehead.","An accent changes how hard the note starts, not the overall dynamic. In a p passage an accented note is still fairly soft, just stronger than its neighbours."],"use":"Accents add punch and energy. They mark important notes in a melody and help create syncopation when they land off the beat. Drummers accent the backbeat, and brass sections accent the hits in funk and big band music. When you compose, put accents on the notes you want to grab the listener.","listen":["Listen for single notes that jump out louder or harder than the rest.","Check if the accents fall on the beat or between beats.","Notice a sharper attack at the start of the note."],"example":"The brass play **accented** chords on beats 2 and 4, which gives the music a punchy, driving feel."},"Articulation>Slur":{"what":["A slur is a curved line over or under two or more notes of different pitch. It means play them legato, smooth and connected, with no gap between them.","On a wind instrument you only tongue the first note of the slur. On a string instrument you play all the slurred notes in one bow stroke. Singers sing the slurred notes on one syllable."],"use":"Slurs make a melody sound smooth, flowing and song-like, so they are used a lot in slow, lyrical and sad music. They also show phrases, like a breath in speech. When you compose, slur notes that should flow together and leave the others separate, so the phrase has a shape.","listen":["Listen for notes that flow into each other with no gap.","Notice if a wind player seems to play several notes in one breath without re-starting each one.","Compare a smooth phrase with a choppy one nearby."],"example":"The violin melody is **slurred**, so the notes flow smoothly into each other and the music sounds tender and calm."},"Articulation>Tie":{"what":["A tie is a curved line joining two notes of the same pitch. You play the first note and hold it through the second without playing again. The note's length is the two values added together.","Ties are used to make a note longer than one bar allows, or to show a note that carries over a beat or a barline."],"use":"Composers need ties to write long notes that cross a barline, for example a note held from beat 4 into the next bar. Ties are also how a lot of syncopation is written. When you read music, check the pitches first: if the notes are the same, it is a tie and you do not play the second one.","listen":["Listen for a note that is held across the beat or into the next bar.","Notice a long note that starts on a weak beat and keeps sounding through a strong beat."],"example":"In the chorus the melody is **tied** over the barline, so the long note pushes against the beat and creates a syncopated feel."},"Articulation>Tenuto (lines)":{"what":["Tenuto is a short horizontal line above or below a notehead. It means hold the note for its full value and give it a little weight. Tenuto comes from the Italian for 'held'.","It is the opposite of staccato. Staccato shortens the note, tenuto makes sure it lasts every bit of its length."],"use":"Tenuto is used to make each note in a phrase sound important and heavy without being as sharp as an accent. You often see it in slow, serious music, or on a few key notes in a melody. If a phrase sounds too bouncy, adding tenuto lines tells the player to lean on the notes.","listen":["Listen for notes that are full length with almost no gap between them.","Notice a slight weight or lean on each note, softer than an accent."],"example":"The final phrase is marked **tenuto**, so each note is held its full length and leaned on, which makes the ending sound solemn."},"Articulation>Fermata (pause)":{"what":["A fermata, or pause, is an arc with a dot inside it, placed over a note or rest. It means hold the note or rest longer than its written value. How much longer is up to the performer or conductor.","When a group plays, everyone watches the conductor or leader to know when to move on."],"use":"Fermatas are common on the final chord of a piece, at the end of a phrase in a hymn or chorale or just before a big return. They make the music stop and breathe. When you compose, a fermata on the last note gives the ending a sense of arrival.","listen":["Listen for a moment where the beat seems to stop on one note.","Notice whether the music waits before carrying on."],"example":"The piece ends on a long **fermata** on the last chord, so the music stops and rings out, which makes the ending feel grand and final."},"Articulation>Tie or slur?":{"what":["Ties and slurs look almost the same: both are curved lines. The trick is to look at the pitches. If the curve joins two notes of the same pitch, it is a tie, so you add the values together and only play once. If the notes are different, it is a slur, so you play every note smoothly.","It works because a tie is about length, while a slur is about how the notes join."],"use":"Check this every time you sight-read. Mixing them up is one of the most common reading mistakes, because a tie read as a slur makes you play an extra note. Also watch for a tie inside a slur: the tied notes are held, the others are played smoothly.","listen":["A tie sounds like one long note.","A slur sounds like several different notes joined smoothly."],"example":"In bar 1 the G is **tied**, so it sounds as one note lasting three beats, but in bar 2 the **slur** joins three different notes legato."},"Dynamics and expression>Expressive techniques and effects":{"what":["Expressive techniques are special ways of playing an instrument or singing to change the sound: plucking instead of bowing, sliding between notes, wobbling the pitch or trilling. Effects are mostly electronic, added with a pedal, amplifier or computer, such as distortion, delay and reverb.","Both change the timbre (tone colour) of the sound as well as the notes."],"use":"Composers write techniques into the score with words or symbols such as pizz., arco, tr and gliss. Effects are usually chosen by performers and producers in the studio. When you compose or record, one well-chosen technique or effect can change the whole mood of a section.","listen":["Listen for a plucked versus a bowed string sound.","Notice slides, wobbles or fast flickering notes.","Listen for echoes, a fuzzy guitar or a sound that seems far away in a big room."],"example":"The violins switch from **arco** to **pizzicato** in the middle section, and the electric guitar adds **distortion** in the chorus, which makes the music suddenly sound rough and aggressive."},"Expressive techniques and effects>Pizzicato":{"what":["Pizzicato (pizz.) means plucking the strings of a bowed instrument, like a violin, viola, cello or double bass, with a finger instead of using the bow.","It stays pizzicato until you see the word arco, which tells you to pick the bow up again."],"use":"Pizzicato makes short, light, bouncy notes that die away quickly, so it suits playful, sneaky or quiet moments. Jazz double bass players use it almost all the time for walking bass lines. In an orchestra, pizzicato strings are often used as a soft accompaniment under a melody.","listen":["Listen for short plucked notes that fade straight away.","Notice that the notes cannot be held long.","Listen for a sudden change of string sound when the bow comes back."],"example":"In the middle section the strings play **pizzicato**, and the short plucked notes give the music a light, tiptoeing feel."},"Expressive techniques and effects>Arco":{"what":["Arco means play with the bow. It is used on string instruments after a pizzicato passage, to tell the player to go back to bowing.","Bowing is the normal way to play violin, viola, cello and double bass, so arco is only written when it is needed."],"use":"Bowing lets string players hold long notes, play smooth legato lines and make crescendos on a single note, none of which pizzicato can do. Composers often contrast the two: pizzicato for a light section, arco for a singing melody. When you write for strings, add arco wherever bowing returns.","listen":["Listen for long, smooth, sustained string notes.","Notice the sound can grow louder or softer while one note is held."],"example":"After the **pizzicato** introduction the cellos return to **arco** for the main melody, so the sound becomes smooth and warm."},"Expressive techniques and effects>Vibrato":{"what":["Vibrato is a small, fast wobble in pitch, going a tiny bit above and below the note. String players make it by rocking a finger on the string, singers and wind players with their breath and guitarists by bending the string slightly.","It is different from a trill, which swaps between two separate notes. Vibrato stays on one note."],"use":"Vibrato makes long notes sound warmer, richer and more emotional, so most classical string players and singers use it a lot. Some styles avoid it, and a composer can write senza vib. (without vibrato) for a plain, pure or eerie sound. When you perform, try a long note first without and then with vibrato.","listen":["Listen to long held notes for a slight shimmer or wave in the pitch.","Compare the start of a note with the end, where singers often add vibrato.","Notice if a sound is completely steady, which suggests no vibrato."],"example":"The cello holds the long notes of the melody with a wide **vibrato**, which makes the sound warm and full of emotion.","fig":[{"file":"violin.jpg","caption":"String players make vibrato by rocking a finger on the string"}]},"Expressive techniques and effects>Glissando":{"what":["A glissando (gliss.) is a slide from one note to another, passing through the pitches in between. It is written as a straight or wavy line between the two notes, often with the word gliss.","On a piano or harp you sweep across the keys or strings, so you hear the separate notes. On a trombone, violin or voice the slide can be completely smooth."],"use":"Glissandos add drama, humour or excitement. The famous clarinet slide at the start of Gershwin's Rhapsody in Blue is a glissando. Trombones use slides for comic effects, and harpists sweep across the strings for a magical shimmer. Use one sparingly so it stands out.","listen":["Listen for a sound that swoops up or down between two notes.","Notice whether you can hear separate notes (piano, harp) or one smooth slide (trombone, voice)."],"example":"The harp plays a rising **glissando** into the new section, which sounds like a magical sweep and announces the change of mood."},"Expressive techniques and effects>Trill (tr)":{"what":["A trill is a fast back-and-forth between the written note and the note just above it. It is written as tr above the note, sometimes with a wavy line to show how long it lasts.","You keep alternating for the whole length of the note. In much Baroque music the trill starts on the upper note, but in later music it usually starts on the written note."],"use":"Trills decorate a melody and add sparkle or tension. They often appear near a cadence, just before the end of a phrase. You hear them a lot on flute, violin and piano. Birdsong is often imitated with trills. When you compose, put a trill on a long note so there is time for it.","listen":["Listen for a fast flicker between two neighbouring notes.","Notice whether it happens on a long note near the end of a phrase.","Check that it is two different notes, not a wobble on one note (that is vibrato)."],"example":"Just before the final cadence the flute plays a **trill** on a long note, which adds sparkle and makes the ending feel more decorated.","fig":[{"file":"rm_s4_trill_played.png","caption":"A trill is written as tr above the note and played as a fast alternation with the note above"}]},"Expressive techniques and effects>Distortion":{"what":["Distortion is an electronic effect that makes an amplified sound fuzzy, gritty and crunchy. It happens when the signal is pushed harder than the amplifier or pedal can cleanly handle, so the sound waves get squashed.","Guitarists switch it on with a pedal or by turning up the gain on the amplifier. The opposite is a clean sound."],"use":"Distortion is the sound of rock, punk and metal. It makes power chords and riffs sound heavy and aggressive, and makes notes sustain longer. It can also be used on bass, keyboards or vocals. When you produce a song, try a clean guitar in the verse and distortion in the chorus to make the chorus hit harder.","listen":["Listen for a fuzzy, buzzing or crunchy edge on the guitar.","Compare it with a clean guitar sound, which is bright and clear.","Notice if notes keep ringing for a long time."],"example":"In the chorus the electric guitar switches to heavy **distortion** on its power chords, which makes the music sound loud, raw and aggressive.","fig":[{"file":"electric_guitar.png","caption":"Distortion is used mostly on the electric guitar"}]},"Expressive techniques and effects>Delay":{"what":["Delay is an electronic effect that records the sound and plays it back a moment later, like an echo. Each repeat is usually softer than the one before.","You can set how long the gap is and how many repeats you hear. Short delays sound like a doubling, long ones like a canyon echo."],"use":"Guitarists use delay to make a simple riff sound bigger and to fill space. Producers put it on vocals so the last word of a line echoes. Some players set the delay in time with the beat so the echoes become part of the rhythm. Use it when a part sounds too dry or empty.","listen":["Listen for a note or word that repeats on its own, getting softer.","Notice if the echoes are in time with the beat.","Check whether the effect appears only in certain sections."],"example":"The singer's last word in each line has **delay** on it, so it echoes several times and fades, which makes the verse sound spacious and dreamy.","fig":[{"file":"rm_s4_delay_echo.png","caption":"Delay: the note you play comes back as softer and softer echoes"}]},"Expressive techniques and effects>Reverb":{"what":["Reverb (short for reverberation) is the way sound bounces around a room and keeps ringing after the note stops. A big hall or church has a lot of reverb, a small carpeted room has very little.","In recording, reverb is added electronically to make a sound seem as if it is in a large space. Unlike delay, you do not hear separate echoes, just a smooth wash of sound."],"use":"Producers add reverb to vocals, drums and guitars to make them sound fuller and more natural. A lot of reverb makes music sound distant, dreamy or huge, and very little makes it sound close and intimate. When you mix a recording, compare a dry voice with one that has reverb.","listen":["Listen to the end of a loud note: does it ring on or stop dead?","Notice whether the sound seems close to you or far away in a big space."],"example":"The vocals are drenched in **reverb**, which makes them sound as if they were sung in a huge hall and gives the song a dreamy, distant feel."},"Expressive techniques and effects>Why Italian?":{"what":["Most music terms are Italian because many of the earliest printed scores and the first written performance directions came from Italy. Composers all over Europe copied the habit, so Italian became the shared language of the score.","That is why a player from any country can read Allegro, forte or rit. and know what to do."],"use":"Learn the common words as a set: tempo words (Andante, Allegro), dynamics (piano, forte), changes (rit., cresc.) and techniques (pizz., arco). Some composers also write directions in their own language, such as French or German, and many modern scores use English. When you compose, use the standard Italian words so any player understands.","listen":["When you see a score, spot the Italian words and check what each one tells the performer.","Listen to whether the music actually does what the word says, for example slowing down at rit."],"example":"The marking **Andante** sets a walking pace, and the **rit.** in the last two bars makes the music slow down so the ending feels relaxed."},"Elements of Music>Performing media and timbre":{"what":["Performing media are the voices and instruments that make the sound in a piece. Timbre (say 'TAM-ber') is the colour or quality of a sound. It is the reason a trumpet and a violin sound different even when they play the same note at the same volume.","This element has two jobs: name what is playing, then describe how it sounds."],"use":"Composers choose instruments for the colour they want, the way a painter chooses paint. A soft flute suits a calm scene and loud brass suits a battle. Performers change timbre too, by bowing, plucking, muting or singing breathily. When you compose, decide which instrument carries the melody and why.","listen":["Name every instrument or voice you can hear, then sort them into families.","Notice when a new instrument enters or the melody moves to a different instrument.","Find one describing word for the sound of each main instrument (bright, warm, raspy)."],"example":"In the opening the melody is played by a solo **flute** with a **breathy, mellow timbre**, then the **brass** take it over with a much **brighter** sound, which makes the second section feel bolder."},"Performing media and timbre>Sound sources":{"what":["A sound source is anything that makes the sound in a piece of music. There are four main kinds: the human voice, acoustic instruments, electronic sounds and natural or environmental sounds (body percussion, found objects, recordings of the world around us).","Many pieces mix sources, like a pop song with a live singer over a drum machine."],"use":"Composers pick sound sources to suit the style and mood. Film composers often blend an orchestra with electronic sounds, and some modern pieces are built from recordings of rain, traffic or birds. When you compose, try adding one unexpected source, such as a body-percussion layer.","listen":["Ask first: is it a voice, an instrument, electronic or a natural sound?","Listen for sounds that could not come from a normal instrument, which often means electronic or found sounds.","Check whether the voice is singing words, humming or making sound effects."],"example":"This excerpt combines **acoustic** guitar and **voice** with an **electronic** drum machine, so it sounds both personal and modern at the same time."},"Sound sources>Voices":{"what":["The voice is the instrument everyone carries. Sound is made when air from the lungs makes the vocal folds in your throat vibrate, and your mouth and throat shape that sound into vowels and words.","Voices can sing, speak, chant, hum, whisper, shout or beatbox. Each person's voice has its own timbre, which is why you can recognise a singer you know after a few notes."],"use":"Voices carry lyrics, so they usually take the melody in pop songs, opera, musicals and choirs. Singers change their timbre on purpose: breathy and soft for a gentle verse, full and strong for a big chorus. When you perform, think about how you shape vowels and how much breath you use.","listen":["Decide if it is a solo voice or a group, and male, female or child.","Listen for how the voice is used: singing, speaking, rapping, humming or vocal sound effects.","Describe the vocal timbre: breathy, raspy, smooth, nasal or powerful."],"example":"In the verse a solo female **voice** sings quietly with a **breathy** timbre, then in the chorus backing **vocals** join in harmony, which makes the chorus sound fuller.","fig":[{"file":"ex_voice_ranges.png","caption":"Approximate ranges of the four voice types, lowest note to highest note"}]},"Sound sources>Instruments":{"what":["An instrument is any object built or used to make musical sound. Acoustic instruments make their sound without electricity, from something vibrating: a string, a column of air inside a tube, a drum skin or a solid bar of wood or metal.","We group them by how the sound is made: strings, woodwind, brass, percussion and keyboards. Instruments from many cultures fit these groups too, such as the didgeridoo (blown with buzzing lips)."],"use":"Composers write for instruments they know well, using each one's best range and colour. Bands, orchestras and cultural ensembles all have their own usual line-up. When you compose for an instrument, check its range and how it is played so the part is actually playable.","listen":["Work out what is vibrating: a string, air in a tube, a skin or a bar.","Listen for how it is played: bowed, plucked, blown, struck or shaken.","Notice whether you hear one instrument or several of the same kind together."],"example":"The melody is played by a **cello**, a bowed **string instrument**, while a **piano** plays chords underneath, so the warm tone of the cello stands out over the accompaniment.","fig":[{"file":"ex_orchestra_layout.png","caption":"The four families of the orchestra and where they sit"}]},"Sound sources>Electronic":{"what":["Electronic sound sources make or change sound using electricity and circuits or computers. A synthesiser creates sounds from scratch, a drum machine plays programmed beats and a sampler plays back recorded sounds (samples) at different pitches.","An electric guitar is a slightly different case: its strings vibrate normally, but it needs electronics and an amplifier to be heard properly."],"use":"Electronic sounds are at the centre of pop, hip hop, EDM and much film and game music. Producers build tracks in a computer program called a DAW (digital audio workstation), using loops, samples and virtual instruments. You can compose this way at school with apps such as GarageBand or Soundtrap.","listen":["Listen for sounds that are perfectly even and repeat exactly, like a looped drum beat.","Notice sounds no acoustic instrument makes: wobbling bass, sweeping pads or robotic vocal effects.","Check for samples: short recorded sounds or phrases that keep coming back."],"example":"The introduction uses a **synthesiser** pad that slowly swells, and an **electronic drum machine** enters with a steady beat, which gives the song a cool, modern feel."},"Sound sources>Natural / environmental":{"what":["Natural and environmental sound sources are sounds that do not come from a normal instrument. Body percussion means using your body to make rhythm: clapping, clicking, stamping and patting your legs or chest. Found sounds come from everyday objects like bins, buckets, pens or bottles.","Recordings of the environment, such as rain, waves, birdsong or city traffic, also count as sound sources."],"use":"Body percussion is easy to perform in a group and is used in classroom ensembles and stage shows such as Stomp. Composers add environmental recordings to set a scene, like waves at the start of a song. When you compose, try a body-percussion ostinato (a pattern that repeats) under a melody.","listen":["Listen for claps, clicks, stamps or patting sounds.","Notice sounds of everyday objects being hit, rubbed or shaken.","Listen for background sounds from nature or the city that set a scene."],"example":"The piece opens with **environmental sounds** of waves and seagulls, then a **body percussion** ostinato of stamps and claps begins, so the music feels connected to a real place."},"Performing media and timbre>Families of the orchestra":{"what":["A symphony orchestra is a large group of players, often 60 to 100 people, led by a conductor. The instruments are sorted into four families by how they make their sound: strings, woodwind, brass and percussion.","The strings are the biggest family and sit at the front. Woodwind sit behind them, with brass and percussion at the back because they are the loudest."],"use":"Composers use each family for a different job. Strings often carry long melodies and harmony, woodwind add solo colours, brass give power and fanfares and percussion adds rhythm and big moments. When you write for orchestra, give each family a clear role so the music does not sound muddy.","listen":["Listen for which family has the melody at each point.","Notice when a whole family plays together, like a full brass chord.","Listen for the moment all four families play at once, usually the loudest part."],"example":"The **strings** play the main melody quietly, then the **brass** enter with a loud fanfare supported by **timpani** rolls, which makes the climax sound triumphant."},"Families of the orchestra>Strings":{"what":["The string family makes sound when stretched strings vibrate. The orchestral strings are the violin, viola, cello and double bass, plus the harp. The size rule is simple: the bigger the instrument and the longer its strings, the lower it sounds.","Players either draw a bow across the strings (arco) or pluck them with a finger (pizzicato, written pizz.)."],"use":"Strings are the backbone of most orchestras. They can play long, smooth melodies, fast exciting passages, soft held chords and short plucked notes. Strings also appear in folk, pop ballads and film music. When you compose, use pizz. for light, bouncy moments and arco for flowing lines.","listen":["Listen for a smooth, singing sound (bowed) or short dry notes (plucked).","Use the pitch to name the instrument: high is violin, middle is viola or cello, very low is double bass.","Notice if you hear a whole section playing together, which sounds fuller than one player."],"example":"The **strings** play **pizzicato** in the opening, which sounds light and playful, then change to **arco** for a smooth melody in the second section.","fig":[{"file":"violin.jpg","caption":"Violin: the smallest and highest string instrument"},{"file":"double_bass.jpg","caption":"Double bass: the biggest and lowest"}]},"Strings>Violin":{"what":["The violin is the smallest and highest instrument in the string family. It has four strings tuned G, D, A and E, and it is held under the chin and played with a bow or plucked. Violin music is written in the treble clef.","An orchestra has two violin groups, the first violins and second violins, who usually play different parts."],"use":"The violin is often given the main melody because its bright, singing tone carries over the orchestra. It turns up in classical music, film scores, folk music (where it is often called a fiddle) and pop ballads. Violinists use vibrato (a small wobble in pitch) to make long notes warmer.","listen":["Listen for a high, singing string sound that can be very smooth or very fast.","Notice vibrato: a gentle wobble in pitch on long notes.","Listen for the brighter, higher partner when the strings play in parts."],"example":"The **violins** play the melody high in their range with a lot of vibrato, which makes the music sound emotional and intense."},"Strings>Viola":{"what":["The viola looks like a violin but is a little bigger, so it sounds lower and a little darker. Its four strings are tuned C, G, D and A, which is five notes lower than the violin.","It is still held under the chin. Viola music is mostly written in the alto clef, a clef where middle C sits on the middle line of the staff."],"use":"The viola usually fills in the middle of the harmony, between the violins and the cellos, so you hear it more as part of the blend than as a soloist. Composers use it when they want a warm, slightly husky melody. In a string quartet it has an important inner part.","listen":["Listen for a string sound lower and huskier than a violin but higher than a cello.","Notice middle notes that fill out the harmony in the strings.","In a solo, listen for a darker, more mellow tone than the violin."],"example":"In the middle section the **viola** takes over the melody with a **warm, husky** tone, which makes the music feel more serious than the bright violin opening."},"Strings>Cello":{"what":["The cello is a large string instrument played sitting down, held between the knees with a metal spike (the endpin) resting on the floor. Its four strings are tuned C, G, D and A, an octave lower than the viola.","Cello music is usually written in the bass clef. It has a wide range, from deep bass notes up to high singing notes."],"use":"The cello often plays the bass line with the double bass, but composers love it for melodies too because its tone is rich and warm, close to a human voice. It is used in classical music, film scores and some pop and rock. Cellists can bow, pluck and use vibrato.","listen":["Listen for a deep, rich string sound that can also sing in the middle range.","Notice if the cello is doubling the bass line or carrying a melody of its own.","Listen for long, warm bowed notes with vibrato."],"example":"A solo **cello** plays the melody in its low register with a **rich, warm** tone, which gives the opening a sad and thoughtful mood."},"Strings>Double bass":{"what":["The double bass is the biggest and lowest instrument in the string family. Players stand or sit on a tall stool to play it. Its four strings are tuned E, A, D and G.","Music for the double bass is written in the bass clef, and it sounds an octave lower than written, which keeps the notes from needing lots of ledger lines."],"use":"In the orchestra the double bass plays the lowest notes and gives the harmony its foundation. In jazz it is usually plucked to play a walking bass line, a bass part that moves on every beat. It is also used in rockabilly, folk and bluegrass.","listen":["Listen for the very lowest notes, which you may feel more than hear.","In jazz, listen for a plucked bass part moving on every beat.","Notice a deep buzzy sound when the bass is bowed."],"example":"The **double bass** plays a plucked **walking bass line** on every crotchet beat, which keeps the jazz feel moving forward."},"Strings>Harp":{"what":["The harp is a large string instrument played by plucking the strings with the fingers. The concert harp has 47 strings and seven foot pedals that change some notes up or down by a semitone. The C strings are coloured red so the harpist can find their place.","Because its strings are plucked, the harp is in the string family. The guitar is also a string instrument, though it is not a regular member of the orchestra."],"use":"Harpists play spread chords (the notes of a chord played quickly one after another, called arpeggios) and glissandos, where the fingers sweep across many strings. Composers use the harp for dreamy, magical or gentle moments in orchestral and film music.","listen":["Listen for soft plucked notes that ring on after they are played.","Notice rippling arpeggios or sweeping glissandos up and down.","Listen for a gentle, shimmering sound under the orchestra."],"example":"A **harp glissando** sweeps upward at the start of the scene, which gives the music a dreamy, magical feel."},"Families of the orchestra>Woodwind":{"what":["Woodwind instruments make sound when air inside a tube vibrates. The flute does this when the player blows across a hole. The others use a reed: a thin strip of cane. Clarinet and saxophone use a single reed, and oboe and bassoon use a double reed (two reeds tied together).","Players press keys or cover holes to change the length of the tube. A longer tube means a lower note."],"use":"Composers often give short melodies and solos to woodwind because each instrument has a clear, recognisable colour. Woodwind play in orchestras, concert bands and jazz bands. When you compose, try passing a melody from one woodwind instrument to another to change its colour.","listen":["Listen for a breathy sound (flute) or a buzzier reed sound (oboe, clarinet).","Notice how high or low the instrument is: piccolo and flute are high, bassoon is low.","Listen for short solo phrases that stand out over the strings."],"example":"The **woodwind** answer the strings with short phrases: first a **reedy** oboe, then a **mellow** clarinet, which gives each phrase a different colour.","fig":[{"file":"flute.jpg","caption":"Flute: no reed, blown across a hole"},{"file":"oboe.jpg","caption":"Oboe: double reed"}]},"Woodwind>Flute":{"what":["The flute is a high woodwind instrument held out to the right side. The player blows across a hole in the mouthpiece, like blowing across the top of a bottle. It has no reed.","Most flutes are made of metal, but the flute is still a woodwind instrument because of how the air makes the sound. The piccolo is a small flute that sounds an octave higher."],"use":"The flute can play fast, light runs and gentle, airy melodies, so composers use it for birdsong, nature scenes and delicate solos. It is in orchestras, concert bands, folk music and some jazz. Flautists can also use flutter-tonguing, rolling an 'r' while they play.","listen":["Listen for a high, pure sound with a little breath in it.","Notice fast, light runs and trills, often imitating birds.","Low flute notes sound soft and breathy, high notes are bright and clear."],"example":"A solo **flute** plays a light, **breathy** melody high above soft strings, which makes the music sound peaceful, like a bird singing."},"Woodwind>Oboe":{"what":["The oboe is a woodwind instrument played with a double reed: two thin blades of cane tied together that vibrate against each other when the player blows between them. It is held straight down in front of the player.","The oboe has a strong, focused sound that people often describe as nasal or reedy. Before a concert the orchestra tunes to an A played by the oboe."],"use":"Composers give the oboe slow, expressive melodies and pastoral moments (music about the countryside) because its tone cuts through the orchestra. It also plays in concert bands and chamber groups. A bigger relative, the cor anglais, sounds lower and darker.","listen":["Listen for a thin, focused, slightly nasal tone.","Notice that it cuts through the orchestra even when it plays softly.","Listen for slow, singing solo melodies in the middle to high range."],"example":"The **oboe** plays a slow solo with a **reedy, nasal** tone that cuts through the soft strings, which makes the melody sound lonely."},"Woodwind>Clarinet":{"what":["The clarinet is a woodwind instrument with a single reed held against a mouthpiece by a metal or leather band called a ligature. The reed vibrates against the mouthpiece when the player blows. Most clarinets are made of dark wood or plastic.","The most common clarinet is in B flat, which means its notes sound a tone lower than written."],"use":"The clarinet has a huge range, from a dark, hollow low register to a bright, clear high register, so it suits both gentle and lively music. It plays in orchestras, concert bands, jazz and klezmer (Jewish folk music). It can also slide up smoothly and play very softly.","listen":["Listen for a smooth, round tone, darker and less nasal than the oboe.","Notice the hollow, dark sound of its low notes.","Listen for slides and wide jumps between low and high notes."],"example":"The **clarinet** plays the melody in its low register with a **dark, hollow** tone, then leaps up to bright high notes, which makes the music sound playful."},"Woodwind>Bassoon":{"what":["The bassoon is a low woodwind instrument with a double reed, like the oboe. Its tube is about two and a half metres long, folded in half so it can be held. The reed sits on a curved metal pipe called the crook (or bocal).","It is the lowest regular woodwind in the orchestra. The contrabassoon is a rare, larger version that plays even lower."],"use":"The bassoon often plays bass lines in the woodwind section, but it can also play melodies. Its low, slightly buzzy notes can sound funny or grumpy, so composers often use it for comic characters. Its high notes can sound sad and gentle.","listen":["Listen for a low, reedy and slightly buzzy tone.","Notice short, bouncy staccato notes that sound comic.","Listen for low woodwind notes underneath the higher instruments."],"example":"The **bassoon** plays a bouncy staccato melody low in its range, and its **buzzy, reedy** tone makes the character sound clumsy and comic."},"Woodwind>Saxophone":{"what":["The saxophone has a brass body, but it is a woodwind instrument because the sound comes from a single reed on its mouthpiece, like the clarinet. It was invented by the Belgian instrument maker Adolphe Sax in the 1840s.","The common types, from highest to lowest, are soprano, alto, tenor and baritone. The alto and tenor are the ones you see most at school."],"use":"The saxophone is a star of jazz, funk, rock and roll and pop solos, and it is used in concert bands. It is not a regular member of the orchestra. Players can make it sound smooth and sweet or growly and raspy, and can bend notes up and down.","listen":["Listen for a reedy tone that is louder and fuller than a clarinet.","Notice bends, slides and growls in jazz or pop solos.","Listen for a smooth, breathy sound in slow ballads."],"example":"In the instrumental break a **tenor saxophone** plays a solo with a **raspy**, growling tone and bent notes, which gives the song a bluesy, energetic sound."},"Families of the orchestra>Brass":{"what":["Brass instruments make sound when the player buzzes their lips into a cup-shaped metal mouthpiece. The buzz makes the air inside the long metal tube vibrate.","To change notes, players tighten or loosen their lips and press valves or move a slide, which changes the length of the tube. The orchestral brass are the trumpet, French horn, trombone and tuba."],"use":"Brass are the loudest family, so composers use them for fanfares, big climaxes and powerful chords. They can also play very softly and smoothly. Brass are central in brass bands, concert bands, jazz big bands and film music. Players can change their timbre with mutes placed in the bell.","listen":["Listen for a bold, strong sound, especially in loud passages.","Notice fanfares: short, rhythmic calls often built from the notes of a chord.","Listen for a muted sound that is quieter and buzzier or more distant."],"example":"The **brass** section plays a loud **fanfare** of repeated notes and wide leaps, with a **bright, bold** tone that makes the opening sound heroic.","fig":[{"file":"trumpet.jpg","caption":"Trumpet: the highest brass"},{"file":"tuba.png","caption":"Tuba: the lowest brass"}]},"Brass>Trumpet":{"what":["The trumpet is the highest instrument in the brass family. It has three valves, which players press in different combinations to change notes. The most common trumpet is in B flat.","Its tube is about 1.5 metres long, curled into a compact shape, and it ends in a flared bell."],"use":"The trumpet has a bright, powerful sound, so composers use it for fanfares, military calls and exciting melodies. It is important in jazz, ska, Latin music and brass bands. Trumpeters often use mutes, such as the straight mute or the wah-wah (harmon) mute, to change the timbre.","listen":["Listen for a bright, clear, powerful high brass sound.","Notice short, sharp notes in fanfares and calls.","Listen for a muted trumpet, which sounds thin, buzzy or far away."],"example":"A solo **trumpet** plays a **bright, piercing** fanfare above the orchestra, which makes the moment sound bold and important."},"Brass>French horn":{"what":["The French horn (usually just called the horn) is a brass instrument with a long tube, about 3.7 metres, coiled into a circle. It has rotary valves played with the left hand, while the player's right hand sits inside the bell.","The bell points backwards, so the sound reflects off the wall behind, which helps give the horn its mellow, rounded tone."],"use":"Composers use the horn for warm, noble melodies, hunting calls and heroic themes in film music. It blends well with both brass and woodwind, so it also fills in harmony. In loud passages it can sound very powerful.","listen":["Listen for a warm, round, mellow brass sound.","Notice that it sounds softer-edged and further away than a trumpet.","Listen for big, sweeping melodies in film and orchestral music."],"example":"The **French horns** play the main theme in unison with a **warm, mellow** tone, which gives the music a noble, heroic feeling."},"Brass>Trombone":{"what":["The trombone is a brass instrument that changes notes with a slide instead of valves. Pushing the slide out makes the tube longer and the note lower. There are seven slide positions.","Because the slide moves smoothly, the trombone can slide from one note to another. This is called a glissando. Trombone music is usually written in the bass clef."],"use":"Trombones give weight and power to orchestral brass chords and are a big part of jazz big bands, ska and Latin music. Composers use the glissando for comic or dramatic effects. Played softly, a trombone section sounds rich and smooth.","listen":["Listen for a full, powerful mid-to-low brass sound.","Notice sliding notes (glissandos) that only a trombone can play smoothly.","Listen for rich brass chords under the trumpets."],"example":"The **trombone** plays a slow downward **glissando** at the end of the phrase, which sounds comic, like a sad 'wah-wah'."},"Brass>Tuba":{"what":["The tuba is the largest and lowest instrument in the brass family. It is played sitting down with the bell pointing up, and usually has three to five valves.","Its very long tube and wide bore (the inside width of the tube) give it a deep, round sound. Tuba music is written in the bass clef."],"use":"In the orchestra the tuba usually plays the bass line under the brass. In marching bands, brass bands and some jazz and polka styles it carries a strong 'oom-pah' bass part on the beat. Composers sometimes use it for heavy, slow or funny characters.","listen":["Listen for the very lowest brass notes, deep and round.","Notice an 'oom-pah' bass on the strong beats in band music.","Listen for the bottom note of loud brass chords."],"example":"The **tuba** plays an 'oom-pah' **bass line** on beats 1 and 3 with a **booming** tone, which gives the march a solid, steady feel."},"Families of the orchestra>Percussion":{"what":["Percussion instruments make sound when they are struck (hit), shaken or scraped. They are split into two groups. Tuned (pitched) percussion plays definite notes, like the xylophone and timpani. Untuned (unpitched) percussion makes sounds with no definite note, like the snare drum and cymbals.","Percussionists usually play several instruments in one piece and swap between them."],"use":"Percussion gives music rhythm, energy and special colours. Composers use rolls to build tension, cymbal crashes for climaxes and glockenspiel for sparkle. Every culture has its own percussion, from African drums to the Indonesian gamelan. When you compose, a simple untuned percussion ostinato can drive a whole piece.","listen":["Listen for hits, shakes and scrapes and name how each sound is made.","Decide whether you can sing the note (tuned) or not (untuned).","Notice rolls and crashes that build up or mark big moments."],"example":"**Untuned percussion** keeps a steady ostinato on snare drum, while a **glockenspiel** doubles the melody with a **bright, metallic** sparkle.","fig":[{"file":"timpani.jpg","caption":"Timpani: tuned percussion"},{"file":"snare_drum.png","caption":"Snare drum: untuned percussion"}]},"Percussion>Tuned":{"what":["Tuned percussion (also called pitched percussion) plays definite notes that you could sing back. Bar instruments like the xylophone and glockenspiel are laid out like a piano keyboard, and timpani can be tuned to particular notes.","Because they play real notes, tuned percussion parts are written on a normal five-line staff."],"use":"Tuned percussion can play melodies, chords and ostinatos. The xylophone and glockenspiel often double a melody to brighten it, and timpani reinforce the bass and add drama. School classroom instruments such as glockenspiels and xylophones are great for composing simple ostinatos.","listen":["Listen for a percussion sound that has a clear note you could hum.","Notice if the percussion is playing the melody along with another instrument.","Listen for whether the sound is woody (xylophone) or metallic (glockenspiel)."],"example":"The **xylophone** plays a fast, **tuned** ostinato with a dry, wooden tone, which gives the piece a playful, bouncy feel.","fig":[{"file":"rm_s4_tuned_untuned.png","caption":"Tuned percussion is written on a five-line staff because it plays real notes; untuned percussion only needs rhythm, so one line is enough"}]},"Tuned>Xylophone":{"what":["The xylophone is a tuned percussion instrument with wooden bars (or tough synthetic bars) laid out like a piano keyboard. It is played with hard mallets. Tubes called resonators hang under the bars to make the sound louder.","Orchestral xylophone music sounds an octave higher than written. The marimba is a bigger relative with a deeper, warmer sound."],"use":"The xylophone's short, dry, bright notes suit fast, playful and comic music, and it is also used for spooky effects, such as rattling skeletons. In class you often play smaller xylophones with soft mallets for ostinatos and simple melodies.","listen":["Listen for short, dry, wooden 'tok' notes with a clear pitch.","Notice fast runs and repeated notes that sound bright and bouncy.","Compare it with the glockenspiel: the xylophone does not ring on."],"example":"The **xylophone** doubles the melody with short, **dry, wooden** notes, which makes the music sound cheeky and playful."},"Tuned>Glockenspiel":{"what":["The glockenspiel is a tuned percussion instrument with metal bars, laid out like a piano keyboard. It is played with hard mallets and makes a bright, bell-like sound that keeps ringing after each note.","Orchestral glockenspiel music sounds two octaves higher than written. 'Glockenspiel' is German for 'play of bells'."],"use":"Composers use the glockenspiel for sparkle and magic, in Christmas music, toy and fairy-tale scenes and film music. Because it is so bright, it is usually used in small amounts to double a melody. Classroom glockenspiels are ideal for learning melodies and composing ostinatos.","listen":["Listen for very high, bright, bell-like notes that ring on.","Notice a twinkling sound doubling a melody.","Compare it with the xylophone: the glockenspiel is metallic and rings longer."],"example":"A **glockenspiel** doubles the melody two octaves higher with a **bright, metallic** ring, which gives the scene a magical, sparkling feel."},"Tuned>Timpani (kettledrums)":{"what":["Timpani (or kettledrums) are large drums with a copper bowl and a skin or plastic head stretched over the top. Unlike most drums they are tuned to definite notes. A foot pedal tightens or loosens the head to change the pitch.","Orchestras usually have two to five timpani, each tuned to a different note. They are played with soft-headed sticks and written in the bass clef."],"use":"Timpani often play the home note and the fifth of the key to strengthen the bass. Composers use timpani rolls (very fast repeated strokes) to build tension and loud strokes for dramatic climaxes. They are in orchestras, film scores and concert bands.","listen":["Listen for a deep, booming drum that has a clear note.","Notice rolls that swell louder before a big moment.","Listen for single loud strokes at the ends of phrases."],"example":"The **timpani** play a long **roll** that grows from soft to loud on the home note, which builds tension before the full orchestra enters.","fig":[{"file":"rm_s4_timpani.png","caption":"A timpani part for two drums tuned to C and G. The three slashes on the last note mean a roll"}]},"Percussion>Untuned":{"what":["Untuned percussion (also called unpitched percussion) makes sounds that have no definite note you could sing back. Drums like the snare and bass drum, cymbals, tambourine, triangle, woodblock, maracas and guiro are all untuned.","Because there are no pitches to show, the part only needs the rhythm. It is usually written on a one-line staff or a percussion staff."],"use":"Untuned percussion is used for rhythm, accents and sound effects. It keeps the beat in bands, adds colour in orchestras and is the heart of many cultures' music. In class it is the easiest way to layer rhythms and ostinatos.","listen":["Listen for percussion sounds with no clear note.","Notice whether each sound is struck, shaken or scraped.","Listen for repeated rhythm patterns that hold the music together."],"example":"**Untuned percussion** layers an ostinato on **woodblock** and **maracas** under the melody, which gives the music a light, Latin-style groove.","fig":[{"file":"rm_s4_tuned_untuned.png","caption":"Tuned percussion is written on a five-line staff because it plays real notes; untuned percussion only needs rhythm, so one line is enough"}]},"Untuned>Snare drum":{"what":["The snare drum is a small, shallow drum played with drumsticks. Under the bottom head are wires called snares. When the top head is hit, the snares rattle against the bottom head and make the drum's crisp, buzzing 'crack'.","A lever can turn the snares off, which makes the drum sound like a dull tom."],"use":"The snare drum is the main drum in marching bands, military music and the drum kit, where it plays the backbeat on beats 2 and 4. Snare drummers use rolls, accents and rudiments (standard sticking patterns) to build excitement.","listen":["Listen for a sharp, crisp, rattling 'crack'.","Notice rolls that sound like a continuous buzz.","In pop and rock, listen for the snare on beats 2 and 4."],"example":"The **snare drum** plays a steady marching rhythm with a **roll** at the end of each phrase, which makes the music sound military and determined.","fig":[{"file":"rm_s4_snare.png","caption":"A snare drum part on a one-line staff: rhythm only, then a roll (three slashes) and an accent"}]},"Untuned>Cymbals":{"what":["Cymbals are thin, round plates of metal, usually bronze. Crash cymbals come in a pair and are struck together. A suspended cymbal hangs on a stand and is played with sticks or soft mallets.","A drum kit has its own cymbals: the crash, the ride and the hi-hat (two cymbals clamped together and opened or closed with a foot pedal)."],"use":"Composers use a loud cymbal crash to mark a climax or the start of a new section, and a soft mallet roll on a suspended cymbal to make a shimmering build-up. In bands, the hi-hat and ride keep steady patterns.","listen":["Listen for a loud, splashy, metallic crash that rings for a long time.","Notice a shimmering swell made by a cymbal roll.","In band music, listen for the steady 'tss' of the hi-hat or ride."],"example":"A **suspended cymbal roll** swells to a loud **crash** at the start of the chorus, which marks the new section and adds excitement."},"Untuned>Tambourine":{"what":["The tambourine is a small frame drum with pairs of small metal discs called jingles set into its wooden or plastic frame. Some tambourines have a skin head and some have none.","It can be struck with the hand, shaken to make the jingles rattle or rolled by rubbing a thumb around the edge of the head."],"use":"Tambourines turn up in folk dances, gospel, pop, rock and the orchestra. Players often shake it on every beat or hit it on beats 2 and 4. It is a good instrument for a class ensemble because it can play both a clear hit and a long shake.","listen":["Listen for a bright jingling sound.","Notice the difference between a short hit and a long shaken roll.","In pop, listen for jingles on beats 2 and 4 or in a steady quaver pattern."],"example":"The **tambourine** shakes steady quavers through the chorus with a **bright, jingly** timbre, which makes the song feel lively and danceable.","fig":[{"file":"rm_s4_tambourine.png","caption":"Tambourine: struck notes, then a shake written as a roll (three slashes)"}]},"Percussion>Drum kit":{"what":["The drum kit (drum set) is a group of drums and cymbals played by one person. A standard kit has a bass drum (played with a foot pedal), a snare drum, two or three toms, a hi-hat (opened and closed with the other foot) and crash and ride cymbals.","Drum kit music is written on a five-line percussion staff where each line or space stands for a different drum or cymbal."],"use":"The drum kit keeps the beat and groove in rock, pop, jazz, funk and many other styles. Drummers play repeated patterns called grooves or beats and add fills (short bursts) at the ends of sections. A common rock beat has the bass drum on 1 and 3 and the snare on 2 and 4.","listen":["Listen for the low thud of the bass drum and the crack of the snare.","Notice the steady 'tss' of the hi-hat or ride cymbal.","Listen for drum fills that lead into a new section."],"example":"The **drum kit** plays a steady **backbeat**, with the snare on beats 2 and 4, then a tom **fill** leads into the chorus, which lifts the energy.","fig":[{"file":"ex_backbeat.png","caption":"A rock beat: hi-hat quavers on top, bass drum on beats 1 and 3, snare on beats 2 and 4"}]},"Percussion>Maracas":{"what":["Maracas are a pair of rattles, each a hollow shell on a handle filled with seeds, beads or small stones. They come from Latin America and were traditionally made from dried gourds.","They are played by shaking. A sharp flick of the wrist makes a short 'chk' sound, and keeping them moving makes a continuous rattle."],"use":"Maracas are used in Latin American styles like salsa and in pop, where they often play steady quavers or semiquavers to keep the groove moving. In class they are easy to use for shaking ostinatos.","listen":["Listen for a soft, dry, rattling 'chk-chk' sound.","Notice a steady stream of short notes that fills in between the main beats.","Listen for it in Latin dance music together with other hand percussion."],"example":"The **maracas** shake steady quavers through the song with a dry, **rattling** timbre, which gives the groove a light Latin feel."},"Percussion>Guiro":{"what":["The guiro (say 'GWEE-ro') is a hollow percussion instrument with ridges cut along its side. It is traditionally made from a dried gourd and comes from Latin America.","It is played by scraping a stick across the ridges. A long scrape makes a long rasping sound and a short flick makes a quick 'tick'."],"use":"The guiro plays repeated rhythm patterns in Latin American music such as salsa and cumbia, often a long scrape followed by short ones. Composers also use it for funny or creaky sound effects, like a frog croaking.","listen":["Listen for a raspy, scratchy sound.","Notice long and short scrapes in a repeated pattern.","Listen for it with other Latin percussion such as maracas and congas."],"example":"The **guiro** scrapes a long-short-short rhythm with a **raspy** timbre, which adds to the Latin dance feel."},"Families of the orchestra>Tricky ones":{"what":["Some instruments do not fit the family you would guess from what they are made of. Instruments are grouped by how the sound is made, not what they are made of.","The saxophone is metal but uses a reed, so it is woodwind. The flute is metal too, and it is woodwind because the air is blown across a hole, not buzzed. Inside a piano, felt hammers strike strings, so it has features of both strings and percussion."],"use":"This trick works in tests: ask yourself what vibrates first. A reed or an edge of air means woodwind, buzzing lips means brass, a string means string family and a hit, shake or scrape means percussion. The didgeridoo is made of wood, but the player buzzes their lips, the same way brass players do.","listen":["For a mystery instrument, listen for a reedy buzz, which means a reed instrument.","A breathy sound with no buzz is usually a flute or recorder.","A piano note starts with a strike and then fades, which is its percussive side."],"example":"The melody is played by an alto **saxophone**, which is a **woodwind** instrument because it uses a single reed, and its **reedy** tone blends with the clarinets.","fig":[{"file":"saxophone.jpg","caption":"Alto saxophone: metal body but a single reed, so it is woodwind"},{"file":"piano.png","caption":"Grand piano: hammers strike strings"}]},"Performing media and timbre>Keyboards, guitars and others":{"what":["This group covers instruments that are not one of the four orchestra families, or that sit across two of them. Keyboards (piano, synthesiser, organ) are played by pressing keys. Guitars, bass and ukulele are plucked or strummed string instruments used in bands.","It also includes instruments from many cultures, such as the didgeridoo (yidaki) from Aboriginal Australia."],"use":"These are the instruments of most bands and classroom music. Keyboards and guitars can play melody and chords at once, so they often accompany singers. When you compose, these instruments are useful for chord progressions and riffs.","listen":["Listen for chords strummed on guitar or played on piano under a voice.","Notice whether the guitar is acoustic (natural) or electric (amplified).","Listen for electronic keyboard sounds such as pads, organs or synth leads."],"example":"The **acoustic guitar** strums chords under the voice while an **electric bass guitar** plays the bass line, which gives the song a relaxed, warm sound."},"Keyboards, guitars and others>Grand piano":{"what":["The piano is a keyboard instrument with 88 keys, 52 white and 36 black. When you press a key, a felt hammer strikes a string inside, which is why the piano has features of both the string and percussion families. A grand piano lies flat with its strings horizontal; an upright piano stands its strings up vertically.","Its full name, pianoforte, means 'soft-loud', because it can play both."],"use":"The piano can play melody and harmony at once, so it is used for solos, accompanying singers and in almost every style from classical to jazz and pop. The right pedal (sustain pedal) lets notes ring on after the keys are released. Piano music is written on the grand staff.","listen":["Listen for a clear note that starts with a strike and then slowly fades.","Notice melody and chords being played together by two hands.","Listen for the sustain pedal blurring notes into each other."],"example":"The **piano** plays broken chords in the left hand under a gentle melody in the right hand, and the **sustain pedal** blends the notes into a soft, flowing accompaniment."},"Keyboards, guitars and others>Synthesiser":{"what":["A synthesiser (synth) is an electronic instrument that creates sounds from electrical signals rather than from something vibrating. Its oscillators make basic tones, and filters and effects shape them into new sounds. Most synths are played from a keyboard.","A synth can imitate real instruments or make sounds no acoustic instrument can. Synthesisers became popular in the 1960s and 70s and are now often software inside a computer."],"use":"Synths are central in pop, EDM, hip hop and film and game music. Common sounds include pads (soft, held chords), leads (a solo melody sound), arpeggiators (patterns that run up and down) and deep synth bass. When you compose in a DAW, try layering a pad under your chords.","listen":["Listen for sounds that are smooth, buzzy or wobbly and do not sound acoustic.","Notice long held 'pad' chords that swell in the background.","Listen for fast arpeggio patterns that repeat exactly."],"example":"A **synthesiser pad** holds soft chords in the background while a bright **synth lead** plays the hook, which gives the song an electronic, dreamy sound."},"Keyboards, guitars and others>Acoustic guitar":{"what":["The acoustic guitar is a string instrument with a hollow wooden body and a sound hole. It usually has six strings, tuned from lowest to highest E, A, D, G, B and E. Players press the strings onto frets (metal strips on the neck) to change notes.","Steel-string guitars sound bright and are used in folk and pop. Classical guitars have nylon strings and sound softer and warmer."],"use":"Guitarists strum chords to accompany singers or pick individual notes for melodies and riffs. Fingerpicking means plucking strings one at a time with the fingers to make patterns. The guitar is used in folk, pop, country, classical and Latin music, and guitar music can be written in TAB.","listen":["Listen for strummed chords with a natural, woody sound.","Notice fingerpicked patterns where single notes ring together.","Compare steel strings (bright, jangly) with nylon strings (soft, warm)."],"example":"An **acoustic guitar** fingerpicks a gentle pattern under the verse, then changes to **strumming** in the chorus, which makes the chorus sound bigger."},"Keyboards, guitars and others>Electric guitar":{"what":["The electric guitar usually has six strings tuned like the acoustic guitar, but its body is often solid. Magnets called pickups turn the vibrations of the strings into an electrical signal, which goes to an amplifier and speaker.","Without an amplifier it is very quiet. Effects pedals can change the sound, for example distortion (a rough, fuzzy sound) or reverb (an echoey space)."],"use":"The electric guitar is the main instrument of rock and is used in pop, blues, metal, funk and jazz. Guitarists play power chords, riffs and solos. They also bend notes and use vibrato. In a band there is often a lead guitar (solos and riffs) and a rhythm guitar (chords).","listen":["Listen for a distorted, crunchy sound in rock and metal.","Notice a clean, bright electric sound in funk or pop.","Listen for bent notes and fast runs in guitar solos."],"example":"The **electric guitar** plays a **distorted** power-chord riff with a **harsh, crunchy** tone, which makes the song sound aggressive and energetic."},"Keyboards, guitars and others>Bass guitar":{"what":["The bass guitar usually has four strings tuned E, A, D and G, the same notes as the four lowest guitar strings but an octave lower. It has a longer neck than a guitar and is almost always electric, so it needs an amplifier.","Some basses have five or six strings for extra range."],"use":"The bass guitar plays the bass line, the lowest part in a band, which locks in with the drum kit to make the groove. Bassists pluck with their fingers or a pick, and in funk they slap the strings with the thumb. In most songs the bass plays the root note of each chord.","listen":["Listen for the lowest pitched part in a band.","Notice how the bass notes line up with the bass drum.","Listen for the bass changing note each time the chord changes."],"example":"The **bass guitar** plays a repeated **riff** on the root notes, locking in with the bass drum, which gives the song a strong groove."},"Keyboards, guitars and others>Ukulele":{"what":["The ukulele is a small, four-stringed instrument from Hawaii. It developed from small guitar-like instruments brought by Portuguese immigrants in the 1800s. It has nylon strings, usually tuned G, C, E and A.","The G string is tuned higher than the C, so the strings do not go in order from low to high. This is why the ukulele sounds so bright."],"use":"The ukulele is mostly strummed to accompany singing, and it is easy to learn because many chords need only one or two fingers. It is used in Hawaiian music, pop and school music programs. You can also play simple melodies on it.","listen":["Listen for a light, bright, plucky strummed sound.","Notice it is higher and thinner than a guitar.","Listen for chords strummed quickly in a happy, relaxed song."],"example":"A **ukulele** strums a simple down-up pattern with a **bright, light** timbre, which gives the song a cheerful, beachy feel."},"Keyboards, guitars and others>Didgeridoo (yidaki)":{"what":["The didgeridoo is an Aboriginal Australian instrument from northern Australia. In north-east Arnhem Land the Yolngu people call it the yidaki. It is traditionally made from a eucalyptus branch hollowed out by termites.","The player buzzes their lips into one end, the same way brass players do, to make a deep drone (a long, held low note). Many players use circular breathing, breathing in through the nose while pushing air out of the mouth, to keep the sound going."],"use":"The didgeridoo accompanies songs and dances, often with clapsticks. Players change the sound with their mouth and voice to make rhythms, overtones and animal calls. It has deep cultural meaning, and in many communities there are protocols about who may play it, so it should be learned and used respectfully.","listen":["Listen for a deep, buzzing drone that does not stop.","Notice rhythmic pulses and changes in tone colour on top of the drone.","Listen for vocal sounds or animal calls blended into the drone."],"example":"The **didgeridoo (yidaki)** plays a continuous **drone** with rhythmic pulses while clapsticks keep the beat, which creates a hypnotic, grounded sound.","fig":[{"file":"ex_drone.png","caption":"A drone: a low note held under a moving melody"}]},"Performing media and timbre>Playing techniques":{"what":["Playing techniques are the ways a performer gets a sound out of an instrument: blowing, bowing, plucking, strumming, striking, shaking and scraping. The same instrument can have several techniques. A violin can be bowed or plucked, and a tambourine can be struck or shaken.","Composers write techniques into the score with words or signs, such as pizz. (pluck) and arco (bow)."],"use":"Changing technique changes the timbre, so composers use it to add contrast without changing instrument. Performers also choose techniques to suit the style, like strumming a guitar for pop or fingerpicking for folk. When you compose, write the technique into the part so the player knows what you want.","listen":["Ask how the sound was started: blown, bowed, plucked, hit, shaken or scraped.","Notice when the same instrument switches technique, for example arco to pizz.","Listen for special effects such as slides, rolls or mutes."],"example":"The **strings** begin **pizzicato**, then switch to **arco** for the second phrase, which changes the music from light and bouncy to smooth and flowing."},"Playing techniques>Blowing":{"what":["Blowing is how woodwind and brass instruments are played. On a flute or recorder the player blows across or into an edge. On a clarinet, saxophone, oboe or bassoon the breath makes a reed vibrate. On brass the player buzzes their lips into a mouthpiece.","In every case the breath sets the air inside the tube vibrating."],"use":"Wind players control breath to shape the music: more air makes a louder sound, and steady air makes smooth, long notes. Tonguing (starting a note with a 'too' or 'doo' movement of the tongue) makes notes separate, and slurring lets them flow. Players breathe at the ends of phrases, so wind melodies are written with breathing places.","listen":["Listen for breath sounds or a breathy edge to the note.","Notice whether notes are tongued (separate) or slurred (smooth).","Listen for where the player takes a breath, usually at the end of a phrase."],"example":"The **flute** player uses lots of air in the low register, so the **blown** notes sound **breathy** and soft, which suits the calm opening.","fig":[{"file":"flute.jpg","caption":"Flute: blown across a hole"},{"file":"trumpet.jpg","caption":"Trumpet: buzzed lips into a mouthpiece"}]},"Playing techniques>Bowing":{"what":["Bowing is drawing a bow across the strings of an instrument such as the violin, viola, cello or double bass. The bow is a wooden stick with horsehair, rubbed with rosin (a sticky resin) so it grips the string and makes it vibrate.","The Italian word for bowing is arco. Players move the bow in two directions: down-bow (pulling) and up-bow (pushing)."],"use":"Bowing lets string players hold long, smooth notes and change the volume during a note. Notes under one slur are played in a single bow, which makes them smooth. Bowing near the bridge sounds harsh and glassy; bowing over the fingerboard sounds soft and airy. Composers mark bowings in the part.","listen":["Listen for long, smooth string notes that can swell and fade.","Notice short, bouncing bow strokes in fast music.","Listen for the change back to the bow after a plucked passage, marked arco."],"example":"The **cellos** play **arco** with long, slow **bow** strokes, which gives the melody a smooth, singing quality.","fig":[{"file":"rm_s4_bowing.png","caption":"Bowing marks: the square bracket means down-bow (pull), the V means up-bow (push). Notes under one slur are played in one bow"}]},"Playing techniques>Plucking":{"what":["Plucking is pulling a string with a finger or a pick (plectrum) and letting it go so it vibrates. Harps, guitars, bass guitars and ukuleles are normally plucked.","Bowed string players can pluck too. This is called pizzicato, written pizz. in the music. When they go back to the bow, the music says arco."],"use":"Plucked notes start sharply and then fade quickly, so they sound light and crisp. Composers use pizzicato strings for playful, sneaky or bouncy music. Guitarists pluck single notes for melodies and riffs, or fingerpick patterns to accompany a singer.","listen":["Listen for short notes with a sharp start that die away quickly.","Notice whether the plucking is a whole string section (pizzicato) or a guitar or harp.","Listen for the change between plucked and bowed sounds."],"example":"The **double basses** play **pizzicato**, plucking short notes on every beat, which gives the music a light, tiptoeing feel.","fig":[{"file":"ex_pizz_arco.png","caption":"Playing techniques are written into the music: pizz. = pluck the strings, arco = go back to the bow"}]},"Playing techniques>Strumming":{"what":["Strumming is brushing across several strings at once with the fingers or a pick, so a whole chord sounds. It is how guitars and ukuleles usually play chords.","A strum can go down (towards the floor, from the low strings to the high strings) or up. A strumming pattern is a repeated rhythm of down and up strums, usually with downs on the beats and ups in between."],"use":"Strumming gives songs their rhythmic backing in pop, folk, country and rock. Changing the strumming pattern changes the feel: steady downs sound solid, quick down-ups sound energetic and gaps make it sound syncopated. When you perform, keep your hand moving down and up in time even when you miss the strings.","listen":["Listen for chords that sound all together with a brushing attack.","Notice the rhythm of the strums and where the accents fall.","Listen for muted 'chk' strums in funk and reggae."],"example":"The **acoustic guitar** plays a down-up **strumming** pattern in quavers through the chorus, which drives the rhythm forward.","fig":[{"file":"rm_s4_strumming.png","caption":"Strumming patterns: D = strum down, U = strum up. Down-strums fall on the beats and up-strums on the 'and'"}]},"Playing techniques>Striking":{"what":["Striking means hitting an instrument to make it sound. Drums, cymbals, xylophones, glockenspiels and timpani are struck with sticks, mallets, beaters or hands.","Inside a piano, hammers strike the strings. What you strike with changes the timbre: hard sticks sound sharp and bright, and soft mallets sound round and warm."],"use":"Struck sounds have a clear attack, so they are perfect for marking the beat and accents. Percussionists choose sticks, mallets or brushes to suit the music, such as brushes on a snare for soft jazz. A roll (very fast repeated strikes) makes a long sound that can grow louder.","listen":["Listen for sounds with a sharp start that then ring or fade.","Notice whether the strike sounds hard and bright or soft and round.","Listen for rolls that turn single hits into a continuous sound."],"example":"The **timpani** are **struck** with hard sticks on the strong beats, which gives each accent a powerful, dramatic edge.","fig":[{"file":"rm_s4_snare.png","caption":"A snare drum part: struck notes, then a roll (three slashes) and an accent"}]},"Playing techniques>Shaking":{"what":["Shaking is moving an instrument so that things inside or on it rattle. Maracas and egg shakers have seeds or beads inside. A tambourine has metal jingles on its frame.","A shake can be one sharp flick for a short sound or kept going for a continuous rattle."],"use":"Shakers often play steady quavers or semiquavers to fill in the rhythm and keep the groove moving, especially in Latin and pop music. A tambourine shaken on the beat adds sparkle to a chorus. In class, shakers are great for an easy ostinato.","listen":["Listen for a soft, rattly 'chk' sound.","Notice a steady stream of short notes between the main beats.","Listen for jingles when a tambourine is shaken."],"example":"The **maracas** are **shaken** in steady quavers under the melody, which adds a light, rattling layer to the groove.","fig":[{"file":"rm_s4_tambourine.png","caption":"Tambourine: struck notes, then a shake written as a roll (three slashes)"}]},"Playing techniques>Scraping":{"what":["Scraping is rubbing a stick or beater along a ridged or rough surface. The guiro is the best-known scraped instrument: a stick is scraped over notches cut into its side.","Other scraped instruments include the washboard and the cabasa, a beaded cylinder that is rotated against the hand."],"use":"Scraped sounds give a rough, rasping colour that cuts through the texture. They are common in Latin American music and are also used for creaky or funny sound effects. A long scrape followed by short ones makes a simple, catchy rhythm pattern.","listen":["Listen for a raspy, scratchy sound.","Notice whether the scrape is long and slow or short and quick.","Listen for scraped patterns with other Latin percussion."],"example":"The **guiro** is **scraped** in a long-short pattern, which gives the rhythm section a raspy texture."},"Performing media and timbre>Voices and ensembles":{"what":["This group covers who is performing and how many. Voices are grouped into types by range: soprano, alto, tenor and bass (SATB). An ensemble is any group of performers, from a duet to a full orchestra or choir.","Naming the voice types and the ensemble is of
