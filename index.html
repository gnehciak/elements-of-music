tion, contrary motion, different rhythms). Link contrapuntal writing to complexity, interest, intellectual rigour or a Baroque influence, and say if it develops a theme.","listen":["Listen for two or more tunes at once.","Notice lines that move in opposite directions or different rhythms.","Check whether an idea passes between the lines."],"example":"In the middle section the strings become **contrapuntal**, with the opening motif passed between violin and cello against an independent viola line, which makes the texture denser and more intricate.","quote":[{"text":"demonstrates contrapuntal elaboration between layers","source":"HSC 2018"}]},"Texture type (named)>homophonic":{"what":["A homophonic texture has one clear melody supported by accompaniment, usually chords. It covers two kinds: melody with accompaniment (a song with guitar strumming) and block chords where all parts move in the same rhythm (a hymn). The melody is the most important layer and the others support it.","Most pop songs and much Classical music are homophonic."],"use":"Name the melody instrument and describe the accompaniment (block chords, broken chords, Alberti bass, strummed chords). Then add density words: a homophonic texture can be thin or thick. Link it to clarity of the melody or lyrics.","listen":["Listen for one clear tune standing out above the rest.","Notice whether the other parts play chords or patterns rather than tunes.","Check whether all parts change notes together."],"example":"The verse is **homophonic**, with the vocal melody over **block chords** in the piano, so the lyrics are clear before the chorus thickens the texture.","quote":[{"text":"creating a dense, complex homophonic texture","source":"HSC 2016"},{"text":"a thin, homophonic texture","source":"HSC 2019"},{"text":"note-for-note homophony in the first section","source":"Trial 2019"}]},"Texture type (named)>monophonic":{"what":["A monophonic texture has a single melodic line and nothing else. It can be one performer or several in unison or octaves. Plainchant, a solo bugle call and an unaccompanied opening solo are all monophonic.","A drone underneath would add a second layer, so the texture would no longer be strictly monophonic."],"use":"Name the instrument and where the monophonic passage occurs. Link it to exposure, simplicity, a solemn or lonely mood or clear presentation of a motif. It is a common opening, so describe how the texture develops from it.","listen":["Listen for one melody with nothing under it.","Notice that there are no chords.","Check if several performers are playing the same line."],"example":"The excerpt begins **monophonically** with a solo cor anglais, which exposes the main theme and gives the opening a lonely, reflective character.","quote":[{"text":"a monophonic texture, where the cello has the only melodic role","source":"HSC 2021"},{"text":"the piece begins monophonically","source":"Trial 2021"}]},"Texture type (named)>polyphonic / polyphony":{"what":["A polyphonic texture has two or more independent melodies sounding together, each with its own shape and rhythm, and none simply accompanying the others. Rounds, canons, fugues and much Renaissance choral music are polyphonic.","Polyphony is about equal importance. If one tune dominates and the rest support it, the texture is homophonic."],"use":"Name the lines and explain how they are independent (different rhythms, imitation, contrary motion). Link polyphony to complexity, interest and density. Say whether the passage becomes more or less polyphonic over time.","listen":["Listen for more than one tune at once.","Notice parts entering at different times with the same material.","Check whether you can follow different lines on repeated listening."],"example":"As each voice enters with its own line, the texture becomes increasingly **polyphonic**, which makes the passage feel intricate and builds towards the climax.","quote":[{"text":"each voice has individual importance, creating polyphonic texture","source":"HSC 2016"},{"text":"denser and more polyphonic","source":"HSC 2023"},{"text":"elements of polyphony","source":"Trial 2021"}]},"Texture type (named)>heterophonic":{"what":["A heterophonic texture has one melody performed at the same time in slightly different versions. One part may play it plainly while another decorates it with extra notes, ornaments or rhythmic changes. The parts follow the same tune but do not line up exactly.","Heterophony is common in many traditions, including Balinese gamelan, Chinese and Middle Eastern music and Irish traditional music."],"use":"Name the parts, say which one plays the plain melody and how the other decorates it (ornaments, passing notes, rhythmic variation). Link heterophony to a thicker but unified texture and, where relevant, to a particular musical tradition.","listen":["Listen for one tune that seems to be played twice, slightly out of step.","Notice one part adding decorations while another stays simple.","Check that the parts land on the same main notes at the same time."],"example":"The flute decorates the violin's melody with turns and passing notes at the same time, so the texture is **heterophonic**, with two versions of one tune heard together."},"Elements of Music>Performing media and timbre":{"what":["Performing media are the sound sources in a piece: voices, acoustic instruments, electronic instruments and the technology used to record and shape them. Timbre is the tone colour of a sound. It comes from the balance of overtones inside each note, the attack at the start and the way the sound decays.","At HSC level you need both halves. Identify the media precisely (instrument, register, playing technique, production effect), describe the timbre with an exact word, then explain what that timbre does in the music."],"use":"Markers reward answers that go further than 'a guitar plays'. Name the instrument and how it is played (muted trumpet, sul ponticello violins, palm-muted distorted guitar), give the register, then choose a timbre word that fits that exact moment. Finish by linking the timbre to an effect on mood, contrast or structure.","listen":["Identify every sound source, including electronic sounds and production effects such as reverb and delay.","Listen for changes of timbre on the same instrument: a new register, a mute, a different bow or pick technique.","Find one precise timbre word for each main layer and check it suits the dynamic and register as well as the instrument."],"example":"In the opening the melody is given to a **muted trumpet** in its middle register, whose **thin, distant** timbre contrasts with the **warm, sonorous** cellos underneath, so the solo sounds isolated and the mood is lonely."},"Performing media and timbre>Bright / brilliant":{"what":["These words describe sounds with strong high overtones. Every note contains fainter, higher frequencies called overtones (or harmonics), and the more energy a sound has in the upper ones, the brighter and more forward it seems.","Brightness comes from the instrument (trumpet, piccolo, glockenspiel, steel-string guitar), from a high register and from loud or hard-attacked playing, so it can change from moment to moment on the same instrument."],"use":"Bright timbres pull a line to the front of the texture, so composers use them for melodies that must cut through, for fanfares and for festive or triumphant moments. In an answer, say what produces the brightness: the instrument, the register, the dynamic or a technique such as hard mallets. A trumpet at forte in its high register is brilliant, while the same trumpet played softly down low is not.","listen":["Listen for sounds that cut through and seem to sit at the front of the music.","Notice high, metallic or struck sounds: they are often sparkling, ringing or glittering.","Check whether the brightness comes from the instrument, the high register or a loud dynamic."],"example":"In the final chorus the melody moves up into the trumpets' high register, and their **brilliant, ringing** tone over a **sparkling** glockenspiel part makes the ending sound triumphant."},"Bright / brilliant>silvery":{"what":["A silvery timbre is light, high and gleaming, with a clean shine and no harshness. It is brighter than 'pure' and gentler than 'brilliant'.","It suits the flute and piccolo in their upper-middle register, a soft glockenspiel or celesta, high harp harmonics and a light soprano voice."],"use":"Use silvery for soft to moderate high sounds that shine without cutting. Name the instrument and register ('flute in its upper register'), then link the timbre to a delicate, magical or night-time character. Check the dynamic fits: a fortissimo sound is rarely silvery.","listen":["Listen for a high, gleaming line that floats above the texture without dominating it.","Check that the attack is soft and clean, with no breathiness or edge."],"example":"Above the muted strings the flute plays a **silvery** descant in its upper register, and its light, gleaming tone gives the passage a magical, moonlit quality.","fig":[{"file":"flute.jpg","caption":"The flute in its upper register has a light, silvery tone"}]},"Bright / brilliant>pure":{"what":["A pure timbre has few overtones and no noise, roughness or wobble, so the pitch sounds simple and clean. The purest possible sound is a sine wave, which has no overtones at all.","Close acoustic examples are a soft flute or recorder in the middle register, a treble or soprano singing with little vibrato and a tuning fork."],"use":"Pure is the right word when a sound is simple and clean rather than bright or rich. It often goes with straight tone (no vibrato) in early music and choral writing, or with sine-wave synth sounds. Link it to an effect such as innocence, stillness or clear tuning.","listen":["Listen for a steady, simple tone with no breath noise, buzz or vibrato.","Notice whether the sound melts easily into the harmony, which pure tones tend to do."],"example":"The treble soloist sings with a **pure**, straight tone and almost no vibrato, so the melody sounds innocent and still against the warmer adult choir."},"Bright / brilliant>sparkling":{"what":["A sparkling timbre is made of short, bright flashes of sound, like light catching on water. It comes from high, quick, detached notes with a hard, clean attack and a brief ring.","Typical sources are the glockenspiel, celesta, high piano figuration, crotales, a xylophone with hard mallets and a bright synth arpeggio."],"use":"Sparkling describes the activity of the part as well as its colour, so pair it with articulation and rhythm ('staccato semiquavers in the glockenspiel'). Composers use it for joy, festivity, magic or excitement. Say where the sparkle sits in the texture, usually as decoration above the melody.","listen":["Listen for quick, high, separated notes that ring briefly.","Notice metal or struck sounds decorating the top of the texture."],"example":"In the chorus a **sparkling** glockenspiel ostinato sits above the strings, and its bright, ringing attacks make the section sound festive.","fig":[{"file":"glockenspiel.jpg","caption":"Glockenspiel: metal bars struck with hard mallets give short, sparkling flashes of sound"}]},"Bright / brilliant>shimmering":{"what":["A shimmering timbre is bright and gently unstable, as if the sound is trembling in the light. It comes from many quick repetitions or small fluctuations rather than one steady tone.","Common sources are soft, high tremolo strings, a soft suspended cymbal roll, a vibraphone with its motor on, woodwind trills and synth pads with chorus or slow modulation."],"use":"Shimmering suits background layers and atmosphere. Name the technique that creates it (bowed tremolo, cymbal roll, vibraphone motor) and its register, then link it to an effect such as anticipation, mystery or light. It often appears in introductions and transitions.","listen":["Listen for a sustained sound that flickers or trembles instead of holding still.","Check whether the strings are playing tremolo or a cymbal is being rolled softly."],"example":"The excerpt opens with **shimmering** high violin tremolo over a soft cymbal roll, and the trembling, sustained sound builds anticipation before the horn theme enters.","fig":[{"file":"rm_s5_string_techniques.png","caption":"Tremolo is written as slashes through the stem: the quick, repeated bow strokes make the sound shimmer"}]},"Bright / brilliant>glittering":{"what":["A glittering timbre is a mass of small, bright, high sounds, like many tiny points of light at once. Sparkling suggests separate flashes, while glittering suggests a dense spray of them.","It comes from harp glissandi, celesta and glockenspiel runs, fast high piano figuration, wind chimes and bright arpeggiated synths with delay."],"use":"Use glittering when a high decorative layer is busy and bright. Name the instrument and the figure (a harp glissando, rapid celesta arpeggios) and say what it decorates. Composers often use it for magical, dreamlike or luxurious effects, or to mark the arrival of a new section.","listen":["Listen for a rush of fast, high notes that blur into a bright wash.","Notice harp glissandi and wind chimes at section changes."],"example":"A **glittering** harp glissando sweeps up into the new section, and the rush of high, bright notes gives the change a magical, dreamlike quality.","fig":[{"file":"harp.jpg","caption":"A harp glissando sweeps across many strings at once for a glittering wash of sound"}]},"Bright / brilliant>vibrant":{"what":["A vibrant timbre is full of energy and life. It is bright and strong, and usually has lively vibrato, crisp articulation or rhythmic drive behind it.","Typical examples are a trumpet section playing a Latin or big-band riff, a steel pan band, a gospel choir and a punchy horn section in funk or soul."],"use":"Vibrant mixes timbre with character, so support it with evidence: dynamic, register, articulation and rhythm. It suits festive, celebratory or dance-based music. Say which instrument or group produces it and how it supports the style, for example the energy of a salsa horn section.","listen":["Listen for bright, strong, energetic tone, often in groups playing rhythmic riffs.","Notice lively vibrato or crisp, accented articulation that keeps the sound alive."],"example":"The horn section's **vibrant**, accented riffs in the chorus, played forte in the trumpets' upper register, drive the dance feel and lift the energy above the verse."},"Bright / brilliant>crisp":{"what":["A crisp timbre has a clean, sharp, precise attack and a quick, tidy end to each note. There is no blur at the start of the sound, so rhythms sound exact.","It suits the snare drum, a closed hi-hat, staccato or spiccato strings, tightly picked guitar, tongued staccato in the woodwind and a dry, well-recorded drum kit."],"use":"Crisp links timbre with articulation and rhythm, so pair it with the rhythmic figure ('crisp semiquavers on the snare'). It shows precision and often drives a passage forward. In production analysis it can describe a mix where every drum attack is clear and bright.","listen":["Listen for a clean, sharp start and a short, controlled end to each note.","Check whether the rhythm sounds precise and clearly separated."],"example":"The **crisp** snare and closed hi-hat semiquavers give the groove a sharp, precise edge, so the syncopated bass line sits clearly against a tight pulse.","fig":[{"file":"snare_drum.png","caption":"The snare drum's sharp attack and snare wires give a crisp, precise sound"}]},"Bright / brilliant>ringing":{"what":["A ringing timbre keeps sounding after it is struck or plucked, with a clear pitch and a long, bright decay. The instrument keeps vibrating after the attack.","Examples are bells, triangle, crotales, vibraphone, guitar or harp strings left to sound, a piano with the sustain pedal down and a cymbal left to ring."],"use":"Ringing describes the decay of a sound as well as its brightness, so it pairs well with comments on sustain, pedalling and 'let ring' markings. Link it to effects such as celebration (bells), suspense (a lone cymbal left to ring) or a blurred, resonant harmony when chords overlap.","listen":["Listen to the end of each note: does it fade slowly after the attack?","Notice open strings, pedalled piano and metal percussion left to ring."],"example":"The guitarist leaves the open strings **ringing** through each chord change, so the arpeggios overlap into a bright, resonant wash."},"Bright / brilliant>clear":{"what":["A clear timbre is focused and easy to hear, with no blur, fuzz or breathiness around the pitch. Each note and each part can be picked out.","It suits a solo clarinet in its middle register, cleanly picked acoustic guitar, a well-produced lead vocal, a clean electric guitar and a choir with good diction and tuning."],"use":"Clear can describe one instrument or the whole mix. Use it in contrast with murky, muddy or distorted sounds, and link it to effects such as an intimate, exposed or honest feel. If the clarity comes from production (a dry vocal, careful EQ), say so.","listen":["Listen for focused notes that are easy to pick out, with no fuzz or air.","Check whether each layer can be heard separately."],"example":"The verse uses a **clear**, clean electric guitar with very little reverb, so the lyrics stay in focus and the sudden distortion in the chorus hits much harder."},"Bright / brilliant>brilliant":{"what":["A brilliant timbre is very bright, strong and showy, with powerful high overtones. It is brighter and more forceful than 'bright'.","Classic sources are the trumpet and piccolo trumpet in their high register, the piccolo, a full orchestra at a fortissimo climax, a high soprano at full voice and an organ using its bright mixture stops."],"use":"Brilliant suits climaxes, fanfares and virtuoso display. Support it with the register and dynamic that cause it, and link it to effects such as triumph, celebration or a structural high point. Avoid it for soft sounds, because brilliance needs energy.","listen":["Listen for a dazzling, very bright sound at a loud dynamic and high register.","Notice whether it arrives at a climax or the end of a section."],"example":"At the climax the piccolo trumpet takes the theme an octave higher, and its **brilliant** fortissimo tone crowns the full orchestra so the ending sounds triumphant."},"Bright / brilliant>bright":{"what":["A bright timbre has strong high overtones, so it sounds light, forward and clear. It is the opposite of dark.","Brightness can come from the instrument (trumpet, xylophone, oboe, steel-string guitar), the register (most instruments get brighter as they go higher), the dynamic (louder is usually brighter) or the technique and equipment, such as hard mallets, picking near the bridge or a treble boost."],"use":"Bright is the base word of this category, so make it precise by adding its cause. Name the instrument and register, then link it to an effect: a bright timbre can make a melody stand out, lift the mood or contrast with a darker section. Use 'brilliant' when the sound is also loud and showy.","listen":["Listen for sounds that sit at the front of the mix and cut through.","Check whether the brightness comes from instrument, register, dynamic or technique."],"example":"When the melody passes from the clarinet to the oboe the timbre becomes **brighter** and more focused, which makes the returning theme stand out clearly above the strings."},"Performing media and timbre>Dark / dull / heavy":{"what":["These words describe sounds with weak upper overtones, so the energy sits in the low and middle frequencies. They sound deep, covered or weighty, as if some of the light has been taken out.","Darkness comes from low instruments (bassoon, cello, tuba, bass clarinet), low registers, soft playing, mutes and damping. In popular music it also comes from palm muting, down-tuned guitars and low-pass filters, which cut the high frequencies."],"use":"Composers use dark timbres for serious, tragic, mysterious or threatening moments, and producers use heavy timbres to give rock and metal their weight. In an answer, separate what makes the sound dark (register, mute, filter) from whether the low notes stay clear (booming, resonant) or blur together (muddy, murky). Then link the darkness to mood or to a contrast with brighter material.","listen":["Listen for where the weight of the sound sits: low and middle rather than high.","Notice covered sounds such as muted brass, damped drums or palm-muted guitar.","Ask whether the low notes are clear or blurred together."],"example":"The introduction is scored for low strings and bassoon in close-spaced chords, which gives a **dark, murky** timbre, so the opening sounds ominous and the high solo flute in bar 9 sounds strikingly exposed."},"Dark / dull / heavy>muffled":{"what":["A muffled timbre sounds covered over, as if heard through a wall or a blanket. The high overtones and the sharp attack have been removed, leaving a soft, thudding core.","It comes from damping (a cloth or hand on a drum, a palm on guitar strings), soft beaters, a mute or a low-pass filter in production."],"use":"Muffled tells the marker that something is damping the sound, so say what: palm muting, a damped bass drum, a filter. In electronic and pop music a muffled section often comes just before the filter opens at the drop. Link it to effects such as distance, suppression or anticipation.","listen":["Listen for a soft, thudding attack with the high frequencies missing.","Notice a filter opening later, when the muffled sound becomes bright again."],"example":"In the pre-chorus the whole mix is **muffled** by a low-pass filter, and when the filter opens at the drop the sudden return of the high frequencies makes the chorus feel explosive.","fig":[{"file":"s5_palm_mute.png","caption":"Palm muting (P.M.): the hand rests on the strings near the bridge for a muffled, thudding sound"}]},"Dark / dull / heavy>booming":{"what":["A booming timbre is deep, loud and full, with a strong low pitch that you feel as well as hear. It usually has a big attack and a long, resonant decay.","Sources include the bass drum, timpani, low gongs, low organ pedal notes, a bass voice in a large hall and the kick and sub-bass in electronic dance music."],"use":"Booming suits low, powerful events, so pair it with dynamics and placement ('booming timpani strokes on each downbeat'). Link it to effects such as weight, menace, ceremony or the physical impact of a drop. The sound must be loud: a soft low sound is better called deep or dark.","listen":["Listen for low, loud hits that seem to fill the room.","Notice whether they land on structurally important beats."],"example":"**Booming** timpani strokes and bass drum on each downbeat give the march a heavy, ceremonial weight, so the procession sounds massive and unstoppable.","fig":[{"file":"timpani.jpg","caption":"Timpani struck loudly give a deep, booming sound"}]},"Dark / dull / heavy>rumbling":{"what":["A rumbling timbre is low, continuous and unsettled, like distant thunder. Instead of separate hits, the low sound keeps rolling.","It comes from a timpani or bass drum roll, low piano tremolo, double basses playing tremolo, low gongs and sustained sub-bass or noise in electronic music."],"use":"Rumbling is a good word for introductions, build-ups and suspense, so link it to structure and tension. Name the technique (a roll, a tremolo) and the register. It often pairs with a crescendo, so describe the dynamic shape as well.","listen":["Listen for a low, continuous roll or tremolo rather than separate notes.","Notice whether it grows louder towards a climax."],"example":"A **rumbling** timpani roll with a slow crescendo underpins the introduction, which builds suspense before the full orchestra enters.","fig":[{"file":"rm_s4_timpani.png","caption":"The three slashes on the last note mean a roll, which gives a low, rumbling sound"}]},"Dark / dull / heavy>murky":{"what":["A murky timbre is low and unclear, so the individual notes and parts are hard to pick out, like looking into dark water. It is darker and less defined than 'dark'.","It comes from low instruments in close-spaced chords, low strings and bass clarinet together, heavy pedalling in the low piano or a mix with too much low end and reverb."],"use":"Murky is usually deliberate in art and film music, where composers use it for mystery, menace or confusion. Explain the cause: register, close spacing, doubling or production. Contrast it with a clear or transparent section to show how timbre supports the structure.","listen":["Listen for low sounds where the separate notes are hard to identify.","Notice close chords in a low register or a lot of low-end reverb."],"example":"The close-spaced chords in the low strings and bass clarinet create a **murky** timbre in which no single line is clear, which gives the scene a mysterious, threatening atmosphere."},"Dark / dull / heavy>muddy":{"what":["A muddy timbre is one where low notes blur together so nothing sounds clear. Close intervals in the bass register clash because their overtones crowd the same space.","It happens when bass guitar and the piano's left hand share the same low range, when low chords are spaced too closely or when a mix has too much low-middle frequency. It is usually a fault, while murky is often deliberate."],"use":"Use muddy carefully. In a critique of a performance, arrangement or mix it identifies a problem with low spacing. When the effect is deliberate, such as lo-fi production or a dense low cluster, explain why the composer wants it. Pair it with register and spacing.","listen":["Listen for a low end where you cannot follow the bass line.","Notice close low chords or two low instruments fighting in the same range."],"example":"In the bridge the bass guitar and low synth overlap in the same range, so the low end turns **muddy** and the bass line is hard to follow, unlike the clean, open sound of the verses."},"Dark / dull / heavy>hollow":{"what":["A hollow timbre sounds empty in the middle, with little body, as if the sound comes from inside a tube or box.","The low clarinet (chalumeau register) is the classic example, because its tone is dominated by odd-numbered overtones. Other sources are the woodblock and temple blocks, a stopped organ pipe, the flute's lowest notes, square-wave synth sounds and open fifths with no third."],"use":"Hollow can describe an instrument's tone or a harmonic sound (open fifths with no third). Name the source and register, then link it to an effect such as emptiness, bleakness or an ancient, archaic feel. It contrasts well with rich or full.","listen":["Listen for a tone that sounds thin in the middle, with a woody or tube-like quality.","Notice open fifths or octaves with no third filling them in."],"example":"The clarinet's low chalumeau register gives the opening a **hollow** timbre, and with only open fifths beneath it the passage sounds bleak and empty.","fig":[{"file":"clarinet.jpg","caption":"The clarinet's low register sounds hollow and woody"}]},"Dark / dull / heavy>muted":{"what":["Muted means the sound has been softened or changed by a mute, a device placed on or in the instrument. The marking is con sord. (with mute), cancelled by senza sord.","String mutes clip onto the bridge and veil the tone. Brass mutes go in the bell: the straight mute sounds thin and nasal, the cup mute rounder and the harmon mute buzzy and distant. Guitarists mute with the palm or fretting hand."],"use":"When you hear a mute, name the instrument and the mute type if you can. Muted strings suggest intimacy or sadness, while muted brass can sound distant, comic, jazzy or menacing depending on the dynamic. Link the change of timbre to structure, such as a muted middle section before an open, full return.","listen":["Listen for a veiled, distant or buzzy version of the instrument's normal sound.","Notice the moment the mute comes off and the full tone returns."],"example":"The trumpet plays the second verse with a harmon mute, and its **muted**, buzzy and distant timbre gives the melody a lonely, late-night jazz feel.","fig":[{"file":"s5_dir_consord.png","caption":"con sord. (mute on) and senza sord. (mute off)"}]},"Dark / dull / heavy>dark":{"what":["A dark timbre has weak high overtones, so its energy sits in the low and middle frequencies and it sounds deep and shadowy. It is the opposite of bright.","Instruments known for darkness include the bassoon, cello, viola, bass clarinet, horn and tuba, as well as the alto voice. Most instruments also sound darker in their low register, at soft dynamics, with a mute or when bowed over the fingerboard (sul tasto)."],"use":"Dark is the base word for this category, so make it precise by naming the instrument, register and technique responsible. Link it to effects such as seriousness, grief, mystery or threat, and look for a contrast with brighter material to explain the structure.","listen":["Listen for sounds whose weight sits low, with little edge or sparkle.","Check whether the darkness comes from register, instrument choice or technique."],"example":"The theme returns in the violas and cellos an octave lower, and the **dark** timbre of the low register turns the hopeful opening melody into something sombre."},"Dark / dull / heavy>heavy":{"what":["A heavy timbre feels weighty and solid, with a lot of low and low-middle energy and strong, sustained notes. The sound seems to press down.","In rock and metal it comes from distorted guitars playing power chords in a low, often down-tuned register, doubled by bass and kick drum. In orchestral music it comes from low brass, timpani and low strings playing loudly together."],"use":"Heavy usually describes the combined sound, so name the layers that create it and the techniques (distortion, palm muting, octave doubling). Link it to effects such as power, aggression or gravity, and to structure: a heavy chorus often follows a lighter verse.","listen":["Listen for low, thick, sustained sound with a lot of weight.","Notice instruments doubling the same low riff."],"example":"In the chorus the distorted guitars double the riff with the bass in a low register, which makes the timbre **heavy** and aggressive compared with the clean, light verse."},"Dark / dull / heavy>dull":{"what":["A dull timbre has no brightness, edge or ring. The attack is soft and the high overtones are missing, so the sound is flat and lifeless rather than shadowy.","It comes from soft felt or rubber beaters, a heavily damped drum, a deadened piano, very soft or tired playing or an old recording with little high frequency."],"use":"Dull is less positive than dark or mellow, so use it with care. Use it for a deliberate lifeless effect (a damped drum in a funeral march) and explain how it is made. In a critique of a performance or recording, dull can also name a weakness in tone or production.","listen":["Listen for a soft, thudding attack with no ring afterwards.","Compare it with a bright version of the same instrument."],"example":"The bass drum is struck with a soft beater and damped by hand, so each stroke is **dull** and short, and the funeral rhythm sounds heavy and lifeless."},"Dark / dull / heavy>subdued":{"what":["A subdued timbre is held back: quiet in colour as well as volume, with nothing bright or forceful in it. You can tell the performers are restraining the sound.","Examples include a soft horn, muted strings, a humming choir, guitar played softly with the fingers rather than a pick and a drum kit played with brushes."],"use":"Subdued suggests restraint, so link it to dynamics and expression as well as timbre. It suits reflective, sad or tense passages and sections that wait before a climax. Say what makes it subdued: dynamic, mute, technique or instrumentation.","listen":["Listen for soft, restrained playing with a covered tone.","Notice brushes, mutes, humming or finger-picking in place of full tone."],"example":"In the second verse the drummer switches to brushes and the strings play con sord., so the accompaniment becomes **subdued** and the vocal sounds more intimate and reflective."},"Performing media and timbre>Density (tone colour)":{"what":["These words describe how thick or thin the tone colour feels and how well the sounds blend. They overlap with texture, but texture counts and describes the layers, while these words describe the weight and colour of the combined sound.","A single recorder sounds thin. A full brass section or a pipe organ sounds full and rich. A homogeneous sound is one where similar instruments blend into one colour, while a transparent sound lets you hear every part."],"use":"Orchestration and production change density all the time. Doubling parts, adding low instruments and widening the spacing make the sound fuller, and stripping parts away makes it lighter. Use these words alongside texture words so your answer covers both, for example 'the texture thins to two parts and the timbre becomes transparent', and link the change to structure.","listen":["Listen for how much weight and body the combined sound has.","Notice whether you can hear through to each part (transparent) or whether everything blends (homogeneous).","Compare sections: does the sound get fuller or lighter as the piece goes on?"],"example":"When the brass and organ join the choir in the final section the timbre becomes **full** and **rich**, whereas the unaccompanied voices of the opening were **homogeneous** and light, which marks the ending as the climax."},"Density (tone colour)>thin":{"what":["A thin timbre has little body or weight. The sound is narrow, with weak low and middle frequencies, so it can seem fragile or exposed.","It comes from a single high instrument, a violin bowed near the bridge (sul ponticello), a straight-muted trumpet, a tin whistle, a small speaker or a sound with its low end filtered out."],"use":"Thin can describe one instrument or the whole sound. Keep it separate from a thin texture, which means few layers: a solo cello is a thin texture but not a thin timbre. Name the source and link the thinness to effects such as vulnerability, distance or tension.","listen":["Listen for a narrow sound with little warmth or low end.","Notice sul ponticello strings or filtered sounds."],"example":"The violins play sul ponticello, which makes their timbre **thin** and glassy, and the fragile sound adds to the unease of the passage.","fig":[{"file":"rm_s5_sul_pont_tasto.png","caption":"sul pont. (bow near the bridge) gives a thin, glassy timbre; sul tasto (over the fingerboard) gives a soft, veiled one"}]},"Density (tone colour)>homogeneous":{"what":["A homogeneous timbre is one where the sounds blend into a single, unified colour, so you hear one block of sound rather than separate instruments.","It happens when similar instruments play together: a string orchestra, a brass choir, a recorder consort, a choir with matched vowels or a saxophone section. A mixed group of strings, woodwind and percussion is heterogeneous instead."],"use":"Homogeneous is a strong word for questions on ensemble and orchestration. Say which family or group produces it, then link it to effects such as unity, smoothness or a serious, chorale-like quality. It contrasts well with mixed scoring later in the piece.","listen":["Listen for a group sound where you cannot easily separate the instruments.","Notice whether all the instruments belong to one family."],"example":"The opening chorale is scored for strings alone, so the timbre is **homogeneous** and smooth, and the oboe's entry in bar 9 stands out as a new colour."},"Density (tone colour)>full":{"what":["A full timbre has plenty of body and weight across the low, middle and high ranges. Nothing seems to be missing from the sound.","It comes from large groups, doubled parts and wide spacing: the whole brass section, an orchestral tutti, a pipe organ with many stops drawn, a big choir or a band with layered guitars, keyboards and backing vocals."],"use":"Full usually describes the combined sound at a structural point, so link it to texture (more layers, doubling) and dynamics. Composers use a full timbre for climaxes, final choruses and grand endings. Say exactly what is added to fill out the sound.","listen":["Listen for sound spread across the whole range, from deep bass to high treble.","Notice which instruments join to fill out the sound."],"example":"In the final chorus backing vocals, organ and layered guitars join the band, so the sound becomes **full** and wide, which marks the emotional peak of the song."},"Density (tone colour)>light":{"what":["A light timbre is airy and easy, without weight or force. The sound sits mostly in the middle and upper range, with soft or crisp attacks.","Examples are flute with pizzicato strings, staccato woodwind, ukulele, a high piano part with no pedal, a jazz drummer on brushes and a soprano singing softly."],"use":"Light often goes with playful, graceful or carefree characters and with quick dance music. Support it with register, articulation and instrumentation. It contrasts usefully with heavy, so say how the composer moves between the two.","listen":["Listen for high and middle sounds with no heavy bass underneath.","Notice staccato, pizzicato or soft, quick playing."],"example":"The middle section is scored for flute, clarinet and pizzicato strings without the low brass, so the timbre becomes **light** and graceful, which suits its dance-like character."},"Density (tone colour)>transparent":{"what":["A transparent timbre lets you hear through the sound to every part. Each line is clear and nothing covers anything else.","It comes from small groups, wide spacing between parts, contrasting instrument colours and moderate dynamics. A string quartet, a jazz trio or a sparse, cleanly mixed electronic track can all be transparent."],"use":"Transparent links timbre to texture and balance. Use it to show you can hear the separate parts, then name them. It suits clarity, delicacy and conversation between instruments, and contrasts with dense, murky or full sections.","listen":["Listen for whether you can follow each part separately.","Notice space between the parts in pitch and colour."],"example":"With only flute, harp and viola, the scoring is **transparent**, so the imitation passing between the three parts can be heard clearly."},"Density (tone colour)>rich":{"what":["A rich timbre is deep, full and complex, with many overtones in a pleasing balance. It sounds resonant and satisfying rather than simply loud.","Examples are the cello in its low and middle register, a pipe organ, a full string section in close harmony, a deep bass voice and a grand piano chord with the pedal down."],"use":"Rich works for one instrument or a whole ensemble. Name the source and register, and link it to effects such as warmth, grandeur or emotional depth. It also pairs with harmony: extended chords in the strings or piano sound rich because of the many notes.","listen":["Listen for a deep, resonant sound with a lot going on inside it.","Notice low and middle strings, organ or pedalled piano."],"example":"The violas and cellos play the theme in close harmony in their middle register, which gives a **rich**, resonant timbre that makes the return of the melody sound warm and heartfelt."},"Performing media and timbre>Harsh / strident / forceful":{"what":["These words describe rough, hard or cutting sounds. They come from extreme dynamics, hard attacks, heavy bow pressure, overblowing, distortion and anything else that adds noise or strong upper overtones to a tone.","Several of them also suggest register. Piercing, acute and penetrating sounds are usually high, while gruff and growling sounds are usually low."],"use":"Composers and producers use harsh timbres on purpose for aggression, danger, tension or raw energy: distorted guitars in metal, cluster chords and fortissimo brass in film music, a screamed or belted vocal. Say how the harshness is made (distortion, accents, fff, sul ponticello) and what it does. Do not treat 'harsh' as a criticism of the performance.","listen":["Listen for sounds that feel rough or grainy instead of smooth.","Notice very loud or accented playing, and sounds that cut through everything else.","Check for electronic distortion on guitars, bass or vocals."],"example":"In the bridge the distorted guitars and heavily accented brass create a **harsh, aggressive** timbre, which raises the tension before the music drops back to the clean sound of the verse."},"Harsh / strident / forceful>penetrating":{"what":["A penetrating timbre cuts through everything around it, so you hear it clearly even in a loud, full texture. It has strong energy in the upper-middle frequencies, where the ear is most sensitive.","Examples are the piccolo, the oboe, a lead trumpet in a big band, the soprano saxophone, bagpipes and a singer with a bright, forward ring in the voice."],"use":"Penetrating explains why a line can be heard, so link it to balance and texture: 'the oboe's penetrating tone carries the melody over the strings'. It is useful in orchestration answers. A penetrating sound is not always harsh; the word describes carrying power.","listen":["Listen for a line you can still hear when everyone else is playing.","Notice reedy or high, focused sounds sitting above the texture."],"example":"The lead trumpet's **penetrating** tone in its upper register carries the melody over the full big band, so the shout chorus stays focused despite the dense texture."},"Harsh / strident / forceful>gruff":{"what":["A gruff timbre is low, rough and grumbling, like a deep voice clearing its throat. It has a coarse edge on a low note.","It comes from tuba, bass trombone, contrabassoon or baritone saxophone played loudly, a bass voice singing roughly, a double bass bowed with heavy pressure and an overdriven bass guitar."],"use":"Gruff gives a low sound a personality, so it often goes with humorous, grumpy or menacing characters. Name the instrument and the dynamic or technique that roughens it. It works well in contrast with a light, high line.","listen":["Listen for low notes with a rough, gritty edge.","Notice low brass or reeds played forcefully."],"example":"The bassoon and tuba answer each flute phrase with **gruff**, accented low notes, so the dialogue between the bright, high line and the grumbling bass becomes comic."},"Harsh / strident / forceful>growling":{"what":["A growling timbre is a low, rough buzz, like an animal growl. A grainy, rattling noise rides on top of the note.","Jazz trumpeters and trombonists growl by humming or gargling in the throat while they play, often with a plunger mute. Singers growl in blues, rock and metal by adding rasp in the throat, and producers get a similar effect from a heavily distorted or modulated bass synth."],"use":"Growling usually names a specific technique, so say what it is and who does it. Link it to style (jazz, blues, metal, dubstep bass) and to an effect such as aggression, humour or raw expression.","listen":["Listen for a rattling or buzzing roughness on top of the pitch.","Notice brass players using plungers or singers adding grit to held notes."],"example":"The trombone solo uses a plunger mute and a **growling** throat buzz on the held notes, which gives the blues a raw, vocal quality.","fig":[{"file":"trombone.jpg","caption":"Jazz trombonists often growl through a plunger mute"}]},"Harsh / strident / forceful>rasping":{"what":["A rasping timbre is rough and grating, like a file scraping across wood. A lot of noise is mixed into the tone.","String players create it with heavy bow pressure, a very slow bow or bowing close to the bridge. Other sources are the guiro, a rough, strained voice and noise layers in electronic music."],"use":"Rasping suggests effort and friction, so link it to the technique and to an effect such as strain, anger, grief or ugliness. In contemporary music it is often a deliberate extended technique, so describe it as a colour, not a mistake.","listen":["Listen for scraping noise mixed into the pitch.","Notice heavy bow pressure or bowing very near the bridge."],"example":"The cellist uses extreme bow pressure on the low C string, and the **rasping**, grinding sound makes the melody sound strained and anguished."},"Harsh / strident / forceful>rough":{"what":["A rough timbre is uneven and grainy rather than smooth. There is noise, grit or instability in the sound.","Sources include a raspy or strained voice, an overblown saxophone, distorted guitar, heavy bow pressure on strings, lo-fi recording and folk or blues singing that values raw expression over polish."],"use":"Rough is a general word, so make it precise: say what kind of roughness (grit, breath, distortion) and where it comes from. In popular and folk styles a rough vocal can suggest honesty, age or struggle, so link it to style and to the lyrics where relevant.","listen":["Listen for grain, grit or crackle in the tone.","Compare it with a smooth, polished version of the same instrument."],"example":"The singer's **rough**, strained tone in the final verse, compared with the smoother tone of the opening, makes the lyrics sound more desperate."},"Harsh / strident / forceful>aggressive":{"what":["An aggressive timbre is hard, loud and attacking. Notes start with a forceful attack, and the tone usually has edge, noise or distortion.","Examples include high-gain metal guitar with palm-muted chugging, accented fortissimo brass, a snare played hard with rimshots, a screamed vocal, slap bass and sharp, accented string chords."],"use":"Aggressive is a character word as well as a timbre word, so give the evidence: dynamics, articulation, register and technique. Link it to tension, conflict, anger or excitement, and to structure if the aggression arrives at a climax or a chorus.","listen":["Listen for very strong attacks and loud, edgy tone.","Notice accents, rimshots, distortion or screamed vocals."],"example":"The strings attack each chord with heavy down-bows and sforzando accents, which makes the timbre **aggressive** and the music sound violent."},"Harsh / strident / forceful>choppy":{"what":["A choppy timbre is broken into short, hard pieces rather than flowing. The sound starts and stops abruptly, sometimes unevenly.","It comes from short staccato or marcato chords, the percussive 'chop' bow stroke used by contemporary fiddlers and cellists, muted guitar strokes in funk and reggae, stuttered vocal edits and gated or sliced synth pads."],"use":"Choppy joins timbre, articulation and rhythm. Describe the pattern of the short sounds and the instrument, then link it to an effect such as nervous energy, agitation or groove. Contrast it with legato sections to show how the composer builds the structure.","listen":["Listen for sound cut into short, separate pieces.","Notice stuttered edits or abrupt on-off patterns in electronic tracks."],"example":"The synth pad is sliced into **choppy** semiquaver bursts by a gate effect, which gives the verse a restless, nervous energy."},"Harsh / strident / forceful>coarse":{"what":["A coarse timbre is rough and unrefined, with a lot of grain and noise. Rough suggests unevenness, while coarse suggests a thick, gritty texture across the whole sound.","Examples are heavily distorted guitar or fuzz bass, a growled or shouted vocal, a raucous reed instrument in a street band and a lo-fi, bit-crushed electronic sound."],"use":"Coarse is useful for deliberate rawness in punk, garage rock, folk and street music. Name the source of the grit and link it to style and attitude. In art music it can describe a rustic or primitive effect.","listen":["Listen for thick, grainy noise across the sound.","Notice heavy distortion or bit-crushed electronic sounds."],"example":"The bass is put through a fuzz pedal, so its tone becomes **coarse** and gritty, which suits the raw, rebellious attitude of the garage-rock style."},"Harsh / strident / forceful>powerful":{"what":["A powerful timbre is strong, loud and weighty, with a lot of energy behind it. It suggests force under control rather than roughness.","Examples are full brass, an orchestral tutti, a pipe organ with many stops drawn, a belted vocal, a gospel choir and a rock band with drums, bass and distorted guitars at full volume."],"use":"Powerful is common in student answers, so make it work by naming the cause: dynamics, instrumentation, doubling and register. Link it to structure (climaxes, choruses, finales) and to effects such as triumph, defiance or grandeur.","listen":["Listen for loud, weighty sound with plenty of energy.","Notice which instruments are added to create the power."],"example":"In the final chorus the singer belts the melody in a high chest voice over full band and choir, and the **powerful** timbre makes the message of the song sound defiant."},"Harsh / strident / forceful>piercing":{"what":["A piercing timbre is high, sharp and focused enough to feel almost painful. It is like penetrating, but stronger and higher.","Sources include the piccolo at the top of its range, a whistle, the E flat clarinet up high, a high trumpet at fortissimo, a screamed vocal, loud violin harmonics and an unfiltered high synth lead."],"use":"Piercing suits shocking, painful or alarming moments, such as screams in film music. Name the instrument, register and dynamic, and link the sound to its effect on the listener. Do not use it for sounds that are only bright.","listen":["Listen for very high, loud sounds that seem to sting.","Notice them at climaxes or moments of shock."],"example":"A **piercing** piccolo trill at the top of its range cuts through the orchestral climax like a scream, which heightens the sense of terror."},"Harsh / strident / forceful>relentless":{"what":["Relentless describes a hard, driving sound that never lets up. It is about persistence as much as colour: the same forceful sound keeps coming without a break.","Examples include pounding drums or toms, repeated hard brass chords, a driving ostinato in the low strings, a four-on-the-floor kick drum and constant distorted guitar chugging in metal."],"use":"Relentless links timbre with duration and structure, so mention repetition, ostinato and the lack of rests or contrast. Link it to effects such as drive, menace, obsession or exhaustion. It is a strong word for minimalism, film music, metal and dance music.","listen":["Listen for a hard, repeated sound that continues without a break.","Notice ostinati and the absence of rests or quieter moments."],"example":"The low strings and toms hammer a **relentless** quaver ostinato through the whole section, and the lack of any break creates a sense of unstoppable threat."},"Harsh / strident / forceful>acute":{"what":["Acute describes a sound that is very high and sharp, focused into a small, intense point. It combines a high register with a sharp edge.","Examples include the piccolo, violin and flute harmonics, the sopranino recorder and very high synth or electronic tones."],"use":"Acute is a precise, sophisticated word, so pair it with an exact register and instrument ('the violins' acute harmonics'). Link it to effects such as tension, fragility or alarm. Do not use it for sounds that are only fairly high.","listen":["Listen for very high sounds that seem thin and sharply focused.","Notice harmonics or the extreme top of an instrument's range."],"example":"The violins hold an **acute** harmonic high above the texture, and the thin, needle-like sound keeps the listener on edge."},"Harsh / strident / forceful>strident":{"what":["A strident timbre is loud, harsh and insistent, as though it is demanding attention. It is brighter and more blaring than powerful.","Examples are trumpets and trombones at fortissimo, a high, forced vocal, bagpipes, a shrill synth lead and a heavily distorted lead guitar."],"use":"Strident suits military, protest, warning and conflict moments. Pair it with the dynamic and register, and link it to an effect such as aggression, alarm or urgency. It can also describe a deliberately abrasive voice in punk or political song.","listen":["Listen for loud, blaring, bright sounds that will not be ignored.","Notice high brass or forced vocals at climaxes."],"example":"The trumpets enter fortissimo with a **strident** fanfare figure, and their blaring tone breaks into the quiet strings like a call to battle."},"Harsh / strident / forceful>harsh":{"what":["A harsh timbre is unpleasant and rough on the ear, with strong noise and clashing upper overtones. It is the opposite of smooth or mellow.","It comes from heavy distortion, sul ponticello and over-pressured bowing, cluster chords, very loud brass, screamed vocals, metal percussion struck hard and digital clipping."],"use":"Harsh is the general word for this category, so make it exact: what makes the sound harsh, and why the composer wants it. In metal, industrial and modern art music harshness is a deliberate choice, so link it to effects such as violence, horror or protest rather than calling it bad.","listen":["Listen for noise, grit or clashing upper overtones.","Notice clusters, distortion or extreme bow techniques."],"example":"Dissonant clusters in the brass and **harsh**, scraping sul ponticello strings make the climax sound violent and chaotic."},"Harsh / strident / forceful>brittle":{"what":["A brittle timbre is hard, thin and sharp, as if it could crack. It has a quick, bright attack and very little body or sustain.","The harpsichord is a classic example, because its strings are plucked by small plectra. Others are the xylophone with hard mallets, prepared piano, a dry staccato high piano and a thin, clean electric guitar with no effects."],"use":"Brittle is good for fragile or mechanical characters. Name the instrument and attack, and link it to an effect such as tension, coldness, fragility or a clockwork feel. It contrasts with rich or warm sounds.","listen":["Listen for hard, thin attacks that stop quickly.","Notice plucked keyboard sounds or hard mallets."],"example":"The harpsichord's **brittle**, plucked chords give the accompaniment a dry, mechanical quality against the smooth violin line."},"Harsh / strident / forceful>intense":{"what":["An intense timbre is highly charged and concentrated, with a lot of energy packed into the sound. It suggests strong emotion or effort, and it can be soft as well as loud.","Players create intensity with a high register, fast or wide vibrato, firm bow pressure, a focused, strained vocal or a held note that grows in volume. A soft, high violin with tight vibrato can be as intense as fortissimo brass."],"use":"Intense needs evidence, so name the technique (vibrato, register, bow pressure) and the dynamic shape. Link it to emotional effects such as longing, anguish or climax. It works well for expressive solo playing and climactic moments.","listen":["Listen for focused, strained or high-energy tone.","Notice faster, wider vibrato and a rising register as the music builds."],"example":"As the violin climbs to its highest register its vibrato becomes faster and wider, and the **intense** tone brings the melody to an anguished climax."},"Harsh / strident / forceful>forceful":{"what":["A forceful timbre is produced with great strength and weight. Each note is pushed out with a strong attack and full tone.","Examples are accented brass chords, hard down-bows in the strings, heavy piano chords played with the weight of the arms, power chords on guitar and a choir singing marcato at forte."],"use":"Forceful links timbre to articulation and dynamics, so mention the accents, marcato or sforzando and the dynamic level. Link it to effects such as determination, aggression or emphasis at a structural point.","listen":["Listen for strong attacks and full, weighty tone on each note.","Notice accents, marcato and loud dynamics working together."],"example":"The full orchestra closes the section with **forceful** marcato chords in the brass and low strings, which gives the cadence a strong, decisive finish."},"Performing media and timbre>Material / sound-source":{"what":["These words describe a sound by what makes it or where it happens: wood, metal, skin, a reed, breath, electronics or the acoustic space. Many of them, such as reedy, brassy and woody, point straight at an instrument family.","Others describe the space or the production. Reverberant and echoey sounds ring on or repeat, while a dry sound has no added reverb. Synthetic, electronic and distorted describe sounds made or changed by technology."],"use":"These words help when you can hear the material but cannot name the exact instrument, and they are essential for popular and electronic music, where production choices are part of the timbre. Pair a source word with a quality word ('a dry, percussive slap bass', 'a warm, reedy clarinet') and say what the choice does in context.","listen":["Ask what the sound is made of: wood, metal, skin, breath, a reed or electronics.","Listen to the attack of each note: is it hard (percussive) or soft (breathy, airy)?","Notice the space around the sound: does it ring on (reverberant) or stop dead (dry)?"],"example":"The **reedy** oboe melody is answered by **metallic** steel pans over a **dry**, close-miked drum kit, so each layer has its own clear colour and the call and response is easy to follow."},"Material / sound-source>panting":{"what":["A panting timbre is made of short, breathy bursts, like heavy breathing after a run. The breath itself is the sound, often with little or no pitch.","It is an extended technique for voices and wind instruments: singers using rhythmic in-and-out breaths, flautists blowing air without a full tone and vocal percussion. Producers also sample and loop breath sounds as rhythmic layers."],"use":"Panting usually names a deliberate effect, so describe how it is made and its rhythm. Link it to effects such as effort, fear, exhaustion or intimacy. It is common in contemporary art music, film scores and electronic tracks that use the body as a sound source.","listen":["Listen for rhythmic breath sounds with little pitch.","Notice whether the breaths are part of the groove or a dramatic effect."],"example":"The vocalists use **panting** in-and-out breaths in a quaver rhythm, which turns the voice into a percussion instrument and makes the passage sound breathless and urgent."},"Material / sound-source>rattling":{"what":["A rattling timbre is made of many small, loose hits at once, so the sound is noisy and fizzing rather than pitched.","It comes from shakers, maracas, cabasa, the wires under a snare drum, a ratchet, rattles made from seeds or shells and objects placed on piano strings or drum heads."],"use":"Rattling identifies a sound source and its texture. Name the instrument and the rhythm it plays, and link it to style (Latin percussion, rattles in ceremonial music) or to effects such as tension or a dry, insect-like atmosphere.","listen":["Listen for a fizzing, noisy sound made of many tiny hits.","Notice shakers or snare wires buzzing with each stroke."],"example":"A **rattling** shaker plays steady semiquavers under the guitar, which drives the groove forward and gives the Latin style its light rhythmic energy.","fig":[{"file":"maracas.jpg","caption":"Maracas: seeds or beads inside give a rattling sound"}]},"Material / sound-source>hoarse":{"what":["A hoarse timbre is rough, croaky and breathy, like a voice after shouting or with a sore throat. The tone is unstable, with air and grit mixed in.","It mostly describes voices in blues, rock, folk and soul and in deliberately strained vocal styles. Instruments can sound hoarse too, such as an overblown saxophone or a breathy harmonica."],"use":"Hoarse tells the marker about the vocal quality and suggests the singer's character: worn, aged, emotional or desperate. Link it to the lyrics and style, and contrast it with clean or polished voices elsewhere in the track.","listen":["Listen for air and grit in the voice, especially on long notes.","Notice the tone cracking on high or loud notes."],"example":"The singer's **hoarse**, cracking tone on the held high notes makes the lyrics sound worn and deeply personal."},"Material / sound-source>fluttering":{"what":["A fluttering timbre is a fast, wavering sound, like wings beating. It is usually made by flutter-tonguing (flz.), where the player rolls an 'r' with the tongue or throat while blowing.","Flute, trumpet and clarinet all use flutter-tonguing. Similar effects come from fast trills, string tremolo and synth tremolo set to a quick rate."],"use":"Name the technique precisely, because flutter-tonguing is a strong technical term. Link it to effects such as birdsong, nervousness, magic or a buzzing, unsettled atmosphere, and to where it is placed (a held note, a climax, a transition).","listen":["Listen for a fast, rolling buzz inside a wind instrument's held note.","Compare it with a trill, which clearly alternates two pitches."],"example":"The flutes hold a long note with **fluttering** flutter-tonguing, and the rolling, buzzing sound makes the forest scene seem alive with insects and birds.","fig":[{"file":"s5_dir_flutter.png","caption":"Flutter-tonguing (flz.) gives a fluttering, rolling buzz"}]},"Material / sound-source>jangly":{"what":["A jangly timbre is bright, clashing and chiming, with lots of metallic ring and a slight edge. Many bright notes ring together without blending smoothly.","Classic sources are a twelve-string or clean, chorused electric guitar strummed in open chords, a tambourine's jingles and sleigh bells."],"use":"Jangly is closely linked to styles such as folk rock and indie pop, so connect it to style and era. Name the instrument and the strumming or playing technique, and link it to effects such as brightness, nostalgia or carefree energy.","listen":["Listen for bright, chiming chords with a metallic edge.","Notice open strings and tambourine jingles ringing together."],"example":"The clean twelve-string guitar strums open chords with a bright, **jangly** timbre, which gives the song its upbeat, nostalgic indie-pop feel.","fig":[{"file":"tambourine.jpg","caption":"The tambourine's metal jingles add a jangly edge"}]},"Material / sound-source>reverberant":{"what":["A reverberant sound rings on after the notes stop, because thousands of reflections from the walls of a space blend into a smooth tail. Reverb is not a separate echo: the reflections are too close together to hear one by one.","Natural reverb comes from cathedrals, halls and caves. Studio reverb is added with plates, springs or digital effects, from a short room to a long hall."],"use":"Reverberant describes the space, so link it to setting and mood: sacred, vast, distant or dreamlike. Say whether it sounds natural (a church acoustic) or produced (reverb on a vocal), and contrast it with dry sections to show how production supports the structure.","listen":["Listen to the end of each note: does it fade into a long tail?","Notice how fast notes blur in a very reverberant space."],"example":"The choir is recorded in a highly **reverberant** acoustic, so each chord lingers into the next and the music sounds vast and sacred."},"Material / sound-source>scratchy":{"what":["A scratchy timbre has rough, scraping surface noise on top of the tone, like a needle on an old record or a bow dragging on the string.","It comes from heavy bow pressure, bowing near the bridge, scraping a string with a fingernail or pick, the guiro, vinyl crackle samples in lo-fi production and deliberately rough fiddle playing in folk styles."],"use":"Scratchy can describe a playing technique or a production choice, so say which. Link it to effects such as age, nostalgia (vinyl crackle), tension or rawness. In art music it is often an extended technique and should be described as a colour.","listen":["Listen for scraping noise layered over the pitch.","Notice crackle in the background of lo-fi tracks."],"example":"A **scratchy** vinyl crackle sample runs under the piano chords, which gives the track the nostalgic, old-recording feel typical of lo-fi hip hop."},"Material / sound-source>wheezing":{"what":["A wheezing timbre is thin, breathy and strained, like air forced through a narrow gap. You hear the effort and the air as well as the pitch.","It suits the accordion and harmonium, whose free reeds are blown by bellows, the harmonica, an old reed organ and wind instruments played with a lot of air."],"use":"Wheezing gives a sound a worn, human or comic character. Name the instrument and how the breath or bellows is heard, and link it to style (folk, tango, café music) or to effects such as age, fatigue or humour.","listen":["Listen for thin tone with audible air or bellows noise.","Notice slightly unsteady pitch and volume as the air runs out."],"example":"The accordion's **wheezing**, bellows-driven chords give the waltz an old, worn charm, as if it is being played in a small street café."},"Material / sound-source>synthetic":{"what":["A synthetic timbre is made by electronic synthesis rather than by an acoustic instrument. The sound is built from oscillators, filters and envelopes, so it can imitate real instruments or create sounds that exist nowhere else.","Typical synthetic sounds are pads, saw-wave leads, square-wave bass and FM bells. Some imitate strings or brass but still sound slightly too even to be real."],"use":"Synthetic names the sound source, so pair it with precise production terms (pad, lead, filter sweep, arpeggiator) and a quality word. Link it to style (synth-pop, film, electronic dance music) and to effects such as a futuristic, cold or dreamlike feel.","listen":["Listen for sounds with no clear acoustic source, or too smooth and even to be real.","Notice filter sweeps and perfectly regular repetition."],"example":"A **synthetic** saw-wave pad with a slow filter sweep fills the background, which gives the verse a cold, futuristic atmosphere.","fig":[{"file":"synthesizer.jpg","caption":"A synthesiser builds synthetic sounds from oscillators and filters"}]},"Material / sound-source>breathy":{"what":["A breathy timbre has air audible in the tone, so you hear breath as well as pitch. It is softer and more intimate than a focused tone.","It comes from the flute (especially low and soft), pan flute, shakuhachi, a whispery, close-miked vocal, saxophone subtone and singers deliberately letting air escape."],"use":"Breathy is a strong word for vocal and wind timbre. Name the instrument and register, and link it to effects such as intimacy, fragility or mystery. In pop analysis, mention close miking, which captures the breath.","listen":["Listen for a soft hiss of air around the note.","Notice whether the voice sounds very close to the microphone."],"example":"The vocal is close-miked and **breathy** in the verse, so it sounds intimate, and the switch to full chest voice in the chorus has a much stronger impact."},"Material / sound-source>reedy":{"what":["A reedy timbre has the buzzing, slightly nasal edge of a vibrating reed. It is focused, and it can be bright or dark depending on the instrument.","Single-reed instruments (clarinet, saxophone) and double-reed instruments (oboe, cor anglais, bassoon) all sound reedy, as do the harmonica, accordion, bagpipes and the reed stops of a pipe organ."],"use":"Reedy points to a woodwind source, so name the instrument and register if you can. Link the timbre to effects such as a pastoral, folk or melancholy feel, or explain how a reedy line stands out against strings.","listen":["Listen for a buzzing, focused edge in the tone.","Compare it with the flute, which has no reed and sounds airier."],"example":"The **reedy** cor anglais solo stands out clearly against the muted strings, and its plaintive tone gives the slow movement a melancholy, pastoral feel."},"Material / sound-source>brassy":{"what":["A brassy timbre is bright, buzzing and blaring: the sound of brass instruments when they are pushed. The louder brass instruments play, the more upper overtones appear, so the sound gains a hard, metallic edge.","It suits trumpets, trombones and horns at forte or louder, synth brass, big-band brass and funk or soul horn sections. Horn players have a special marking, cuivré, for a forced, brassy sound."],"use":"Brassy describes both the source and the edge of the sound. Pair it with the dynamic and register, and link it to effects such as triumph, aggression, celebration or jazzy punch. It contrasts well with mellow brass playing at a soft dynamic.","listen":["Listen for a bright, buzzing, metallic edge on loud brass notes.","Compare loud and soft brass passages and notice when the edge appears."],"example":"The horns play the theme fortissimo with a **brassy**, cuivré edge, which turns the earlier mellow melody into a fierce, heroic statement.","fig":[{"file":"trumpet.jpg","caption":"Brass played loudly gains a bright, brassy edge"}]},"Material / sound-source>distorted":{"what":["A distorted timbre is fuzzy, gritty and crunchy. It happens when an electric signal is pushed harder than an amplifier or pedal can cleanly handle, so the sound wave is clipped and many new upper overtones appear.","Distortion ranges from warm overdrive to heavy fuzz and high-gain metal tones. It is used mostly on electric guitar, but also on bass, keyboards, drums and vocals."],"use":"Use distorted with the type and amount if you can hear them (light overdrive, heavy fuzz, high gain). Link it to style (rock, punk, metal, grunge) and to effects such as aggression or power. Comparing a clean verse with a distorted chorus is a strong way to discuss structure through timbre.","listen":["Listen for a fuzzy, crunchy edge and long sustain on the notes.","Compare clean and distorted sections of the same song."],"example":"The guitar moves from clean arpeggios in the verse to **distorted** power chords in the chorus, which makes the chorus sound louder, heavier and more aggressive.","fig":[{"file":"electric_guitar.png","caption":"Distortion is used mostly on the electric guitar"}]},"Material / sound-source>airy":{"what":["An airy timbre is light and open, with a lot of breath or space around it. It feels spacious rather than solid.","Sources include the pan flute, low flute, shakuhachi, breathy vocals, widely spaced high string chords and soft synth pads with lifted high frequencies and long reverb."],"use":"Airy works for an instrument or for the production. Name the source and any effects (reverb, a high-frequency boost), and link it to effects such as openness, calm, freedom or a dreamy, floating mood.","listen":["Listen for breath or soft high frequencies around the note.","Notice space in the mix, with nothing heavy in the bass."],"example":"The pan flute's **airy** tone, set in a wide reverb, gives the opening an open, spacious feel, as if the music is drifting outdoors."},"Material / sound-source>artificial":{"what":["An artificial timbre is clearly not natural or acoustic, and it does not try to hide it. The sound has obviously been processed or generated by technology.","Examples are hard auto-tune that makes the voice jump between pitches, vocoder and talk-box effects, robotic synth voices, extreme pitch shifting and parts too perfect to be played by a person."],"use":"Artificial suggests a deliberate choice, so explain the process behind it (auto-tune, vocoder, pitch shifting) and link it to style and meaning, for example a robotic or detached character or a futuristic setting. It contrasts strongly with natural, acoustic sounds in the same track.","listen":["Listen for a voice that snaps between notes or sounds robotic.","Notice sounds that no one could produce on an acoustic instrument."],"example":"The vocal is processed with hard auto-tune, so its **artificial**, robotic leaps between pitches make the singer sound detached and emotionally numb."},"Material / sound-source>electronic":{"what":["An electronic sound is made or changed by electronics. It may be generated (synthesisers, drum machines, samplers) or be acoustic sound processed through effects and software.","Electronic sources include synth pads and leads, drum machines, sampled loops, the theremin and electronic organs, along with DAW effects such as filters, delay and reverb."],"use":"At HSC level electronic is only a starting point, so make it precise by naming the device and the sound (an analogue synth bass, a drum machine kick, a sampled vocal loop). Link it to style and era, and to effects such as a futuristic, mechanical or club feel.","listen":["Listen for sounds that come from devices rather than acoustic instruments.","Notice perfectly regular rhythms, which often point to drum machines or sequencers."],"example":"An **electronic** drum machine plays a steady four-on-the-floor kick under a sampled vocal loop, which gives the track its mechanical, club-ready drive."},"Material / sound-source>buzzing":{"what":["A buzzing timbre has a fast vibration you can hear as a buzz on top of the note. The vibration usually comes from lips, a membrane or a reed.","Examples are the didgeridoo (yidaki), brass instruments played with tight lips, the kazoo, the sitar's jawari bridge, snare wires and distorted or square-wave synth bass."],"use":"Buzzing points to how the sound is made, so name the source and technique. Link it to style and culture (the didgeridoo drone, the sound of the sitar) or to effects such as tension, energy or a comic character.","listen":["Listen for a fizzing vibration riding on the pitch.","Notice drones that buzz continuously under the music."],"example":"The didgeridoo holds a **buzzing** drone beneath the voices, and its continuous vibration grounds the whole texture.","fig":[{"file":"didgeridoo.jpg","caption":"Didgeridoo (yidaki): the player's vibrating lips make a buzzing drone"}]},"Material / sound-source>resonant":{"what":["A resonant timbre is full and vibrating, ringing on with body after the attack. The instrument's body, its other strings or the space around it vibrate in sympathy, which strengthens and sustains the sound.","Examples are a cello's open strings, a grand piano with the sustain pedal down, a big drum, a gong, a bass voice in a hall and a large-bodied acoustic guitar."],"use":"Resonant links timbre to sustain and space. Name what is resonating (the instrument body, sympathetic strings, the hall) and link it to effects such as richness, depth or grandeur. It contrasts with dry or damped sounds.","listen":["Listen for a full sound that keeps vibrating after the note starts.","Notice open strings, pedalled piano or large drums."],"example":"With the sustain pedal held, the piano's low octaves become deeply **resonant**, so the bass rings on beneath the chords and gives the passage a solemn weight.","fig":[{"file":"piano.png","caption":"With the sustain pedal down, the piano's strings ring on and the sound becomes resonant"}]},"Material / sound-source>bell-like":{"what":["A bell-like timbre is clear and ringing, with a hard attack and a long, slowly fading decay. Bells have overtones that do not fit neatly into the normal harmonic series, which gives them their shimmer.","Sources include the glockenspiel, tubular bells, celesta, vibraphone, crotales, electric piano, piano and harp harmonics and FM synth bell sounds."],"use":"Bell-like compares a sound to bells, so it suits instruments that are not bells. Name the instrument and register, and link it to effects such as ceremony, childhood, magic or celebration.","listen":["Listen for a hard, ringing attack followed by a long fade.","Notice whether the sound seems to chime rather than sustain evenly."],"example":"The celesta doubles the melody with a **bell-like**, chiming tone, which gives the passage a magical, music-box quality.","fig":[{"file":"glockenspiel.jpg","caption":"The glockenspiel's metal bars give a clear, bell-like ring"}]},"Material / sound-source>nasal":{"what":["A nasal timbre sounds as if it comes through the nose. It is focused and pinched, with strong upper-middle overtones and less warmth below.","The oboe is the classic example, along with the cor anglais, bagpipes, a straight-muted trumpet, a pinched vocal in some folk and country styles and double-reed instruments such as the Chinese suona."],"use":"Nasal is a precise word for double reeds and some vocal styles. Name the instrument or vocal style, and link it to effects such as a pastoral, rustic, plaintive or ceremonial feel. Use it as a neutral description, not a criticism.","listen":["Listen for a pinched, focused tone with an edge.","Compare it with the rounder sound of the flute or clarinet."],"example":"The oboe's **nasal**, focused tone carries the folk-like melody over the strings, which gives the passage a rustic, pastoral character.","fig":[{"file":"oboe.jpg","caption":"Oboe: its double reed gives a focused, nasal tone"}]},"Material / sound-source>percussive":{"what":["A percussive timbre has a hard, strong attack on each note followed by a quick decay. The start of the sound matters more than the sustain.","Drums are percussive by nature, but many pitched instruments can be played percussively: slap bass, hammered piano chords, guitar chops, col legno strings, hard pizzicato and staccato brass."],"use":"Percussive is useful when a melodic instrument is used for rhythm. Name the technique and link it to effects such as drive, groove or aggression. It is good evidence for answers about rhythm and texture as well as timbre.","listen":["Listen for a strong attack that matters more than the held note.","Notice melodic instruments being used rhythmically."],"example":"The pianist hammers **percussive** cluster chords on the off-beats, so the piano works like a drum and drives the rhythm forward."},"Material / sound-source>echoey":{"what":["An echoey sound repeats after a short gap, like a voice bouncing back in a canyon. Unlike reverb, each repeat can be heard separately.","In the studio it is made with a delay effect, which sets the gap, the number of repeats (feedback) and how fast they fade. Dub reggae, ambient guitar and rock guitar solos use it heavily."],"use":"Echoey describes production, so name delay as the effect and, if you can, whether the repeats are timed to the beat. Link it to effects such as space, distance, dreaminess or a rhythmic layer that fills the gaps, and contrast it with dry sections.","listen":["Listen for a sound coming back as softer repeats.","Notice whether the repeats fall in time with the beat."],"example":"The guitar's **echoey** delay repeats each note a dotted quaver later, which fills the space between phrases and makes one player sound like several.","fig":[{"file":"rm_s4_delay_echo.png","caption":"Delay: each note comes back as softer and softer echoes"}]},"Material / sound-source>dry":{"what":["A dry sound has no reverb or echo added. It is close, plain and direct, as if played in a small room right next to you.","Dry sounds come from close miking in a dead room or from mixing with few or no effects. Drum machines, spoken word and many modern pop vocals are mixed fairly dry for clarity and impact."],"use":"Dry is a production word, so link it to the effect of closeness: intimacy, honesty, punch or starkness. It is most useful in contrast with reverberant or echoey sections, which shows how production supports the structure.","listen":["Listen to the end of each note: does it stop cleanly with no tail?","Notice how close and present the sound seems."],"example":"The verse vocal is almost completely **dry**, so it sounds close and conversational, which contrasts with the washed-out, reverberant chorus."},"Material / sound-source>wooden / woody":{"what":["A wooden or woody timbre has the warm, knocking or hollow sound of wood. Struck wood gives a dry knock with a short ring, while wooden pipes a
