ten the first thing to write in a listening answer."],"use":"Composers write differently for a solo singer, a small group and a large choir or orchestra. Small groups sound personal and clear, and large groups sound powerful. When you perform in an ensemble, you need to listen to the others and fit in with them.","listen":["Count roughly how many performers you hear.","Name the voice types or instruments in the group.","Notice whether there are instruments at all, or just voices."],"example":"The piece is sung by an **SATB choir a cappella**, so the four **voice types** create the harmony on their own, which gives it a pure, clear sound."},"Voices and ensembles>Voice types (SATB)":{"what":["Voices are grouped by how high or low they sing. From highest to lowest they are soprano, alto, tenor and bass, shortened to SATB. Sopranos and altos are usually women's or children's voices, and tenors and basses are usually men's voices.","There are in-between types too. Mezzo-soprano sits between soprano and alto, and baritone sits between tenor and bass."],"use":"Choirs are often written in four parts, SATB, with the soprano usually singing the melody. In choir music the parts can be written on four staves or two, with soprano and alto on the treble staff and tenor and bass on the bass staff. Knowing your voice type helps you sing in a comfortable range.","listen":["Listen for which voice has the melody, often the highest part.","Notice low male voices (bass) singing the bottom of the harmony.","Listen for whether the voices are all high, all low or mixed."],"example":"The **sopranos** sing the melody while the **altos, tenors and basses** sing harmony below them, which gives the hymn a full, balanced sound.","fig":[{"file":"rm_s4_satb.png","caption":"SATB on two staves: soprano and alto share the treble staff, tenor and bass share the bass staff"}]},"Voices and ensembles>A cappella":{"what":["A cappella (say 'ah ka-PEL-ah') means singing with no instruments at all. It comes from the Italian for 'in the style of the chapel', because early church choirs often sang without instruments.","In a cappella music the voices make all the parts: melody, harmony and sometimes bass lines and beats."],"use":"A cappella is used in church choirs, barbershop quartets, gospel and modern vocal groups, where singers copy instrument sounds and one person may beatbox the drum part. Singing a cappella is hard because there is nothing to keep you in tune, so singers must listen carefully to each other.","listen":["Check that there are no instruments: every sound is a voice.","Listen for voices imitating instruments, such as 'doo' or 'bum' bass parts.","Notice beatboxing or vocal percussion keeping the rhythm."],"example":"The group sings **a cappella**, with the bass singer on a 'doo-doo' **bass line** and another singer **beatboxing**, so the voices do the job of a whole band."},"Voices and ensembles>Ensemble sizes":{"what":["An ensemble is a group of performers. The names tell you how many: a solo is one performer, a duet (or duo) is two, a trio is three, a quartet is four and a quintet is five.","Larger groups include bands, choirs and orchestras. Big ensembles are usually led by a conductor, who shows the beat and the tempo, brings players in and shapes the dynamics."],"use":"Composers choose an ensemble size for the sound they want: a solo is personal, a quartet is clear and balanced and an orchestra or choir is grand and powerful. A string quartet has two violins, a viola and a cello. In a small group each person plays their own part, so every player matters.","listen":["Count how many separate parts or performers you hear.","Listen for a solo voice or instrument standing out from the group.","Notice whether the group sounds small and clear or big and full."],"example":"The piece begins with a solo **piano**, then a **string quartet** joins in, so the texture grows from one performer to five."},"Voices and ensembles>Typical rock band":{"what":["A typical rock band has electric guitar, bass guitar, drum kit and vocals, often with a keyboard as well. Many bands have two guitarists: a lead guitarist who plays riffs and solos and a rhythm guitarist who plays chords.","The bass guitar and drums together are called the rhythm section, because they hold the beat and groove."],"use":"In a rock band each member has a clear role: the drums keep the beat, the bass plays the bass line, the guitars and keyboard play chords and riffs and the singer has the melody. Pop, punk, metal and indie bands use similar line-ups. When your class forms a band, give each member one of these roles.","listen":["Listen for distorted or clean electric guitar.","Find the bass guitar line under everything, locked in with the bass drum.","Listen for the singer's melody and any backing vocals."],"example":"The song uses a **typical rock band**, with **distorted electric guitar** chords, a driving **bass guitar** and **drum kit** backbeat under the **vocals**, which makes it loud and energetic.","fig":[{"file":"electric_guitar.png","caption":"Electric guitar: needs an amplifier"},{"file":"drum_kit.jpg","caption":"Drum kit: the rhythm section with the bass guitar"}]},"Performing media and timbre>Words to describe timbre":{"what":["Timbre words describe the colour or quality of a sound. Because sound cannot be seen, we borrow words from colour (bright, dark), touch (smooth, rough) and other senses (warm, thin).","A good timbre description names the instrument and then gives one or two describing words for how it sounds in that moment."],"use":"Performers change their timbre on purpose to suit the mood, and composers choose instruments for their colour. In a listening answer, a timbre word plus the instrument plus the effect makes a strong sentence. Learn the words in pairs of opposites: bright and dark, thin and rich, smooth and raspy.","listen":["Listen to one instrument at a time and pick the word that fits best.","Compare high notes and low notes: the same instrument often sounds brighter up high.","Notice when a performer changes the sound, like a singer going from smooth to raspy."],"example":"The **trumpet** has a **bright, piercing** timbre in the fanfare, while the **cello** that follows sounds **dark and warm**, which marks the change from celebration to sadness."},"Pitch>Key ideas":{"what":["Pitch is how high or low a sound is. These cards give you the first big ideas: some instruments play clear notes you can sing back (definite pitch) and some don't (indefinite pitch). When notes come one after another you get a melody. When different notes sound at the same time you get harmony."],"use":"Nearly every piece you study has a melody and some harmony underneath it, played by definite-pitch instruments, with indefinite-pitch percussion adding rhythm. When you compose, decide which instruments carry the tune, which play the chords and which just keep the beat.","listen":["Try to hum along. If you can, the instrument has a definite pitch.","Pick out the main tune first, then listen for the notes sounding underneath it.","Notice which sounds are only rhythm, like drums and shakers."],"example":"In the opening the flute plays the **melody** while the piano adds **harmony** with soft chords underneath, and the snare drum, an **indefinite pitch** instrument, keeps a steady rhythm.","fig":[{"file":"rm_s4_definite_indefinite.png","caption":"The xylophone part is written on a five-line staff because it plays real notes. The snare drum only needs one line, because it plays rhythm, not pitch."}]},"Key ideas>Definite pitch":{"what":["An instrument has definite pitch when it makes a clear note that you could sing back or match on a keyboard. Each note has a letter name, like C or G, and is written on a particular line or space of the staff.","Most instruments are like this: voices, flutes, violins, guitars, pianos and tuned percussion such as the xylophone and glockenspiel."],"use":"Definite-pitch instruments play the melodies and harmonies in a piece. In a classroom band the xylophone, keyboard and guitar can play the tune and the chords. When you compose, use them for anything that needs real notes, and give the rhythm-only jobs to the drums.","listen":["Hum the note straight after you hear it. If you can match it, it has definite pitch.","Listen for notes that go up and down to make a tune.","Check if two instruments play the same note together and sound in tune."],"example":"In the verse the xylophone, a **definite pitch** instrument, plays a short tune that rises and falls, while the drums only keep the rhythm.","fig":[{"file":"glockenspiel.jpg","caption":"The glockenspiel is tuned percussion: each metal bar plays one definite note"}]},"Key ideas>Indefinite pitch":{"what":["An instrument has indefinite pitch when it makes a sound with no clear note. You can hear that it is higher or lower than another sound, but you can't sing it back as a note with a letter name.","Snare drum, cymbals, maracas, tambourine and most of the drum kit are like this. They are called untuned percussion. Their parts are usually written on a single line or a percussion staff, showing rhythm only."],"use":"Indefinite-pitch instruments keep the beat, add rhythm and mark big moments, like a cymbal crash at the start of a chorus. In pop and rock the drum kit does this job. When you compose, use untuned percussion for rhythm patterns and effects, and leave the tune to the tuned instruments.","listen":["Try to hum the sound. If there is no clear note to match, it is indefinite pitch.","Listen for rattles, crashes, taps and hisses rather than notes.","Notice if a drum sounds higher or lower without playing a tune."],"example":"Throughout the chorus the snare drum and cymbals, which are **indefinite pitch** instruments, play a driving rhythm under the melody, which makes the music feel energetic.","fig":[{"file":"rm_s4_definite_indefinite.png","caption":"Tuned instruments need a full staff for their notes. A snare drum part needs just one line, because only the rhythm matters."}]},"Key ideas>Melody":{"what":["A melody is a line of single notes played one after another. It is usually the tune: the part you hum or sing along to. A melody moves up, down or stays the same, and it has rhythm too, so each note lasts a certain length.","Melodies are made of phrases, like sentences in speech, often with a short breath or pause at the end of each one."],"use":"The melody is usually the part the audience remembers, so composers give it to a voice or a lead instrument such as the flute, violin, trumpet or lead guitar. When you compose, start with a short melody, then repeat it, change it slightly or answer it with a new phrase.","listen":["Find the part you could sing back by yourself.","Follow which instrument or voice has the tune, because it can move from one to another.","Listen for where each phrase ends and the next one starts."],"example":"In the opening the violin plays the **melody**, which moves mostly by step and rises to a high note at the end of the phrase, which makes it feel calm and singable."},"Key ideas>Harmony":{"what":["Harmony is two or more different notes sounding at the same time. A melody is horizontal, one note after another. Harmony is vertical, notes stacked on top of each other.","Three or more notes played together make a chord. Some combinations sound settled and smooth (consonant) and some sound clashing or tense (dissonant)."],"use":"Harmony supports the melody and changes its mood. Pianos and guitars often play chords under a singer, and choirs sing in harmony with different notes in each voice part. When you compose, add a simple chord under your melody, or a second line a 3rd below it.","listen":["Listen underneath the tune for notes or chords sounding at the same time.","Notice when the chords change, often at the start of a bar.","Decide if the notes together sound smooth or clashing."],"example":"In the chorus the backing singers add **harmony** a 3rd below the lead vocal, which makes the sound fuller and warmer than the verse."},"Pitch>The staff and clefs":{"what":["To write pitch down you need two things: a staff (five lines and four spaces) and a clef at the start that tells you which note each line and space stands for.","The treble clef is used for higher notes and the bass clef for lower notes. Piano music joins the two into a grand staff. Notes that go above or below the staff use short ledger lines."],"use":"Every piece of written music for definite-pitch instruments uses a staff and a clef. Flute, violin, trumpet and voice parts use treble clef. Bass guitar, cello, tuba and trombone use bass clef. Piano uses both.","listen":["Higher instruments and voices usually read treble clef.","Lower instruments and voices usually read bass clef.","On a score, notes higher on the staff sound higher in pitch."],"example":"In this score the flute part is written in **treble clef** and the cello part in **bass clef**, so the cello plays much lower notes under the flute melody.","fig":[{"file":"ref_grand_staff.png","caption":"The grand staff: treble clef on top, bass clef underneath, joined by a brace"}]},"The staff and clefs>Staff (stave)":{"what":["The staff (also called a stave) is a set of five lines with four spaces between them. Notes go on the lines or in the spaces. The higher a note sits on the staff, the higher it sounds.","Always count the lines and spaces from the bottom up. The bottom line is line 1 and the top line is line 5."],"use":"Every written part for a tuned instrument uses a staff. When you write music, place each note clearly so the line goes through the middle of a line note, and a space note sits neatly between two lines.","listen":["As a melody goes up, its notes climb up the staff.","A big jump in sound shows as a big jump on the staff.","Repeated notes stay on the same line or space."],"example":"Looking at the **staff**, the melody starts on the bottom line and climbs to the top space by the end of bar 2, matching the rising sound you hear."},"The staff and clefs>Clef":{"what":["A clef is the sign at the start of every staff. It tells you which note each line and space stands for. Without a clef, the staff is just five lines with no names.","The same spot on the staff means a different note in a different clef. For example, the second line from the bottom is G in treble clef but B in bass clef."],"use":"Each instrument reads the clef that suits its range. High instruments use treble clef, low instruments use bass clef and piano uses both. When you read or write music, check the clef first, then name the notes.","listen":["Notes in treble clef usually sound higher than notes in bass clef.","When an instrument plays much lower, its part is probably in bass clef.","Piano music shows the right hand in treble clef and the left hand in bass clef."],"example":"The **clef** shows that the trombone part is in bass clef, so its notes sound much lower than the trumpet part written in treble clef above it.","fig":[{"file":"rm_s4_clef_same_line.png","caption":"The note sits on the same line both times, but the clef changes its name: G in treble clef, B in bass clef"}]},"The staff and clefs>Treble clef (G clef)":{"what":["The treble clef is used for higher notes. It is also called the G clef because its curl wraps around the second line from the bottom, and that line is G (the G just above middle C).","Once you know that line is G, you can work out every other note by counting up or down the lines and spaces."],"use":"Flute, violin, recorder, trumpet, guitar, the right hand of the piano and most singers read treble clef. When you draw it, start on the G line and curl around it so the shape is clear.","listen":["Higher instruments and voices are written in treble clef.","The melody of a song is usually in treble clef.","On piano music, the right hand plays the treble clef part."],"example":"The violin melody is written in **treble clef** and starts on the G line, then climbs into the higher spaces as the music gets more excited.","fig":[{"file":"ref_treble_notes.png","caption":"Treble clef notes from middle C up to high A"}]},"The staff and clefs>Bass clef (F clef)":{"what":["The bass clef is used for lower notes. It is also called the F clef because the two dots sit on either side of the fourth line from the bottom, and that line is F (the F just below middle C).","Bass clef notes have different names from treble clef notes on the same line or space, so learn its own lines and spaces."],"use":"Bass guitar, double bass, cello, trombone, tuba, bassoon, the left hand of the piano and low male voices read bass clef. It is used for bass lines and the low parts of the harmony.","listen":["Deep, low parts are usually written in bass clef.","Listen for the bass line under the tune, which is often played by bass guitar or the piano left hand.","Notice that low instruments often play fewer, longer notes that support the chords."],"example":"The cello part is written in **bass clef** and plays a slow, low bass line under the melody, which gives the music a solid base.","fig":[{"file":"ref_bass_notes.png","caption":"Bass clef notes from low E up to middle C"}]},"The staff and clefs>Ledger lines":{"what":["Ledger lines are short extra lines added above or below the staff for notes that are too high or too low to fit on it. Each ledger line works like another staff line, with spaces between them.","Middle C is the most common one. In treble clef it sits on one ledger line just below the staff."],"use":"Ledger lines let a part go higher or lower than the five lines allow. Flute and violin parts often use them above the staff, and bass parts use them below. When you write a note on a ledger line, keep the line short and level, just wider than the note head.","listen":["Notes well above the staff sound very high, like a flute or piccolo solo.","Notes well below a bass clef staff sound very low, like a tuba or bass guitar.","Many ledger lines in a row means the part is at the edge of its range."],"example":"At the climax the flute rises onto **ledger lines** above the staff, so the melody sounds very high and bright."},"The staff and clefs>Grand staff":{"what":["The grand staff is a treble staff and a bass staff joined by a brace (a curly bracket) and a line at the start. It is used for piano, organ and harp, where the player needs a wide range of notes.","Middle C sits on a ledger line between the two staves. It is the same note whether it is written just below the treble staff or just above the bass staff."],"use":"Pianists usually play the treble staff with the right hand and the bass staff with the left hand. A common pattern is melody in the right hand and chords or a bass line in the left. When you compose for keyboard, write the tune on the top staff and the accompaniment on the bottom one.","listen":["Listen for a high part and a low part played at the same time on one instrument.","The right hand usually plays the tune and the left hand the bass notes or chords.","Notes near middle C sound in the middle of the piano."],"example":"On the **grand staff** the right hand plays the melody in treble clef while the left hand plays low chords in bass clef, so the piano covers both the tune and the harmony."},"Pitch>Treble clef notes":{"what":["These are the notes you need to know in treble clef, from middle C on a ledger line below the staff up to high A on a ledger line above it.","The notes go in alphabetical order from A to G and then start again. Each step up goes from a line to the next space, or a space to the next line. Learn the lines and the spaces separately, then join them together."],"use":"Reading treble clef lets you play melodies on keyboard, xylophone, guitar, recorder and most band instruments. When you compose, check each note name as you write it, so your part plays the right notes.","listen":["As you name notes upwards (C D E F G A B C), the pitch rises.","Notes on the higher lines and spaces sound higher.","The note on the top space (E) sounds much higher than middle C."],"example":"Reading the **treble clef**, the melody starts on E on the bottom line, climbs by step to the C in the third space and then falls back to middle C."},"Treble clef notes>Lines: E G B D F":{"what":["The five lines of the treble clef, from the bottom up, are E, G, B, D and F. The saying Every Good Boy Deserves Fruit helps you remember them, one word for each line.","The second line, G, is the one the treble clef curls around, so you can always check your answer against it."],"use":"Knowing the line notes quickly helps you read music at the speed it is played. Practise by naming random line notes, then playing them on a keyboard or xylophone.","listen":["Moving from one line note to the next skips a letter (E to G), so it sounds like a small leap.","A melody using only line notes, like E G B D, jumps by 3rds.","The top line F sounds much higher than the bottom line E."],"example":"The melody uses the **line notes** E, G and B, so it moves by small leaps and sounds a bit bouncy."},"Treble clef notes>Spaces: F A C E":{"what":["The four spaces of the treble clef, from the bottom up, are F, A, C and E. They spell the word FACE.","The space notes and line notes take turns. Going up from the bottom line: E (line), F (space), G (line), A (space) and so on."],"use":"FACE is the quickest note-reading trick in music, so use it whenever you name treble clef notes. Combine it with Every Good Boy Deserves Fruit to name any note on the staff.","listen":["Moving from one space note to the next also skips a letter (F to A).","A melody that steps from a space to the line above moves by step.","The top space E sounds a 7th higher than the bottom space F."],"example":"The tune sits mostly in the **spaces**, moving F, A, C, E, which makes it rise in small leaps like a broken chord."},"Pitch>Bass clef notes":{"what":["These are the notes you need to know in bass clef, from low E on a ledger line below the staff up to middle C on a ledger line above it.","Bass clef notes have different names from treble clef notes in the same spot. Bass clef notes sit one place lower in the alphabet than treble clef notes would on the same line, so the bottom line is G, not E."],"use":"Reading bass clef lets you play bass lines and the left hand of piano music. Bass guitar, cello and trombone players read it all the time. When you write a bass part, keep it in bass clef so it doesn't need lots of ledger lines.","listen":["Bass clef notes sound low and deep.","The top of the bass clef, near middle C, sounds in the middle of the piano.","Listen for the bass line, which usually moves under the melody."],"example":"Reading the **bass clef**, the bass line moves G, C, D, G, which gives the music strong, low support under the melody."},"Bass clef notes>Lines: G B D F A":{"what":["The five lines of the bass clef, from the bottom up, are G, B, D, F and A. The saying Good Boys Do Fine Always helps you remember them.","The fourth line is F, the line between the two dots of the bass clef, so you can check your answer against it."],"use":"Bass players and the left hand of the piano read these notes constantly. Practise by naming line notes in a bass part, then playing them on keyboard or bass guitar.","listen":["Line-to-line moves skip a letter (G to B), so they sound like small leaps.","The bottom line G is a very low note, often played by bass guitar or tuba.","The top line A sounds just below middle C."],"example":"The bass guitar plays on the **line notes** G, B and D, outlining the chord of G major under the melody."},"Bass clef notes>Spaces: A C E G":{"what":["The four spaces of the bass clef, from the bottom up, are A, C, E and G. The saying All Cows Eat Grass helps you remember them.","As in treble clef, the lines and spaces take turns going up: G (line), A (space), B (line), C (space) and so on."],"use":"Use All Cows Eat Grass together with Good Boys Do Fine Always to name any note on the bass staff. This makes it much faster to read piano left-hand parts and bass lines.","listen":["Moving from one space note to the next skips a letter (A to C).","A bass line that steps from a space to the line above moves by step.","The top space G sounds lower than middle C, but higher than the bottom space A."],"example":"The cello plays a slow bass line on the **space notes** A, C and E, which outlines an A minor chord and gives the passage a darker sound."},"Pitch>The keyboard":{"what":["The keyboard is the easiest place to see how pitch works. Keys on the left sound lower and keys on the right sound higher. The white keys use the letter names A to G over and over, and the black keys are the sharps and flats in between.","The black keys come in groups of two and three. These groups help you find any note, and they help you measure semitones, tones, octaves and other intervals."],"use":"Keyboard is the tool most students use to work out melodies, chords and scales, even if they play another instrument. When you compose, test your melody on the keyboard and count the keys between notes to check your intervals.","listen":["Moving right on the keyboard sounds higher, moving left sounds lower.","Neighbouring keys sound very close together.","The same letter name an octave apart sounds like the same note, just higher or lower."],"example":"On the **keyboard** the melody moves up by a **tone** from C to D, then by a **semitone** from E to F, so you can see and hear the different step sizes.","fig":[{"file":"ref_keyboard.png","caption":"The keyboard, with middle C highlighted"}]},"The keyboard>Finding C":{"what":["To find C, look for a group of two black keys. The white key just to the left of that group is always C. This works anywhere on the keyboard.","Middle C is the C closest to the middle of the keyboard, usually near the brand name on a piano."],"use":"This trick works because the black keys repeat the same pattern of two, then three, all the way along. Once you have C, count along the white keys to find the others: D sits between the two black keys, and E is just to their right. Start most melodies, scales and chords from C as a home base.","listen":["Every C sounds like the same note, just higher or lower.","Play two Cs together and they blend almost into one sound.","Middle C sits in the middle of most singers' range."],"example":"The pianist finds **middle C** using the group of two black keys, then plays a C major scale upwards from it."},"The keyboard>Semitone":{"what":["A semitone is the smallest step in Western music. On a keyboard it is the distance from one key to the very next key, black or white, with nothing in between.","Most semitones go from a white key to a black key (C to C sharp). Two pairs of white keys have no black key between them, so E to F and B to C are also semitones."],"use":"Semitones give music tension and pull. A note a semitone away from the home note pulls strongly towards it, like B pulling up to C. Film composers use semitone steps for creepy, tense music, like the low two-note pattern used for a shark or monster sneaking up. Try a slow semitone back and forth in a low register when you compose.","listen":["Listen for two notes that sound very close together.","A semitone often sounds tense or uneasy.","In a slide up or down through every key, each step is a semitone."],"example":"In the introduction the double bass moves back and forth by a **semitone**, which makes the music sound tense and threatening.","fig":[{"file":"rm_s4_semitones_staff.png","caption":"Semitones on the staff: E to F, B to C and C to C sharp. A tone is two semitones: C to D and E to F sharp."}]},"The keyboard>Tone":{"what":["A tone is two semitones. On the keyboard, you move two keys along, so there is one key in between. C to D is a tone because the black key C sharp sits between them.","Be careful with E and F, and B and C: they are only a semitone apart, so E to F sharp and B to C sharp are tones. A tone is sometimes called a whole step, and a semitone a half step."],"use":"Tones and semitones are the building blocks of scales. A major scale follows the pattern tone, tone, semitone, tone, tone, tone, semitone. When you compose, a melody moving mostly by tones and semitones sounds smooth and easy to sing.","listen":["A tone sounds like a normal step in a scale.","A tone sounds a little wider and more open than a semitone.","Sing do-re (C to D) to hear a tone, and mi-fa (E to F) to hear a semitone."],"example":"The melody rises by a **tone** from C to D and then by a **semitone** from E to F, so the last step feels smaller and leans into the F.","fig":[{"file":"rm_s4_semitones_staff.png","caption":"The last two bars are tones: C to D and E to F sharp. The first three are semitones."}]},"The keyboard>Octave":{"what":["An octave is the distance from one note to the next note with the same letter name, like C up to the next C. Count the letter names and include both ends: C D E F G A B C makes 8, which is why it is called an octave (octo means eight).","The two notes sound so alike that they blend almost into one. On the keyboard an octave is 12 semitones."],"use":"Players double a melody in octaves to make it sound stronger, for example piano right hand and left hand playing the same tune an octave apart. Men and women singing the same tune are usually an octave apart. In Somewhere Over the Rainbow the melody leaps up an octave on the first two notes. Try an octave leap at the start of a phrase to make it stand out.","listen":["Listen for two notes that sound like the same note, one higher and one lower.","A big leap that lands on the same note name is an octave.","Notice when two instruments play the same tune but one sounds much higher."],"example":"In the final chorus the piano doubles the melody in **octaves**, which makes the tune sound bigger and brighter than before."},"The keyboard>Interval":{"what":["An interval is the distance between any two pitches. To name it, count the letter names from the bottom note to the top note and include both. C to E is C, D, E, which is 3 letters, so it is a 3rd. C to G is a 5th.","A melodic interval has the notes one after the other. A harmonic interval has them sounding together."],"use":"Small intervals (2nds) make a melody smooth. Large intervals (5ths, 6ths, octaves) make it leap and stand out. Harmony is built from intervals too: a chord stacks 3rds. When you compose, mix small and large intervals so the melody has shape but is still singable.","listen":["Decide whether the two notes sound close together or far apart.","Close intervals sound smooth and large intervals sound like a jump.","Listen for whether the notes are played one after another or together."],"example":"The melody opens with a rising **interval** of a 5th, from C up to G, which gives the tune a bold, open start."},"Pitch>Accidentals":{"what":["Accidentals are signs written just before a note to change its pitch by a semitone. A sharp raises the note, a flat lowers it and a natural cancels a sharp or flat.","An accidental lasts until the end of the bar, so later notes on the same line or space in that bar are changed too. The bar line cancels it. You write the sign before the note, but say it after: F sharp, B flat."],"use":"Accidentals add notes that are outside the usual scale, which gives a melody extra colour or tension. They are also used to make a note pull strongly towards the next one. Check every bar for accidentals when you read music.","listen":["Listen for a note that sounds surprising or slightly 'off' compared with the scale around it.","A note that leans hard into the next note by a semitone is often an accidental.","Notice if a note sounds different the second time it is played."],"example":"In bar 3 an **accidental**, F sharp, raises the note by a semitone so it leads strongly up to G, which gives the end of the phrase more pull.","fig":[{"file":"rm_s4_accidental_bar.png","caption":"The sharp lasts until the end of the bar, so the second F is also F sharp. After the bar line it is F again."}]},"Accidentals>Sharp ♯":{"what":["A sharp (♯) raises a note by one semitone. F sharp is the key just to the right of F, which is a black key.","Sharps are written before the note on the same line or space, and they last until the end of the bar. Note that E sharp is the same key as F, and B sharp is the same key as C, because there is no black key between them."],"use":"Sharps appear as accidentals in a melody and in key signatures, such as G major with F sharp. A raised note often pulls upward towards the next note, as F sharp pulls to G. Use one when you want a melody to lean up into its next note.","listen":["Listen for a note that sounds a little higher than you expected.","A sharp note often pushes up into the note above it.","Compare the two versions of a note: the sharp one sounds slightly brighter."],"example":"In the last bar of the phrase the melody uses a **sharp**, F sharp, which leads up by a semitone to G and makes the ending sound finished.","fig":[{"file":"rm_s4_accidental_bar.png","caption":"A sharp lasts for the rest of the bar, then the bar line cancels it"}]},"Accidentals>Flat ♭":{"what":["A flat (♭) lowers a note by one semitone. B flat is the key just to the left of B, which is a black key.","Flats are written before the note and last until the end of the bar. The black keys have two names: the black key between A and B is both A sharp and B flat. Which name you use depends on the key of the music."],"use":"Flats appear as accidentals and in key signatures, such as F major with B flat. Brass and wind bands often play in flat keys like B flat and E flat. A lowered note often sounds darker, so try one in a melody when you want a sadder or bluesy colour.","listen":["Listen for a note that sounds a little lower than you expected.","A flat note often sounds darker or sadder.","A flat note often sinks down towards the note below it."],"example":"In the second phrase the **flat** on the B makes the note a semitone lower, which darkens the melody and gives it a bluesy sound.","fig":[{"file":"kb_semitone_tone.png","caption":"Each black key has two names: the one between A and B is A sharp or B flat"}]},"Accidentals>Natural ♮":{"what":["A natural (♮) cancels a sharp or flat, so the note goes back to its plain white-key pitch. If a B flat is followed later in the same bar by B natural, the second note is the ordinary B.","Like other accidentals, a natural lasts until the end of the bar. It can also cancel a sharp or flat from the key signature for that bar."],"use":"Composers use naturals to switch quickly between two versions of a note, such as B flat and B natural, which can change the mood from dark to bright. When you write a part, add a natural whenever you need the plain note again in a bar that already has a sharp or flat on that line or space.","listen":["Listen for a note that changes back to its normal pitch.","A natural often makes the sound brighter after a flat, or softer after a sharp.","Compare the note before and after the change."],"example":"In bar 2 a **natural** cancels the B flat, so the melody rises through B natural to C and the phrase sounds brighter.","fig":[{"file":"rm_s4_natural_cancel.png","caption":"B flat at the start of the bar, then the natural sign turns it back into B natural later in the same bar"}]},"Pitch>How melodies move":{"what":["Every melody moves in three ways: by step to the next-door note, by leap over one or more notes or by staying on the same note (repeated notes). Put these moves together and you get the overall shape of the melody, called its contour.","On the staff, steps go line to space, leaps skip lines or spaces and repeated notes stay in the same spot."],"use":"Melodies that move mostly by step sound smooth and are easy to sing, like Ode to Joy. Leaps add surprise and energy. Repeated notes add rhythm and focus. Good melodies mix all three, often with a leap followed by steps back in the other direction.","listen":["Notice if the melody slides smoothly or jumps.","Hear when a melody stays on one note.","Follow the overall direction: up, down or both."],"example":"The melody moves mostly **by step** with one **leap** up to the highest note, so it has an **arch** contour that rises to a peak in the middle and falls back at the end.","fig":[{"file":"rm_s4_step_leap_repeat.png","caption":"One melody using all three kinds of movement: steps, leaps and a repeated note"}]},"How melodies move>By step":{"what":["A melody moves by step when it goes to the next-door note, up or down, like C to D or G to F. It moves through the alphabet without skipping a letter.","On the staff a step goes from a line to the next space, or a space to the next line. Smooth, stepwise movement is also called conjunct motion."],"use":"Stepwise melodies are easy to sing and remember, which is why many folk songs, hymns and nursery rhymes use them. Ode to Joy moves mostly by step. When you compose, use steps for calm, flowing phrases, and save leaps for special moments.","listen":["Listen for notes that move smoothly to the note next door.","Try singing along. Stepwise tunes are easy to follow.","Notice a scale going up or down, which is all steps."],"example":"The opening melody moves **by step**, rising from C to G and falling back again, which makes it sound smooth and gentle."},"How melodies move>By leap":{"what":["A melody moves by leap when it jumps over one or more notes, like C to E or C to G. Any move bigger than a step is a leap. Leaps can be small, like a 3rd, or large, like an octave.","On the staff a leap skips lines or spaces. Jumpy movement is also called disjunct motion."],"use":"Leaps give a melody energy, surprise and drama. Twinkle Twinkle Little Star leaps up a 5th after its first two notes. Composers often follow a big leap with steps going the other way, which helps the melody settle. Try one big leap to reach the high point of your phrase.","listen":["Listen for a sudden jump to a much higher or lower note.","Bigger leaps sound more dramatic than small ones.","Notice if the melody moves back by step after a leap."],"example":"In the chorus the melody **leaps** up an octave to its highest note, which makes the moment sound bold and exciting.","fig":[{"file":"rm_s4_step_leap_repeat.png","caption":"Steps move to the next-door note. Leaps jump over notes."}]},"How melodies move>Repeated notes":{"what":["Repeated notes are when a melody stays on the same pitch for two or more notes in a row. The rhythm keeps moving, but the pitch does not change.","On the staff repeated notes all sit on the same line or space."],"use":"Repeated notes put the attention on rhythm and words. They are common in rap-like vocal lines, chants, fanfares and riffs. Twinkle Twinkle Little Star starts with two repeated notes. When you compose, try repeating a note with an interesting rhythm before moving away from it.","listen":["Listen for the pitch staying the same while the rhythm continues.","Repeated notes often sound like speech or a chant.","Notice repeated notes that build tension before the melody moves."],"example":"The verse melody uses lots of **repeated notes**, so it sounds almost like speech and puts the focus on the words."},"How melodies move>Contour":{"what":["Contour is the overall shape of a melody: the line you would draw if you joined up all its notes. It can go up (ascending), go down (descending), go up then down (arch), go up and down repeatedly (wave-like) or stay on one note.","Steps, leaps and repeated notes are the small moves. Contour is the big picture."],"use":"Composers shape contour to match the mood: rising lines build excitement, falling lines relax or sound sad and an arch gives a phrase a clear high point. When you analyse a melody, describe the contour first, then the steps and leaps inside it.","listen":["Trace the melody in the air with your hand as you listen.","Find the highest note and where it comes in the phrase.","Decide if the end of the phrase is higher, lower or the same as the start."],"example":"The first phrase has an **arch** contour, **ascending** by step to a high G and then **descending** back to C, which gives it a clear peak and a settled ending.","fig":[{"file":"mel_arch.png","caption":"An arch contour: up, then down"},{"file":"mel_wave.png","caption":"A wave-like contour: up and down, over and over"}]},"Contour>Ascending":{"what":["An ascending melody goes up in pitch, getting higher as it moves. It can climb by step, like a scale, or by leaps.","On the staff the notes move up towards the top lines. On a keyboard they move to the right."],"use":"Rising melodies build energy, hope and excitement, so composers often use them leading into a chorus or a climax. When you compose, use an ascending line to make a phrase feel like it is going somewhere.","listen":["Each note sounds higher than the one before.","The music often feels like it is building or lifting.","Listen for a rising line that leads into a big moment."],"example":"Before the chorus the strings play an **ascending** scale, which builds excitement and leads into the loudest part of the song."},"Contour>Descending":{"what":["A descending melody goes down in pitch, getting lower as it moves. It can fall by step or by leaps.","On the staff the notes move down towards the bottom lines. On a keyboard they move to the left."],"use":"Falling melodies often sound relaxed, sad or finished, so they are common at the ends of phrases and in slow, sad songs. Many bass lines descend by step. When you compose, use a descending line to calm the music down or end a section.","listen":["Each note sounds lower than the one before.","The music often feels like it is relaxing or settling.","Listen for falling lines at the ends of phrases."],"example":"At the end of the piece the melody **descends** by step back to the home note, which makes the music sound calm and finished."},"Contour>Arch":{"what":["An arch contour goes up to a high point and then comes back down, like the shape of a bridge or a rainbow. The highest note usually comes near the middle of the phrase.","The rise and fall can be by step, by leap or a mix of both."],"use":"The arch is one of the most common melody shapes because it has a clear climax and a settled ending. Composers use it for phrases that sound balanced and complete. When you compose, plan where your highest note will go, then build up to it and come back down.","listen":["Find the highest note of the phrase.","Check whether the melody climbs to it and then falls away.","Notice if the end of the phrase lands close to where it started."],"example":"The violin melody has an **arch** contour, rising to its highest note in bar 3 and falling back by step, which gives the phrase a clear high point."},"Contour>Wave-like":{"what":["A wave-like contour goes up and down again and again, like waves in the sea. The melody rises a little, falls a little, then rises again.","The ups and downs can be small, staying close together, or large, with big swoops."],"use":"Wave-like melodies sound flowing and restless, and they are good for music about water, wind or movement. They also keep long melodies interesting. When you compose, try a short rise-and-fall pattern and repeat it at different pitches.","listen":["Trace the melody with your hand and notice it going up and down repeatedly.","Listen for no single clear high point.","Notice if the pattern of ups and downs repeats."],"example":"The flute melody has a **wave-like** contour, rising and falling over and over, which suggests the movement of water."},"Contour>Staying the same":{"what":["A melody that stays the same keeps returning to, or holding, one pitch. The contour is a flat line, even though the rhythm may keep changing.","On the staff the notes stay on one line or space, or stay very close to it."],"use":"A flat contour puts the attention on rhythm and words, so you hear it in rap, chants, recitation and some riffs. A melody that stays on one note for a while can also build suspense before it finally moves. When you compose, try a flat line in the verse, then move to a rising line in the chorus for contrast.","listen":["Listen for a melody that stays on one pitch for a long time.","Notice whether the rhythm or words become more important than the tune.","Listen for suspense building before the melody finally moves."],"example":"In the verse the vocal melody **stays the same**, on one repeated note, so the rhythm of the words stands out before the chorus melody leaps up."},"Elements of Music>Pitch":{"what":["Pitch is how high or low a sound is. A high pitch comes from fast vibrations (a piccolo or a whistle) and a low pitch comes from slow vibrations (a tuba or a bass guitar).","Pitch covers three big ideas. Melody is pitches heard one after another. Harmony is pitches heard together, usually as chords. Tonality is the set of notes the music is built from, such as a major, minor or pentatonic scale, and the home note it keeps returning to."],"use":"Composers choose pitches to shape a tune, to build chords under it and to set a mood through the key. A riff, an ostinato or a drone gives a piece a pitch idea that keeps coming back. When you compose, start with a scale, write a short tune from its notes and then add chords or a drone underneath.","listen":["Follow the melody: does it go up, down or stay the same, and does it move by step or leap?","Listen under the tune for chords or a held note and notice when the chord changes.","Decide whether the music sounds major (bright), minor (darker) or something else, like pentatonic or modal.","Listen for a short pitch pattern that repeats, such as a bass riff."],"example":"The melody is in a **major** key and moves mostly by step over a repeating bass **riff**, while the **chords** change every bar, which gives the song a bright, settled feel."},"Pitch>Tonality":{"what":["Tonality is the 'home base' of a piece: which scale the notes come from and which note feels like home. That home note is called the tonic. Music usually ends on it because it sounds finished there.","The main types you need are major, minor, pentatonic, modal and chromatic. Each one uses a different set of notes, so each has its own sound."],"use":"Composers pick a tonality to set the mood before they write a single tune. Major often suits happy or confident music, minor suits sad, serious or spooky music, pentatonic suits folk songs and simple tunes and modes give a folk or older sound. You can change a tune's mood just by changing its tonality, for example by playing a major tune in minor.","listen":["Hum the note that feels like home at the end; that is the tonic.","Ask whether the music sounds bright (often major) or darker (often minor).","Listen for a gentle, open sound with no clashing half steps, which can mean pentatonic.","Notice notes sliding by semitones, which points to chromatic writing."],"example":"The verse is in a **minor** key, which makes it sound dark and unsettled, but the chorus shifts to **major** and the melody returns to the **tonic** at the end so it sounds finished.","fig":[{"file":"rm_s4_major_minor_tune.png","caption":"The same short tune in major and then in minor: only the E changes to E flat, but the mood changes"}]},"Tonality>Major":{"what":["Music in a major key uses the notes of a major scale. It usually sounds bright, happy or confident.","Every major scale follows the same pattern of steps: tone, tone, semitone, tone, tone, tone, semitone. The third note of the scale is a big step (two tones) above the tonic, and that wide 3rd gives major its bright sound. The key signature at the start of each line tells you which major key you are in."],"use":"Most pop songs, national anthems, nursery rhymes and marches are in major keys. Composers use major for celebration, energy and calm. When you compose a cheerful piece, choose a major key, start and end on the tonic and use the chords I, IV and V.","listen":["Listen for a bright, open, settled sound.","Sing the first three notes of the scale (doh, re, mi); in major the mi sounds bright and wide.","Check whether the main chords sound bright and stable rather than dark."],"example":"The piece is in a **major** key and the tune keeps returning to the **tonic**, which gives it a bright, confident mood that suits a celebration."},"Major>C major scale":{"what":["The C major scale is eight notes moving by step from C up to the next C: C D E F G A B C. It uses only the white keys on a keyboard, so it has no sharps or flats.","The first and last notes are both C (an octave apart). C is the tonic, the note that feels like home."],"use":"C major is the first key most students learn on keyboard, recorder and xylophone because there are no black notes to remember. Many class pieces and exercises are written in C. When you compose your first tune, use the notes of C major and finish on C so it sounds complete.","listen":["Listen for a smooth run of eight notes going up or down by step.","Notice the small steps between E and F and between B and C, the two semitones.","Hear how the top C sounds like the bottom C, only higher."],"example":"The melody climbs the **C major scale** by step from C to C, so it sounds smooth and bright and lands firmly on the tonic at the top."},"Major>The major pattern":{"what":["Every major scale uses the same pattern of steps: tone, tone, semitone, tone, tone, tone, semitone (T T S T T T S). A tone is two keys apart on the keyboard and a semitone is the very next key.","In C major the two semitones fall naturally between E and F and between B and C. If you start on any other note, you need sharps or flats to keep the pattern the same. That is why other keys have key signatures."],"use":"The pattern lets you build a major scale on any note. Musicians use it to work out key signatures and to transpose a song into a higher or lower key for a singer. Try it on a keyboard: start on G, follow T T S T T T S and you will find you need F sharp.","listen":["Every major scale sounds like 'doh re mi fa so la ti doh', whatever note it starts on.","The two semitone steps (mi to fa and ti to doh) sound smaller and closer than the others.","The step from ti up to doh sounds like it is pulling home."],"example":"The tune follows **the major pattern** up from G, and the F sharp keeps the semitone in the right place, so the scale still sounds bright and major.","fig":[{"file":"rm_s4_scale_g.png","caption":"G major scale: following T T S T T T S from G needs an F sharp, which the key signature gives you"}]},"Major>G major":{"what":["G major is the major scale starting on G: G A B C D E F sharp G. It has one sharp, F sharp, so its key signature is a single sharp on the top line of the treble staff (the F line).","The key signature means every F in the piece is played as F sharp, in every octave, unless a natural sign cancels it."],"use":"G major sits comfortably on guitar, violin and recorder, so lots of folk tunes and beginner pieces use it. Its chords are G, C and D (I, IV and V). When you read a piece in G, check the key signature first and remember to play every F as F sharp.","listen":["Listen for the tune settling on G at the end.","Notice the F sharp leading up to G, which pulls strongly towards home.","On guitar, listen for the G, C and D chords."],"example":"The piece is in **G major**, so the F sharp in the melody leads up to G at the end of each phrase and makes it sound finished."},"Major>D major":{"what":["D major is the major scale starting on D: D E F sharp G A B C sharp D. It has two sharps, F sharp and C sharp, written in that order in the key signature.","Every F and every C in the piece is played sharp unless a natural sign tells you otherwise."],"use":"D major is a bright, ringing key for string instruments because the open strings of the violin include D and A. Lots of fiddle tunes and orchestral pieces use it. Its primary chords are D, G and A (I, IV and V).","listen":["Listen for the music settling on D at the end.","Notice a bright, ringing sound in string music, where open strings vibrate along.","The C sharp leading up to D pulls strongly towards home."],"example":"The violin tune is in **D major**, and the C sharp at the end of each phrase leads up to D, which gives the melody a bright, ringing finish."},"Major>F major":{"what":["F major is the major scale starting on F: F G A B flat C D E F. It has one flat, B flat, written on the middle line of the treble staff (the B line).","Every B in the piece is played as B flat unless a natural sign cancels it. The B flat is needed to keep the semitone between the 3rd and 4th notes (A to B flat)."],"use":"F major suits brass and wind instruments and is common in band music and songs for singers. Its primary chords are F, B flat and C (I, IV and V). When you play in F, the only change from C major is the B flat.","listen":["Listen for the tune coming to rest on F.","Notice the B flat, which sounds softer than a B natural would.","Hear the C chord (V) pulling back to F (I) at the end."],"example":"The melody is in **F major**, and the C chord (V) at the end of the phrase resolves to F (I), so the music comes to a calm stop."},"Major>B flat major":{"what":["B flat major is the major scale starting on B flat: B flat C D E flat F G A B flat. It has two flats, B flat and E flat, written in that order in the key signature.","Every B and every E is played flat unless a natural sign tells you otherwise. Both the first and last notes of the scale are B flat."],"use":"B flat major is one of the most common keys for concert bands and jazz bands, because trumpets, clarinets and saxophones play comfortably in it. Its primary chords are B flat, E flat and F (I, IV and V). If you join a school band you will see this key signature a lot.","listen":["Listen for the music settling on B flat.","Band music in this key often has a warm, full brass sound.","Hear the F chord (V) leading back to B flat (I) at the ends of phrases."],"example":"The band piece is in **B flat major**, and the F chord (V) at the end of each phrase pulls back to B flat (I), which gives the music a strong, settled ending."},"Tonality>Minor":{"what":["Music in a minor key uses the notes of a minor scale. It usually sounds darker, sadder, more serious or more mysterious than major.","The biggest difference is the 3rd note. In minor it is one semitone lower than in major (C major uses E, C minor uses E flat). The natural minor scale follows the pattern T S T T S T T. Every major key has a 'relative minor' that shares its key signature: A minor shares C major's, and E minor shares G major's."],"use":"Composers use minor for sad, tense, spooky or dramatic moments, such as film scenes, laments and many rock and metal songs. A minor key can also sound gentle and thoughtful. To compose in minor, start and end on the minor tonic, for example A, and use the chord Am a lot.","listen":["Listen for a darker, heavier or sadder sound.","Sing the first three notes of the scale; in minor the 3rd sounds low and close to the 2nd.","Check whether the home chord at the end sounds dark rather than bright."],"example":"The opening is in a **minor** key, and the low, slow melody keeps falling back to the **tonic**, which makes the music sound sad and serious.","fig":[{"file":"rm_s4_major_minor_tune.png","caption":"Same tune, two tonalities: lowering E to E flat turns C major into C minor"}]},"Minor>A minor (natural minor)":{"what":["A minor (natural minor) uses the same notes as C major, but it starts and finishes on A: A B C D E F G A. Like C major it has no sharps or flats.","Because it shares C major's notes, A minor is called the relative minor of C major. What changes is the home note. When the music keeps resting on A and the A minor chord, it sounds minor. The step pattern from A is T S T T S T T."],"use":"A minor is the easiest minor key on keyboard and xylophone because it uses only white notes. Many folk tunes and pop songs use it. In real pieces composers often raise G to G sharp so the tune leads more strongly back to A; that version is called the harmonic minor.","listen":["Listen for a darker sound than C major, even though the notes are the same.","Notice the music coming to rest on A, not C.","Listen for a G sharp near the end of a phrase, a sign of the harmonic minor."],"example":"The tune uses the **A minor** scale and keeps landing on A, so even though there are no sharps or flats it sounds darker than C major."},"Tonality>Pentatonic":{"what":["A pentatonic scale has only five different notes ('penta' means five). The major pentatonic is the major scale with the 4th and 7th left out, so in C it is C D E G A.","Leaving out those two notes removes the semitone steps, so no two notes clash badly. The black keys on a piano make a pentatonic scale too."],"use":"Pentatonic scales turn up in folk music from many cultures, including China, Japan, Scotland and West Africa, and in blues, rock and pop melodies and guitar solos. Because nothing clashes, it is perfect for improvising: give everyone the notes C D E G A and any combination sounds good. Try making up a tune on the black keys only.","listen":["Listen for an open, simple sound with no tense half-step moves.","Notice small leaps in the melody where the missing notes would be (E up to G, A up to C).","In many folk styles the tune keeps circling the same five notes."],"example":"The flute melody uses a **pentatonic** scale with only five notes, so it moves in small leaps and sounds open and folk-like.","fig":[{"file":"rm_s4_pentatonic_tune.png","caption":"A made-up pentatonic tune: only C, D, E, G and A appear"}]},"Pentatonic>C major pentatonic":{"what":["The C major pentatonic scale uses five notes: C D E G A. It is the C major scale without F and B, the 4th and 7th notes.","Without F and B there are no semitone steps, so the notes sit a tone or a minor 3rd apart (E to G and A to C)."],"use":"Teachers often give C pentatonic on tuned percussion like xylophones by taking off the F and B bars, so students can improvise without wrong notes. Guitarists and singers use the same idea in blues, rock and pop solos. Compose a short tune using only these five notes and end on C.","listen":["Listen for the gaps where F and B would normally be.","The tune sounds happy and open, without the pull of the 7th note up to C.","Ostinatos and tunes built on these notes fit together without clashing."],"example":"The xylophone part improvises on the **C major pentatonic** scale, and because F and B are left out none of the notes clash with the ostinato underneath."},"Tonality>Modal":{"what":["Modal music is based on a mode, an older type of scale. You can find the main modes by playing only white notes and starting on a different note each time. Starting on D gives Dorian, and starting on G gives Mixolydian.","Each mode has the same seven letter names as C major but its own pattern of tones and semitones, so it sounds different. Dorian sounds like minor with a brighter 6th; Mixolydian sounds like major with a flatter 7th."],"use":"Modes were used in medieval church music and are common in folk music (especially Celtic folk), jazz, rock and film music. They give a piece a folk, ancient or slightly unusual flavour. To try it, write a tune using only white notes and make it start and end on D.","listen":["Listen for music that sounds almost major or almost minor, but not quite.","In Dorian, listen for a raised 6th note that brightens a minor-sounding tune.","In Mixolydian, listen for a lowered 7th, so the music does not pull as hard back to the tonic."],"example":"The fiddle tune is **modal**, built on D Dorian, so it sounds minor but the B natural gives it a brighter, folk-like colour.","fig":[{"file":"rm_s4_dorian_tune.png","caption":"A made-up tune in D Dorian: it sounds minor, but the B natural brightens it"}]},"Modal>D Dorian":{"what":["D Dorian is the mode you get by playing the white notes from D to D: D E F G A B C D. Its step pattern is T S T T T S T.","It sounds like D minor, but D minor (natural) has B flat, while D Dorian has B natural. That one raised note, the 6th, is what gives Dorian its sound."],"use":"Dorian is common in Celtic and English folk tunes, in jazz and in some rock and funk. It suits music that should sound minor but not too gloomy. To compose in Dorian, use the white notes, keep coming back to D and make a feature of the B natural.","listen":["Listen for a minor feel with one brighter-than-expected note.","Notice the 6th (B in D Dorian) sounding raised.","Listen for the tune resting on D even though there is no key signature."],"example":"The melody uses **D Dorian**, and the B natural near the top of the phrase brightens what would otherwise be a sad minor sound."},"Tonality>Chromatic scale":{"what":["The chromatic scale moves up or down by semitones, using every note: all the white and black keys in a row. In one octave there are 12 different notes before you reach the starting letter again.","Going up it is usually written with sharps (C, C sharp, D, D sharp...) and going down with flats (C, B, B flat, A, A flat...). It does not have a home note the way major and minor do."],"use":"Composers use chromatic runs and slides for tension, spookiness and excitement, and in film music they often signal danger or creeping suspense. A full chromatic scale is also a common warm-up for instrumentalists. When you compose, a few chromatic notes leading into a main note can make a tune sound smoother or more mysterious.","listen":["Listen for a slippery run where every note is very close to the last.","Notice a creeping or sliding effect, often in scary or tense music.","On keyboard, this sound comes from playing every key, black and white."],"example":"In the bridge a **chromatic scale** creeps up by semitones in the strings, which builds tension before the chorus returns."},"Pitch>Harmony and chords":{"what":["Harmony is what you hear when different pitches sound at the same time. The building block of harmony is the chord, usually a triad of three notes.","In any key, a few chords do most of the work. The primary chords (I, IV and V) are built on the 1st, 4th and 5th notes of the scale. Chords can be written as letter names above the music (chord symbols), as Roman numerals underneath or as chord diagrams for guitar and ukulele."],"use":"Chords support the melody and set the mood: major chords sound bright and minor chords sound darker. Pianists, guitarists and ukulele players usually play the chords while a singer or lead instrument has the tune. When you compose, choose a chord for each bar that shares notes with the melody.","listen":["Listen under the tune for the instruments playing several notes at once.","Notice when the chord changes, often at the start of a bar.","Decide whether each chord sounds major or minor and whether the last chord sounds finished."],"example":"The guitar strums a **chord progression** of I, IV and V under the vocal melody, and the **V7** chord at the end of the phrase pulls strongly back to the **tonic**.","fig":[{"file":"rm_s4_progression.png","caption":"A I, IV, V, I chord progression in C major, with chord symbols above and Roman numerals below"}]},"Harmony and chords>Chord":{"what":["A chord is three or more different notes played at the same time. Most chords are built by stacking every second note of a scale (C, E and G, for example).","Notes can be played together as a block chord or one after another as a broken chord (an arpeggio). Both are the same chord. Two notes together are usually called an interval rather than a chord, though guitarists call a root and 5th a 'power chord'."],"use":"Guitarists strum chords, pianists play them with the left hand and choirs make them by singing different notes at once. Broken chords are common in piano accompaniments. When you compose, try your chord as a block, then as a broken pattern, to hear which suits the song.","listen":["Listen for several notes starting together, especially in piano, guitar or organ parts.","Notice a broken chord when the notes of a chord are played one by one in a pattern.","Listen for the moment the chord changes under a held melody note."],"example":"In the verse the piano plays **broken chords** while the voice sings the tune, but in the chorus it switches to loud **block chords**, which makes the music sound fuller.","fig":[{"file":"rm_s4_block_broken.png","caption":"The C major chord as a block chord (all at once) and as a broken chord (one note at a time)"}]},"Harmony and chords>Triad":{"what":["A triad is a chord of three notes built in 3rds. Start on any note (the root), add the note a 3rd above it and then the note a 5th above the root. C major is C, E and G.","On the staff a triad in root position looks like a snowman: three notes all on lines or all in spaces, stacked one above the other. The root names the chord."],"use":"Triads are the basic chords in almost all Western music, from classical to pop. Keyboard players often learn the shape (skip a key, play, skip a key, play) so they can build any triad. To build one, choose a root, count up three letter names for the 3rd and five letter names for the 5th.","listen":["Listen for a full, stable sound from three notes at once.","Try singing the three notes one at a time: root, 3rd, 5th, like 'doh, mi, so'.","Decide whether the triad sounds bright (major) or darker (minor)."],"example":"The opening chord is a **C major triad** played by the brass, which sounds strong and bright and sets up the key straight away.","fig":[{"file":"rm_s4_triad_parts.png","caption":"Building a triad: start with the root, add the 3rd, then the 5th"}]},"Harmony and chords>Primary chords in C major":{"what":["The primary chords are the three most important chords in a key: I, IV and V. In C major they are C (I), F (IV) and G (V). Adding a 7th to chord V makes V7 (G7).","Roman numerals tell you which scale note the chord is built on, so I IV V works in any key. Chord symbols (C, F, G) tell you the actual chord names for this key."],"use":"Thousands of songs use only these three chords, and the 12-bar blues is built from I, IV and V. They also give you everything you need to harmonise a simple melody: every note of the C major scale belongs to at least one of them. Try playing C, F, G, C on keyboard or ukulele, one chord per bar.","listen":["Listen for the home chord (I) at the start and end.","Notice the move to IV, which sounds like stepping away.","Hear V or V7 at the end of a phrase, which sounds like it wants to go home to I."],"example":"The song uses the **primary chords** throughout, moving from **I** to **IV** in the verse and ending each chorus with **V7** resolving to **I**, so it sounds simple and complete."},"Harmony and chords>Major vs minor triad":{"what":["A major triad and a minor triad on the same root share two notes. Only the middle note, the 3rd, is different. C major is C E G; C minor is C E flat G.","In a major triad the 3rd is four semitones above the root (a major 3rd). In a minor triad it is three semitones (a minor 3rd). That one semitone changes the chord from bright to dark. Chord symbols show the difference with a small 'm': C means major, Cm means minor."],"use":"Composers switch between major and minor chords to change the mood, sometimes on the same root for a sudden shadow. Guitarists and ukulele players change chord shapes, and keyboard players move the middle finger down one key. Try playing C then Cm on a keyboard and describe the change in mood.","listen":["Listen for bright (major) versus dark or sad (minor) chords.","Play or sing the middle note on its own: it is the only note that moves.","Notice a sudden change of mood when a major chord becomes minor."],"example":"The chorus ends on a **major triad**, but in the next verse the same chord turns into a **minor triad**, so the mood suddenly darkens."},"Harmony and chords>Chord diagrams":{"what":["A chord diagram is a picture of the fretboard of a guitar or ukulele that shows where to put your fingers for a chord. The vertical lines are the strings and the horizontal lines are the frets; the thick line at the top is the nut.","A dot shows where a finger presses. O above a string means play it open (no finger) and X means do not play that string. On ukulele, C needs only one finger: the A string (the one nearest the floor) at the 3rd fret."],"use":"Chord diagrams appear in songbooks and above lyrics so guitarists and ukulele players can strum along without reading staff notation. Players learn a few common shapes (C, G, Am, F) and can then play hundreds of songs. Read the diagram as if the instrument is standing upright facing you.","listen":["Listen for the strummed chord pattern under the singer.","Count how often the chord changes, often once or twice a bar.","Notice whether the chord sounds major or minor; the diagram's chord name will tell you."],"example":"The ukulele player reads the **chord diagrams** above the lyrics and strums C and G in steady crotchets, which gives the song a light, bouncy accompaniment."},"Pitch>Pitch devices":{"what":["Pitch devices are ways of organising pitch that composers use over and over. This group covers the riff, the ostinato and the drone.","All three rely on repetition or holding a pitch. They give the music a base that other parts can move over, and they help the listener remember the piece."],"use":"A riff drives a rock or pop song, an ostinato holds a classical or world music piece together and a drone gives a steady background sound. When you compose, start with one of these as a foundation, then add a melody over it.","listen":["Listen for a short pattern that keeps repeating, usually in the bass or guitar.","Listen for one low note that never seems to stop.","Notice whether the repeating part stays the same while the parts above it change."],"example":"The piece is built on a repeating bass **ostinato** with a **drone** on D underneath, while the melody above changes each time it is repeated."},"Pitch devices>Riff":{"what":["A riff is a short, catchy musical pattern that repeats many times through a song. It is often only one or two bars long.","Riffs are usually played by the guitar, bass guitar or keyboard, sometimes by a horn section. 'Riff' is the word used in rock, pop, funk and jazz. A classical musician would call the same idea an ostinato."],"use":"A riff can be the most memorable part of a song, even more than the vocal tune. The guitar riff in Deep Purple's Smoke on the Water is a famous example. When you compose, write a two-bar pattern on the low strings of a guitar or bass using a few notes, add some syncopation and repeat it.","listen":["Listen for a short pattern you could hum after hearing it once or twice.","Notice which instrument plays it, often electric guitar or bass.","Check whether it comes back between the verses or keeps going under the singing."],"example":"The song opens with a syncopated bass guitar **riff** that repeats under the verse, which makes the song instantly recognisable and keeps it driving forward."},"Pitch devices>Ostinato":{"what":["An ostinato is a short pattern that repeats over and over while other music happens above or around it. 'Ostinato' comes from the Italian word for stubborn.","A melodic ostinato repeats pitches as well as rhythm. A rhythmic ostinato repeats only a rhythm, as on a drum. Ostinato is the general term, used in classical and world music; 'riff' is the pop and rock name for a similar idea."],"use":"Ostinatos hold a piece together and build tension. The bass line of Pachelbel's Canon is a famous melodic ostinato: the same eight notes repeat while the violins play above. In class, an ostinato is an easy part to add on xylophone or boomwhackers. Make one by choosing three or four notes from the scale and repeating them in a one-bar pattern.","listen":["Listen for a pattern that repeats exactly, many times in a row.","Notice whether it is pitched (a tune) or only a rhythm.","Hear the other parts changing while the ostinato stays the same."],"example":"The xylophones play a one-bar melodic **ostinato** under the whole piece, which keeps the music steady while the recorder melody changes above it."},"Pitch devices>Drone":{"what":["A drone is a long note, or two notes, held or repeated underneath the music for a long time, often for the whole piece. Usually the notes are the tonic and the 5th above it (D and A, for example).","The drone does not change while the melody moves above it, so some melody notes blend with it and others clash and then resolve."],"use":"Drones are a key sound in bagpipe music, where drone pipes sound under the chanter melody, and the didgeridoo (yidaki) is played with a continuous drone. Indian classical music uses a drone from the tanpura. When you compose, hold the tonic and 5th on a low instrument and improvise a tune above.","listen":["Listen for a low hum that never stops or changes pitch.","Notice the melody moving freely above that one sound.","Listen for moments where the melody clashes with the drone and then settles."],"example":"Under the melody the bagpipes hold a **drone** on the same low notes for the whole piece, which gives the music a steady, ancient-sounding background."},"Pitch>Ways of notating pitch":{"what":["There is more than one way to write pitch down. Staff notation shows exact pitches on five lines with a clef. Tablature (TAB) shows where to put your fingers on a guitar or bass. Graphic notation uses shapes and pictures.","Each method suits different players and different music. Staff notation shows the most detail, TAB is quick for guitarists and graphic notation suits experimental pieces and sound effects."],"use":"Pianists, orchestras and choirs read staff notation, rock guitarists and bassists often read TAB, and composers of experimental or film soundscapes may use graphic scores. When you compose, choose the notation that the performer can read and that fits your music.","listen":["As you listen, follow the score with your finger to connect sound and symbols.","Notice that higher sounds are written higher in staff notation and in graphic notation.","Compare how the same tune looks in staff notation and in TAB."],"example":"The guitarist reads the riff from **TAB**, while the singer reads the melody in **staff notation**, so each performer has the notation that suits their instrument."},"Ways of notating pitch>Staff notation":{"what":["Staff notation writes notes on a staff (or stave) of five lines and four spaces. The higher the note sits on the staff, the higher the pitch. A clef at the start tells you which notes the lines and spaces stand for.","The treble clef is used for higher instruments and voices (flute, violin, right hand of piano). The bass clef is used for lower ones (bass guitar, cello, left hand of piano). Staff notation also shows rhythm, so it gives the full picture of a tune."],"use":"Staff notation is the standard way music is written across the world, from orchestras to school bands and choirs. Guitar music sometimes uses a treble clef with a small 8 underneath, which means the notes sound an octave lower than written. Practise reading it a little each day: knowing the lines and spaces in both clefs makes everything easier.","listen":["Follow the notes up and down the staff while the music plays.","Check that when the line of notes rises, you hear the pitch rise.","Notice that long notes (minims, semibreves) look different from short ones (quavers)."],"example":"In **staff notation** the melody climbs from the bottom line of the treble staff to the top, and you can hear it rise in pitch as it builds to the climax.","fig":[{"file":"ref_grand_staff.png","caption":"Treble and bass staves joined as a grand staff: middle C sits between them"}]},"Ways of notating pitch>Tablature (TAB)":{"what":["Tablature (TAB) is a way of writing music for fretted string instruments like guitar, bass and ukulele. Each horizontal line is a string, with the highest-sounding string at the top. The numbers tell you which fret to press. A 0 means play the string open.","TAB tells you where to play, not the note name. Basic TAB often does not show rhythm, so you need to know how the song goes or read it with staff notation."],"use":"Guitarists and bassists use TAB because it is fast to read and shows exactly where to put each finger, and it is common in online song sites and guitar books. Guitar TAB has six lines and bass TAB has four. When you write a riff, check you can play it before writing the fret numbers in TAB.","listen":["Listen for which string a note is on: lower strings sound lower.","Notice open strings (0) ringing, often low and full.","Higher fret numbers on the same string give higher pitches."],"example":"The riff is written in **TAB** on the bottom two strings, using frets 0 and 3, which gives the guitar part a low, heavy sound."},"Ways of notating pitch>Graphic notation":{"what":["Graphic notation uses shapes, lines, colours and pictures instead of standard notes. Usually height shows pitch (higher on the page is higher in pitch), width shows how long a sound lasts and size shows how loud it is.","There are no fixed rules. Each graphic score comes with a key that explains what its symbols mean, and performers make some choices for themselves."],"use":"Graphic notation is used by 20th-century and contemporary composers for sounds that standard notation cannot show well, such as slides, clusters, electronic sounds and sound effects. It is great for class compositions using voices, found sounds or technology. When you make one, draw a time line across the page and create a key for your symbols.","listen":["Follow the shapes from left to right with your finger as the music plays.","Match rising lines to sliding pitches and big shapes to loud sounds.","Notice that performances of the same graphic score can sound different each time."],"example":"In the class **graphic score** a long rising line shows the voices sliding upward while growing dots show short sounds getting louder, so the performers know the shape of the music without reading notes."},"Elements of Music>Texture":{"what":["Texture is about the layers of sound in a piece and how they fit together. A layer is one musical line, like the vocal melody, the strummed chords or the drum part.","When you describe texture you talk about three things: how many layers there are (density), what job each layer does (its role) and how the layers relate to each other (the type of texture, such as monophonic, homophonic or polyphonic)."],"use":"Composers change the texture to shape a piece. A song might open with one instrument, add the band for the chorus, then drop back to a single voice at the end. When you compose or arrange, plan which layers play in each section so the music builds up and thins out on purpose.","listen":["Count the layers you can hear at one moment, then count again in the next section.","Pick out which layer has the tune and which layers are backing it up.","Notice when an instrument drops out or joins in, because that is where the texture changes."],"example":"In the chorus the **texture** becomes **thicker** as lead guitar joins the vocals, keyboard, bass and drums, and the **homophonic** backing makes the melody sound bigger than in the verse.","fig":[{"file":"ex_texture_graph.png"}]},"Texture>Density":{"what":["Density is how thick or thin the music sounds. It depends mostly on how many layers are playing at once, but also on how busy each layer is and how close together the notes sit.","A few layers give a thin texture. Lots of layers give a thick texture. Most music sits somewhere in between and moves up and down as the piece goes on."],"use":"Changing density is one of the easiest ways to create contrast. Pop songs often keep the verse fairly thin an
