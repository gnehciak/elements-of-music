 a 5th apart.","Notice a strong pull home to the same chord at each phrase end."],"example":"The accompaniment is **tonic-and-dominant based**, alternating I and V once per bar in the bass, which keeps the key clear and gives the dance a simple, cheerful feel.","fig":[{"file":"ex_chords_c.png","caption":"I and V in C major are C and G"}],"quote":[{"text":"Harmonic vocabulary is very tonic and dominant based","source":"Trial 2019"}]},"Harmony and chord quality>pedal point / drone":{"what":["A pedal point is a note held or repeated, usually in the bass, while the chords above it change, so some chords clash with it. It is most often the tonic or the dominant. An upper (inverted) pedal sits in a high part instead.","A drone is a continuous held note or fifth that sounds throughout, as on bagpipes or in a lot of folk and non-Western music."],"use":"Name the pitch of the pedal (tonic, dominant, E), the instrument and the register. A dominant pedal builds expectation before a cadence, a tonic pedal gives stability and a drone gives a static, folk-like or hypnotic quality.","listen":["Listen for one bass note that stays put while everything else moves.","Notice clashes building against the held note."],"example":"The double basses hold a **pedal point** on the dominant for eight bars while the harmony moves above, which builds tension until the return of the main theme.","fig":[{"file":"s5_pedal.png","caption":"The bass holds C while the chords above change"},{"file":"ex_drone.png","caption":"A drone on D and A under a moving melody"}],"quote":[{"text":"Low bass drone/pedal layer","source":"HSC 2019"},{"text":"Upper pedal point","source":"HSC 2016"}]},"Harmony and chord quality>major 7 / open 5ths":{"what":["A major 7th chord is a major triad with the major 7th added: Cmaj7 is C, E, G and B. It sounds warm and slightly bittersweet and is common in jazz, soul and film music.","An open 5th is just the root and the 5th, with no 3rd, so it is neither major nor minor. It sounds bare, hollow or powerful, as in rock power chords and medieval-style writing."],"use":"Name the chord and its effect. Major 7ths give a soft, dreamy or jazzy colour. Open 5ths sound stark, ancient or heroic, and because there is no 3rd they also leave the tonality ambiguous.","listen":["For a major 7th, listen for a soft rub between the 7th and the root.","For open 5ths, listen for a hollow chord that sounds neither happy nor sad."],"example":"The horns play **open 5ths** at the start, a bare and hollow sound, and the piano then adds **major 7** chords that warm the harmony.","quote":[{"text":"Features major 7 chords","source":"Trial 2021"},{"text":"combinations of open 5ths","source":"HSC 2020"}]},"Harmony and chord quality>quartal":{"what":["Quartal harmony uses chords built from stacked 4ths, such as D, G and C, instead of the stacked 3rds of a triad. Because there is no 3rd, the chord is neither major nor minor.","It sounds open and ambiguous and is associated with 20th century concert music and modern jazz."],"use":"Say that the harmony moves away from triads and link quartal chords to an open, modern or unsettled sound with a weak sense of key. It is a good partner for points about modality or tonal ambiguity.","listen":["Listen for chords that sound open and spacious but not clearly major or minor.","Notice parallel movement of the same chord shape up and down."],"example":"The piano accompaniment uses **quartal** chords moving in parallel, which avoids a clear major or minor sound and gives the section a modern, floating quality.","quote":[{"text":"Use of quartal harmonies","source":"HSC 2018"}]},"Harmony and chord quality>broken chords / arpeggiated":{"what":["A broken chord plays the notes of a chord separately instead of all at once. An arpeggio is a broken chord played in order up or down, like a harp spreading a chord. Patterns such as the Alberti bass (low, high, middle, high) are broken chords too."],"use":"Name the instrument, the chord and the pattern, then the effect. Broken chords keep the music moving, fill out the harmony with fewer players and create a flowing, rippling texture under a melody.","listen":["Listen for a fast repeating pattern that spells out the chord notes.","Notice harp, guitar or piano accompaniments that ripple rather than strike."],"example":"The harp's **arpeggiated** semiquavers spell out each chord, and their rippling motion keeps the harmony moving under the long notes of the solo voice.","fig":[{"file":"rm_s4_block_broken.png","caption":"The C major chord as a block chord and as a broken chord"}],"quote":[{"text":"flowing arpeggio accompaniment","source":"HSC 2020"},{"text":"broken chord arpeggio-style runs","source":"HSC 2025"}]},"Harmony and chord quality>suspended / suspension":{"what":["A suspension has three stages. A note is prepared as part of one chord, held (suspended) while the harmony changes under it so that it clashes, then resolved by step, usually downward, to a note of the new chord. The common types are 4-3, 7-6 and 9-8.","A suspended chord (sus4 or sus2) replaces the 3rd with the 4th or 2nd, and in pop it may not resolve at all."],"use":"Show you understand the delay: say which instrument holds the note, that it creates tension against the new chord and when it resolves. Suspensions are typical of Baroque and choral writing and of expressive slow movements.","listen":["Listen for one note that stays still while the chord changes beneath it.","Then listen for that note slipping down a step to fit the chord."],"example":"A chain of **suspensions** in the upper strings delays each resolution by a beat, which builds an aching tension through the slow introduction.","quote":[{"text":"The use of suspension... establishes tension","source":"HSC 2021"},{"text":"triple suspensions","source":"Trial 2019"}]},"Harmony and chord quality>unresolved":{"what":["Unresolved harmony leaves a dissonance or a tension chord without moving to the stable chord the ear expects. A phrase that ends on V, a final chord with a clash or a suspension that never falls are all unresolved."],"use":"Point to the moment the resolution is withheld and say what it does: it leaves the listener waiting, sustains tension, sets up the next section or gives an ending that sounds open or uneasy.","listen":["Listen at the ends of phrases for a chord that sounds incomplete.","Notice when the music stops or changes section before the clash settles."],"example":"The section ends on an **unresolved** dominant 7th chord that is cut off by a bar of silence, so the expected tonic is withheld and the listener is left waiting for the return of the main theme.","fig":[{"file":"rm_s5_cad_imperfect.png","caption":"Ending on V leaves the phrase unresolved"}],"quote":[{"text":"imperfect cadence... unresolved","source":"HSC 2016"},{"text":"an unsettled, unresolved harmony","source":"HSC 2021"}]},"Harmony and chord quality>resolved / resolution":{"what":["Resolution is when a dissonant note or chord moves to a consonant one, releasing tension. A suspension resolves by step, a dominant chord resolves to the tonic and a leading note resolves up a semitone to the tonic."],"use":"Describe both the tension and the release: what clashes, how it moves and where it lands. Link resolution to relief, closure or arrival, often at a cadence or the end of a section.","listen":["Listen for a crunchy chord that relaxes into a smooth one.","Track the top note of a clash as it steps down into place."],"example":"The dissonant chord in the brass finally **resolves** to the tonic major at the cadence, and the release of tension marks the end of the development.","fig":[{"file":"rm_s5_cad_perfect.png","caption":"The leading note B resolves up to C in a perfect cadence"}],"quote":[{"text":"suspension and resolution in the harmony","source":"HSC 2021"}]},"Harmony and chord quality>triadic":{"what":["A triad is a three-note chord made of a root, a 3rd and a 5th, such as C, E and G. Triadic harmony uses these chords. A triadic melody is built mostly from the notes of a triad, so it leaps between chord notes like a bugle call."],"use":"Use 'triadic' for traditional chord-based harmony or for a melody that outlines a chord. Link it to clarity, stability and a strong key, and contrast it with quartal or cluster harmony when the style changes.","listen":["Listen for a melody that leaps between the notes of one chord.","Notice whether the harmony sounds like clear major and minor chords."],"example":"The trumpet fanfare is **triadic**, outlining the tonic chord in rising leaps, which gives the opening a bold, ceremonial character.","fig":[{"file":"triad_c.png","caption":"C major triad: C, E and G"}],"quote":[{"text":"the melody... is triadic","source":"Trial 2023"},{"text":"triadic harmony","source":"Trial 2021"}]},"Harmony and chord quality>root position / inverted":{"what":["A chord is in root position when its root is the lowest note: C, E, G in C major. In first inversion the 3rd is in the bass (E, G, C) and in second inversion the 5th is in the bass (G, C, E).","Chord symbols show inversions with a slash: C/E is a C chord over E."],"use":"Root position chords sound solid and stable, so they suit strong, plain or final moments. Inverted chords sound lighter and less final and let the bass move smoothly by step. Name the inversion and link it to the bass line or to stability.","listen":["Listen to the bass: if it is not the chord's root, the chord is inverted.","Notice a bass line moving by step under repeated chords, which usually means inversions."],"example":"The hymn-like opening uses only **root position** chords, which sounds solid and plain, but in the second phrase **inverted** chords let the bass line descend by step.","quote":[{"text":"all root position chords","source":"HSC 2017"},{"text":"A Major in first inversion","source":"HSC 2023"}]},"Harmony and chord quality>block chords":{"what":["Block chords are chords whose notes are all played together, instead of being spread out as broken chords. They can be short and punchy or long and sustained, played by one instrument or shared across a section."],"use":"Say which instruments play the block chords, their rhythm and their dynamic, then link them to the effect: weight, power, punctuation or a firm homophonic texture. Pair the point with chord quality, for example dissonant block chords.","listen":["Listen for several notes struck at exactly the same time.","Notice whether the chords are repeated in a rhythm or held."],"example":"Piano and strings punctuate the melody with short, accented **block chords** on the off-beats, which adds weight and rhythmic drive to the chorus.","fig":[{"file":"rm_s4_block_broken.png","caption":"A block chord (all at once) and a broken chord (one note at a time)"}],"quote":[{"text":"Block chords in trumpets... creating dissonance","source":"HSC 2020"}]},"Harmony and chord quality>diminished / augmented":{"what":["A diminished triad has a minor 3rd and a diminished 5th: C, E flat, G flat. An augmented triad has a major 3rd and an augmented 5th: C, E, G sharp. Both are dissonant compared with major and minor triads.","A diminished 7th chord stacks minor 3rds and an augmented triad stacks major 3rds. Because they are symmetrical they can belong to several keys, which makes them sound unstable."],"use":"Use these words for moments of strong tension, mystery or suspense. Diminished chords sound dark and anxious; augmented chords sound strange, stretched or dreamlike. Say who plays the chord and how it moves or resolves.","listen":["For a diminished chord listen for a tight, tense, dark sound.","For an augmented chord listen for an eerie, stretched sound with no clear home."],"example":"A **diminished** 7th chord in the tremolo strings marks the climax, and its tense, unstable sound heightens the drama before the music resolves to the tonic.","quote":[{"text":"a descending D# diminished chord outline","source":"HSC 2021"},{"text":"parallel augmented triads","source":"Trial 2025"}]},"Pitch>Melodic motion and contour":{"what":["Melodic motion is how a line moves from note to note: by step (conjunct), by leap (disjunct) or by staying still. Contour is the overall shape that motion makes, such as rising, falling or arc-shaped.","These words also describe the character of a line, from smooth and static to angular, florid or virtuosic."],"use":"Describe the motion and the contour together, then name the instrument and where it happens. Link smooth stepwise lines to calm or lyrical moods and angular leaps or virtuosic runs to tension, energy or display.","listen":["Hum the melody and notice whether your voice steps or jumps.","Trace the overall shape of a phrase with your hand."],"example":"The flute melody is mostly **stepwise** with an **arc-shaped** contour, while the clarinet answers with **angular** leaps that unsettle the mood."},"Melodic motion and contour>angular":{"what":["An angular melody moves in wide, uneven leaps and sudden changes of direction, often using awkward intervals such as 7ths, 9ths and the tritone. It looks jagged on the page and sounds unpredictable, the opposite of a smooth, stepwise tune."],"use":"Name the instrument and the kind of leaps, then link the angular line to tension, restlessness, unease or a modern style. It pairs well with comments on dissonance, wide range and irregular rhythm.","listen":["Listen for a line that jumps a long way and then changes direction.","Notice that the melody is hard to sing back."],"example":"The clarinet line is **angular**, leaping a 7th and then a 9th with constant changes of direction, which gives the passage a restless, unpredictable character.","quote":[{"text":"the complex rhythms and angular pitch material","source":"HSC 2024"}]},"Melodic motion and contour>leap / disjunct":{"what":["A leap is a move from one note to another that is more than a step: a 3rd or larger, with a 3rd sometimes called a skip. A disjunct melody moves mostly by leaps. Large leaps such as an octave stand out and draw attention."],"use":"Give the size of important leaps (an octave leap, a rising 6th) and say what they do: create drama, energy, excitement or emotional reach. Contrast disjunct passages with conjunct ones to show change.","listen":["Listen for jumps that make the melody suddenly change height.","Pick out the biggest leap in a phrase and estimate its size."],"example":"In the chorus the vocal line becomes **disjunct** and opens with an octave **leap**, which lifts the emotional intensity above the stepwise verse.","fig":[{"file":"mel_leaps.png","caption":"A melody moving by leaps"},{"file":"rm_s6_pitch_conjunct_angular.png","caption":"A stepwise phrase and an angular phrase"}],"quote":[{"text":"stepwise movement and small leaps... and larger leaps","source":"HSC 2021"}]},"Melodic motion and contour>sequential / sequence":{"what":["A sequence is a short melodic or harmonic pattern repeated immediately at a different pitch, usually a step higher or lower each time. Sequential writing is built from these repetitions.","In a real sequence the intervals are copied exactly; in a tonal sequence they are adjusted to stay in the key."],"use":"Say what the pattern is, which instrument plays it and which direction it moves. Rising sequences build tension and intensity; falling sequences can relax the music or lead it back to a cadence or a new key.","listen":["Listen for the same short shape repeated straight away on a new pitch.","Track whether each repeat moves up or down."],"example":"The violins develop the motif as a **sequence** rising by step, and each repeat raises the tension towards the climax.","fig":[{"file":"s5_sequence.png","caption":"The same four-note shape repeated one step higher each time"}],"quote":[{"text":"Use of sequence descending stepwise","source":"HSC 2020"},{"text":"developed into a sequential pattern","source":"Trial 2021"}]},"Melodic motion and contour>static":{"what":["A static melody or part stays on one note or moves within a very small range, with little sense of direction. Static harmony stays on one chord for a long time."],"use":"Use 'static' to contrast an unmoving part with an active one. Link it to stillness, suspense, a hypnotic or meditative feel, or to a part that supports while another line moves.","listen":["Listen for a repeated note or a line that hovers around two or three notes.","Notice a chord that stays the same for many bars."],"example":"The accompanying strings are **static**, holding a single chord for eight bars, while the oboe melody moves freely above them.","quote":[{"text":"the piano features a static melody","source":"HSC 2019"},{"text":"the more static movement of the accompanying orchestra","source":"HSC 2025"}]},"Melodic motion and contour>contrary / similar / parallel motion":{"what":["These words compare two lines. In contrary motion they move in opposite directions. In similar motion they move in the same direction by different intervals. In parallel motion they move in the same direction keeping the same interval, such as parallel 3rds or parallel 5ths."],"use":"Name the two parts and the type of motion. Contrary motion makes lines sound independent and can expand the range outwards; parallel 3rds and 6ths sound sweet and blended; parallel 5ths and octaves sound bare and powerful.","listen":["Follow the top and bottom parts together and check their directions.","Listen for two lines that move like one and keep the same gap."],"example":"The flutes and clarinets move in **parallel** 3rds, a sweet, blended sound, while the bass moves in **contrary motion** beneath them.","fig":[{"file":"rm_s5_motion_types.png","caption":"Contrary, similar, parallel and oblique motion"}],"quote":[{"text":"Contrary motion used between lower and upper strings","source":"HSC 2020"},{"text":"Similar motion melodic movement","source":"HSC 2021"},{"text":"a parallel third harmony","source":"Trial 2007"}]},"Melodic motion and contour>arc-shaped":{"what":["An arc-shaped phrase rises to a high point, usually near the middle, then falls back towards where it started. Many lyrical melodies and folk songs use this shape because it feels balanced."],"use":"Describe where the high point falls and what supports it, such as a crescendo or a long note. Link the arc to balance, a sense of tension and release within the phrase or an expressive climax.","listen":["Trace the phrase with your hand: up to a peak, then down.","Notice where the highest note lands."],"example":"The opening violin phrase is **arc-shaped**, rising to its highest note on a held minim and falling back to the tonic, which gives the theme a balanced, lyrical quality.","fig":[{"file":"mel_arch.png","caption":"Arch (arc) contour: up, then down"}],"quote":[{"text":"The first phrase is arc shaped","source":"Trial 2008"}]},"Melodic motion and contour>ascending / descending":{"what":["Ascending means a line moves upward in pitch; descending means it moves downward. You can describe a scale, an arpeggio, a bass line or a whole passage this way."],"use":"Be specific: what ascends or descends (scale, chord outline, bass line), by step or by leap, and over what range. Ascending lines often build energy or hope; descending lines often suggest sadness, relaxation or closure.","listen":["Listen for the overall direction of a run or phrase.","Follow the bass line separately from the melody."],"example":"The bass line **descends** stepwise through an octave while the melody holds a high note, which gives the passage a sense of weight and lament.","fig":[{"file":"mel_ascending.png","caption":"Ascending contour"},{"file":"mel_descending.png","caption":"Descending contour"}],"quote":[{"text":"an ascending tonic chord outline","source":"HSC 2021"},{"text":"a descending melodic minor scale","source":"HSC 2021"}]},"Melodic motion and contour>contour":{"what":["Contour is the shape a melody traces as it moves up and down: ascending, descending, arc-shaped, wave-like or static. It describes the overall outline rather than each interval."],"use":"Describe the contour of key phrases and link it to the mood or structure, for example a rising contour building to a climax. Compare contours between sections or instruments to show contrast or development.","listen":["Draw the melody in the air as it plays.","Compare the shape of the first phrase with the next one."],"example":"The melody's **contour** changes from a narrow, wave-like shape in the verse to wide rising leaps in the chorus, which lifts the energy.","fig":[{"file":"mel_wave.png","caption":"A wave-like contour"},{"file":"mel_arch.png","caption":"An arch contour"}],"quote":[{"text":"The pitch contour... contrasts widely","source":"HSC 2025"},{"text":"changing contours, registers and dynamic levels","source":"Trial 2023"}]},"Melodic motion and contour>florid":{"what":["A florid line is heavily decorated, with fast runs, turns, trills and other ornaments filling the spaces between the main notes. It is typical of Baroque and Classical solo writing, opera and some jazz improvisation."],"use":"Name the instrument and say what makes the line florid (rapid runs, ornaments). Link it to display, brilliance, energy or expressive decoration, and contrast it with a plainer part underneath.","listen":["Listen for many quick notes decorating a simple outline.","Notice trills and turns on longer notes."],"example":"The soprano's **florid** line decorates each held note with quick runs and trills, which shows off her agility against the simple string accompaniment.","quote":[{"text":"bassoon florid passage","source":"HSC 2025"}]},"Melodic motion and contour>smooth":{"what":["A smooth melody moves mostly by step or small intervals, often legato, without sudden jumps or harsh accents. 'Smooth contour' means the shape rises and falls gradually, with no sudden turns. Smooth is a description of the effect, so back it up with the technical reason."],"use":"Link smooth lines to calm, lyrical, flowing or gentle moods. Support the point with evidence such as stepwise motion, legato phrasing or a sustained instrument like the cello or voice.","listen":["Listen for a line you could easily sing.","Notice the absence of large leaps and sharp accents."],"example":"The cello melody has a **smooth** contour, moving mostly by step under a legato slur, which creates a calm and reflective mood.","fig":[{"file":"mel_steps.png","caption":"Moving by step gives a smooth line"}],"quote":[{"text":"Melodies explore a wide range with smooth contour","source":"HSC 2020"}]},"Melodic motion and contour>virtuosic":{"what":["Virtuosic writing demands great technical skill: very fast notes, wide leaps, extreme registers and difficult techniques. It is written to show off the performer, especially in concertos, cadenzas and solos."],"use":"Name the instrument and the specific difficulties (rapid triplets, leaps across the range, high register). Link it to excitement, display and the soloist standing out from the accompaniment.","listen":["Listen for passages that sound fast and hard to play.","Notice solo moments where the accompaniment drops away."],"example":"The solo violin has a **virtuosic** passage of rapid semiquaver runs across its whole range, which makes the soloist stand out and builds excitement.","quote":[{"text":"the virtuosic triplet figure bassoon writing","source":"HSC 2025"}]},"Melodic motion and contour>stepwise / conjunct":{"what":["Stepwise or conjunct motion means the melody moves mainly to the next note up or down, by tone or semitone. Small skips of a 3rd may appear, but the line stays connected."],"use":"Use it with the instrument and range. Conjunct lines sound smooth, singable and calm. Contrast them with disjunct or angular passages, and note that a stepwise line can still cover a wide range.","listen":["Listen for a melody that moves to neighbouring notes.","Hum it: if it is easy to sing back, it is probably conjunct."],"example":"The oboe melody is **stepwise** and moves over a narrow range, which gives the opening a gentle, folk-like simplicity.","fig":[{"file":"mel_steps.png","caption":"A melody moving by step"},{"file":"rm_s6_pitch_conjunct_angular.png","caption":"A conjunct phrase and an angular phrase"}],"quote":[{"text":"a stepwise melody over a wide range","source":"HSC 2019"},{"text":"mostly conjunct, moving in small steps/skips","source":"HSC 2024"}]},"Pitch>Range and register":{"what":["Range is the distance between the lowest and highest notes of a part or melody. Register is which part of an instrument's or voice's range the music is using: low, middle or high.","Tessitura is where most of a part's notes sit, which is not the same as its full range."],"use":"Always attach range and register to an instrument, because 'high' on a tuba is low on a flute. Explain the effect: low registers sound dark or heavy, high registers bright or strained, and extreme registers create tension or contrast.","listen":["Listen for the highest and lowest notes of the main melody.","Notice when an instrument moves into an unusual part of its range."],"example":"The cello begins in a **low register** with a **narrow range**, then climbs into its **high register**, which raises the intensity before the climax."},"Range and register>high register":{"what":["The high register is the upper part of an instrument's or voice's range. Each instrument sounds different there: high flute is bright and piercing, high cello is intense and strained, a high trumpet is brilliant."],"use":"Name the instrument and link the register to its tone colour and the mood: brightness, tension, excitement, fragility. A move into the high register often marks a climax.","listen":["Listen for when a part climbs above its normal range.","Notice changes in tone as the instrument goes higher."],"example":"At the climax the cello climbs into its **high register**, where its tone becomes thin and strained, which makes the phrase sound urgent and exposed.","fig":[{"file":"s5_register.png","caption":"The same figure in a low register and a high register"}],"quote":[{"text":"at a higher register","source":"HSC 2020"},{"text":"high register (Soprano 1)","source":"HSC 2024"}]},"Range and register>register extremes":{"what":["Register extremes are the very top and bottom of an instrument's or voice's range. Composers use them for special colour or effect, such as the piano's lowest rumbling notes or a piccolo's piercing top notes."],"use":"Say which instrument goes to which extreme and the effect: tension, darkness, brilliance, contrast. Extremes heard at the same time leave a wide gap in the middle and can sound empty or dramatic.","listen":["Listen for unusually low or high notes.","Notice a big gap between the highest and lowest parts."],"example":"The orchestration moves to **register extremes**, with piccolo at the top of its range and contrabassoon at the bottom, and the empty space between them makes the passage sound stark and exposed.","fig":[{"file":"s5_ranges.png","caption":"Approximate ranges of common instruments and voices"}],"quote":[{"text":"the exploration of register","source":"HSC 2017"},{"text":"Extreme registers on piano are explored","source":"HSC 2024"}]},"Range and register>narrow / limited range":{"what":["A narrow or limited range means the melody uses only a small span of notes, such as a 3rd to a 5th. This keeps the line close together and often repetitive."],"use":"Use it to describe chant-like, folk-like or speech-like melodies, or to show how a melody later expands. Link it to restraint, simplicity, intimacy or growing tension. Name the span if you can (within a 5th) and the instrument, and compare it with the range of the next section.","listen":["Listen for a melody that circles a few notes.","Notice when the range suddenly opens up later."],"example":"The vocal line in the verse has a **narrow range** of a 4th, which sounds restrained and speech-like before the chorus expands upward.","quote":[{"text":"Narrow range of pitch, and the register","source":"HSC 2019"},{"text":"Relatively narrow range of melody","source":"HSC 2024"}]},"Range and register>low register":{"what":["The low register is the lower part of an instrument's or voice's range. Low flute is breathy and soft, low clarinet is dark and hollow and low brass is heavy and rich."],"use":"Name the instrument and link the register to its colour and the mood: dark, warm, heavy, ominous. Low registers also add weight to the texture and anchor the harmony.","listen":["Listen for a dark, heavy colour.","Notice which instrument is providing the lowest notes."],"example":"The clarinet enters in its **low register**, where its dark, hollow tone suits the slow tempo and soft dynamic and sets a sombre mood.","fig":[{"file":"s5_register.png","caption":"The same figure in a low register and a high register"}],"quote":[{"text":"in a low register which creates a sense of foreboding","source":"HSC 2023"}]},"Range and register>wide range":{"what":["A wide range means the part covers a large span from its lowest to highest notes, often an octave and a half or more. Instruments like the piano can spread across many octaves at once."],"use":"Give an estimate of the span (over two octaves, four or five octaves) and say which instrument or voice covers it. Link a wide range to drama, expressiveness, virtuosity or a full, spacious sound, and note any contrast with a narrow-range section.","listen":["Listen for the highest and lowest notes and estimate the gap.","Notice whether the melody climbs gradually or leaps to extremes."],"example":"The violin melody covers a **wide range** of over two octaves, moving from its warm low string to a soaring high note, which adds to its expressive intensity.","fig":[{"file":"s5_ranges.png","caption":"Approximate ranges of common instruments and voices"}],"quote":[{"text":"a wider pitch range","source":"HSC 2016"},{"text":"piano spanning 4-5 octaves","source":"Trial 2021"}]},"Range and register>tessitura":{"what":["Tessitura is the part of a range where most of the notes of a part lie, rather than the highest or lowest notes. A soprano part with a high tessitura stays up high most of the time, even if it has a few low notes."],"use":"Use 'tessitura' to describe where a voice or instrument mostly sits and how comfortable it sounds. A high tessitura sounds bright or strained, a low one dark or relaxed. Compare tessituras between performing media.","listen":["Listen for where a part spends most of its time.","Notice whether the part sounds comfortable or strained."],"example":"The tenor line sits in a high **tessitura** throughout the chorus, which gives the voice an urgent, strained edge.","fig":[{"file":"ex_voice_ranges.png","caption":"Approximate ranges of the four voice types"}],"quote":[{"text":"contrasts in the register/tessitura of performing media","source":"HSC 2021"}]},"Pitch>Scale / mode type":{"what":["A scale or mode is the collection of notes a passage uses, set out in order. Major and minor scales are the most common, but HSC excerpts often use modes (Dorian, Mixolydian and others), pentatonic, whole-tone or chromatic scales.","Each scale has its own pattern of tones and semitones, which gives it its colour."],"use":"Name the scale and if you can the starting note (E Dorian, C pentatonic). Link it to the mood or style: pentatonic sounds folk-like or open, whole-tone dreamy and unsettled, chromatic tense and modes slightly ancient or folk-like.","listen":["Listen for a 'wrong' note compared with major or minor, such as a flat 7th or a raised 6th.","Notice scales with no semitones (pentatonic, whole-tone) as they sound floating and open."],"example":"The melody is built on a **pentatonic** scale, while the bass runs use a **chromatic scale**, which contrasts the open, folk-like tune with tense movement underneath."},"Scale / mode type>chromatic scale":{"what":["A chromatic scale moves by semitones through all 12 notes of the octave: every white and black key on the piano in order. Going up it is usually written with sharps and coming down with flats."],"use":"Name the instrument and direction. Chromatic scales create tension, slide between key notes or add colour. They are common in runs, horror and suspense music and in Romantic writing.","listen":["Listen for a run where every step is the smallest possible.","Notice the sliding or slithering effect."],"example":"A rapid **chromatic scale** in the flute sweeps up two octaves into the climax, and its semitone steps sharpen the tension before the full orchestra enters.","fig":[{"file":"scale_chromatic.png","caption":"Chromatic scale: all 12 notes"}],"quote":[{"text":"ascending and descending chromatic scale","source":"Trial 2025"}]},"Scale / mode type>scalic / scale-based":{"what":["A scalic melody or figure moves along the notes of a scale, usually stepwise. Scale-based material might be a full scale run or just a fragment, such as four notes going up."],"use":"Name the scale if you can, the instrument and the direction. Scalic runs give momentum, energy or flow and are often used to lead into a new section or decorate a cadence.","listen":["Listen for runs of notes in step order.","Notice fast scale figures that link phrases."],"example":"Rising **scalic** runs in the oboe link each phrase to the next, and their stepwise momentum carries the music into the reprise.","fig":[{"file":"scale_cmaj.png","caption":"C major scale: eight notes moving by step"}],"quote":[{"text":"A repeated scalic clarinet motif","source":"HSC 2016"},{"text":"scale-based melodies","source":"HSC 2019"}]},"Scale / mode type>whole-tone":{"what":["A whole-tone scale moves only by whole tones, so it has six notes in the octave (on C: C, D, E, F sharp, G sharp, A sharp). With no semitones and no perfect 5ths it has no strong home note, so it sounds floating and dreamlike.","There are only two different whole-tone scales."],"use":"Link whole-tone writing to an unsettled, dreamy, mysterious or blurred sound, with a weak tonal centre. It is associated with Impressionist music and with dream sequences in film and television.","listen":["Listen for runs that sound slippery and avoid any clear key.","Notice that the melody never seems to land."],"example":"The harp plays **whole-tone** runs, and the lack of a clear tonal centre gives the passage a hazy, dreamlike quality.","fig":[{"file":"s5_scale_wholetone.png","caption":"Whole-tone scale on C"}],"quote":[{"text":"subito whole-tone trills","source":"HSC 2018"},{"text":"a descending whole tone semiquaver passage","source":"Trial 2024"}]},"Scale / mode type>mixolydian / dorian / aeolian / phrygian":{"what":["Modes are scales with their own pattern of tones and semitones. On white notes, Dorian runs D to D (minor with a raised 6th), Phrygian E to E (minor with a flat 2nd), Mixolydian G to G (major with a flat 7th) and Aeolian A to A (the natural minor).","Each can start on any note: E Dorian has the same notes as D major."],"use":"Name the mode and its starting note, and point to the note that gives it away, such as the flat 7th in Mixolydian. Link it to the mood: Dorian sounds folky or wistful, Phrygian dark and Spanish-flavoured, Mixolydian bright but bluesy.","listen":["Compare the melody with major or minor and find the odd note.","Listen for a flat 2nd falling to the home note in Phrygian."],"example":"The guitar riff is in **mixolydian**, with a flattened 7th that gives an earthy, rock feel instead of a plain major sound.","quote":[{"text":"C mixolydian scale","source":"HSC 2022"},{"text":"an E Dorian mode","source":"HSC 2019"},{"text":"F# Aeolian mode","source":"HSC 2019"},{"text":"a sense of Phrygian mode","source":"Trial 2024"}]},"Scale / mode type>pentatonic":{"what":["A pentatonic scale has five notes. The major pentatonic uses notes 1, 2, 3, 5 and 6 of the major scale (C, D, E, G, A); the minor pentatonic is the same set starting on A. With no semitones it has no strong clashes."],"use":"Link pentatonic melody to folk, blues, rock and traditional music from many cultures, and to an open, simple or bright sound. Say which instrument plays it and point to the missing notes if you can.","listen":["Listen for a melody that sounds open and never clashes.","Notice the absence of the 4th and 7th notes of the scale."],"example":"The flute melody is **pentatonic**, avoiding the 4th and 7th of the scale, so there are no semitone clashes and the tune sounds open and folk-like over the drone.","fig":[{"file":"scale_cpent.png","caption":"C major pentatonic: C, D, E, G and A"}],"quote":[{"text":"based on pentatonic scale","source":"Trial 2024"}]},"Scale / mode type>harmonic minor":{"what":["The harmonic minor scale is the natural minor with the 7th note raised by a semitone. In A minor that makes G sharp, the leading note. The gap between the 6th and 7th notes (F to G sharp) is an augmented 2nd, which gives it a distinctive, exotic sound."],"use":"Mention the raised 7th and the augmented 2nd. The raised 7th gives a strong pull to the tonic and makes the V chord major; the augmented 2nd can sound dramatic or Middle Eastern in flavour.","listen":["Listen for the stretched step between the 6th and 7th notes.","Notice a strong leading note rising to the tonic."],"example":"The melody uses the **harmonic minor**, and its augmented 2nd between the 6th and 7th notes gives the line a dramatic, exotic flavour.","fig":[{"file":"s5_scale_harm_minor.png","caption":"A harmonic minor: the raised 7th is G sharp"}],"quote":[{"text":"the tonic minor (harmonic)","source":"Trial 2007"}]},"Pitch>Tonality":{"what":["Tonality is the system of pitch that organises the music around a home note, or tonal centre. Music can be major, minor, modal, chromatic or atonal, and it can change key (modulate), use two keys at once (bitonal) or leave the key unclear (tonal ambiguity).","Identifying the tonality is often the first pitch point in a strong answer."],"use":"State the tonality near the start of your pitch paragraph and support it with evidence, such as the final chord, a Picardy 3rd or a modulation. Explain how the tonality shapes the mood and whether it stays stable or shifts.","listen":["Listen to the last chord of a phrase: it usually confirms the key.","Notice if the home note seems to move or becomes hard to find."],"example":"The excerpt begins in a **minor** tonality, **modulates** to the relative major in the middle section and ends with a **Picardy 3rd**, which brightens the close."},"Tonality>chromaticism":{"what":["Chromaticism is the use of notes outside the key, shown by extra sharps, flats and naturals. It can colour a melody, enrich the harmony or weaken the sense of key altogether."],"use":"Say how much chromaticism there is and where: in the melody, bass line or harmony. Link it to tension, mystery, emotional intensity or instability, and pair it with dissonance when the two go together.","listen":["Listen for unexpected notes that slide by semitone.","Notice chords that seem outside the key."],"example":"Heavy **chromaticism** in the inner string parts blurs the sense of key, and the constant semitone movement makes the atmosphere eerie and unsettled.","fig":[{"file":"s5_chromaticism.png","caption":"Chromaticism: a melody using notes outside C major"}],"quote":[{"text":"Use of dissonance and chromaticism","source":"HSC 2017"}]},"Tonality>bitonal / polytonal":{"what":["Bitonality is two keys heard at the same time, for example one instrument in C major and another in E flat major. Polytonality is more than two. Each layer may sound clear on its own, but together they clash.","Stravinsky's 'Petrushka chord' combines C major and F sharp major triads."],"use":"Say which parts are in which key and link it to clashing, tension, conflict, humour or a modern sound. It works well with a texture point, since the keys usually sit in separate layers.","listen":["Listen for two layers that each sound in tune but clash together.","Try singing the home note of each layer."],"example":"The melody stays in C major while the accompaniment moves in E flat major, a **bitonal** clash that gives the passage a strange, unstable edge.","quote":[{"text":"creates bitonality","source":"Trial 2024"},{"text":"modulates to... a polytonal key","source":"Trial 2007"}]},"Tonality>modal / modality":{"what":["Modal music is based on a mode, such as Dorian or Mixolydian, instead of the major or minor scales. Modality refers to this way of organising pitch, which often avoids the strong V to I pull of major and minor keys."],"use":"Name the mode if you can and link modality to folk, medieval, film, jazz or rock styles. Explain how it differs from major or minor and how this affects the mood, such as sounding ancient, open or ambiguous.","listen":["Listen for a melody that sounds almost major or minor but with one unexpected note.","Notice the absence of a strong leading note."],"example":"The excerpt is **modal**, built on a Dorian scale, which gives it a folk-like quality and avoids a strong major or minor feel.","fig":[{"file":"rm_s4_dorian_tune.png","caption":"A made-up tune in D Dorian"}],"quote":[{"text":"in a modal tonality","source":"HSC 2022"},{"text":"Modality versus major/minor tonality","source":"Trial 2024"}]},"Tonality>modulating":{"what":["Modulation is moving from one key to another during a piece. Common modulations go to the dominant, the relative major or minor, or up a step for the last chorus in pop songs."],"use":"Name the keys if you can, or describe the move (to the relative major, up a semitone). Link modulation to structure, contrast, a new section or heightened energy, and say how it is prepared.","listen":["Listen for a shift in the home note.","Notice new accidentals or a change in the feeling of brightness."],"example":"The music **modulates** to the relative major at the start of the B section, prepared by a pivot chord, and the brighter key marks the structural change.","fig":[{"file":"s5_modulation.png","caption":"The music moves from C major to G major"}],"quote":[{"text":"modulates through a number of keys","source":"HSC 2018"}]},"Tonality>Picardy 3rd / tierce de picardie":{"what":["A Picardy 3rd (tierce de picardie) is when music in a minor key ends on a major tonic chord. The 3rd of the chord is raised: in A minor the final chord is A major, with C sharp instead of C. It is common in Baroque music."],"use":"Point to the final chord, name the raised 3rd and say which instrument or voice sings it. Link it to an unexpected brightening, hope or resolution at the close of a minor-key work, and mention it alongside the perfect cadence that usually comes with it.","listen":["Listen to the final chord of a minor piece.","Notice if it suddenly sounds brighter."],"example":"Although the excerpt is in a minor key, it ends with a **Picardy 3rd**, a major tonic chord that brings a sense of brightness at the close.","quote":[{"text":"use of a Picardy 3rd","source":"HSC 2022"},{"text":"('tierce de picardie')","source":"Trial 2019"}]},"Tonality>tonal / tonal centre":{"what":["Tonal music is organised around a home note, the tonal centre or tonic. The other notes and chords pull towards it. The tonal centre can be set up by the key, by a pedal or drone, or by repeating that note at important points."],"use":"Name the tonal centre and say how it is established (a pedal, repeated cadences, a riff). Link a strong tonal centre to stability and a weak one to ambiguity or tension.","listen":["Listen for the note that feels like home.","Notice where phrases come to rest."],"example":"A repeated low D in the bass guitar establishes a strong **tonal centre**, which anchors the music while the chords above shift through chromatic colours.","quote":[{"text":"creates an E tonal centre/pedal point","source":"HSC 2020"},{"text":"a strong tonal centre on C","source":"Trial 2009"}]},"Tonality>chromatic":{"what":["Chromatic describes notes, chords or lines that use pitches outside the key. A chromatic line usually moves by semitones. Chromatic chords borrow notes from other keys, such as a major chord on a note where the key would give a minor one."],"use":"Say what is chromatic (a melody, an inner part, a bass line), which instrument plays it and where. Link it to tension, colour, sliding motion or emotional intensity, and contrast it with diatonic passages when the style changes.","listen":["Listen for semitone slides.","Notice notes that sound unexpected in the key."],"example":"A **chromatic** bass line creeps down by semitones under sustained chords, so the harmony darkens bar by bar and the sense of key weakens.","fig":[{"file":"s5_chromaticism.png","caption":"A melody using notes outside C major"}],"quote":[{"text":"features chromatic movement","source":"HSC 2021"},{"text":"Violin semiquaver chromatic figures","source":"HSC 2023"}]},"Tonality>diatonic":{"what":["Diatonic music uses only the notes of the key, with no added sharps, flats or naturals. Diatonic chords are those built from the scale of the key, such as I, ii, IV and V."],"use":"Use 'diatonic' to describe clear, simple, stable harmony and melody, and name the key if you can. It is most useful as a contrast: a diatonic verse against a chromatic bridge shows the marker you can hear the change.","listen":["Listen for music that sounds clearly in one key.","Notice the absence of surprise notes."],"example":"The verse uses only **diatonic** chords in G major, so the key sounds clear and settled, which sets up the contrast when chromatic chords colour the bridge.","fig":[{"file":"ex_chords_c.png","caption":"Diatonic primary chords in C major"}],"quote":[{"text":"mostly diatonic chords","source":"HSC 2025"},{"text":"diatonic chord progressions","source":"Trial 2021"}]},"Tonality>major":{"what":["Major describes a key, scale or chord whose 3rd is a major 3rd above the root. Major keys follow the pattern T T S T T T S and usually sound bright and stable."],"use":"Name the key if you can and link the major tonality to bright, confident, hopeful or celebratory moods. A change between major and minor is a strong point of contrast to mention.","listen":["Listen for a bright, settled sound.","Notice the 3rd of the final chord."],"example":"After the minor middle section the theme returns in the tonic **major**, with full brass chords, so the ending sounds bright and triumphant.","fig":[{"file":"rm_s4_major_minor_tune.png","caption":"The same tune in major and in minor"}],"quote":[{"text":"to the final chord... a G major chord","source":"HSC 2022"},{"text":"ends in the tonic major ('tierce de picardie')","source":"Trial 2019"}]},"Tonality>tonal ambiguity":{"what":["Tonal ambiguity is when the key or tonal centre is unclear. It can come from avoiding cadences, using open 5ths or quartal chords, chromaticism, modes or bitonality. Tonal ambiguity is different from atonality: the music hints at a key but does not confirm it."],"use":"Explain what causes the ambiguity, such as the absence of a 3rd or of cadences, and say where it happens. Link it to mystery, tension, instability or a floating effect, and say if a clear key arrives later.","listen":["Listen for music that never settles on a home note.","Notice whether you can sing a tonic."],"example":"The open 5ths in the horns create **tonal ambiguity**, as without a 3rd the listener cannot tell if the music is major or minor.","quote":[{"text":"create a certain tonal ambiguity","source":"Trial 2024"}]},"Tonality>minor":{"what":["Minor describes a key, scale or chord whose 3rd is a minor 3rd above the root. Minor keys usually sound darker, sadder or more serious. There are natural, harmonic and melodic forms of the minor scale."],"use":"Name the key if you can and link minor tonality to sad, serious, dark or dramatic moods. Mention features such as the raised 7th or a Picardy 3rd when they appear.","listen":["Listen for a darker, more serious sound.","Notice the 3rd of the tonic chord."],"example":"The **minor** tonality is reinforced by the raised leading note in the bass at each cadence, and together with the low strings it gives the opening a dark, serious character.","fig":[{"file":"ex_major_minor.png","caption":"Major and minor triads: only the middle note changes"}],"quote":[{"text":"reinforcing minor tonality","source":"HSC 2016"},{"text":"a strong sense of minor tonality","source":"Trial 2019"}]},"Elements of Music>Texture":{"what":["Texture is the way the layers of sound are put together. At HSC level you are expected to go past 'thick' and 'thin' and say how many layers there are, what job each layer does (melody, countermelody, harmony, bass, rhythm) and how the layers relate to each other.","Texture is also about change. Markers reward answers that track how the texture builds, thins or switches type across an excerpt and say why."],"use":"In an aural answer, name the texture type, describe its density, then explain the relationship between layers with specific instruments and bars. Link each change in texture to its effect: tension, release, contrast or a new section. Texture often supports structure, so a change in texture is a good clue to a new section.","listen":["Count the layers at the start, then notice when one is added or drops out.","Decide whether the layers move together (homophonic) or independently (polyphonic).","Listen for devices such as imitation, doubling or ostinato that link the layers."],"example":"The excerpt opens with a **monophonic** solo cello, then the texture gradually **thickens** as the strings enter in **staggered** entries, so the music grows in density and tension towards the climax.","fig":[{"file":"tex_roles.png","caption":"Roles of layers: melodic (top), harmonic (middle), bass line (bottom)"}]},"Texture>Compositional-device textures":{"what":["These words name a technique that shapes the texture, as well as how thick it is. Each one describes a particular relationship between parts: copying (imitation, canon, fugue), answering (antiphony), entering one after another (staggered entries), adding a second tune (countermelody) or sharing one line between players (hocket).","Naming the device shows a marker you understand how the texture was built."],"use":"Use one of these words when you can hear the parts interacting in a specific way. Name the device, the instruments involved and where it happens, then link it to an effect such as momentum, density, conversation or unity.","listen":["Listen for an idea that comes back straight away in another part.","Notice whether two groups take turns or play over each other.","Check whether one melody is being split between several players."],"example":"The woodwinds enter in **staggered entries** that **imitate** the opening flute motif, so the texture moves from a single line to a busy **contrapuntal** web within four bars."},"Compositional-device textures>antiphonal":{"what":["Antiphonal music alternates between two (or more) separate groups of performers. One group plays or sings a phrase and the other answers, sometimes with the same material and sometimes with a reply. The idea comes from church music, where two choirs sang from opposite sides of a building.","It is close to call and response, but antiphony usually means two equal groups rather than a leader and a group."],"use":"Name the two groups (for example brass and strings, or upper and lower voices) and say whether they answer with the same or new material. Link it to contrast of timbre, a sense of space or conversation, and comment on how the gap between entries changes, since tighter answers raise the energy.","listen":["Listen for a phrase from one group followed by a reply from a different group.","Notice whether the reply changes timbre, register or dynamic.","Check whether the groups eventually join together."],"example":"Brass and strings exchange the four-bar theme **antiphonally**, and as the answers come closer together the music gains urgency before both groups combine in a **full** tutti.","fig":[{"file":"rm_s6_texture_antiphonal.png","caption":"Antiphonal: Group 1 and Group 2 take turns with the phrase, then both play together"}],"quote":[{"text":"more polyphonic or antiphonal in the second","source":"Trial 2019"},{"text":"Spacing of antiphonal entries varies","source":"Trial 2024"}]},"Compositional-device textures>countermelody":{"what":["A countermelody is a secondary melody that sounds against the main melody. It has its own shape and rhythm, so it is heard as a real tune rather than as harmony. It often moves when the main melody holds a long note, and rests or holds when the main melody is busy.","Adding a countermelody turns a homophonic texture into one with polyphonic elements."],"use":"Say which instrument has the countermelody, how it differs from the main melody (register, rhythm, direction) and when it enters. Link it to a thicker, more interesting texture and to variety, especially when a returning section gets a countermelody it did not have the first time.","listen":["Listen for a second tune in a different register from the main melody.","Notice if it fills the gaps when the main melody holds a note.","Check whether it appears only when a section returns."],"example":"When the chorus returns, the violins add a rising **countermelody** above the vocal line, which thickens the texture and gives the repeat a new sense of lift.","quote":[{"text":"an additional countermelody... creating a polyphonic texture","source":"HSC 2021"}]},"Compositional-device textures>imitative / imitation":{"what":["Imitation is when one part repeats a melodic or rhythmic idea just played by another part, often at a different pitch. The copy may be exact at first and then go its own way. Strict imitation that continues for a whole passage is a canon.","An imitative texture is contrapuntal: the parts are independent but linked by shared material."],"use":"Name the first part, the imitating part, the time gap and the interval if you can hear it (for example 'a fifth higher, one bar later'). Link imitation to unity, interplay between parts and growing density as more parts join in.","listen":["Listen for a short distinctive idea that comes back in another instrument.","Notice how far apart the entries are and whether the copy is higher or lower.","Check whether the copy stays exact or changes after a few notes."],"example":"The clarinet **imitates** the oboe's dotted motif a bar later and a fourth lower, which produces a conversation between the woodwinds and a gradually busier texture.","fig":[{"file":"s5_tex_imitation.png","caption":"Imitation: Voice 2 copies the opening shape a bar later and a 5th higher, then goes its own way"}],"quote":[{"text":"textural interplay... creating contrast","source":"HSC 2023"}]},"Compositional-device textures>staggered entries":{"what":["Staggered entries happen when instruments or voices begin at different times, usually a bar or a phrase apart. Each entry adds a new layer, so the texture builds step by step.","The entries may imitate each other (as in a canon or fugue) or each part may bring new material. The key point is the timing of the entries."],"use":"List the order of entry with instruments and bars, then say what each entry adds. Staggered entries are a strong way to explain a gradual increase in density, tension or volume, so link them to a build-up towards a climax or a new section.","listen":["Count the instruments as they enter one by one.","Notice the gap between entries and whether it shrinks.","Listen for whether each new part copies the first one or brings something new."],"example":"Bassoon, clarinet and then flute enter in **staggered entries** two bars apart, each adding a higher layer, so the density builds steadily towards the tutti at bar 9.","fig":[{"file":"rm_s6_texture_staggered.png","caption":"Staggered entries: flute, then clarinet, then bassoon come in a bar apart, so the texture thickens one layer at a time"}],"quote":[{"text":"staggered oboe, flute, clarinet and bassoon entries","source":"HSC 2018"},{"text":"Staggered entries increase textural density","source":"HSC 2024"}]},"Compositional-device textures>fugal / fugue-like":{"what":["A fugue is a contrapuntal piece built on one main theme called the subject. Each part enters with the subject in turn, often alternating between the tonic and the dominant, while earlier parts continue with new countermelodies. The result is a dense web of independent lines.","Calling a passage fugal or fugue-like means it uses these entries without being a full Baroque fugue."],"use":"Use 'fugal' when you hear a clear theme enter in one part after another and the earlier parts keep going with independent lines. Mention the order of entries and the instruments, and link it to growing density, intensity and a learned, Baroque-influenced sound.","listen":["Listen for a solo theme at the start, then the same theme in a new part.","Notice the earlier part carrying on with a different line.","Check whether the theme enters at a different pitch each time."],"example":"The development section becomes **fugal**: the cellos state the subject alone, then violas and violins enter with it in turn, so the texture grows into dense **counterpoint**.","quote":[{"text":"played in fugal style","source":"HSC 2018"},{"text":"a fugue-like opening","source":"HSC 2017"}]},"Compositional-device textures>canonic / canon":{"what":["A canon is strict imitation. One part plays a melody and one or more other parts play exactly the same melody, entering a set distance later. A round such as Frere Jacques is a canon at the unison that can loop. A canon can also be at a different interval, or even in augmentation.","Canonic writing is contrapuntal and keeps every part equally important."],"use":"Say how many parts there are, the time gap between entries and the interval of the copy. Link canon to unity (one melody generates everything) and to increasing density as each voice enters. Compare it with looser imitation if the copy stops being exact.","listen":["Listen for the whole melody, not just its opening, repeating in another part.","Count the entries and the gap between them.","Notice whether the parts overlap all the way to the end."],"example":"The voices sing in a four-part **canon** one bar apart, so the single melody gradually builds a thick **polyphonic** texture while keeping the passage unified.","quote":[{"text":"Canonic/staggered entries","source":"HSC 2016"},{"text":"The excerpt is a 6-part canon","source":"Trial 2025"}]},"Compositional-device textures>hocket / interlocking":{"what":["Hocket is a technique where one melody or rhythm is split between two or more performers, so each plays only some of the notes and rests while the others play. Heard together, the notes interlock into one continuous line.","It appears in medieval music, in many African and Balinese traditions and in minimalist and contemporary music. Interlocking rhythms work the same way for percussion."],"use":"Name the instruments sharing the line and describe the effect: a sparkling, rapid line, rhythmic drive and a sense of movement across the ensemble or stereo field. Mention that each part on its own is full of rests, which a performer must place exactly.","listen":["Listen for notes of one line jumping between instruments or speakers.","Notice a fast line that sounds impossible for one player.","Check whether the rhythms fit together with no gaps."],"example":"The marimbas play in **hocket**, each filling the rests in the other's part, so the interlocking quavers form one fast, unbroken line with strong rhythmic drive.","quote":[{"text":"Use of hocket features and interlocking rhythms","source":"Trial 2021"}]},"Texture>Density":{"what":["Density describes how much is happening in the texture. It depends on the number of layers, how close together their notes are in pitch, how many notes each plays and how much doubling there is. Busy rhythms can make even a few layers sound dense.","Density changes over time, and those changes are often what a question asks you to track."],"use":"Use density words with evidence: number of instruments, register and rhythmic activity. Then link the change to its effect, such as tension, climax, relief or a new section. Avoid vague words on their own; 'thick because all four strings play block chords in a low register' earns more than 'thick'.","listen":["Count how many parts are playing.","Notice the register: low, close chords sound heavier than high, spread ones.","Listen for fast notes that make the texture feel busier."],"example":"The texture is **sparse** at first, with only a held bass note and a solo flute, then becomes increasingly **dense** as tremolo strings and brass chords are added.","fig":[{"file":"ex_texture_graph.png","caption":"A texture graph (layer diagram) of a pop song: count the coloured layers in each section to see the texture get thicker and thinner"}]},"Density>thick / thicken":{"what":["A thick texture has many layers or many notes in each chord. 'Thicken' describes the process of adding layers over time, which is often gradual.","Thickness comes from the number of parts, chords with many notes and doubling. It is a relative word, so say what it is thicker than."],"use":"Say which instruments are added and when, and use 'gradually' or 'suddenly' to describe the pace. Thickening is usually linked to tension, intensity or a build to a climax, so connect it to dynamics and pitch if they rise at the same time.","listen":["Notice when new instruments enter and stay.","Listen for chords with more notes or wider spacing.","Check whether volume and register rise as the texture thickens."],"example":"From bar 12 the texture **thickens** as horns and lower strings join the melody with sustained chords, which adds weight and builds tension into the final section.","fig":[{"file":"rm_s4_tex_thin_thick.png","caption":"The same tune: thin with one layer, then thick with three layers"}],"quote":[{"text":"creates a thicker texture","source":"HSC 2016"},{"text":"Gradual thickening of texture adds to tension","source":"HSC 2021"},{"text":"piano thick chords","source":"Trial 2021"}]},"Density>dense / density":{"what":["Density is the amount of musical activity in a texture. A dense texture has many layers, busy rhythms or closely spaced pitches, so there is little space in the sound. 'Density' is the noun you use to talk about the level going up or down.","Dense is about more than the number of instruments: two parts in rapid semiquavers can sound denser than six held notes."],"use":"Explain what causes the density (number of layers, rapid notes, close harmony, doubling) and link a rise or fall to an effect such as tension, energy or release. 'Density increases' is a useful phrase for describing a build-up across bars.","listen":["Listen for fast notes in several parts at once.","Notice whether the pitches crowd into one register.","Track whether the overall amount of activity rises or falls."],"example":"The **density** increases from bar 20 as the strings move into rapid semiquavers beneath the brass chords, so the texture becomes crowded and urgent.","quote":[{"text":"increases in density","source":"HSC 2016"},{"text":"a more dense texture","source":"HSC 2019"},{"text":"The texture is quite dense due to parts with rapid notes","source":"Trial 2021"}]},"Density>light / lighter":{"what":["A light texture has few parts, often in a higher register, with short or detached notes and space between them. It sounds clear and transparent, so each line can be heard on its own.","'Lighter' compares one passage with another, so it is useful when the texture thins after a full section."],"use":"Pair 'light' with evidence (which instruments drop out, what register, what articulation) and link it to effect: clarity, delicacy, relief after a climax or contrast between sections. Give bar numbers for when it becomes lighter.","listen":["Listen for the bass and lower parts dropping out.","Notice short, detached notes and gaps in the sound.","Check whether you can hear each instrument clearly."],"example":"At the start of the B section the texture becomes **lighter**, with only pizzicato strings and a high flute line, which gives a delicate contrast to the heavy tutti before it.","quote":[{"text":"Texture is lighter at bars 178 to 182","source":"HSC 2018"},{"text":"Light, transparent textures","source":"Trial 2024"}]},"Density>complex":{"what":["A complex texture has several layers with different rhythms, melodies or roles happening together. It is about variety between the parts as much as the number of parts. Four instruments in rhythmic unison are thick but not complex. Four instruments with independent rhythms are complex.","Complexity often grows across an excerpt as new ideas are layered."],"use":"Say what makes the texture complex: independent lines, cross-rhythms, layered ostinatos or contrasting timbres. Link it to tension, energy or confusion, and if it increases, show the stages with bar numbers.","listen":["Listen for several rhythms that do not line up.","Notice more than one melody at a time.","Check whether it gets harder to follow a single part."],"example":"The texture grows more **complex** as a syncopated brass riff and a semiquaver string ostinato are layered under the melody, so the music feels restless and crowded.","quote":[{"text":"a dense, complex homophonic texture","source":"HSC 2016"},{"text":"The increasing complexity of the texture","source":"HSC 2018"}]},"Density>thin":{"what":["A thin texture has only one or two layers, or a small number of notes. It is the opposite of thick. A solo line, a melody with a single bass note or two instruments in unison all sound thin.","A thin texture is often used for openings, quiet passages or a moment of focus after a fuller section."],"use":"Say which parts remain and which have stopped (a part that stops is said to tacet). Link a thin texture to intimacy, exposure of a solo, suspense or contrast. A sudden thin texture after a climax is worth naming as a structural signpost.","listen":["Count the parts: one or two means thin.","Notice when most instruments drop out together.","Listen for a solo that is suddenly exposed."],"example":"After the climax the texture suddenly becomes **thin**: only the solo oboe is left over a held cello note, which exposes the melody and signals the start of the final section.","fig":[{"file":"rm_s4_tex_thin_thick.png","caption":"The same tune: thin with one layer, then thick with three layers"}],"quote":[{"text":"the texture then becomes thin","source":"HSC 2018"},{"text":"tacets into a thinner texture","source":"Trial 2021"}]},"Density>busy":{"what":["A busy texture is full of activity: fast rhythms, many short notes and constant movement in several parts. It describes how active the layers are rather than how many there are.","Busy textures often come from semiquaver patterns, ornaments, running bass lines or several ostinatos together."],"use":"Pair 'busy' with duration evidence such as running semiquavers or syncopated riffs, and name the parts doing it. Link it to energy, excitement or momentum, and contrast it with a calmer section if one follows.","listen":["Listen for constant quick notes in more than one part.","Notice whether the busy part is in the melody, the accompaniment or both.","Check whether the activity ever stops for breath."],"example":"The accompaniment is **busy**, with running semiquavers in the piano and a walking bass, which keeps up a strong sense of momentum beneath the sustained vocal line.","quote":[{"text":"the very busy nature of the musical ideas","source":"HSC 2016"}]},"Density>full / rich":{"what":["A full or rich texture has many instruments covering high, middle and low registers, usually with complete harmony. 'Rich' adds the idea of warmth, often from sustained chords, doubling and a strong bass.","These words often describe a tutti, where the whole ensemble plays."],"use":"Say what fills the texture (registers, instruments, doubling, chords) and link it to grandeur, warmth, climax or arrival. Use it with dynamics evidence when a full texture coincides with ff.","listen":["Listen for low, middle and high registers all being used.","Notice the whole ensemble playing together.","Check for sustained chords that fill the sound."],"example":"The return of the theme has a **full**, **rich** texture, with the melody doubled in octaves over sustained brass chords and a strong bass, which makes the final statement sound triumphant.","quote":[{"text":"rich full texture when all instruments are playing","source":"HSC 2018"},{"text":"The texture is full and rich","source":"HSC 2022"}]},"Density>sparse":{"what":["A sparse texture has few layers and few notes, with gaps and silence between them. It is thinner than thin: the space itself is part of the sound.","Sparse textures are common in film music, minimalism and openings that set a mood before the main material arrives."],"use":"Describe what is left (a few isolated notes, a held drone, short fragments) and the silence around it. Link it to suspense, emptiness, calm or isolation, and say where it happens with bar numbers.","listen":["Listen for silences between notes.","Notice isolated notes or fragments rather than continuous lines.","Check whether a held note or drone is the only thing sounding."],"example":"The opening is **sparse**, with isolated piano notes separated by rests over a quiet drone, which sets up an atmosphere of suspense before the strings enter.","quote":[{"text":"The sparse texture at bar 177","source":"HSC 2020"},{"text":"a sparse 'light' texture","source":"HSC 2023"},{"text":"A light and sparse texture","source":"Trial 2025"}]},"Texture>Layer relationship and count":{"what":["These words describe the relationship between layers: whether they move independently, talk to each other, double each other, play in unison or move together in blocks. They also cover counting layers, from a single line to a multilayered score.","This is where you show detailed listening, because you have to name the parts and say exactly how they connect."],"use":"Use these words to support a texture type. For example, 'homophonic' is backed up by 'block chords', and 'polyphonic' by 'independent' lines and 'interplay'. Always name instruments and bars, and link the relationship to an effect.","listen":["Count the layers in the opening and at the climax.","Notice whether parts move in the same rhythm.","Listen for parts copying or answering each other."],"example":"The excerpt begins with a **single line** in the flute, then builds to three **independent** **layers**, with the clarinet and bassoon in **dialogue** beneath it."},"Layer relationship and count>independent":{"what":["An independent part has its own melodic shape and rhythm, so it can be heard as a line in its own right. Independent parts are the basis of polyphonic and contrapuntal textures.","A bass line that walks or moves against the melody is independent. A bass that only plays the root of each chord with the melody's rhythm is not."],"use":"Name the independent part and explain how it differs from the others (contrary motion, different rhythm, own melodic shape). Link it to interest, depth in the texture and a contrapuntal or Baroque style.","listen":["Listen for a part with a different rhythm from the melody.","Notice lines moving in opposite directions.","Check whether you could sing the part as a tune on its own."],"example":"The cello has an **independent** line moving in contrary motion to the violin melody, which gives the texture a **contrapuntal** quality.","quote":[{"text":"the cello has an independent bass line","source":"HSC 2023"},{"text":"independent voice movement","source":"HSC 2025"}]},"Layer relationship and count>interplay / dialogue":{"what":["Interplay or dialogue is when parts pass ideas between them, answer each other or overlap. It can be short motifs tossed between instruments or longer phrases traded back and forth.","It is a broader word than imitation: the parts relate to each other, but they do not need to copy exactly."],"use":"Name the instruments in dialogue and describe what is exchanged (a motif, a rhythm, a phrase). Link it to conversation, energy and unity between sections of the ensemble. It is useful in jazz, chamber music and orchestral writing.","listen":["Listen for ideas bouncing between instruments.","Notice one part entering as another finishes.","Check whether the exchanges get shorter or overlap."],"example":"There is constant **interplay** between saxophone and trumpet, which trade two-bar fragments of the riff, so the texture feels like a lively conversation.","quote":[{"text":"Interplay between instruments is created","source":"HSC 2018"},{"text":"dialogue between the parts","source":"HSC 2023"}]},"Layer relationship and count>doubled / doubling":{"what":["Doubling is when two or more instruments play the same melodic line, either at the same pitch or an octave (or more) apart. Doubling strengthens a line and changes its timbre, because the two sounds blend.","Doubling makes the texture fuller without adding a new idea, so it adds density but not complexity."],"use":"Name the instruments and the interval (unison or octave), then link doubling to strength, emphasis, a richer timbre or a fuller texture. It is often used to make a theme stand out at a climax.","listen":["Listen for a melody that sounds thicker or brighter than one instrument could.","Notice the same line in a high and a low register at once.","Check whether the doubling starts at a key moment."],"example":"At the climax the theme is **doubled** an octave lower by the cellos and horns, which strengthens the melody and thickens the texture.","quote":[{"text":"violin 2 doubling down an octave","source":"HSC 2024"},{"text":"Doubling contributes to density","source":"Trial 2025"}]},"Layer relationship and count>unison (as texture)":{"what":["A unison texture has all parts playing the same melody at the same pitch. Unison at the octave (sometimes called octave doubling) is often heard as unison too. There is no harmony, so it works like a powerful monophonic texture.","Unison passages stand out because they remove harmony and focus all attention on one line."],"use":"Say which parts are in unison and where, then link it to power, emphasis, unity or starkness. Contrast it with what comes before or after, for example unison leading into full harmony.","listen":["Listen for a single line played by many instruments.","Notice the absence of chords under the line.","Check whether the parts then split into harmony."],"example":"The whole orchestra plays the opening motif in **unison**, which makes it sound bold and stark before the parts split into harmony.","quote":[{"text":"Tenor and Bass voices... singing in unison","source":"HSC 2022"},{"text":"all instruments in unison","source":"Trial 2019"}]},"Layer relationship and count>block (chordal)":{"what":["Block or chordal writing has all parts moving in the same rhythm, so the notes sound together as chords. It is the clearest form of homophony, sometimes called note-for-note or homorhythmic writing.","It contrasts with broken chords, where the chord notes are played one after another."],"use":"Use 'block chords' to support a homophonic description. Say which instruments or voices play them and link the effect to solidity, clarity of words in choral music, a hymn-like feel or strong punctuation.","listen":["Listen for all parts changing note at the same moment.","Notice a chord sounding as one solid sound.","Check whether the words of a choir are easy to hear."],"example":"The choir sings in **block chords**, all voices moving in the same rhythm, so the text is clear and the passage sounds like a hymn.","fig":[{"file":"rm_s4_tex_block_broken.png","caption":"The same chords two ways: block chords (all notes at once) and broken chords (one note at a time)"}],"quote":[{"text":"all parts singing block rhythms/harmonies","source":"HSC 2016"},{"text":"moves in block chords","source":"HSC 2022"}]},"Layer relationship and count>single line":{"what":["A single line is one melody heard on its own, with no accompaniment. It is a monophonic texture. The line may be played by one performer or by several in unison.","A single line is a common opening, because it presents the main idea clearly before other layers join."],"use":"Name the instrument and where the single line appears. Link it to clarity, exposure, a sense of isolation or a focus on the main motif, and say how the texture changes after it.","listen":["Listen for one melody with nothing underneath.","Notice whether more parts enter afterwards.","Check whether the line is one instrument or several in unison."],"example":"The piece opens with a **single line** in the solo clarinet, which presents the main motif clearly before the strings enter beneath it.","fig":[{"file":"tex_mono.png","caption":"Monophonic: one melody line only"}],"quote":[{"text":"the single melodic line at the beginning","source":"HSC 2019"}]},"Layer relationship and count>layered / layers":{"what":["A layer is one strand of the texture, such as a melody, a countermelody, a harmony part, a bass line or a rhythm pattern. Layered music builds these strands on top of each other, often one at a time.","Layering is central in minimalism, pop production and electronic music, where loops or ostinatos are added and removed."],"use":"Count the layers and say what each one does, then trace how they are added or taken away. Link adding layers to growth in density and intensity, and removing them to release or a new section.","listen":["Count the separate strands you can hear.","Notice when a new loop or ostinato is added.","Check what job each layer does: melody, harmony, bass or rhythm."],"example":"The texture is built in **layers**: a drum groove, then a bass ostinato, then a synth pad, so the density increases steadily towards the entry of the vocal melody.","fig":[{"file":"ex_texture_graph.png","caption":"A texture graph (layer diagram) of a pop song: count the coloured layers in each section to see the texture get thicker and thinner"}],"quote":[{"text":"A second and third layer are added","source":"HSC 2019"},{"text":"three different rhythmic layers","source":"HSC 2022"},{"text":"Multilayered score","source":"Trial 2023"}]},"Texture>Texture type (named)":{"what":["These are the standard names for types of texture. Monophonic is one line. Homophonic is a melody with accompaniment or block chords. Polyphonic and contrapuntal mean several independent lines. Heterophonic is one melody played in different versions at the same time.","A piece rarely stays in one type, so strong answers name the type in each section and explain the changes."],"use":"Name the texture type first, then prove it with evidence from the layers (which parts, what they do). Use the change from one type to another to explain contrast and structure. You can also qualify a type, for example 'mainly homophonic with polyphonic moments'.","listen":["Decide whether you hear one line, melody plus accompaniment or several lines.","Listen for changes of type between sections.","Check whether several parts are playing versions of the same tune."],"example":"The excerpt moves from a **monophonic** opening to a **homophonic** chorus, then becomes **polyphonic** as the voices enter in **imitation**."},"Texture type (named)>contrapuntal":{"what":["Contrapuntal music combines two or more independent melodic lines that fit together in harmony. Counterpoint is the skill of writing those lines. Contrapuntal and polyphonic mean nearly the same thing, but 'contrapuntal' stresses the composition technique, and it is often used for Baroque-style writing such as fugues and canons.","Each line has its own rhythm and shape, but together they make sense harmonically."],"use":"Name the lines and explain how they relate (imita
