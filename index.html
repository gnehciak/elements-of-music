 a wobble in pitch. Melisma means singing many notes on one syllable. Vocal fry is a low, creaky sound. Beatboxing uses the mouth to imitate drums.","Each one changes the timbre and expression of the voice."],"use":"Different styles use different techniques: melisma in R&B and gospel, belt in musicals, scat in jazz, beatboxing in hip hop and a cappella music. When you sing or compose a vocal line, choose one technique that fits the style, such as a short melisma on the last word of a phrase.","listen":["Listen for many notes on one word (melisma).","Notice a change from light, airy singing to powerful chest voice.","Listen for drum sounds made with the mouth (beatboxing)."],"example":"In the final chorus the singer adds a **melisma** on the last word and **belts** the high notes, which makes the ending more emotional and powerful.","fig":[{"file":"s5_melisma.png"}]},"Techniques for specific media>Piano / keys":{"what":["Pianists change the sound using pedals and special techniques. The sustain pedal (right pedal) lifts the dampers so notes keep ringing after you let go of the keys. It is marked 'Ped.' and released at '*' or the end of a bracket line. The una corda pedal (left pedal) makes the sound softer and more muted. 'tre corde' cancels it.","A glissando slides a finger quickly across the keys. Prepared piano means placing objects such as screws or rubber between the strings to change the sound."],"use":"The sustain pedal is used in almost all piano music to make the sound smooth and rich, but it must be changed when the chord changes or the sound blurs. Prepared piano was made famous by John Cage and creates percussion-like sounds. When you play or compose for piano, mark pedal changes with each new chord.","listen":["Listen for notes that keep ringing and blend together (sustain pedal).","Notice a softer, more veiled piano sound (una corda).","Listen for a fast sweep up or down the keys (glissando)."],"example":"The pianist uses the **sustain pedal** to let the arpeggios ring together, then switches to **una corda** in the quiet section, which makes the sound softer and more distant."},"Dynamics and expression>Electronic manipulation":{"what":["Electronic manipulation means using technology to change recorded or electronic sound. It includes effects such as distortion, delay and reverb (from Stage 4) and Stage 5 techniques such as looping, compression and sustain shaping.","This can happen on effects pedals, on a synthesiser or inside a DAW (digital audio workstation) such as GarageBand, Logic or Ableton."],"use":"Producers use electronic manipulation to shape the sound of almost all modern pop, hip hop, EDM and film music. It can make a voice sound larger, a guitar sound heavier or a drum loop repeat forever. When you produce your own tracks, add one effect at a time and listen to how it changes the mood.","listen":["Listen for sounds that seem unnaturally repeated, echoed, squashed or distorted.","Notice voices or instruments that sound changed by technology."],"example":"The vocal is drenched in **reverb** over a repeating **loop**, and the drums are heavily **compressed**, which makes the track sound big and spacious but punchy."},"Electronic manipulation>Looping":{"what":["Looping means recording a short musical phrase (often one to four bars) and repeating it continuously. New loops can be layered on top to build a thick texture.","Performers use loop pedals to do this live. Producers loop sections in a DAW by copying a region end to end."],"use":"Looping is the base of most hip hop, EDM and much pop music, where a drum loop or sample repeats under the whole song. Solo performers such as Ed Sheeran build full songs live with a loop pedal. When you compose in a DAW, start with a two-bar drum loop, then layer a bass line and chords on top.","listen":["Listen for a short pattern that repeats exactly, over and over.","Notice new layers being added on top of an existing loop."],"example":"The track is built from a two-bar drum **loop**, with new loops of bass, chords and vocals layered in one at a time, which gradually thickens the texture."},"Electronic manipulation>Compression":{"what":["Compression automatically turns down the loudest parts of a sound when they go over a set level (called the threshold). The quiet and loud parts end up closer in volume.","The whole sound can then be turned up, so it sounds louder, fuller and more even."],"use":"Compression is used on almost every modern recording, especially vocals, drums and bass, so they sit steadily in the mix. Heavy compression makes drums punchy and vocals sound close and intimate. When you mix in a DAW, try a compressor on the vocal and notice how the quieter words become easier to hear.","listen":["Listen for very even volume, with no loud bumps or quiet dips.","Notice drums that sound punchy and tight, or a vocal that sounds close and steady."],"example":"The vocals are heavily **compressed**, so every word is the same level and sits clearly on top of the mix, which makes the singer sound close to the listener."},"Electronic manipulation>Sustain":{"what":["Sustain is about how a note holds on once it has started. On a synthesiser, sustain is the S in the ADSR envelope (Attack, Decay, Sustain, Release). It is the volume level the note holds at while you keep the key down.","Instruments can have long sustain (organ, bowed strings) or short sustain (xylophone, plucked strings). On a piano the sustain pedal keeps notes ringing."],"use":"Producers set sustain to shape the character of a sound. A pad with high sustain holds a long, smooth chord, while a pluck sound with zero sustain dies away quickly. Guitarists lengthen sustain with compression or distortion. When you design a synth sound, change the sustain and listen to how the note behaves.","listen":["Listen for whether a note keeps ringing or fades quickly.","Compare long, held synth pads with short, plucky sounds."],"example":"The synth pad has a long **sustain** and holds a smooth chord under the track, while the short plucky lead has almost none."},"Electronic manipulation>From Stage 4":{"what":["These are the effects from Stage 4. Distortion clips the signal so the sound becomes rough and gritty, like a rock guitar. Delay repeats the sound as an echo after a set time. Reverb adds the reflections of a room or hall so the sound feels spacious.","They are added with pedals, amplifiers or plug-ins in a DAW."],"use":"Distortion is the sound of rock and metal guitar. Delay creates echoes that can repeat in time with the beat. Reverb makes vocals and instruments sound as if they are in a large space. Use them in your own productions, but adjust the amount: a little reverb sounds natural, too much sounds washy.","listen":["Listen for a rough, fuzzy or crunchy guitar sound (distortion).","Listen for clear echoes of a note (delay).","Listen for a sense of space, as if in a hall or church (reverb)."],"example":"The guitar uses heavy **distortion** for a gritty sound, while the vocal has **delay** on the last word of each line, so it echoes into the gap."},"Electronic manipulation>Others":{"what":["Other common effects: chorus copies the sound and slightly detunes it so it sounds thicker. Auto-tune corrects pitch, and when pushed hard it makes a robotic voice. EQ (equalisation) turns frequency ranges up or down, such as bass or treble. Panning places the sound left or right in stereo. Sampling uses a recorded piece of sound in a new track.","All of these can be done with plug-ins in a DAW."],"use":"Producers use these tools to shape a mix. EQ and panning help each instrument have its own space. Chorus thickens guitars and synths. Auto-tune is heard in pop and hip hop, and Cher's 'Believe' made the robotic effect famous. Sampling is central to hip hop. When you mix, try panning two guitars left and right.","listen":["Listen for a robotic, stepped sound in a vocal (auto-tune).","Notice sounds coming from only the left or right speaker (panning).","Listen for a shimmering, thickened sound (chorus)."],"example":"The vocals use strong **auto-tune** for a robotic sound, and the two guitar parts are **panned** left and right, which gives the mix a wide stereo sound."},"Dynamics and expression>Expressive directions":{"what":["Expressive directions are words written in a score that tell the performer the mood or character to play with. Most are Italian, for example dolce (sweetly), cantabile (in a singing style), agitato (agitated) and maestoso (majestic). Some, like rubato and a tempo, are about flexible speed.","They are usually written in italics above or below the stave, often next to a tempo marking."],"use":"Composers use expressive directions to show the feeling they want, which notes alone cannot show. Performers turn these words into choices about tone, dynamics, articulation and timing. When you compose, add one expressive word at the start of each section so the performer knows the mood.","listen":["Listen for the overall mood or character of the playing.","Notice changes of mood between sections, such as calm to agitated.","Listen for small, flexible changes of speed."],"example":"The opening is marked **dolce** and **cantabile**, so the melody is played sweetly in a singing style, then the middle section becomes **agitato** with faster, louder notes."},"Expressive directions>dolce":{"what":["dolce (say 'dol-chay') means 'sweetly'. The performer plays with a gentle, warm, soft tone.","It is usually quiet, but it is mostly about tone and feeling."],"use":"dolce is common in lyrical melodies for strings, woodwind and piano, especially in Romantic music. Players use a soft attack and smooth legato. When you perform a dolce passage, aim for a warm, rounded sound and avoid harsh accents.","listen":["Listen for a soft, gentle and warm tone.","Notice smooth notes without strong accents."],"example":"The flute plays the theme **dolce**, with a soft, warm tone and smooth phrasing that makes the melody sound tender."},"Expressive directions>cantabile":{"what":["cantabile means 'in a singing style'. The performer plays a melody smoothly and expressively, as though a singer were singing it.","It usually means legato, with a full tone and shaping of each phrase."],"use":"cantabile is common in slow movements for piano, strings and woodwind, where the melody should sound like a song. Pianists bring out the melody above the accompaniment. When you play cantabile, think about where a singer would breathe and shape each phrase.","listen":["Listen for a smooth, flowing melody that sounds like a song.","Notice phrases that rise and fall in volume."],"example":"In the slow section the piano plays the melody **cantabile**, smooth and song-like, while the left hand provides a quiet accompaniment."},"Expressive directions>espressivo (espress.)":{"what":["espressivo (espress.) means 'expressively'. The performer is asked to play with strong feeling, shaping the dynamics and timing to bring out the emotion.","It is often used for a solo melody that should stand out."],"use":"espressivo appears in Romantic and film music for important melodies, often given to violin, cello or oboe. Performers may add vibrato, gentle rubato and dynamic shaping. When you see espress., ask yourself what emotion the melody shows and exaggerate it.","listen":["Listen for a melody with lots of shaping in volume and timing.","Notice extra vibrato or emotional intensity."],"example":"The cello plays the melody **espressivo**, with rich vibrato and swells in dynamics that make it sound sorrowful."},"Expressive directions>con brio / con fuoco":{"what":["con brio means 'with vigour' or spirit: lively, energetic and bright. con fuoco means 'with fire': passionate, fierce and intense.","Both usually go with a fast tempo, as in Allegro con brio."],"use":"These directions are used for exciting, energetic music, often at the start of a fast movement. Beethoven's Symphony No. 5 first movement is marked Allegro con brio. When you perform con brio, keep the rhythm crisp and the energy high.","listen":["Listen for lively, energetic playing with crisp rhythms.","Notice fierce, intense, passionate playing (con fuoco)."],"example":"The movement opens **con brio**, with crisp, energetic rhythms and strong accents that drive it forward."},"Expressive directions>agitato / tranquillo":{"what":["agitato means 'agitated': restless, anxious and excited. tranquillo means 'calm' or 'peaceful'.","They are opposites, so composers often use them for contrasting sections."],"use":"agitato is used for tense, stormy or anxious music, often with fast notes, accents and sudden dynamics. tranquillo is used for calm, still sections with slow, smooth playing. When you compose, try following an agitato section with a tranquillo one for strong contrast.","listen":["Listen for restless, nervous, rushing music (agitato).","Listen for calm, slow, peaceful music (tranquillo)."],"example":"The **agitato** middle section, with fast repeated notes and sudden accents, contrasts with the **tranquillo** ending, which is slow and calm."},"Expressive directions>maestoso / grazioso":{"what":["maestoso means 'majestic': grand, stately and dignified, usually at a moderate or slow tempo. grazioso means 'graceful': light, elegant and charming.","maestoso suits a royal or ceremonial mood, while grazioso suits a light, dance-like one."],"use":"maestoso is used for grand openings, finales and ceremonial music, often with full brass and timpani. grazioso is used for light, elegant music such as minuets and waltzes. When you perform maestoso, play broadly with full tone; for grazioso, keep it light and delicate.","listen":["Listen for grand, broad, stately music (maestoso).","Listen for light, elegant, dance-like music (grazioso)."],"example":"The finale is **maestoso**, with full brass and timpani playing broad, heavy chords that make it sound grand and ceremonial."},"Expressive directions>rubato":{"what":["rubato means 'robbed time'. The performer speeds up and slows down slightly within a phrase for expression, so the beat is flexible rather than strict.","The overall tempo stays roughly the same. Time 'stolen' in one place is given back in another."],"use":"Rubato is used in Romantic piano music, especially Chopin, and in slow ballads and solo singing. It makes music sound natural and emotional rather than mechanical. When you perform rubato, linger slightly on important notes and push forward through less important ones.","listen":["Listen for a beat that stretches and pushes, so you cannot tap along evenly.","Notice slight slowing at the top of a phrase."],"example":"The pianist plays with **rubato** and lingers on the high notes then pushes forward through the quick runs, which makes the melody sound free and expressive."},"Expressive directions>a tempo":{"what":["a tempo means 'in time'. It tells the performer to return to the original speed after a change such as rit., rall. or accel.","It is written above the stave at the point where the original speed returns."],"use":"a tempo appears in almost every style after a slowing or speeding up. Performers must remember the original speed so they can return to it exactly. When you compose, use rit. at the end of a phrase and a tempo at the start of the next.","listen":["Listen for the music going back to its original speed after slowing down.","Notice a sudden return to a steady beat."],"example":"After the **ritardando** at the end of the phrase the music returns **a tempo**, so the original speed and energy come back for the next section."},"Elements of Music>Pitch":{"what":["Pitch is how high or low a sound is. It covers the melody (the tune), the harmony (the chords underneath it) and the tonality (the key or scale the music is built on, such as major, minor or pentatonic).","In Stage 5 you go further: the devices composers use to shape a melody, the ways chords build tension and finish phrases, scales from around the world and other ways of writing pitch down besides the five-line stave."],"use":"Every piece makes choices about pitch. A composer picks a scale to set the mood, writes a melody that moves by step or leap, then chooses chords that support it, clash with it or surprise the listener. When you compose, decide on your scale and your cadences early, because they shape everything else.","listen":["Follow the melody: is it high or low, and does it move by step or by leap?","Listen under the tune for the chords and whether they sound settled or tense.","Work out the tonality: major, minor or something less familiar such as a blues or whole-tone scale.","Notice the ends of phrases and whether they sound finished or left hanging."],"example":"The melody is built on the **harmonic minor** scale and climbs in a **sequence**, and the phrase ends with an **interrupted cadence** that holds back the resolution the listener expects."},"Pitch>Melodic devices":{"what":["Melodic devices are the tools a composer uses to build and develop a tune. Some repeat an idea in a new way (sequence, motif), one changes how the words fit the notes (melisma), one colours the melody with notes from outside the key (chromaticism) and some decorate single notes (ornaments)."],"use":"These devices let a composer make a short idea go a long way. A melody that repeats exactly gets dull, but one that repeats in sequence, or comes back with ornaments, sounds familiar and fresh at the same time. In your own compositions, write one strong motif, then try moving it up a step, adding a chromatic passing note or decorating it with a turn.","listen":["Listen for a short idea that keeps coming back, maybe at a new pitch.","Notice when a singer stretches one word over many notes.","Listen for slides by semitone or notes that sound outside the key.","Catch quick flicks and shakes around a single note."],"example":"The opening **motif** is repeated as a rising **sequence**, and when it returns for the last time it is decorated with a **trill**, which builds excitement towards the end of the phrase."},"Melodic devices>Sequence":{"what":["A sequence is a melodic pattern that is repeated straight away, starting on a higher or lower note. The shape and rhythm stay the same; only the starting pitch moves.","It is different from plain repetition (the same notes again) and from imitation (another part copying the idea). A sequence usually happens in the same part, two or three times in a row, with each repeat moving the same distance."],"use":"Sequences help a composer stretch a short idea into a longer phrase. Rising sequences build tension and excitement, while falling sequences often relax and wind the music down. You hear them in Baroque music, film scores and pop melodies. To write one, take a 2-4 note idea and repeat it one step higher, then one step higher again.","listen":["Listen for the same little shape heard two or three times in a row.","Check whether each repeat starts higher (a rising sequence) or lower (a falling sequence).","Hum the first pattern and see if the next one has the same shape on new notes."],"example":"In the bridge the violins play a rising **sequence**, repeating the same four-note figure a step higher each time, which builds tension before the chorus returns."},"Melodic devices>Melisma":{"what":["A melisma is one syllable of text sung over a group of different notes. Music that does this a lot is called melismatic. The opposite is syllabic, where each syllable gets just one note.","In a score a melisma is shown with a slur over the notes and a line after the syllable in the lyrics, so the singer knows to keep holding the same vowel."],"use":"Melismas show off the voice and draw attention to an important word. You hear them in Gregorian chant, Baroque choral music, gospel singing and R&B ballads, where singers often decorate the last word of a line. When you write a song, keep most of it syllabic so the words are clear, and save a melisma for one key word.","listen":["Follow the words: does one vowel keep going while the notes change?","Listen for runs of quick notes on a single syllable, often at the end of a line.","Compare with the verses, which are often syllabic so the words are easy to follow."],"example":"In the final chorus the singer uses a **melisma** on the word 'love', spreading one syllable over a run of quick notes, which highlights the emotion of the lyric."},"Melodic devices>Chromaticism":{"what":["Chromaticism means using notes from outside the key, shown by extra sharps, flats or naturals that are not in the key signature. Chromatic lines often move by semitone, the smallest step on a keyboard (from one key to the very next one, black or white).","A melody in C major uses only the white notes. Add C sharp, E flat or F sharp and the music becomes chromatic."],"use":"Composers use chromatic notes for tension, mystery or a sliding, slinky feel. Suspense and horror film music uses creeping chromatic lines, jazz uses them to slide between chord notes and Romantic composers used them for rich, emotional harmony. In your own melody, try joining two notes a tone apart with the semitone in between (a chromatic passing note).","listen":["Listen for melodies that slide up or down in tiny steps.","Notice notes that sound slightly unexpected or 'wrong' for the key.","Listen for bass lines or inner parts that creep by semitone under held chords."],"example":"The introduction uses **chromaticism**, with a bass line that slides down by semitones, which makes the mood uneasy and creepy."},"Melodic devices>Motif":{"what":["A motif is a short musical idea, often only two to six notes long, that is used again and again through a piece. You recognise it mostly by its rhythm and its shape.","A motif is smaller than a melody or a phrase. The point of a motif is that it gets developed: repeated, moved to new pitches, turned upside down, made longer or shorter or passed between instruments."],"use":"Composers build whole movements out of a single motif, which ties the music together. The four-note opening of Beethoven's Symphony No. 5 is the famous example. Film composers attach a motif to a character (a leitmotif) so you know who is on screen. When you compose, start with one short motif and change it bit by bit instead of writing lots of new ideas.","listen":["Listen for a short, catchy rhythm or shape that keeps returning.","Track it as it moves to different instruments or different pitches.","Notice when it is changed slightly but is still recognisable."],"example":"The short rising **motif** heard in the trumpets at the start returns throughout the piece, passed to the strings and played lower, which ties the whole work together."},"Melodic devices>Ornamentation":{"what":["Ornamentation means decorating a melody note with extra quick notes. Ornaments are written as small symbols above a note or as tiny notes before it, so the composer does not have to write out every decoration in full.","The main ones are the trill, the mordent, the turn and grace notes (the acciaccatura and the appoggiatura)."],"use":"Ornaments were essential in Baroque music, where performers were expected to add decoration, especially when a section repeated. You also hear them in Irish and Scottish fiddle and pipe music, in Indian classical music and in pop and R&B singing. Adding one ornament to a long note is an easy way to make your performance sound more stylish.","listen":["Listen for a quick flutter or shake on one note.","Notice tiny, quick notes squeezed in just before a main note.","Compare a repeated phrase with the first time you heard it: has it been decorated?"],"example":"When the theme repeats, the harpsichord decorates it with **ornaments**, including a **trill** on the long note before the cadence, which makes the return sound more elaborate."},"Ornamentation>Trill":{"what":["A trill is a rapid alternation between the written note and the note one step above it, kept going for the length of the written note. It is written as tr above the note, sometimes followed by a wavy line that shows how long it lasts.","The upper note comes from the key, so in C major a trill on D alternates D and E. In Baroque music a trill usually starts on the upper note; in later music it usually starts on the written note."],"use":"Trills add sparkle and excitement, and are often placed on a long note just before a cadence to build tension before the final chord. Flautists, violinists, pianists and singers all use them, and rock guitarists play a similar fast shake with hammer-ons and pull-offs. When you perform one, keep the two notes even and let the main note settle at the end.","listen":["Listen for a fast shimmer between two neighbouring notes.","Notice whether it sits on a long note, often near the end of a phrase.","Check that only two pitches are involved: that tells you it is a trill and not a run."],"example":"Just before the final cadence the flute plays a **trill** on a long note, and the tension it builds is released when the music lands on the tonic chord."},"Ornamentation>Mordent":{"what":["A mordent is a quick three-note ornament: the main note, the note next to it, then the main note again, all squeezed into the start of the written note. It is written as a short zigzag above the note.","There are two kinds. The lower mordent (zigzag with a vertical line through it) dips to the note below. The upper mordent (zigzag with no line) flicks up to the note above. A trill keeps shaking; a mordent does it once and stops."],"use":"Mordents give a note a crisp, sharp start, a little like an accent. They are very common in Baroque keyboard music, such as Bach's, and similar quick flicks are part of folk fiddle playing. When you play one, keep it quick and light so the main note still sounds like the important one.","listen":["Listen for a very quick wobble at the start of a note that then settles.","Count the shake: one quick there-and-back means a mordent, a long shake means a trill.","Notice whether the extra note is just above or just below the main note."],"example":"The harpsichord begins each phrase with a **mordent**, a quick flick down and back on the first note, which gives the opening a crisp, lively start."},"Ornamentation>Turn":{"what":["A turn is a four-note ornament that wraps around the main note: the note above, the main note, the note below, then back to the main note. It is written as a sideways S shape above the note.","If the symbol is written between two notes instead of directly above one, you play the main note first and then the turn on the way to the next note."],"use":"Turns make a melody sound graceful and flowing, and are often used to lead smoothly from one note to the next. They are common in music by Classical composers such as Haydn and Mozart, and singers add similar curls in jazz and soul. In your own performance, try a turn on a long note in the middle of a phrase rather than at the very end.","listen":["Listen for a quick curl of notes going above and below a main note.","Notice that it uses only three different pitches: the main note and its two neighbours.","Check whether it leads smoothly into the next melody note."],"example":"In the second phrase the violin decorates the long note with a **turn**, curling quickly above and below it, which gives the melody an elegant, graceful feel."},"Ornamentation>Grace notes":{"what":["Grace notes are small notes written just before a main note. An acciaccatura (say 'a-chak-a-TOO-ra', meaning 'crushed') has a slash through its stem and is played as fast as possible, crushed against the main note.","An appoggiatura (say 'a-poj-a-TOO-ra', meaning 'leaning') has no slash. It leans on the main note and takes time from it, usually about half its value, so it sounds like a sigh."],"use":"Acciaccaturas add a quick snap or bite to a note and turn up everywhere from classical piano to folk fiddle; guitarists and singers do the same thing when they flick into a note. Appoggiaturas are expressive: the leaning note usually clashes with the chord and then resolves, which is why they sound emotional in slow music. Try an acciaccatura in a bright, quick tune and an appoggiatura in a sad, slow one.","listen":["A quick flick into a note that does not change the rhythm is an acciaccatura.","A note that leans on the beat, clashes with the harmony and then slides by step onto the main note is an appoggiatura.","Listen for whether the extra note takes noticeable time or is almost instant."],"example":"The melody leaps up to an **appoggiatura** on the strong beat, which clashes with the chord and then resolves down a step, so the phrase sounds like a sigh."},"Pitch>Scales":{"what":["A scale is a set of notes arranged in order from low to high, and it gives a piece its tonality. The scale a composer picks shapes the whole mood of the music.","In Stage 5 you sort scales by how many notes they have, and you meet scales with a strong character of their own: blues, whole-tone, chromatic, harmonic minor, Indian ragas and Arabic maqamat."],"use":"Composers pick a scale for the colour it gives. The blues scale sounds gritty and soulful, the whole-tone scale dreamy and floating and the harmonic minor exotic and dramatic. Ragas and maqamat come with rules about how the notes are used as well as which notes to use. When you compose, write the same short melody in two different scales and compare the moods.","listen":["Listen for whether the music sounds major, minor or something else.","Notice any unusual gaps or bends between notes.","Ask whether there is a strong home note, or whether the music seems to float."],"example":"The opening uses the **whole-tone scale**, which gives a floating, dreamlike mood, but the second section switches to the **harmonic minor**, whose raised 7th sounds far more dramatic."},"Scales>By number of notes":{"what":["Scales can be sorted by how many different notes they have in one octave. The top note, which repeats the bottom one, is not counted. Pentatonic scales have five notes, hexatonic scales have six and heptatonic scales have seven.","The names come from Greek numbers: penta means five, hexa six and hepta seven."],"use":"Fewer notes usually means a simpler, more open sound with fewer clashes, which is why pentatonic tunes feel folk-like and are easy to improvise on. Seven-note scales give the full set of steps that major and minor harmony is built on. When you improvise, start with a pentatonic scale, then add the missing notes one at a time.","listen":["Listen for gaps in a melody: a missing step often means a pentatonic or hexatonic scale.","Notice whether every step sounds the same size, as in the whole-tone scale.","Hum the notes of the melody and count how many different pitches you hear."],"example":"The flute melody uses a **pentatonic** scale with no semitones to clash, while the chorus brings in the full **heptatonic** major scale, which makes the harmony richer."},"By number of notes>Pentatonic":{"what":["A pentatonic scale has five different notes. The major pentatonic is a major scale with the 4th and 7th notes left out: C, D, E, G and A in C major. Playing only the black notes on a keyboard also gives a pentatonic scale.","Because it has no semitones, none of its notes clash badly with each other."],"use":"Pentatonic scales are found in folk music all over the world, including Scottish, Chinese, Japanese and West African music, and in blues, rock and pop. The minor pentatonic (A, C, D, E, G) is the basis of most rock guitar solos. It is the easiest scale to improvise with, because almost any note sounds right.","listen":["Listen for a melody that sounds open and simple, with no tense semitone steps.","Notice small jumps (a minor 3rd) where a major scale would move by step.","Listen for a bluesy but uncomplicated guitar solo, which is often minor pentatonic."],"example":"The melody uses the **pentatonic** scale, which gives it an open, folk-like sound with no clashing semitones."},"By number of notes>Hexatonic":{"what":["A hexatonic scale has six different notes in each octave. Two common ones are on this map: the blues scale (C, E flat, F, F sharp, G, B flat) and the whole-tone scale (C, D, E, F sharp, G sharp, A sharp).","They sound completely different, which shows that the size of the gaps between the notes matters as much as how many notes there are."],"use":"Composers and improvisers use hexatonic scales for a particular colour. Blues and rock players use the blues scale for gritty solos and riffs, and Debussy and film composers use the whole-tone scale for dreamy or magical moments. When you improvise, try the blues scale over a 12-bar blues.","listen":["Listen for the blue note (F sharp in C) in a bluesy melody.","Notice a floating, unsettled sound where every step is the same size: that is the whole-tone scale.","Count the different pitches in a repeated riff."],"example":"The guitar riff is built on the **blues scale**, a **hexatonic** scale, and its flattened 5th gives the riff a gritty edge.","fig":[{"file":"s5_scale_blues.png","caption":"The C blues scale: six different notes"},{"file":"s5_scale_wholetone.png","caption":"The whole-tone scale on C: also six notes, but every step is a tone"}]},"By number of notes>Heptatonic":{"what":["A heptatonic scale has seven different notes in each octave. The major scale, every form of the minor scale and the modes (such as Dorian) are all heptatonic.","Each one has its own pattern of tones and semitones. The major scale goes tone, tone, semitone, tone, tone, tone, semitone. Moving where the semitones fall changes the mood."],"use":"Most Western music, from classical to pop, is built on heptatonic scales because they give a full set of chords to work with. Many Indian ragas and Arabic maqamat also use seven notes. When you compose, choose between major, minor or a mode like Dorian to set the mood before you write a single note.","listen":["Listen for melodies that move smoothly by step through every note of the key.","Decide whether it sounds major (bright) or minor (darker).","Notice a slightly unusual flavour that may mean a mode, such as the raised 6th of Dorian."],"example":"The verse uses the **heptatonic** natural minor scale for a dark, serious mood, and the chorus brightens into the relative major.","fig":[{"file":"scale_cmaj_tts.png","caption":"C major, a heptatonic scale: seven notes and the pattern of tones and semitones"}]},"Scales>Blues":{"what":["The blues scale has six notes. On C it is C, E flat, F, F sharp, G and B flat. It is the minor pentatonic scale (C, E flat, F, G, B flat) with one extra note: the flattened 5th (F sharp, also written G flat), called the blue note.","The blue note sits a semitone between the 4th and 5th, and it is usually played quickly in passing or bent into."],"use":"The blues scale is the sound of blues, rock, jazz and soul. Guitarists bend into the blue note, singers slide through it and pianists crush it against the note next to it. It works over all three chords of a 12-bar blues, which makes it a great choice for a first improvisation. Use the blue note as a passing note rather than landing on it.","listen":["Listen for a gritty, slightly 'off' note between the 4th and 5th of the key.","Notice bends and slides into notes, especially on guitar and voice.","Listen for flattened 3rds and 7ths in the melody sounding against major chords underneath."],"example":"The saxophone solo uses the **blues scale**, bending through the flattened 5th, which gives it a raw, soulful sound."},"Scales>Whole-tone":{"what":["A whole-tone scale moves by a tone at every step, so it has no semitones at all. On C it is C, D, E, F sharp, G sharp and A sharp, then C again: six notes.","Because every step is the same size, no note sounds more like home than any other, and the music seems to float without a clear key."],"use":"Debussy used the whole-tone scale for misty, dreamy effects. Film and TV music uses it for dream sequences, magic and moments of confusion, often on harp or celesta. Try playing a whole-tone scale up and down quickly on a keyboard with the sustain pedal held down to hear the effect.","listen":["Listen for a melody or run where every step sounds equally spaced.","Notice music that seems to drift with no strong home note.","Listen for blurry, shimmering harp or piano runs."],"example":"As the scene changes to a dream, the harp plays rippling runs on the **whole-tone scale**, which removes any sense of a home key and makes the music feel weightless."},"Scales>Chromatic":{"what":["The chromatic scale uses all 12 notes in the octave and moves by a semitone at every step: every white and black key on the keyboard, in order.","Going up it is usually written with sharps (C, C sharp, D, D sharp...) and coming down with flats (C, B, B flat, A, A flat...)."],"use":"Composers use chromatic scales for quick runs, slides and moments of tension, in everything from classical piano music to cartoon and horror soundtracks. A chromatic line in the bass or an inner part adds colour under a melody. When you compose, use a short chromatic run to slide into an important note.","listen":["Listen for runs where every step is a tiny semitone.","Notice sliding, creeping or slithering passages.","Compare it with a major scale run, which has bigger steps and sounds more settled."],"example":"In the build-up the strings climb a **chromatic scale**, one semitone at a time, which increases the tension before the climax."},"Scales>Harmonic minor":{"what":["The harmonic minor scale is the natural minor scale with the 7th note raised by a semitone. In A minor, G becomes G sharp: A, B, C, D, E, F, G sharp, A.","Raising the 7th leaves a gap of three semitones (an augmented 2nd) between notes 6 and 7, F to G sharp, which gives the scale its exotic sound. The G sharp also pulls strongly up to the home note A."],"use":"The raised 7th makes chord V major (E major in A minor), which gives a strong perfect cadence in a minor key. That is why the scale is called 'harmonic'. In a melody the augmented 2nd sounds dramatic or Middle Eastern, and you hear it in classical music, film scores and metal guitar. Try an F to G sharp step in an A minor melody to hear it.","listen":["Listen for a stretched, exotic-sounding step near the top of a minor melody.","Notice a strong pull back to the home note at the ends of phrases.","Listen for a major chord V at a cadence in a minor-key piece."],"example":"The melody uses the **harmonic minor** scale, and the wide step from the 6th to the raised 7th gives the passage a tense, exotic flavour."},"Scales>Raga (India)":{"what":["A raga is the framework for a melody in Indian classical music. It is more than a scale: each raga has its own notes going up and going down (which can differ), typical phrases, important notes to dwell on and ornaments such as slides between notes.","Each raga is also linked with a mood and often a time of day or a season. Raga Bhairav, shown on the card, is a morning raga."],"use":"Musicians do not play a fixed tune. They improvise within the raga's rules, usually starting with a slow, free section (the alap) with no drums, then adding a repeating rhythmic cycle (the tala) played on tabla. The sitar or voice carries the melody over a drone, often played on the tanpura. You can try it by improvising slowly over a drone, using only the notes of one raga.","listen":["Listen for a constant drone underneath, usually the home note (Sa) and the 5th (Pa).","Notice slides and bends between notes (called meend).","Listen for a slow, free opening that gradually speeds up and brings in the drums."],"example":"The performance opens with a slow, unmetred **alap** in which the sitar explores the notes of the **raga** over a **drone**, before the tabla enters with a steady tala and the tempo increases."},"Raga (India)>Sargam":{"what":["Sargam is the set of note names used in Indian classical music: Sa, Re, Ga, Ma, Pa, Dha, Ni, then Sa again an octave higher. It works like do, re, mi in solfa: the names show a note's place in the scale, not a fixed pitch.","Sa is the home note and can be set at whatever pitch suits the singer or instrument. Sa and Pa (the 5th) never change, but Re, Ga, Dha and Ni can be flattened and Ma can be sharpened, depending on the raga."],"use":"Students in India learn ragas by singing them in sargam, and singers sometimes sing the sargam syllables as part of a performance, often in fast, showy passages. You can use sargam the same way you use solfa: sing a melody on the note names to learn its shape before you play it.","listen":["Listen for a singer singing note names (Sa, Re, Ga) instead of words.","Notice which note keeps returning as home: that is Sa.","Listen for the drone, which usually sounds Sa and Pa."],"example":"Near the end the singer switches to **sargam**, singing the note names in rapid patterns, which shows off their skill and the shape of the **raga**."},"Raga (India)>Sitar":{"what":["The sitar is a long-necked plucked string instrument from northern India. It has a gourd body, curved movable frets and up to about 20 strings: six or seven that are played (some of them drone strings) and a set of sympathetic strings underneath that are not plucked but ring on their own when their notes are played.","The player plucks with a wire pick worn on the finger and pulls the string sideways across a fret to bend the pitch."],"use":"In a raga performance the sitar plays the melody, from the slow alap to fast, dazzling passages, with the tabla accompanying. Its long bends let it copy the slides of the voice. Ravi Shankar made the sitar famous outside India, and George Harrison played it on the Beatles' Norwegian Wood.","listen":["Listen for a bright, buzzy, metallic plucked tone.","Notice a shimmering halo of sound after each note: the sympathetic strings ringing.","Listen for long bends and slides on a single string."],"example":"The **sitar** plays the melody with long bends between notes, and its sympathetic strings ring on after each note, which gives a shimmering, buzzing timbre."},"Raga (India)>Tabla":{"what":["The tabla is a pair of hand drums from northern India. The smaller drum (the dayan, played with the right hand) is tuned to a definite pitch, usually Sa of the raga. The larger bass drum (the bayan) is played with the other hand, and the player presses the heel of the hand into the skin to bend its pitch up and down.","Both drums have a black circle of paste on the skin, which gives the tabla its ringing, pitched sound."],"use":"The tabla keeps the tala, the repeating rhythmic cycle of an Indian performance, such as teental with 16 beats. Players learn rhythms as spoken syllables called bols (such as 'dha', 'dhin' and 'na') before they play them. The tabla player also trades fast improvised passages with the sitar or singer. In class you could speak a bol pattern before playing it on a drum.","listen":["Listen for a high, ringing drum tuned to the home note.","Notice the low drum's pitch swooping up and down.","Feel for a long repeating cycle with a strong arrival on its first beat (called sam)."],"example":"The **tabla** enters with a steady 16-beat **tala**, its bass drum swooping in pitch, which gives the performance a driving pulse beneath the sitar."},"Scales>Maqam (Arabic music)":{"what":["A maqam (plural maqamat) is the system for melody in Arabic music. Like a raga, it is a scale plus rules: which notes to rest on, typical phrases and how the melody moves from one part of the scale to another.","Many maqamat use quarter-tones, notes halfway between two piano keys, which is why they cannot be played exactly on a piano. Maqam Hijaz, shown on the card, has no quarter-tones but has a stretched step of three semitones between its 2nd and 3rd notes."],"use":"Players and singers improvise within the maqam, often starting with a free, unmetred solo called a taqsim on an instrument such as the oud. Performers move from one maqam to another to change the mood, a bit like a modulation. To hear quarter-tones, listen to a melody in maqam Rast or Bayati and compare it with a Western major or minor scale.","listen":["Listen for notes that sound 'in between' Western notes.","Notice a free, improvised solo opening with no steady beat.","Listen for ornamented, sliding melodies over a repeating drum rhythm."],"example":"The **oud** opens with a free **taqsim** in **maqam** Bayati, whose 2nd note is a quarter-tone that sounds flatter than any note on a piano."},"Maqam (Arabic music)>Oud":{"what":["The oud is a pear-shaped, short-necked lute played across the Middle East and North Africa. It usually has 11 strings, set out as five pairs plus a single low string, and it is plucked with a long pick.","Its neck has no frets, so the player can slide between notes and play the quarter-tones that many maqamat need."],"use":"The oud is often the lead melody instrument in Arabic music, playing taqsim improvisations and accompanying singers. It is the ancestor of the European lute. Players shape the maqam with slides, ornaments and fast repeated plucks on one note (tremolo).","listen":["Listen for a warm, deep plucked tone, darker than a guitar.","Notice smooth slides between notes, possible because there are no frets.","Listen for fast repeated plucks on one note."],"example":"The **oud** plays an ornamented melody with slides between the notes, and its fretless neck lets it reach the **quarter-tones** of the maqam."},"Pitch>Harmonic devices":{"what":["Harmonic devices are the ways composers use notes and chords sounding together. They include consonance and dissonance (stable or clashing sounds), cadences (chord pairs that end phrases), extended chords (triads with extra notes), modulation (changing key) and pedal points (a held bass note under changing chords)."],"use":"Harmony controls tension and release. A composer builds tension with dissonance, a pedal point or a surprise chord, then releases it with consonance and a perfect cadence. Modulation keeps a long piece fresh. When you compose, plan where each phrase ends and which cadence it gets.","listen":["Listen to whether the chords feel tense or relaxed.","Notice how each phrase ends: finished, unfinished or surprising.","Listen for a low note that stays put while the chords change above it.","Notice a sudden lift or change of colour that may be a key change."],"example":"A **pedal point** in the bass creates **dissonance** against the changing chords above, and the tension is finally released by a **perfect cadence**."},"Harmonic devices>Consonance":{"what":["Consonance is when notes sounding together blend smoothly and feel stable and at rest. Consonant intervals include octaves, perfect 5ths, 3rds and 6ths. Major and minor triads are consonant chords.","Consonance only makes sense next to its opposite, dissonance. Composers move between the two to create tension and release."],"use":"Consonance gives the listener a sense of rest and arrival, so you hear it at the ends of phrases and throughout lullabies, hymns and gentle ballads. Music that stays consonant all the time can sound sweet or bland, so composers save the most settled chords for moments of arrival. In your compositions, end each section on a consonant chord such as the tonic triad.","listen":["Listen for chords that sound smooth and settled.","Notice the moment tension is released, often at the end of a phrase.","Check whether the music sounds as if it could stop right there."],"example":"After the clashing chords of the middle section, the music returns to **consonant** major triads, which makes the ending sound calm and resolved."},"Harmonic devices>Dissonance":{"what":["Dissonance is when notes sounding together clash and sound tense or unstable, so the ear wants them to move on. Dissonant intervals include 2nds, 7ths and the tritone (an augmented 4th, such as C to F sharp). A cluster of notes right next to each other is very dissonant.","When a dissonant note moves to a consonant one, it resolves."],"use":"Dissonance creates tension, drama or unease. Film composers use it for horror and suspense, jazz musicians use it to spice up chords and appoggiaturas use it for emotional pull. Composers usually resolve it so the tension is released, although modern composers sometimes leave it unresolved. In your own work, try one clashing chord just before your final cadence.","listen":["Listen for chords that sound harsh, crunchy or uneasy.","Notice notes rubbing against each other a step apart.","Listen for the moment the clash resolves, which shows you where the dissonance was."],"example":"The strings hold a **dissonant** cluster under the melody, and the unease it creates only lifts when the cluster **resolves** onto a major chord."},"Harmonic devices>Cadence":{"what":["A cadence is the pair of chords at the end of a phrase. Like punctuation in a sentence, it tells the listener whether the music has finished, paused or been interrupted.","Cadences are named by their chords, using Roman numerals for the scale note each chord is built on. In C major, I is C, IV is F, V is G and vi is A minor (lower case means a minor chord). The four main cadences are perfect, plagal, imperfect and interrupted."],"use":"Composers choose cadences to shape a piece: an imperfect cadence in the middle of a melody keeps it moving, and a perfect cadence at the end closes it. Hymns often finish with a plagal 'Amen'. Interrupted cadences delay the ending. When you compose, end your first phrase on V and your last phrase with V to I.","listen":["Focus on the last two chords of each phrase.","Ask whether it sounds finished (perfect or plagal), left hanging (imperfect) or surprising (interrupted).","Follow the bass: a bass that moves from the 5th note of the key to the home note usually means a perfect cadence."],"example":"The first phrase ends with an **imperfect cadence** that sounds unfinished, and the answering phrase closes with a **perfect cadence**, which gives the melody a question and answer shape."},"Cadence>Perfect: V – I":{"what":["A perfect cadence is chord V followed by chord I. In C major that is G major (G, B, D) moving to C major (C, E, G). It sounds completely finished, like a full stop.","Two things make it so strong: the bass moves from G to C (the 5th note of the key to the home note), and the leading note B rises a semitone to the home note C. Adding a 7th to chord V (G7) makes the pull even stronger."],"use":"Almost every piece of classical music ends with a perfect cadence, and it closes phrases and sections in hymns, folk songs and pop. Composers sometimes repeat it several times at the very end to make the finish emphatic. In your compositions, use V to I for your final cadence and move the leading note up to the tonic.","listen":["Listen for a strong sense of arrival and completion at the end of a phrase.","Follow the bass as it moves from the 5th note of the key to the home note.","Listen for the melody stepping up from the leading note to the tonic, or down to it from the 2nd."],"example":"The piece ends with a **perfect cadence**, V to I in the home key, which gives a strong, final sense of completion."},"Cadence>Plagal: IV – I":{"what":["A plagal cadence is chord IV followed by chord I. In C major that is F major (F, A, C) moving to C major (C, E, G). It sounds finished, but softer and gentler than a perfect cadence.","It is called the Amen cadence because hymns traditionally set the word 'Amen' to these two chords. The note C is in both chords, so it can stay still while the other notes step down."],"use":"Plagal cadences give a warm, peaceful ending, often added after a perfect cadence has already closed the piece, as in the 'Amen' at the end of a hymn. They are also common in gospel, rock and pop, where IV to I has a laid-back, open sound. In your own music, try IV to I for a calm last chord change instead of V to I.","listen":["Listen for a gentle, settled ending without the strong pull of a perfect cadence.","Notice the bass moving from the 4th note of the key to the home note.","Listen for an 'A-men' feel: two chords, with the top note often staying the same."],"example":"The hymn closes with a **plagal cadence** on the word 'Amen', moving from chord IV to I, which gives a soft, peaceful finish."},"Cadence>Imperfect: ends on V":{"what":["An imperfect cadence is any cadence that ends on chord V. The chord before it is often I, ii or IV (in C major: C to G, D minor to G or F to G). It sounds unfinished, like a comma or a question.","Chord V wants to move on to I, so stopping on it leaves the listener waiting for the next phrase."],"use":"Composers put imperfect cadences in the middle of a melody, often at the end of the first phrase, so the music feels as if it must continue. The next phrase often answers with a perfect cadence, a question and answer pattern found in folk songs, classical themes and pop verses. In your compositions, end your first phrase on V to set up the answer.","listen":["Listen for a phrase that stops but sounds open or incomplete.","Notice that the music sounds as if it is asking a question.","Check what comes next: a following phrase that ends on I confirms the first one was imperfect."],"example":"The first phrase ends with an **imperfect cadence** on chord V, which sounds like a question and makes the listener expect an answering phrase."},"Cadence>Interrupted: V – vi":{"what":["An interrupted cadence is chord V followed by chord vi instead of the expected I. In C major that is G major (G, B, D) moving to A minor (A, C, E).","Chord vi shares two notes with chord I (C and E), so it sounds almost right, but the bass steps up to A instead of landing on C. The ear expects a full stop and gets a surprise minor chord. It is also called a deceptive cadence."],"use":"Composers use an interrupted cadence to delay the ending and add surprise or a touch of sadness. Often the phrase is then repeated and finishes properly with a perfect cadence, which makes the final arrival feel stronger. Try V to vi near the end of your piece, then repeat the phrase and end it V to I.","listen":["Listen for a phrase that seems about to finish but swerves somewhere unexpected.","Notice a minor chord where you expected the bright home chord.","Listen for the bass stepping up one note instead of landing on the home note."],"example":"Just as the music seems about to end, an **interrupted cadence** moves from V to vi, and the minor chord delays the finish until the phrase repeats and closes with a perfect cadence."},"Harmonic devices>Extended chords":{"what":["An extended chord is a triad with extra notes stacked on top, each a 3rd above the last. Add one more 3rd to C major (C, E, G) and you get a 7th chord: C7 adds B flat and Cmaj7 adds B. Another 3rd gives a 9th (D), and after that come 11ths and 13ths.","The chord symbol names the highest extension, so C9 contains C, E, G, B flat and D."],"use":"Extended chords sound rich, smooth and colourful, and they are the normal harmony in jazz, soul, funk and R&B. Dominant 7th chords drive blues and funk, and major 7th chords give a dreamy, mellow sound. Pianists and guitarists often leave out the 5th to keep the chord clear. In your songs, swap a plain chord for its 7th version and listen to the change in colour.","listen":["Listen for chords that sound richer or softer than plain triads.","Notice a slightly unresolved, jazzy sound, even on the final chord.","Listen for the mellow, dreamy colour of major 7th chords in slow songs."],"example":"The keyboard plays **extended chords**, mostly major 7ths and 9ths, which give the ballad a smooth, jazzy sound."},"Harmonic devices>Modulation":{"what":["Modulation is when the music changes key partway through a piece, so a new note becomes home. The most common moves are to a closely related key, such as from C major to G major (the dominant) or to A minor (the relative minor).","Sometimes a new key signature shows it. More often the composer just adds accidentals (for example, F sharps start appearing in a C major piece) and a cadence in the new key confirms it."],"use":"Modulation adds variety and drama to a longer piece. In a Classical sonata the second theme is usually in a new key, often the dominant. Pop songs often lift the final chorus up a semitone or a tone for a big finish. In your compositions, try repeating your chorus one tone higher at the end.","listen":["Listen for a sudden lift or shift in brightness, especially near the end of a song.","Notice when the old home note no longer sounds like home.","Listen for a phrase ending with a strong cadence on an unfamiliar chord."],"example":"For the final chorus the song **modulates** up a tone, which lifts the energy and makes the last chorus sound brighter and more triumphant."},"Harmonic devices>Pedal point":{"what":["A pedal point (or pedal) is a note held or repeated in the bass while the chords above it change. It is usually the tonic (home note) or the dominant (5th note). Some of the chords above fit with it and some clash, which builds tension.","The name comes from organ music, where the player holds a low note with the foot pedals. A pedal in a high part is called an inverted pedal."],"use":"A dominant pedal near the end of a piece builds suspense before the final cadence, and a tonic pedal at the start or end gives a feeling of stability. Rock and electronic music use a repeated bass note under changing chords to drive a section along. Try holding one bass note for four bars while your chords change above it.","listen":["Listen to the lowest part: is one note staying put while the harmony moves?","Notice clashes building between the bass and the chords above.","Listen for the release when the bass finally moves at a cadence."],"example":"Under the build-up the bass holds a **pedal point** on the dominant, G, while the chords change above it, and the tension grows until the final cadence."},"Pitch>Other ways of notating music":{"what":["Staff notation is only one way to write music down. Different styles use the notation that suits them best: lead sheets and chord charts in jazz and pop, the piano roll in music software and number (cipher) notation for Javanese gamelan.","Each one shows some things clearly and leaves the rest to the performer."],"use":"Musicians choose the notation that fits how they work. Jazz and pop players read a lead sheet and make up their own parts, a rhythm section reads a chord chart, producers edit notes in a piano roll and gamelan players read numbers. Being able to read all of these lets you work in many styles.","listen":["When you hear a band, think about which parts were written out and which were made up from the chords.","Compare two versions of the same song: the melody and chords stay the same while the accompaniment changes."],"example":"The band reads from a **lead sheet**, so the singer follows the written melody while the guitarist and pianist make up their parts from the **chord symbols**."},"Other ways of notating music>Lead sheet":{"what":["A lead sheet shows the melody on a stave, the lyrics underneath and chord symbols (such as C, Am or G7) above. It does not show bass lines, accompaniment patterns or drum parts.","The players work out their own parts from the chords, so two bands reading the same lead sheet can sound quite different."],"use":"Lead sheets are the standard way to share songs in jazz and pop, and jazz books of standard songs are full of them. The singer reads the melody and lyrics while a pianist or guitarist turns the chord symbols into an accompaniment. When you write a song, a lead sheet is the quickest way to get it on paper.","listen":["Listen for the melody, which is the only part a lead sheet writes out.","Notice the accompaniment changing from verse to verse while the chords stay the same.","Compare two cover versions of a song to hear what the players added."],"example":"Working from a **lead sheet**, the pianist plays the **chord symbols** as broken chords in the verse and full chords in the chorus, while the singer follows the written melody."},"Other ways of notating music>Chord chart":{"what":["A chord chart shows the chords and how many beats each one lasts, but no melody. Barlines divide it into bars and slashes show the beats, so in 4/4 four slashes under a chord means four beats of that chord.","Two chords in one bar share it: F and G in a 4/4 bar usually means two beats each."],"use":"Chord charts are used by rhythm sections (guitar, bass, keyboard and drums) in bands, church groups and recording sessions. They are quick to write and read, and the players choose their own rhythms and voicings. Some charts also mark 'hits', rhythms the whole band plays together. When your band learns a song, write a chord chart so everyone knows the form.","listen":["Count how many beats each chord lasts.","Listen for where the chords change, usually on beat 1.","Notice moments where the whole band hits the same rhythm together, which a chart might mark."],"example":"The rhythm section plays from a **chord chart**, strumming four beats on each chord, which keeps the harmony steady under the singer."},"Other ways of notating music>Piano roll":{"what":["A piano roll is how a digital audio workstation (DAW) such as GarageBand, Logic or Ableton Live shows MIDI notes. A keyboard runs up the left side for pitch, time runs from left to right and each note is a bar whose length shows how long it lasts.","Instead of note values and clefs you see a grid: higher bars are higher notes and longer bars are longer notes. Colour or shading often shows velocity (how hard the note is played)."],"use":"Producers draw, move and stretch notes in the piano roll to write beats, bass lines and melodies, and to fix timing (quantising) or change how loud each note is. It is the main way electronic, hip hop and pop music is written. Use it in your own DAW projects to tidy up a recorded part or to build a pattern note by note.","listen":["Listen for perfectly even timing, which suggests notes were quantised in a piano roll.","Notice repeated notes at exactly the same volume, a sign of programmed MIDI.","Compare a programmed part with a live performance of the same part."],"example":"The synth bass line was programmed in a **piano roll** and **quantised**, so every note lands exactly on the beat, which gives the track a tight, mechanical feel."},"Other ways of notating music>Gamelan cipher notation":{"what":["Gamelan cipher notation (called kepatihan) writes music as numbers instead of notes on a stave. Each number is a note of the gamelan's scale, a dot above or below a number moves it to a higher or lower octave and a dot on its own means the previous note carries on (no new note is struck).","It usually shows just the core melody, called the balungan. Players work out the patterns for their own instruments from it."],"use":"In Javanese gamelan most players work from the balungan in cipher notation, then decorate it according to their instrument's role, while the gongs mark out the cycle with the big gong at the end. Cipher notation is also a handy way to write music for classroom instruments. Write your own short melody in numbers and play it on a xylophone.","listen":["Listen for the steady core melody on the metallophones (instruments with metal bars).","Notice faster parts decorating that melody above it.","Listen for the big gong marking the end of each cycle."],"example":"The metallophones play the core melody written in **cipher notation**, while faster instruments decorate it and the large gong marks the end of each **colotomic** cycle."},"Rhythmic devices>Hemiola":{"what":["A hemiola is when two bars of three beats are played as if they were three bars of two beats. The time signature stays the same, but the accents move so you feel 2 + 2 + 2 instead of 3 + 3.","It is a kind of cross-rhythm that lasts only a short time, usually just before a cadence."],"use":"Composers use a hemiola to slow the feel of the music and signal that a phrase is about to end, without changing the tempo. It is very common in Baroque dances such as the minuet and the courante, and in some Latin American music. Try it in a 3/4 melody: write minims across the bar line in the bars before your final note.","listen":["Count in 3 and notice when the music seems to stop fitting your counting.","Listen for long notes that cross the bar line just before a cadence.","Feel the music settle back into 3 once the phrase ends."],"example":"Just before the cadence the composer uses a **hemiola**, so the last two bars of 3/4 are felt in 2, which makes the phrase broaden out and sound finished.","fig":[{"file":"rm_s5_hemiola.png","caption":"Bars 3 and 4 are still in 3/4, but the minims make them feel like three groups of 2"}]},"Range and register>Transposing instruments":{"what":["A transposing instrument is one where the note the player reads is not the note that actually sounds. A B flat clarinet or B flat trumpet sounds a tone lower than written, so a written D comes out as a C.","Concert pitch means the real sounding notes, the ones a piano would play. The horn in F, alto saxophone and guitar are other examples."],"use":"Instruments are written this way so players can use the same fingerings across the different sizes of their instrument family. When a band or orchestra plays together, each transposing part is written in its own key so everyone sounds in the same concert key. If you write a part for a clarinet or trumpet, you need to write it a tone higher than you want it to sound.","listen":["You will not hear the transposition itself, because the music sounds in concert pitch.","Notice it when a clarinet or trumpet player and a pianist read the same notes and they do not match.","Compare the key signatures on a score: the transposing parts will look different."],"example":"The trumpet part is written in D major because the **B flat trumpet** is a transposing instrument, so it sounds in C major with the rest of the band.","fig":[{"file":"rm_s5_transposing.png","caption":"A B flat clarinet reads D major but sounds a tone lower, in C major"}]},"Developing musical material>Retrograde":{"what":["Retrograde means playing a musical idea backwards, so the last note comes first and the first note comes last. The rhythm is reversed too.","It is different from inversion. Inversion turns the shape upside down, while retrograde plays it from back to front."],"use":"Composers use retrograde to get new material that is still closely related to the original idea. It turns up in Baroque puzzle pieces and is an important tool in twentieth-century serial music. It can be hard to hear, so composers often combine it with other changes. Try writing a short motif and then playing it backwards as the answer phrase.","listen":["Listen for a familiar group of notes coming back in reverse order.","Notice whether a rising idea now falls, or a long-short rhythm is now short-long."],"example":"In the second phrase the motif returns in **retrograde**, with its notes in reverse order, so it sounds new but still connected to the opening.","fig":[{"file":"rm_s5_retrograde.png","caption":"The motif, then the same notes and rhythm backwards"}]}}};
let MORE=MORES[4];


/* ---------- build ---------- */
const stage=document.getElementById("stage"), world=document.getElementById("world"), bar=document.getElementById("bar");
const SVGNS="http://www.w3.org/2000/svg";
const svg=document.createElementNS(SVGNS,"svg"); world.appendChild(svg);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* The expand/collapse tween always plays: many Windows machines disable OS
   "Animation effects", which Chrome reports as reduce-motion, and the diagram
   reads as broken without it. Other flourishes still respect the setting. */
const DUR=520;
const nodes=[];
let root, narrow=window.innerWidth<720;
const mk=(tag,cls,text)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e};

function build(src,parent,depth,branch){
  const o={t:src.t,d:src.d,k:src.k,parent:parent,depth:depth,branch:branch,side:1,children:[],open:false,vis:false,cx:0,cy:0,tx:0,ty:0};
  nodes.push(o);
  const el=mk("button","node d"+Math.min(depth,3)+(src.k?" "+src.k:"")+(src.c.length?" has":""));
  el.type="button";
  el.style.setProperty("--b",depth?"var(--c"+(branch+1)+")":"var(--ink)");
  el.style.setProperty("--o",depth?"var(--o"+(branch+1)+")":"var(--paper)");
  const card=mk("span","card"), body=mk("span","body");
  body.appendChild(mk("span","t",src.t));
  if(depth===0){ const st=mk("span","stave"); for(let i=0;i<5;i++) st.appendChild(mk("i")); body.appendChild(st) }
  if(src.d) body.appendChild(mk("span","def",src.d));
  const files=parent?IMG[parent.t+">"+src.t]:null;
  if(files){
    o.files=files; el.classList.add("pics"); let maxW=0;
    files.forEach(file=>{
      const m=META[file], r=m[0]/m[1];
      let w=Math.max(100,Math.min(300,Math.sqrt(17000*r))); w=Math.round(Math.min(w,150*r)); const hh=Math.round(w/r);
      maxW=Math.max(maxW,w);
      const pic=mk("span","pic"); pic.style.width=w+"px"; pic.style.height=hh+"px";
      const im=mk("img"); im.src="images/"+file; im.alt=m[2]; im.loading="lazy"; im.decoding="async"; im.draggable=false;
      pic.appendChild(im); body.appendChild(pic);
      pic.addEventListener("click",e=>{ e.stopPropagation(); if(!dragged) openPics(o,file) });
      if(m[3]){ const c=mk("span","credit",m[3]); c.style.maxWidth=Math.max(w,150)+"px"; body.appendChild(c) }
    });
    el.style.setProperty("--mw",Math.max(300,maxW+64)+"px");
  }
  const more=parent?MORE[parent.t+">"+src.t]:null;
  if(more){
    o.more=more;
    const b=mk("span","more","Read more"); b.title="Read more about "+src.t+" (R)";
    b.addEventListener("click",e=>{ e.stopPropagation(); if(!dragged||e.detail===0) openMore(o) });
    body.appendChild(b);
  }
  card.appendChild(body);
  if(src.c.length&&depth){ o.countEl=mk("span","count"); card.appendChild(o.countEl) }
  el.appendChild(card); world.appendChild(el); o.el=el; o.card=card;
  if(parent){
    o.link=document.createElementNS(SVGNS,"path");
    o.link.setAttribute("pathLength","1");
    o.link.style.stroke="var(--c"+(branch+1)+")";
    o.link.style.strokeWidth=depth===1?7:depth===2?4:2.5;
    svg.appendChild(o.link);
  }
  el.addEventListener("click",e=>onNodeClick(o,e));
  el.addEventListener("keydown",e=>onNodeKey(o,e));
  el.addEventListener("focus",()=>{ if(el.matches(":focus-visible")) reveal(o) });
  el.addEventListener("pointerenter",()=>light(o,true));
  el.addEventListener("pointerleave",()=>light(o,false));
  src.c.forEach((c,i)=>o.children.push(build(c,o,depth+1,depth===0?i:branch)));
  return o;
}
function light(o,on){ for(let p=o;p&&p.link;p=p.parent) p.link.classList.toggle("lit",on) }
function setSide(o,s){ o.side=s; o.el.classList.toggle("l",s<0); o.children.forEach(c=>setSide(c,s)) }
function applySides(){ root.children.forEach((c,i)=>setSide(c,narrow||i>=3?1:-1)) }

/* display order: first three sit left of the headline (top to bottom), last three right. Colours stay tied to the element. */
const ORDER=["Pitch","Duration","Dynamics and expression","Performing media and timbre","Texture","Structure"];

function measure(){
  world.classList.add("measuring");
  nodes.forEach(o=>{o.w=o.card.offsetWidth;o.h=o.card.offsetHeight});
  world.classList.remove("measuring");
}

/* ---------- layout ---------- */
const vgap=d=>d<=1?30:d===2?14:8;
const hgap=d=>d===0?(narrow?44:96):d===1?(narrow?48:64):44;
function sub(o){
  if(!o.open||!o.children.length){o.ch=0;return o.sh=o.h}
  let s=0; o.children.forEach((c,i)=>{s+=sub(c)+(i?vgap(c.depth):0)});
  o.ch=s; return o.sh=Math.max(o.h,s);
}
function place(o,edge,top,dir,list){
  o.tx=dir>0?edge:edge-o.w; o.ty=top+(o.sh-o.h)/2; list.push(o);
  if(o.open&&o.children.length){
    let y=top+(o.sh-o.ch)/2;
    const far=(dir>0?edge+o.w:edge-o.w)+dir*hgap(o.depth);
    o.children.forEach((c,i)=>{ if(i) y+=vgap(c.depth); place(c,far,y,dir,list); y+=c.sh });
  }
}
let vis=[], first=true, mapBox={x:0,y:0,w:1,h:1};
const leaving=new Set();
function layout(){
  const list=[root];
  root.tx=-root.w/2; root.ty=-root.h/2;
  [1,-1].forEach(dir=>{
    const kids=root.open?root.children.filter(c=>c.side===dir):[];
    let total=0; kids.forEach((c,i)=>{total+=sub(c)+(i?vgap(1):0)});
    let y=-total/2;
    kids.forEach((c,i)=>{ if(i) y+=vgap(1); place(c,dir*(root.w/2+hgap(0)),y,dir,list); y+=c.sh });
  });
  const now=new Set(list);
  nodes.forEach(o=>{
    const v=now.has(o);
    if(v&&(!o.vis||first)){
      const p=o.parent, idx=p?p.children.indexOf(o):0;
      if(leaving.has(o)) leaving.delete(o);
      else if(first||!p){ o.cx=o.tx; o.cy=o.ty }
      else { o.cx=p.cx+(p.w-o.w)/2; o.cy=p.cy+(p.h-o.h)/2 }
      const delay=(first?120+o.depth*140:30)+Math.min(idx,14)*24;
      o.el.style.setProperty("--delay",delay+"ms"); if(o.link) o.link.style.setProperty("--delay",delay+"ms");
      o.el.classList.remove("off","leaving"); if(o.link) o.link.classList.remove("off","leaving");
      if(o.files&&!o.eager){ o.eager=true; o.el.querySelectorAll("img").forEach(im=>im.loading="eager") }
    } else if(!v&&(o.vis||first)){
      if(first||!DUR){ o.el.classList.add("off"); if(o.link) o.link.classList.add("off") }
      else {
        let a=o.parent; while(a&&!now.has(a)) a=a.parent; a=a||root;
        o.tx=a.tx+(a.w-o.w)/2; o.ty=a.ty+(a.h-o.h)/2;
        o.el.classList.add("leaving"); if(o.link) o.link.classList.add("leaving");
        leaving.add(o);
      }
    }
    o.vis=v;
    o.el.classList.toggle("open",v&&o.open&&o.children.length>0&&o!==root);
    if(o.countEl) o.countEl.textContent=o.open?"−":o.children.length;
    if(o.children.length) o.el.setAttribute("aria-expanded",o.open?"true":"false");
  });
  vis=list; first=false; mapBox=bbox(vis);
}

/* ---------- view + animation ---------- */
let vc={x:0,y:0,k:1}, vs={x:0,y:0,k:1}, vt={x:0,y:0,k:1}, raf=0, t0=0;
const KMIN=.08, KMAX=2.4, zlabel=document.getElementById("zlabel");
function applyView(){
  world.style.transform="translate("+vc.x+"px,"+vc.y+"px) scale("+vc.k+")";
  let s=120*vc.k; while(s<70) s*=2; while(s>260) s/=2;
  stage.style.setProperty("--ps",s+"px"); stage.style.setProperty("--px",vc.x+"px"); stage.style.setProperty("--py",vc.y+"px");
  zlabel.textContent=Math.round(vc.k*100)+"%";
  drawMini();
}
function drawNode(o){
  o.el.style.transform="translate("+o.cx+"px,"+o.cy+"px)";
  if(o.link){
    const p=o.parent, dir=o.side;
    const x1=dir>0?p.cx+p.w:p.cx, y1=p.cy+p.h/2, x2=dir>0?o.cx:o.cx+o.w, y2=o.cy+o.h/2, mx=x1+dir*hgap(p.depth)/2;
    o.link.setAttribute("d","M"+x1+" "+y1+"H"+mx+"V"+y2+"H"+x2);
  }
}
function draw(){ vis.forEach(drawNode); leaving.forEach(drawNode); applyView() }
function startAnim(){
  vis.forEach(o=>{o.sx=o.cx;o.sy=o.cy}); leaving.forEach(o=>{o.sx=o.cx;o.sy=o.cy});
  vs={x:vc.x,y:vc.y,k:vc.k}; t0=performance.now();
  if(!raf) raf=requestAnimationFrame(frame);
}
function settle(){
  for(const o of vis){o.cx=o.tx;o.cy=o.ty}
  leaving.forEach(o=>{ o.cx=o.tx; o.cy=o.ty; o.el.classList.add("off"); o.el.classList.remove("leaving"); if(o.link){o.link.classList.add("off");o.link.classList.remove("leaving")} });
  leaving.clear();
  vc={x:vt.x,y:vt.y,k:vt.k};
}
function frame(now){
  raf=0;
  const p=DUR?Math.min(1,(now-t0)/DUR):1, e=1-Math.pow(1-p,4);
  const mv=o=>{o.cx=o.sx+(o.tx-o.sx)*e;o.cy=o.sy+(o.ty-o.sy)*e};
  vis.forEach(mv); leaving.forEach(mv);
  vc.x=vs.x+(vt.x-vs.x)*e; vc.y=vs.y+(vt.y-vs.y)*e; vc.k=vs.k+(vt.k-vs.k)*e;
  if(p>=1) settle();
  draw();
  if(p<1) raf=requestAnimationFrame(frame);
}
function finish(){ if(raf){cancelAnimationFrame(raf);raf=0} settle(); draw() }
function bbox(list){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  list.forEach(o=>{x0=Math.min(x0,o.tx);y0=Math.min(y0,o.ty);x1=Math.max(x1,o.tx+o.w);y1=Math.max(y1,o.ty+o.h)});
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
const topInset=()=>22;
function fit(list,instant){
  const W=stage.clientWidth,H=stage.clientHeight,pad=narrow?16:40,top=topInset(),bot=narrow?70:30,b=bbox(list||vis);
  let k=Math.min((W-2*pad)/b.w,(H-top-bot)/b.h,1.15);
  k=Math.max(k,narrow?.56:KMIN);
  vt.k=k;
  vt.x=b.w*k>W-2*pad?pad-b.x*k:W/2-k*(b.x+b.w/2);
  vt.y=top+(H-top-bot)/2-k*(b.y+b.h/2);
  if(instant){ vc={x:vt.x,y:vt.y,k:vt.k}; draw() } else startAnim();
}
function relayout(anchor){
  const ox=anchor?anchor.cx:0, oy=anchor?anchor.cy:0;
  layout();
  vt={x:vc.x,y:vc.y,k:vc.k};
  if(anchor&&anchor.vis){
    vt.x-=(anchor.tx-ox)*vc.k; vt.y-=(anchor.ty-oy)*vc.k;
    if(anchor.open) nudge([anchor].concat(anchor.children));
    nudge([anchor]);
  }
  startAnim();
}
function nudge(list){
  const W=stage.clientWidth,H=stage.clientHeight,pad=24,top=topInset(),b=bbox(list),k=vt.k;
  const l=vt.x+b.x*k, r=l+b.w*k, t=vt.y+b.y*k, bt=t+b.h*k;
  if(r>W-pad) vt.x-=r-(W-pad); else if(l<pad) vt.x+=pad-l;
  if(bt>H-pad) vt.y-=bt-(H-pad); else if(t<top) vt.y+=top-t;
}
function reveal(o){ if(!o.vis) return; vt={x:vt.x,y:vt.y,k:vt.k}; nudge([o]); startAnim() }
function panBy(dx,dy){
  // keep a corner of the map on screen so it can't get lost
  const W=stage.clientWidth,H=stage.clientHeight,k=vc.k,m=90;
  const l=vc.x+dx+mapBox.x*k, r=l+mapBox.w*k, t=vc.y+dy+mapBox.y*k, b=t+mapBox.h*k;
  if(r<m) dx+=m-r; else if(l>W-m) dx-=l-(W-m);
  if(b<m) dy+=m-b; else if(t>H-m) dy-=t-(H-m);
  [vc,vs,vt].forEach(v=>{v.x+=dx;v.y+=dy}); applyView();
}
function zoomAt(sx,sy,f,animate){
  finish();
  const k2=Math.min(KMAX,Math.max(KMIN,vc.k*f)), wx=(sx-vc.x)/vc.k, wy=(sy-vc.y)/vc.k;
  vt={x:sx-wx*k2,y:sy-wy*k2,k:k2};
  if(animate) startAnim(); else { vc={x:vt.x,y:vt.y,k:vt.k}; applyView() }
}

/* ---------- minimap ---------- */
const mini=document.getElementById("mini"), minic=document.getElementById("minic"), mctx=minic.getContext("2d");
let palette=null, miniT=null;
function readPalette(){
  const cs=getComputedStyle(document.documentElement), g=n=>cs.getPropertyValue(n).trim();
  palette={c:[1,2,3,4,5,6].map(i=>g("--c"+i)),ink:g("--ink")};
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{palette=null;drawMini()});
new MutationObserver(()=>{palette=null;drawMini()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function drawMini(){
  if(!mini.offsetWidth||!vis.length) return;
  { // only show the overview when part of the map is off screen
    const k=vc.k, l=vc.x+mapBox.x*k, t=vc.y+mapBox.y*k;
    const allIn=l>=-4&&t>=-4&&l+mapBox.w*k<=stage.clientWidth+4&&t+mapBox.h*k<=stage.clientHeight+4;
    mini.classList.toggle("idle",allIn); if(allIn) return;
  }
  if(!palette) readPalette();
  const dpr=Math.min(2,window.devicePixelRatio||1), W=mini.clientWidth, H=mini.clientHeight;
  if(minic.width!==W*dpr){ minic.width=W*dpr; minic.height=H*dpr }
  const b=mapBox, pad=10, s=Math.min((W-2*pad)/b.w,(H-2*pad)/b.h), ox=W/2-s*(b.x+b.w/2), oy=H/2-s*(b.y+b.h/2);
  miniT={s:s,ox:ox,oy:oy};
  mctx.setTransform(dpr,0,0,dpr,0,0); mctx.clearRect(0,0,W,H);
  for(const o of vis){
    mctx.fillStyle=o.depth?palette.c[o.branch]:palette.ink;
    mctx.globalAlpha=o.depth<=1?1:o.depth===2?.8:.5;
    mctx.fillRect(ox+o.cx*s,oy+o.cy*s,Math.max(1.5,o.w*s),Math.max(1.5,o.h*s));
  }
  mctx.globalAlpha=1;
  const vx=ox+(-vc.x/vc.k)*s, vy=oy+(-vc.y/vc.k)*s, vw=stage.clientWidth/vc.k*s, vh=stage.clientHeight/vc.k*s;
  mctx.fillStyle=palette.ink; mctx.globalAlpha=.08; mctx.fillRect(vx,vy,vw,vh);
  mctx.globalAlpha=1; mctx.strokeStyle=palette.ink; mctx.lineWidth=2.5; mctx.strokeRect(vx,vy,vw,vh);
}
function miniGo(e){
  if(!miniT) return;
  const r=mini.getBoundingClientRect(), wx=(e.clientX-r.left-miniT.ox)/miniT.s, wy=(e.clientY-r.top-miniT.oy)/miniT.s;
  finish(); vc.x=stage.clientWidth/2-wx*vc.k; vc.y=stage.clientHeight/2-wy*vc.k; vt={x:vc.x,y:vc.y,k:vc.k}; applyView();
}
let miniDown=false;
