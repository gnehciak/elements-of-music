nd tubes give a round, earthy tone.","Struck sources include the xylophone, marimba, woodblock, temple blocks, claves and clapsticks. Woody also describes the low clarinet, bassoon, recorder and the body sound of an acoustic guitar."],"use":"Say whether the woodiness comes from striking wood or from a wind instrument's tone, and give the register. Link it to effects such as an earthy, rustic, playful or traditional feel. Clapsticks and log drums also connect to cultural context.","listen":["Listen for a dry knock with a short, warm ring.","Notice the earthy, round tone of low woodwind."],"example":"The marimba plays the ostinato with soft mallets, and its **woody**, round tone gives the accompaniment a warm, earthy character.","fig":[{"file":"xylophone.jpg","caption":"Xylophones: wooden bars give a dry, woody knock"}]},"Material / sound-source>metallic":{"what":["A metallic timbre is hard and ringing like metal, often with complex overtones that shimmer or clash. It usually has a bright attack and a long decay.","Sources include cymbals, triangle, gongs, crotales, glockenspiel, steel pans, vibraphone, piano prepared with bolts or screws between the strings and metallic synth sounds."],"use":"Metallic names the material, so pair it with the instrument and how it is played (soft mallets, a bow drawn across a cymbal). Link it to effects such as brightness, tension, an industrial feel or a cultural sound such as steel pan or gamelan.","listen":["Listen for a hard, ringing attack and a shimmering decay.","Notice clashing, complex overtones in cymbals and gongs."],"example":"A bowed cymbal adds a **metallic**, glassy shriek above the low strings, which makes the climax of the scene unsettling.","fig":[{"file":"cymbals.jpg","caption":"Cymbals: struck or bowed metal gives a metallic, shimmering sound"}]},"Performing media and timbre>Mood / character":{"what":["These words describe the character a sound creates rather than the sound itself. A passage sounds eerie, majestic or playful because instrument, register, dynamics, articulation, tempo and harmony work together.","On their own they are opinions. They become analysis when you explain which musical features create the character."],"use":"Mood words link timbre to effect, which is where the higher marks are. Make the claim, then prove it: 'the horns sound majestic because they play a slow, legato chorale at forte in their middle register'. Avoid stacking several mood words without evidence, and avoid any that the music does not support.","listen":["Ask how the sound makes you feel, then find the musical reason for it.","Notice which instruments and registers are used for different moods.","Listen for changes of character between sections."],"example":"High string harmonics over a quiet, sustained cluster in the low piano give the opening an **eerie** character, because the glassy timbre and the lack of a clear tonal centre leave the listener unsettled."},"Mood / character>grand":{"what":["Grand describes a big, impressive and stately sound. It is about scale and dignity: many performers, a wide range, full harmony and usually a moderate or slow tempo.","Grand sounds come from a full orchestra, a pipe organ, massed choirs, a full brass section and wide-spaced chords across the whole range."],"use":"Support grand with evidence: instrumentation, dynamics, register and tempo. Link it to settings such as ceremonies, finales and film title themes. Avoid it for sounds that are only loud, because grandeur also needs breadth and dignity.","listen":["Listen for a wide, full sound from low bass to high treble.","Notice a broad tempo and full harmony."],"example":"The full orchestra and organ play the theme in broad minims at fortissimo, which makes the finale sound **grand** and ceremonial."},"Mood / character>haunting":{"what":["Haunting describes a sound that is sad and strange and stays with you after it ends. It usually involves a simple, exposed line, a lonely timbre and a sense of space.","Common sources are a solo voice or flute with reverb, a high string line over a drone, a wordless soprano, a distant horn, a cor anglais solo and a theremin or other wavering electronic tone."],"use":"Haunting needs musical evidence: an exposed solo, minor or modal pitch, reverb and silence around the line. Link it to effects such as loss, memory or the supernatural. It is very common in film and game music analysis.","listen":["Listen for a single, exposed line with space around it.","Notice reverb, drones and minor or modal melodies."],"example":"A wordless soprano sings a modal melody over a low drone, and the reverberant, exposed timbre makes the opening **haunting** and full of loss."},"Mood / character>majestic":{"what":["Majestic describes a royal, noble character: broad, confident and powerful but controlled. The Italian marking maestoso asks for this.","It usually comes from brass (especially trumpets, horns and trombones), timpani, full strings and organ, playing slow, dotted or broad rhythms at forte."],"use":"Back majestic with instrumentation, tempo and rhythm. Link it to effects such as royalty, heroism or triumph, and mention a maestoso marking if you see one. It is common in anthems, ceremonial marches and film fanfares.","listen":["Listen for slow, broad brass themes at a strong dynamic.","Notice dotted rhythms and timpani on strong beats."],"example":"The horns and trombones state the theme in slow dotted rhythms over timpani rolls, and their full, **majestic** tone gives the hero's entrance a royal dignity."},"Mood / character>sombre":{"what":["Sombre describes a dark, serious and sad character. It is more grave and restrained than simply sad.","It usually comes from low strings, low brass chorales, the bassoon or bass clarinet, a slow tempo, soft dynamics and minor or modal harmony, as in funeral marches and laments."],"use":"Link sombre to the evidence: register, instrumentation, tempo, dynamics and tonality. It suits laments, funeral music and reflective film cues. Contrast it with a brighter section to show how the composer shapes the structure.","listen":["Listen for low, dark instruments playing slowly and softly.","Notice minor harmony and a heavy, steady pulse."],"example":"The trombones and tuba play a slow minor chorale at piano, and the **sombre** low brass timbre gives the passage the weight of a funeral march.","fig":[{"file":"tuba.png","caption":"Tuba: low brass chorales give a sombre, weighty sound"}]},"Mood / character>languid":{"what":["Languid describes a slow, relaxed and lazy character, as if the music is lounging in the heat. Notes are stretched, the phrasing is loose and nothing feels urgent.","It suits a slow saxophone or clarinet melody, a laid-back jazz ballad, a sliding steel guitar line, a breathy vocal sung slightly behind the beat and soft brushes on the drums."],"use":"Languid connects timbre with tempo and rhythm, so mention the slow tempo, the loose or behind-the-beat phrasing and the soft, warm instrumentation. Link it to effects such as heat, sensuality, boredom or relaxation.","listen":["Listen for slow, stretched phrases that take their time.","Notice notes sliding or placed slightly behind the beat."],"example":"The tenor saxophone's **languid**, breathy melody drifts slightly behind the beat, which gives the ballad a relaxed, late-night feel.","fig":[{"file":"saxophone.jpg","caption":"A saxophone played softly in its low register suits a languid melody"}]},"Mood / character>eerie":{"what":["Eerie describes a strange, spooky, unsettling character. Something in the sound seems unnatural or out of place.","Typical sources are the theremin, high string harmonics, the glass harmonica, the waterphone, bowed cymbals and vibraphone, sliding glissandi, whispered voices, detuned synths and dissonant, unresolved harmony."],"use":"Eerie must be supported by the unusual features that create it: extended techniques, odd timbres, a high register, dissonance and silence. Link it to effects such as suspense, horror or the supernatural, which are common in film and game music.","listen":["Listen for unfamiliar, glassy or wavering sounds.","Notice dissonance, slides and long silences."],"example":"The theremin's wavering glissandi over soft, dissonant string harmonics make the passage **eerie**, so the listener senses something unnatural.","fig":[{"file":"s5_dir_harmonic.png","caption":"Harmonics (the small circle) give strings a glassy, eerie sound"}]},"Mood / character>dramatic":{"what":["Dramatic describes big contrasts that grab the listener: sudden changes of dynamic, register, texture or instrumentation, and strong, decisive gestures.","Typical sources are sudden fortissimo brass and timpani, sforzando string chords, a silence followed by a loud tutti, a rapid crescendo and a sudden drop from full orchestra to a solo instrument."],"use":"Dramatic is about contrast, so show both sides: what came before and what changes. Name the instruments and the change of dynamic or texture, and link it to structure (a climax, a turning point) and to its narrative or emotional effect.","listen":["Listen for sudden changes in dynamic, texture or instrumentation.","Notice silences and sudden loud entries."],"example":"After a bar of silence the full orchestra enters fortissimo with brass and timpani, and the **dramatic** contrast marks the start of the new section."},"Mood / character>playful":{"what":["Playful describes a light, bouncy, cheeky character. The music seems to joke or tease.","It usually comes from staccato or pizzicato articulation, leaping bassoon or clarinet lines, piccolo or xylophone runs, unexpected accents, sudden pauses and quick dialogue between instruments."],"use":"Link playful to the techniques that create it: short articulation, light instrumentation, unexpected rhythms or surprising timbres. It is useful for scherzos, cartoon and children's film music and character pieces.","listen":["Listen for short, bouncy notes and light instrumentation.","Notice surprises such as sudden pauses or unexpected accents."],"example":"The staccato bassoon leaps and answering pizzicato strings give the section a **playful**, cheeky character, as if the instruments are teasing one another.","fig":[{"file":"bassoon.jpg","caption":"Staccato bassoon leaps are a classic playful sound"}]},"Mood / character>delicate":{"what":["Delicate describes a soft, light and fragile character. The sound is fine and precise, and could easily be broken.","It comes from the harp, celesta, high solo violin, flute, a soft, high piano line, harmonics and a soprano singing softly, usually at pp or p with sparse scoring."],"use":"Delicate combines timbre with dynamics and texture, so mention the soft dynamic and sparse scoring as well as the instrument. Link it to effects such as tenderness, innocence or fragility. It contrasts well with heavy or forceful passages.","listen":["Listen for soft, high, light sounds with very little underneath.","Notice careful, precise playing at a quiet dynamic."],"example":"The harp and celesta play a **delicate** pianissimo figure in their high register, and the sparse, fragile scoring makes the lullaby sound tender and innocent."},"Performing media and timbre>Warm / mellow / smooth":{"what":["These words describe rounded, soft-edged and pleasant sounds. Their energy sits in the low and middle overtones, with soft attacks and smooth joins between notes. They usually come from middle and lower registers and from instruments such as the cello, French horn, clarinet, alto saxophone and flugelhorn.","Cantabile and lyrical describe a singing, song-like way of shaping a melody, so they tell you about the phrasing as well as the colour."],"use":"Composers use these timbres for calm, tender, nostalgic or romantic moments, and performers create them with legato bowing or tonguing, relaxed vibrato and soft attacks. In an answer, name the instrument, the register and the technique behind the warmth, then link it to the mood or to a contrast with a harsher section.","listen":["Listen for soft attacks and notes that flow smoothly into each other.","Notice middle and low instruments playing gently.","Check for a singing, song-like melody (cantabile, lyrical)."],"example":"The cello carries the theme in its middle register with a **warm, lyrical** tone, and the smooth legato bowing and gentle vibrato make the section feel tender and intimate."},"Warm / mellow / smooth>sonorous":{"what":["A sonorous timbre is deep, full and resonant, with a rich, ringing quality that seems to fill the room. It is more resonant and powerful than warm.","Examples are the cello and double bass, the French horn, a bass or baritone voice, the low register of the piano, low brass chorales and the low stops of a pipe organ."],"use":"Sonorous is a sophisticated word for deep, resonant sound. Name the instrument and register, and link it to effects such as dignity, solemnity or warmth. It suits slow, broad passages more than fast ones.","listen":["Listen for deep, full sound that rings and fills the space.","Notice low strings, horns or deep voices in slow, sustained lines."],"example":"The cellos play a **sonorous** chorale on their low strings, and the deep, ringing tone gives the closing section a solemn dignity.","fig":[{"file":"cello.png","caption":"The cello's low strings give a deep, sonorous tone"}]},"Warm / mellow / smooth>smooth":{"what":["A smooth timbre has no bumps or rough edges. Notes connect evenly, attacks are soft and the tone stays consistent from note to note.","It comes from legato bowing or tonguing, slurred phrasing, sustained string bowing, a clean jazz guitar tone, a crooning vocal and synth pads with slow attacks."],"use":"Smooth links timbre to articulation, so mention legato, slurs or the attack of the notes. Link it to effects such as calm, ease, romance or sophistication, and contrast it with choppy or harsh sections.","listen":["Listen for notes that flow into each other without gaps.","Notice soft attacks and an even tone."],"example":"The strings play the melody with long, **smooth** legato bows, so the phrase flows without a break and the section feels calm and assured."},"Warm / mellow / smooth>warm":{"what":["A warm timbre is rounded and full in the low and middle range, with soft high overtones. It sounds pleasant, comfortable and close.","Instruments often called warm are the cello, viola, French horn, clarinet in its middle register, alto saxophone, flugelhorn, nylon-string guitar, the Rhodes electric piano and a mezzo or baritone voice. Analogue synths and tape recordings are often heard as warm too."],"use":"Warm is the base word for this category, so make it precise with the instrument, register and technique (legato, vibrato, soft attack). Link it to effects such as comfort, tenderness, nostalgia or intimacy.","listen":["Listen for a rounded sound with its weight in the middle range.","Notice soft attacks and gentle vibrato."],"example":"The clarinet takes the melody in its middle register, and its **warm**, rounded tone makes the second theme sound gentle and comforting."},"Warm / mellow / smooth>gentle":{"what":["A gentle timbre is soft and calm, with no hard edges or sudden attacks. It is quiet in character as well as volume.","Examples are a nylon-string guitar played with the fingers, a soft flute, a hummed or softly sung vocal, piano with the soft pedal and strings with mutes or sul tasto."],"use":"Gentle combines timbre, dynamics and articulation, so mention all three. Link it to effects such as calm, comfort, tenderness or a lullaby character. It contrasts well with forceful or aggressive sections.","listen":["Listen for soft attacks and a quiet, rounded tone.","Notice finger-picking, humming or soft-pedal piano."],"example":"The nylon-string guitar's **gentle**, finger-picked arpeggios under a soft vocal give the verse a calm, lullaby-like feel.","fig":[{"file":"acoustic_guitar.jpg","caption":"Finger-picking an acoustic guitar softly gives a gentle tone"}]},"Warm / mellow / smooth>even":{"what":["An even timbre stays the same in tone and volume from note to note. No note sticks out because it is louder, brighter or rougher than the rest.","Evenness is a sign of control. You hear it in a steady legato scale, fast piano or flute runs where every note is equal, a choir with matched vowels and machine-played electronic parts."],"use":"Even is useful in performance and analysis answers about technical control. Mention the passage (a run, a scale, a held chord) and link evenness to effects such as smoothness, precision or a calm, unbroken line. Uneven tone can be contrasted with it.","listen":["Listen for every note sounding equal in tone and volume.","Notice whether fast runs flow without bumps."],"example":"The pianist's semiquaver runs are perfectly **even** in tone and volume, so the accompaniment flows like a steady stream beneath the melody."},"Warm / mellow / smooth>cantabile":{"what":["Cantabile is Italian for 'in a singing style'. A cantabile line is played as if sung: smooth, sustained, shaped in breath-like phrases and warm in tone.","Composers write cantabile on instrumental melodies, often for violin, cello, clarinet or piano, to ask the player to make the line sing over the accompaniment."],"use":"Cantabile describes both timbre and performance style, so link it to phrasing (legato, long lines, rise and fall) and to effects such as lyricism and emotional expression. It is a good term for slow movements and Romantic piano music.","listen":["Listen for an instrumental melody that sounds like singing.","Notice long, connected phrases that rise and fall like breathing."],"example":"The cello plays the second theme **cantabile**, with long legato phrases and warm vibrato, so the melody sings above the soft piano chords."},"Warm / mellow / smooth>sweet":{"what":["A sweet timbre is pleasant, soft and usually high, with a pure, gentle tone and no edge. It is lighter than warm.","Examples are a solo violin in its upper-middle register, a soft soprano, recorder or flute played softly, a high clarinet played gently and children's voices."],"use":"Sweet suits tender, innocent or romantic moments. Name the instrument and register, and support the word with dynamics and articulation, because without evidence it can sound vague. It works well in contrast with a harsher or darker version of the same theme.","listen":["Listen for a soft, high tone with no edge.","Notice gentle vibrato and a quiet dynamic."],"example":"The solo violin's **sweet**, high tone with gentle vibrato makes the love theme sound tender and innocent.","fig":[{"file":"violin.jpg","caption":"A solo violin in its upper-middle register has a sweet tone"}]},"Warm / mellow / smooth>fluid":{"what":["A fluid timbre flows easily from note to note, like water. The line moves without effort and the joins between notes are hidden.","It suits flute runs, harp arpeggios, legato clarinet, rippling piano figuration, a fast, connected jazz saxophone solo and a guitar line using slides and hammer-ons."],"use":"Fluid links timbre with articulation and the shape of the line, so mention legato, runs or arpeggios. Link it to effects such as water imagery, ease or virtuosity. It contrasts with choppy or percussive passages.","listen":["Listen for fast or connected notes that flow without bumps.","Notice rippling runs and arpeggios."],"example":"The flute's **fluid** runs over rippling harp arpeggios make the passage sound like flowing water."},"Warm / mellow / smooth>ethereal":{"what":["Ethereal describes a light, airy and otherworldly sound, as if it is not quite of this earth. It feels weightless and distant.","It comes from high choirs or wordless voices with reverb, synth pads, high string harmonics, celesta, glass harmonica, the high flute and anything with a long, soft reverb tail."],"use":"Ethereal needs evidence: high register, soft dynamics, reverb and no heavy bass. Link it to effects such as the heavenly, dreams, memory or the supernatural. It is common in film, ambient and choral music.","listen":["Listen for high, soft sounds with no heavy bass.","Notice long reverb and wordless voices."],"example":"The wordless upper voices, drenched in reverb above a soft synth pad, give the closing section an **ethereal**, heavenly quality."},"Warm / mellow / smooth>lyrical":{"what":["Lyrical describes a song-like, expressive melody. The line is smooth, shaped in long phrases and full of feeling, like a tune someone could sing.","It suits long legato melodies on clarinet, violin, cello, horn, saxophone or voice. Lyrical is close to cantabile, but lyrical describes the character of the melody, while cantabile is a direction to the performer."],"use":"Lyrical links timbre to pitch and phrasing, so mention the shape of the melody, its range and the legato. Link it to effects such as tenderness or longing, and contrast it with rhythmic or fragmented material.","listen":["Listen for a long, singable melody shaped in phrases.","Notice smooth legato and an expressive rise and fall."],"example":"The horn introduces a **lyrical** theme in long, arching legato phrases, which contrasts with the fragmented rhythmic material of the opening."},"Warm / mellow / smooth>floating":{"what":["A floating timbre drifts along with no weight or pull, as if suspended in the air. There is little sense of bass or beat underneath.","It comes from high, sustained string chords, soft synth pads, a high flute or voice held over silence, sustained vibraphone and harmonies that do not resolve."],"use":"Floating links timbre to texture and rhythm, so mention the high register, the held notes and the missing bass or pulse. Link it to effects such as weightlessness, dreams, timelessness or suspense.","listen":["Listen for high, sustained sounds with no clear bass.","Notice a weak or absent sense of beat."],"example":"The violins hold high, soft chords with no bass underneath, so the timbre sounds **floating** and the music seems suspended in time."},"Warm / mellow / smooth>mellow":{"what":["A mellow timbre is soft, rounded and relaxed, with no edge at all. It is gentler and darker than warm.","The French horn and flugelhorn are classic mellow instruments, along with the alto flute, the clarinet in its low-middle register, a jazz guitar with the tone control rolled back, a soft trombone and the Rhodes electric piano."],"use":"Mellow suits relaxed, reflective or nostalgic moments. Name the instrument and register, and mention technique (a soft attack, the guitar's tone control). Link it to calm and ease, and contrast it with brassy or strident playing in the same family.","listen":["Listen for a soft, rounded tone with no edge.","Notice horns, flugelhorn or soft low woodwind."],"example":"The flugelhorn plays the melody softly with a **mellow**, rounded tone, which gives the jazz ballad a relaxed, reflective mood.","fig":[{"file":"french_horn.png","caption":"French horn: played softly, it has a rounded, mellow sound"}]},"Elements of Music>Dynamics and expression":{"what":["Dynamics and expression covers volume and everything a performer does to shape the sound: the loudness level, how it changes, how each note starts and ends (articulation), the special techniques that change the tone and the mood or character asked for in Italian performance directions.","At HSC level a single word like 'loud' earns little. Markers want the precise term, where it happens (instrument, section, bar number) and what it does to the music."],"use":"In an aural answer, treat dynamics and expression as evidence, not decoration. Name the level or change (pp, subito f, a long crescendo), the articulation or technique that goes with it, and link it to structure, texture or mood. Dynamics are often the clearest signal of a climax or a new section, so use them to explain how the piece is built.","listen":["Track the overall volume across the excerpt and mark where it changes, gradually or suddenly.","Listen to the start and length of notes: short and separated, smooth and joined or hit hard.","Notice any unusual sounds (snapped strings, bouncing bows, slapped reeds, slides) and name the technique."],"example":"The excerpt opens **pp** with **legato** strings, then a **gradual crescendo** over four bars and **marcato** brass accents drive it to an **ff** climax, which marks the start of the B section."},"Dynamics and expression>Articulation":{"what":["Articulation describes how notes begin and end and how they connect to each other. Short and separated (staccato, staccatissimo), smooth and joined (legato, slurred), stressed (accent, marcato) or held for full value (tenuto, sustained) are all articulations. For strings it also covers plucked (pizzicato) against bowed (arco).","Articulation is written with small marks above or below the notehead, or with words."],"use":"Articulation is one of the quickest ways to show detail in an HSC answer. Pair each term with an instrument and a place in the music, then contrast it with another part: staccato woodwind against legato strings tells the marker you heard two layers doing different jobs.","listen":["Listen to the gaps: are there tiny silences between notes, or do they run together?","Notice which notes jump out with extra weight at the start.","For strings, decide whether the sound is plucked (a quick ping that dies away) or bowed (it can be held)."],"example":"The **staccato** bassoon line sits under a **legato** violin melody, and the **marcato** accents in the brass on the downbeats make the contrast between the two layers even sharper.","fig":[{"file":"rm_s5_articulation_compare.png","caption":"The main articulation marks side by side, from shortest (staccato) to strongest (marcato)"}]},"Articulation>tenuto":{"what":["Tenuto (Italian for 'held') is shown by a short horizontal line above or below the notehead. The note is held for its full written length with no gap after it, and often given a gentle extra weight.","It sits between legato and accent: the note is leant on, not hit."],"use":"In an answer, use tenuto for notes that sound deliberate and weighted, often at the end of a phrase or in a slow, expressive melody. Pair it with the instrument and bar, and link it to effect, such as emphasis on a cadence or a heavy, solemn feel.","listen":["Listen for notes that are held right to the end and slightly leant on.","Notice a melody that sounds weighted and deliberate rather than flowing or bouncy."],"example":"In bar 6 the horns play **tenuto** crotchets, each held for full value with a slight stress, which weighs down the cadence and gives the phrase a solemn ending.","quote":[{"text":"tenuto phrasing in bar 8","source":"HSC 2019"}],"fig":[{"file":"s5_tenuto.png","caption":"Tenuto (line): hold for the full value, slightly stressed"}]},"Articulation>marcato":{"what":["Marcato (Italian for 'marked') is shown by a vertical wedge like a small roof (^) above the note. It asks for a strong, forceful attack, heavier than a normal accent (>).","Strings often play it with a heavy, separate bow stroke for each note; brass with a hard tongued attack."],"use":"Use marcato for notes that are hammered out. In an HSC answer link it to forceful or aggressive character, rhythmic drive or a climax. Say which section plays it and whether it is on every note or only on the strong beats.","listen":["Listen for notes that are hit hard with a heavy attack, harder than an ordinary accent.","Notice whether the accents line up with the beat or cut across it."],"example":"The full string section plays **marcato** crotchets throughout the climax, and the heavy, separate attacks give the passage a driving, aggressive character.","quote":[{"text":"marcato accents throughout the string section... adds a forceful tone colour","source":"HSC 2022"}],"fig":[{"file":"s5_marcato.png","caption":"Marcato (wedge): a strong accent, stronger than a normal accent"}]},"Articulation>legato":{"what":["Legato (Italian for 'tied together') means playing notes smoothly with no silence between them. It is written with a slur over the notes or the word legato.","On strings several notes are played in one bow; on wind instruments they are played in one breath without tonguing each note."],"use":"Legato is one of the most useful contrasts in an HSC answer. Name the instrument playing legato, then contrast it with a staccato or accented part. Link legato to lyrical, calm or expressive effects, and to long phrases.","listen":["Listen for notes that flow into each other with no gaps.","Notice long phrases that sound like one continuous line, as if sung in one breath."],"example":"The oboe melody is **legato** and lyrical, played in long, unbroken phrases above detached pizzicato strings, which keeps it clearly in the foreground.","quote":[{"text":"a languid, legato bowed melody","source":"HSC 2022"}],"fig":[{"file":"art_slur.png","caption":"Slur: play legato (smooth and connected)"}]},"Articulation>sustained":{"what":["Sustained notes are long notes that are held on, rather than played and left to fade. Bowed strings, wind, voices and organ can sustain a note at an even volume; a piano or plucked string cannot, because the sound decays.","Sustained notes often form a pedal note, a drone or a pad of harmony under a moving melody."],"use":"Use sustained to describe long held notes or chords, usually in the accompaniment. Say which instrument, how long (for example two bars), and the dynamic level. Link it to texture (a background layer) and mood (calm, tension, suspense).","listen":["Listen for long notes underneath the melody that do not fade.","Notice whether the held notes stay at one volume or swell."],"example":"Low strings hold **sustained** pp chords for the first eight bars, which creates a still, suspended background for the solo flute.","quote":[{"text":"low dynamic levels on sustained notes","source":"HSC 2018"}]},"Articulation>accented":{"what":["An accented note is played with more force at the start than the notes around it. It is written with the accent sign (>) above or below the note.","Accents can fall on strong beats to reinforce the metre, or on weak beats and off-beats, where they create syncopation."],"use":"In an answer, say which notes are accented and where they fall in the bar. Accents on off-beats link to syncopation and rhythmic drive; accents on every beat link to a heavy, marching or aggressive character. Contrast accented parts with smooth legato lines.","listen":["Listen for single notes that stand out with a harder attack.","Check whether the accents sit on the beat or between the beats."],"example":"The trumpets play **accented** quavers on the off-beats, which pull against the steady crotchets in the bass and make the rhythm feel restless.","quote":[{"text":"Accented and staccato parts against legato lines","source":"HSC 2017"}],"fig":[{"file":"art_accent.png","caption":"Accent: play the note with emphasis"}]},"Articulation>slurred / slurs":{"what":["A slur is a curved line over or under a group of different pitches. The notes under it are played legato: in one bow on strings, in one breath without re-tonguing on wind instruments and smoothly connected on piano.","Do not confuse a slur with a tie, which joins two notes of the same pitch into one longer note."],"use":"Use 'slurred' to describe the phrasing of a specific part, and say how the slurs group the notes (in pairs, across a whole bar). Slurred pairs often sound like sighs; long slurs sound lyrical. Contrast slurred and detached notes in the same line.","listen":["Listen for groups of notes that move smoothly, then a small break before the next group.","Notice pairs of notes where the first is leant on and the second is lighter."],"example":"The violin phrase is **slurred** in pairs, with the first note of each pair stressed and the second lighter, which gives the melody a sighing, falling character.","quote":[{"text":"Slurred phrasing in the left hand of the piano","source":"HSC 2024"}],"fig":[{"file":"rm_s4_tie_or_slur.png","caption":"Tie: one pitch held over. Slur: different notes played smoothly"}]},"Articulation>staccatissimo":{"what":["Staccatissimo is the superlative of staccato: as short and separated as possible. It is written with a small vertical wedge or tear-drop above or below the notehead, rather than a dot.","Each note is clipped very short, so there is clear silence before the next one."],"use":"Use staccatissimo when notes are even shorter and sharper than ordinary staccato. Say which instrument and where, and link it to a crisp, brittle, spiky or playful character. Comparing it with legato or staccato in another part shows detailed listening.","listen":["Listen for notes that are tiny pricks of sound with a lot of silence around them.","Compare them with other short notes in the excerpt: are they even shorter?"],"example":"The piano's right hand plays **staccatissimo** quavers, clipped so short that the silences between them are as noticeable as the notes, which gives the passage a brittle, nervous energy.","quote":[{"text":"play always very detached","source":"HSC 2025"},{"text":"staccatissimo (very short)","source":"HSC 2025"}]},"Articulation>detached":{"what":["Detached is the general English word for notes that are separated rather than joined. It covers staccato, staccatissimo and any playing where there are audible gaps between notes.","On strings, detached playing can also mean separate bows for each note (called détaché), which can be quite full in length but still not slurred."],"use":"Use detached when you hear separation but are not sure of the exact marking, or as a plain-English gloss next to the Italian term. Pair it with the instrument and contrast it with legato lines, then link it to effect: light, crisp, playful or tense.","listen":["Listen for small silences between each note.","Notice whether the gaps are tiny (detached) or very large (staccatissimo)."],"example":"The woodwind accompaniment is **detached** and light, while the strings play a legato countermelody, so the two layers are easy to tell apart.","quote":[{"text":"very detached","source":"HSC 2025"},{"text":"clearly articulated and detached","source":"Trial 2021"}],"fig":[{"file":"rm_s5_articulation_compare.png","caption":"The articulation marks side by side, from shortest (staccato) to strongest (marcato)"}]},"Articulation>pizzicato / arco":{"what":["Pizzicato (pizz.) tells string players to pluck the strings with a finger. The sound is short and percussive and dies away quickly. Arco tells them to return to the bow, so the notes can be sustained again.","Composers write 'pizz.' and 'arco' in the part each time the technique changes."],"use":"In an HSC answer, give the instrument and the bar where each technique starts, and link the change to texture or structure. Pizzicato often gives a light, walking bass or a dry accompaniment; the return to arco usually brings a fuller, more sustained sound.","listen":["Pizzicato: short, plucked 'ping' sounds with fast decay.","Arco: smooth notes that can be held and swelled.","Listen for the moment a string section switches from one to the other."],"example":"The double basses begin **pizzicato** with a light, walking bass line, then switch to **arco** at the start of the B section, which thickens the texture and supports the louder dynamic.","quote":[{"text":"Double basses at bar 8 are pizzicato and at bar 11 are arco","source":"HSC 2025"}],"fig":[{"file":"ex_pizz_arco.png","caption":"pizz. = pluck the strings, arco = go back to the bow"}]},"Articulation>staccato":{"what":["Staccato (Italian for 'detached') means the note is shortened, so there is a small silence before the next note. It is written with a dot above or below the notehead.","A staccato crotchet still takes up one beat in the bar; it just sounds for less of it."],"use":"Staccato is a staple of HSC answers but needs detail: which instrument, which section and against what. Contrast it with legato or slurred lines and link it to effect, such as playful, light, march-like or tense.","listen":["Listen for short, bouncy notes with gaps between them.","Check whether all parts are staccato or only one layer."],"example":"The bassoons play **staccato** quavers under the legato clarinet melody, which gives the accompaniment a light, bouncing feel.","quote":[{"text":"staccato and slurs/legato articulations","source":"HSC 2021"}],"fig":[{"file":"art_staccato.png","caption":"Staccato (dots): short and detached"}]},"Dynamics and expression>Change in dynamics":{"what":["These words describe the way the volume changes over time, rather than how loud it is at one moment. A change can be gradual (crescendo, diminuendo), sudden (subito, sfz), in blocks or steps (terraced), or a swell that rises and falls on one note or phrase.","You can also describe how often the volume changes: frequent and varied, or limited."],"use":"Use these words to show how dynamics shape the structure. A long gradual crescendo usually builds to a climax, while terraced or sudden changes often mark sections or echo effects. Always give the start and end levels where you can (pp to ff) and the bars or section.","listen":["Decide whether the change happens over several bars or in an instant.","Listen for repeated phrases played loud and then soft, like an echo.","Count how often the volume shifts: constantly, or only at section changes."],"example":"Dynamics are **terraced** in the first section, with blocks of f and p, but the coda uses a **gradual** crescendo from pp to ff that builds tension towards the final chord.","fig":[{"file":"rm_s5_subito.png","caption":"A crescendo to f, then subito p: the volume drops suddenly, with no diminuendo"}]},"Change in dynamics>swelling / swells":{"what":["A swell is a crescendo followed straight away by a diminuendo, so the sound grows and then fades. It can happen on a single held note or across a short phrase, and is written as two hairpins facing each other (< >).","A swell on one held note is sometimes called messa di voce, a singing technique also used by string and wind players."],"use":"Use swelling for held notes or chords that bloom and fade. Name the instruments and the levels (p to f and back), and link swells to an expressive, breathing quality or to a building of tension that does not quite arrive.","listen":["Listen for long notes that get louder in the middle and softer again at the end.","Notice whether the swells repeat, like waves."],"example":"The brass chords **swell** from p to f and fade again on each sustained note, which gives the accompaniment a breathing, wave-like motion under the melody.","quote":[{"text":"the dynamic swells suddenly","source":"Trial 2021"},{"text":"crescendo and decrescendo swells","source":"Trial 2021"}]},"Change in dynamics>gradual / gradually":{"what":["A gradual change happens little by little: a crescendo or diminuendo spread over several bars. Composers may write 'poco a poco' (little by little) with the crescendo to stretch it out.","The opposite is a sudden change, where the new level arrives at once."],"use":"In an answer, give the starting level, the end level and the length: 'a gradual crescendo from pp to ff over eight bars'. Link gradual crescendos to building tension towards a climax, and gradual diminuendos to winding down or closing a section.","listen":["Listen for volume that creeps up or down without a clear jump.","Count roughly how many bars the change takes."],"example":"A **gradual** crescendo from pp to ff across the final eight bars, with the brass and timpani entering one by one, builds tension towards the closing chord.","quote":[{"text":"gradually increasing to ff at bar 99","source":"HSC 2017"}],"fig":[{"file":"rm_s5_poco_a_poco.png","caption":"poco a poco cresc.: the dashed line shows the crescendo spreads over three bars"}]},"Change in dynamics>sudden":{"what":["A sudden change jumps to a new level straight away, with no crescendo or diminuendo in between. It can be marked subito (suddenly), as in subito p, or shown simply by a new dynamic letter right after a loud passage.","Sforzando and fortepiano are sudden changes on a single note."],"use":"Use sudden for surprise and contrast. Say what the levels were before and after and where it happens, then link it to effect: a shock, a change of section or an echo. Sudden drops to p after a crescendo are a favourite way to build suspense.","listen":["Listen for a loud passage that cuts straight to soft, or the reverse.","Notice whether the change lines up with a new section or a new idea."],"example":"After a long crescendo the music drops **suddenly** to subito p at bar 24, which surprises the listener and resets the tension for the next build.","quote":[{"text":"Use of sudden dynamic changes","source":"HSC 2017"}],"fig":[{"file":"rm_s5_subito.png","caption":"A crescendo to f, then subito p: the volume drops suddenly, with no diminuendo"}]},"Change in dynamics>varied":{"what":["Varied dynamics means the excerpt uses a mix of different levels and types of change rather than staying at one volume. It might move between pp and ff and use crescendos, sudden contrasts and accents.","It is a summary word, so it needs evidence after it."],"use":"Never leave 'varied dynamics' on its own in an answer. Follow it with two or three specific examples (levels, changes, bars) and say what the variety achieves, such as contrast between sections or a constantly shifting, unsettled mood.","listen":["List each dynamic level you hear as the excerpt goes on.","Note the different types of change: gradual, sudden, swells, accents."],"example":"The excerpt uses **varied** dynamics, from a pp opening to sudden sfz chords and a long crescendo to ff, which keeps the listener off balance throughout.","quote":[{"text":"the many varied dynamics","source":"HSC 2024"}]},"Change in dynamics>terraced":{"what":["Terraced dynamics move between levels in blocks, like steps or terraces, rather than gradually. A phrase is played f, then repeated p as an echo, then f again.","It is typical of Baroque music, where the harpsichord and organ could not make gradual changes and where contrast came from adding or removing instruments, such as the full orchestra against a small group of soloists."],"use":"Use terraced for block changes between whole phrases or sections. Link it to echo effects, to the contrast of large and small groups and to the Baroque style. You can also point out where a modern piece uses terraced dynamics deliberately for a clear, block-like structure.","listen":["Listen for a phrase that is repeated at a different level, like an echo.","Notice changes that happen exactly at phrase ends, with no crescendo between."],"example":"Dynamics are **terraced** in the opening, with each two-bar phrase played f by the full ensemble and then echoed p by the solo group, which marks out the phrase structure clearly.","quote":[{"text":"a 'terraced dynamic' effect","source":"HSC 2025"},{"text":"Dynamics are more terraced in the Allegro Vivace section","source":"Trial 2021"}]},"Change in dynamics>frequent":{"what":["Frequent dynamic changes happen close together, so the volume rarely stays the same for long. The changes might be small (ppp to mp) or large, and gradual or sudden.","Like 'varied', it describes the pattern of changes across a passage rather than one moment."],"use":"Use frequent when the volume keeps shifting, and give the range and an example. Link it to an unsettled, restless or highly expressive character, or to a performance style that responds closely to every phrase.","listen":["Count how many changes you hear in a few bars.","Notice whether the changes stay within a narrow range or jump widely."],"example":"There are **frequent** dynamic changes within the quiet range, moving between ppp and mp almost every bar, which gives the passage a fragile, flickering quality.","quote":[{"text":"frequent dynamic changes ranging from ppp to mp","source":"HSC 2024"}]},"Dynamics and expression>Loudness level":{"what":["These are describing words for the volume itself: quiet, soft, loud, forced. They also cover the overall picture, such as a wide dynamic range (from ppp to ff) or a limited one, a static volume that hardly changes or subtle shifts that are only just noticeable.","In an answer, back these words up with the Italian markings (pp, mf, ff) whenever you can."],"use":"Describe the level, then the range, then link it to effect. 'Mostly quiet with a limited range' suggests calm or restraint; 'a wide range from ppp to ff' suggests drama. Name which instrument is loud or soft, because one layer is often louder than the rest.","listen":["Pick the softest and loudest moments and give each a marking, so you can state the range.","Notice whether the volume stays the same for long stretches or keeps moving.","Listen for a single instrument that stands out above the others."],"example":"The excerpt uses a **wide dynamic range**, from barely audible ppp sustained strings to a **loud**, ff tutti at the climax, which makes the arrival of the main theme sound overwhelming.","fig":[{"file":"rm_s5_ppp_fff.png","caption":"From ppp (extremely soft) to fff (extremely loud) in one long crescendo"}]},"Loudness level>subtle":{"what":["Subtle describes changes in volume (or tone) that are small and gentle, such as a slight lift from p to mp or a small fade at the end of a phrase. They are easy to miss unless you are listening closely.","Subtle dynamics are a sign of careful, expressive performance."],"use":"Use subtle to show the marker you noticed fine detail. Say what shifts (a small swell, a slight fade), where and in which part, and link it to effect: intimacy, restraint or a gentle shaping of the phrase.","listen":["Listen for small rises and falls within a soft passage.","Notice phrase endings that fade slightly."],"example":"The vocalist shapes each phrase with **subtle** shifts between p and mp, rising slightly to the high note and falling away at the end, which keeps the soft verse intimate but expressive.","quote":[{"text":"the subtle shifts in dynamics","source":"Trial 2025"}]},"Loudness level>static (volume)":{"what":["Static volume means the loudness stays the same for a long stretch: no crescendos, no sudden changes. It is the opposite of varied or frequent dynamics.","It can be a deliberate choice, common in minimalist music, drones and some electronic music, where interest comes from other elements."],"use":"Use static to describe a passage where volume does not change, then say why that matters: it can create stillness or hypnotic repetition, or set up a contrast with a section where dynamics change a lot. Mention the level (a static mf).","listen":["Listen for a long passage with no clear rise or fall in volume.","Ask what else is changing instead: texture, pitch or rhythm."],"example":"The middle section keeps a **static** mp volume, with no crescendos, so the gradual thickening of the texture becomes the main source of growth.","quote":[{"text":"contrast with the static volume in other sections","source":"HSC 2019"}]},"Loudness level>wide (dynamic range)":{"what":["Dynamic range is the distance between the softest and loudest levels in a piece or excerpt. A wide range might go from ppp to ff; a narrow (limited) range might stay between p and mf.","A wide range is typical of orchestral, Romantic and film music, where there are many instruments to build up sound."],"use":"Always back up 'wide' with the two end points and where they occur. Link a wide range to drama, contrast and a big climax, and say how the extremes are achieved (a solo instrument at ppp, the full tutti at ff).","listen":["Find the softest moment and the loudest moment, and give each a marking.","Notice how the instrumentation changes between the two extremes."],"example":"The excerpt has a **wide dynamic range**, from a ppp solo clarinet at the start to a ff tutti at the climax, which makes the arrival of the full orchestra overwhelming.","quote":[{"text":"a wide dynamic range, from ppp to ff","source":"HSC 2022"}],"fig":[{"file":"rm_s5_ppp_fff.png","caption":"From ppp (extremely soft) to fff (extremely loud)"}]},"Loudness level>forced":{"what":["A forced sound is pushed beyond its comfortable level, so it sounds strained or harsh. It is usually used for voices or wind instruments at the top of their range, where the performer has to push hard to reach a note.","It describes tone and effort as much as volume."],"use":"Use forced for a strained, pushed sound, usually a high note at the top of a voice or instrument's range. Link it to emotional intensity, desperation or a climax, and name the note or register if you can.","listen":["Listen for high notes that sound strained or pushed rather than easy.","Notice a rougher or harsher tone at the loudest moments."],"example":"The singer's top note at the climax is **forced**, pushed to the edge of their range with a strained tone, which gives the line a desperate, emotional intensity.","quote":[{"text":"emphasising the high, forced C#","source":"HSC 2024"}]},"Loudness level>soft / softer":{"what":["Soft means a low volume, marked p (piano) or pp (pianissimo). Softer is the comparative: quieter than what came before, often through a diminuendo.","Soft playing usually also makes the tone gentler and less bright."],"use":"In an answer, give the marking (p, pp) and the instrument, and say how the soft level is shaped: does it stay soft, or get softer towards the end of the phrase? Link soft dynamics to calm, intimacy, mystery or a sense of ending.","listen":["Listen for gentle, quiet playing and decide whether it is p or pp.","Notice phrases that grow in the middle and get softer at the end."],"example":"Each phrase grows to mf in the middle and becomes **softer** towards the cadence, which gives the melody a natural, sung shape.","quote":[{"text":"louder in the middle of a phrase and softer again towards the end","source":"HSC 2022"},{"text":"repeated softly (delicatamente)","source":"Trial 2023"}],"fig":[{"file":"rm_s4_dynamics_ladder.png","caption":"The six dynamic markings from softest to loudest: pp, p, mp, mf, f, ff"}]},"Loudness level>limited":{"what":["Limited dynamics means the volume does not move much: either the range is narrow (only between p and mf, for example) or there are few changes.","It is close in meaning to static, but static means no change, while limited means some change within a small range."],"use":"Use limited to describe a restricted range and give the levels, then explain the effect, such as restraint, steadiness or a focus on other elements. It is especially useful when contrasting a quiet, restrained section with a later one that uses a wide range.","listen":["Listen for a passage where the volume only shifts a little.","Name the softest and loudest levels you hear to show how narrow the range is."],"example":"There is **limited** use of dynamic change in the opening, which stays between p and mp, so the sudden ff entry of the brass at bar 17 has a much bigger impact.","quote":[{"text":"Limited use of dynamic change","source":"HSC 2025"}]},"Loudness level>quiet":{"what":["Quiet is the plain English word for a low volume. On the score it corresponds to markings like p, pp or ppp.","A quiet passage often uses fewer instruments, softer techniques (mutes, sul tasto) or a lower register."],"use":"Use quiet together with the matching Italian marking and the instruments playing. Explain how the quietness is produced (thin texture, muted strings) and what it does: a calm mood, suspense or a contrast with louder sections.","listen":["Listen for gentle, low-volume playing and estimate the marking.","Notice how the quiet effect is made: few instruments, mutes or soft tone."],"example":"The excerpt is mostly **quiet**, with muted strings at pp and a solo flute, which creates a still, mysterious atmosphere.","quote":[{"text":"Mostly quiet dynamics","source":"Trial 2024"}]},"Loudness level>loud":{"what":["Loud means a high volume, marked f (forte), ff (fortissimo) or fff. Louder is the comparative: more than what came before, usually through a crescendo.","Loud passages often use the full ensemble, a higher register and stronger attacks."],"use":"Give the marking and the instrument or section playing loud, then link it to effect: a climax, power, celebration, aggression. If only one part becomes louder, say so, because it shows which layer is in the foreground.","listen":["Listen for powerful, full playing and decide whether it is f or ff.","Notice which instrument or section is loudest at that moment."],"example":"In the coda the low strings play **loud**, ff accented quavers under sustained brass, which gives the ending a heavy, powerful drive.","quote":[{"text":"Marimba 2 becomes louder","source":"HSC 2024"},{"text":"fortissimo quavers from viola, cello and double bass","source":"HSC 2016"}],"fig":[{"file":"dyn_ff.png","caption":"fortissimo: very loud"}]},"Dynamics and expression>Performance directions (Italian)":{"what":["Performance directions are instructions written into the score. Most are Italian: dynamic letters (pp, f), changes (crescendo, sforzando), techniques (con sordino, senza vibrato), freedom of time (ad libitum, senza misura) and character words (dolce, espressivo, leggiero).","HSC questions often show these in the score extract, so you need to know what each one means and what it sounds like."],"use":"When a direction appears in the score, quote it, translate it and say what you hear as a result: 'marked dolce (sweetly), the clarinet plays softly with a smooth, warm tone'. Translating shows understanding; linking to the sound shows aural skill.","listen":["Match what you hear to the marking: does the sound really change at the crescendo or the con sord.?","Listen for changes in tone as well as volume, because many directions are about character."],"example":"The violins enter **con sordino** and **pp**, marked **espressivo**, which gives the melody a veiled, intimate quality before the mutes come off for the forte return of the theme.","fig":[{"file":"s5_dir_consord.png","caption":"con sord. (mute on) and senza sord. (mute off)"}]},"Performance directions (Italian)>senza vibrato":{"what":["Senza vibrato (often 'senza vib.') means 'without vibrato'. The player holds the pitch perfectly still, with no wobble.","The result is a pure, plain, sometimes cold or glassy sound. It is used in early music performance and often in modern music for a stark effect."],"use":"Use senza vibrato when strings or voices sound unusually pure and still. Name the instrument and the bar, and link it to effect: cold, bleak, ghostly or ancient. A change from senza vibrato to vibrato is an important detail to mention.","listen":["Listen for long notes that sound perfectly steady, with no wobble.","Notice whether vibrato is added later, warming up the sound."],"example":"The violins play **senza vibrato** in the opening, so the long held notes sound pale and glassy, and the arrival of full vibrato at bar 12 warms the tone dramatically.","quote":[{"text":"Strings senza vib, without vibrating","source":"Trial 2023"}],"fig":[{"file":"rm_s4_vibrato.png","caption":"Senza vib. means without vibrato. Vib. means add vibrato"}]},"Performance directions (Italian)>crescendo / diminuendo / decrescendo":{"what":["Crescendo (cresc.) means gradually getting louder. Diminuendo (dim.) and decrescendo (decresc.) both mean gradually getting softer.","They are written either as words, often with a dashed line, or as hairpins: an opening hairpin (<) for crescendo and a closing one (>) for diminuendo."],"use":"In an answer, say where the crescendo starts and ends, the levels involved and which instruments drive it. Link crescendos to building tension, excitement and climaxes, and diminuendos to relaxing, endings or fading into a new section.","listen":["Listen for steady growth or fading in volume over a few bars.","Notice whether the crescendo leads to a climax or a new section."],"example":"A **crescendo** from p to ff across bars 9 to 16, with the brass and percussion joining one at a time, builds excitement towards the return of the main theme.","quote":[{"text":"crescendos which build excitement","source":"HSC 2019"},{"text":"Crescendo to decrescendo","source":"HSC 2020"}],"fig":[{"file":"hairpin_cresc.png","caption":"Crescendo: gradually getting louder"},{"file":"hairpin_dim.png","caption":"Diminuendo / decrescendo: gradually getting softer"}]},"Performance directions (Italian)>senza sordino / con sordino (mute)":{"what":["Con sordino (con sord.) means play with a mute; senza sordino (senza sord.) means take the mute off. A mute fits on the bridge of a string instrument or into the bell of a brass instrument and changes the tone, usually making it softer and more veiled.","Brass players have several kinds of mute: straight, cup and harmon, each with its own colour. The harmon mute gives a thin, buzzy, focused sound common in jazz trumpet."],"use":"Name the instrument and the type of mute if you can, then link the tone colour to mood: muted strings sound distant and soft; a harmon mute sounds intimate and edgy. The moment mutes come off is often a structural point, so mention it.","listen":["Listen for a veiled, distant or nasal tone in strings or brass.","Notice a sudden brightening when the mutes are removed."],"example":"The trumpet plays **con sordino** with a harmon mute in the verse for a thin, buzzy tone, then **senza sordino** in the chorus, where the open sound is brighter and louder.","quote":[{"text":"senza sord... Without mute","source":"Trial 2024"},{"text":"harmon mute","source":"HSC 2020"}],"fig":[{"file":"s5_dir_consord.png","caption":"con sord. (mute on) and senza sord. (mute off)"}]},"Performance directions (Italian)>dolce / con forza / espressivo / cantabile":{"what":["These Italian words describe the character of the playing. Dolce means sweetly and gently. Con forza means with force. Espressivo (espress.) means expressively, with feeling. Cantabile means in a singing style, with a smooth, lyrical line.","They often appear at the start of a phrase or section, under or over the notes."],"use":"Quote the term, translate it, then say what you actually hear that matches it: dolce usually brings soft, legato playing; con forza brings loud, accented attacks. Showing a change from one to another (dolce to con forza) is a strong way to describe contrast.","listen":["Listen for the character of a phrase: gentle, forceful, emotional or song-like.","Notice changes in tone and attack when the character marking changes."],"example":"The clarinet's theme is marked **cantabile** and played legato and mp, but when the theme returns it is marked **con forza**, with accented ff attacks that completely change its character.","quote":[{"text":"from dolce... to con forza","source":"HSC 2020"},{"text":"marked espressivo","source":"Trial 2025"},{"text":"lyrical and cantabile","source":"Trial 2021"}]},"Performance directions (Italian)>dynamic letter levels (ppp to ff)":{"what":["Dynamic letters are abbreviations of Italian words: p (piano, soft), f (forte, loud), m (mezzo, moderately). From softest to loudest the common levels are ppp (pianississimo), pp (pianissimo), p, mp, mf, f, ff (fortissimo) and fff.","They are written under the stave (or between the staves for piano) in bold italic letters."],"use":"In an HSC answer, use the letters, not only the English words, and give a range wherever you can ('from ppp to p'). This is precise and saves words. Link the level to the instrument and the effect.","listen":["Pick a level for each new phrase as you listen and jot it down.","Find the extremes so you can state the range."],"example":"The opening stays between **ppp** and **p**, with the strings barely audible, so the sudden **ff** brass chord at bar 9 is a real shock.","quote":[{"text":"from ppp (pianississimo, very, very soft) to p","source":"HSC 2024"}],"fig":[{"file":"rm_s4_dynamics_ladder.png","caption":"The six common markings from softest to loudest: pp, p, mp, mf, f, ff"},{"file":"rm_s5_ppp_fff.png","caption":"The full range, from ppp to fff"}]},"Performance directions (Italian)>leggiero / leggierissimo / grazioso / sotto voce / delicatamente / semplice":{"what":["These directions all ask for a light, gentle or unforced manner. Leggiero means lightly, and leggierissimo very lightly. Grazioso means gracefully. Sotto voce means 'under the voice', so very quietly, as if in an undertone. Delicatamente means delicately. Semplice means simply, without extra expression.","They usually come with soft dynamics and short or light articulation."],"use":"Quote and translate the direction, then describe how the performer achieves it: soft dynamics, light staccato, little vibrato, a thin texture. Link it to the mood, such as playful, graceful, secretive or innocent.","listen":["Listen for light, unforced playing with little weight on the notes.","Notice whether the texture thins out at the same time."],"example":"The piano's right hand plays **leggiero**, with light staccato semiquavers at p, while the left hand marks only the main beats, which gives the scherzo a quick, airy feel.","quote":[{"text":"the leggiero style","source":"HSC 2023"},{"text":"Allegretto grazioso","source":"Trial 2021"},{"text":"marked sotto voce","source":"Trial 2021"},{"text":"(delicatamente)","source":"Trial 2023"},{"text":"semplice... play simply","source":"Trial 2009"}]},"Performance directions (Italian)>sforzando (sfz) / fortepiano (fp) / sfzp":{"what":["Sforzando (sfz or sf) means a sudden, forceful accent on one note or chord. Fortepiano (fp) means play the note loud and then drop immediately to soft. Sforzando-piano (sfzp or sfp) combines them: a strong accent followed straight away by soft.","All three are single-note events, not gradual changes."],"use":"Name which instruments play the sfz or fp and where, and link it to effect: a shock, an aggressive stab, or a swell (fp followed by a crescendo is common for building tension). Saying 'sfz chords from the whole ensemble' is far stronger than 'loud bits'.","listen":["Listen for single notes or chords that are suddenly much louder than the music around them.","Notice a loud attack that drops to soft and then perhaps grows again."],"example":"The whole ensemble plays **sforzando** chords on the off-beats, then the horns hold an **fp** note that drops to soft and crescendos again, which builds tension into the next section.","quote":[{"text":"the use of sforzando by all instruments","source":"HSC 2018"},{"text":"use of fp and sfzp","source":"HSC 2020"}]},"Performance directions (Italian)>ad libitum / senza misura / 'breathing' marks":{"what":["Ad libitum (ad lib.) means 'at liberty': the performer may choose the tempo, repeat a passage freely or improvise. Senza misura means 'without measure', so there is no strict beat or bar. Breathing marks (a small comma or tick above the stave) show where to take a breath or make a short break between phrases.","Together they give the performer control over timing and phrasing."],"use":"Use these terms when the music sounds free and unmeasured, or when the score shows them. Link them to duration (no clear pulse, free rhythm) and to an improvised, speech-like or meditative character. Breathing marks show how phrases are separated.","listen":["Listen for a passage with no steady beat, where the player stretches and compresses time.","Notice short breaks between phrases, like a speaker taking a breath."],"example":"The flute solo is played **senza misura** and **ad libitum**, with no clear beat, and short breaks at the **breathing** marks separate each phrase, so the opening sounds free and improvised.","quote":[{"text":"performed sempre ad libitum","source":"HSC 2022"},{"text":"senza misura (without measure)","source":"HSC 2022"},{"text":"'breathing' indications","source":"HSC 2022"}]},"Dynamics and expression>Phrasing and character":{"what":["These words describe the character of a performance: the mood and manner the dynamics, articulation and tempo add up to. Some have Italian equivalents written in scores (maestoso, dolce, feroce, animando), and others are English words you choose to describe what you hear (relentless, languid, boisterous).","Phrasing is how notes are grouped into musical sentences, shaped with rises and falls in volume and small breaths between them."],"use":"Character words are strongest when you prove them. Never write only 'it sounds majestic': say what makes it majestic (slow tempo, ff brass, accented crotchets in a low register). Use one well-chosen character word per point, then support it with two or three concepts from other elements.","listen":["Ask what mood the performer is aiming for, then find the musical evidence for it.","Listen to how phrases are shaped: do they swell to a peak and fall away, or stay flat?"],"example":"The theme is played in a **languid**, **lyrical** manner, with long legato phrases that rise to mf and fall away, while the **relentless** semiquavers in the piano underneath keep the music moving forward."},"Phrasing and character>lyrical":{"what":["Lyrical describes a melody that sounds like singing: smooth, flowing, mostly legato, with shaped phrases that rise and fall. The Italian equivalent written in scores is cantabile.","Lyrical melodies often move mainly by step and are played with a warm tone and vibrato."],"use":"Use lyrical for melodies, and support it with evidence from other elements: legato articulation, stepwise motion, long phrases, a singing tone. Link it to warmth, tenderness or nostalgia, and contrast it with a more rhythmic or detached section.","listen":["Listen for a melody you could easily sing, with long smooth phrases.","Notice phrases that swell and relax naturally."],"example":"The cello's **lyrical** melody moves mostly by step in long legato phrases, shaped with small swells, which gives the slow section a warm, tender character.","quote":[{"text":"more lyrical and expressive","source":"Trial 2021"}]},"Phrasing and character>animated (animando)":{"what":["Animated means lively, with energy and movement. Animato is the Italian for 'animated', while animando means 'becoming animated': the music gradually gains energy, often with a slight push forward in tempo.","An animated performance often uses short articulation, accents and a brighter tone."],"use":"Use animated for lively, spirited playing and give the evidence: a faster tempo, detached notes, accents, rising dynamics. If the music becomes livelier during the excerpt, use animando and say where the change starts.","listen":["Listen for energy and forward motion in the playing.","Notice if the tempo or rhythmic activity increases as the passage goes on."],"example":"From bar 20 the music becomes **animated**, with detached quavers, accents and a slight push in tempo, which gives the second theme a bright, spirited feel.","quote":[{"text":"perform in an animated manner","source":"HSC 2022"}]},"Phrasing and character>savage / barbaric (feroce)":{"what":["Savage and barbaric describe music that sounds wild, violent and primitive. Composers may write feroce (fiercely), barbaro (barbaric) or intenso (intense) in the score.","This character usually comes from heavy accents, loud dynamics, dissonance, low registers and driving, repeated rhythms."],"use":"Use these words only with strong evidence: name the accents, the ff dynamic, the percussive attacks and the dissonant harmony. They suit 20th century music in particular. Link them to aggression, violence or ritual.","listen":["Listen for hammered, accented chords and pounding repeated rhythms.","Notice harsh dissonance and loud, low brass and percussion."],"example":"Marked **feroce**, the passage is **savage** and driving, with ff accented chords in the low strings and timpani hammering an irregular rhythm.","quote":[{"text":"'intenso, barbaro' (intense, savage)... 'feroce'","source":"Trial 2023"}]},"Phrasing and character>graceful / sweet (dolce)":{"what":["Graceful describes elegant, light, flowing music. Sweet describes a gentle, tender tone; the Italian direction is dolce (sweetly). The Italian for gracefully is grazioso.","Both usually come with soft dynamics, legato or light articulation and a smooth melody."],"use":"Use these words for a gentle, elegant mood and support them: p or mp dynamics, legato or lightly detached notes, a smooth melody, a light texture. Link them to dances (like a minuet) or to tender moments.","listen":["Listen for soft, gentle playing with a warm, sweet tone.","Notice light, elegant rhythms that do not push forward."],"example":"The flute plays **dolce**, softly and legato, over a light pizzicato accompaniment, which gives the dance a **graceful**, elegant character.","quote":[{"text":"the overall mood is graceful and sweet, dolce","source":"Trial 2021"}]},"Phrasing and character>relentless":{"what":["Relentless describes music that keeps going without any break or let-up: constant repeated rhythms, an unchanging ostinato or a stream of fast notes.","The word describes character, but the evidence for it is usually in duration and texture."],"use":"Use relentless for continuous, driving material, often in an accompaniment. Name the rhythm (semiquavers, quavers), the instrument and how long it lasts, then link it to tension, urgency or a sense of being trapped.","listen":["Listen for a rhythm that never stops or changes.","Notice whether it continues even when the melody pauses."],"example":"The cellos play **relentless** semiquavers for the whole section, never pausing even at phrase ends, which builds tension and a feeling of being chased.","quote":[{"text":"The accompanying semiquavers are relentless","source":"HSC 2023"}]},"Phrasing and character>urgent":{"what":["Urgent describes music that feels pressing and in a hurry. It often comes from fast tempo, short repeated notes, accents, crescendos and rising pitch.","Composers may write agitato (agitated) or affrettando (hurrying) to ask for this."],"use":"Use urgent with evidence: fast repeated notes, short phrases, rising sequences, crescendos, a push in tempo. Link it to suspense or drama, especially in film music.","listen":["Listen for fast, repeated notes and short, breathless phrases.","Notice rising pitch and growing volume that push the music forward."],"example":"Short, repeated string figures, rising in sequence with a steady crescendo, give the passage an **urgent** character that pushes towards the climax.","quote":[{"text":"a sense of urgency","source":"Trial 2021"}]},"Phrasing and character>intense":{"what":["Intense describes music with a concentrated strength of feeling or energy. It can be loud and forceful or quiet and focused; the Italian intenso asks for this quality.","Intensity often comes from extremes: very loud or very soft dynamics, high registers, dissonance or sudden changes."],"use":"Use intense for strong emotional energy, and say what creates it: sudden dynamic extremes, high register, dense texture, dissonance. Pair it with a clear location in the music.","listen":["Listen for moments of extreme volume or sudden change.","Notice high, strained registers and dense, clashing harmony."],"example":"The **intense** dynamic changes, with sudden jumps from pp to sfz chords, keep the listener on edge throughout the development.","quote":[{"text":"Use of intense dynamic changes","source":"HSC 2024"}]},"Phrasing and character>dramatic":{"what":["Dramatic describes music with strong, theatrical contrasts: sudden changes of dynamics, texture or tempo, big climaxes and surprising silences.","In an answer it should always come with the specific contrast that makes it dramatic."],"use":"Use dramatic for bold contrasts and name them: 'dramatic changes from pp to sfz', 'a dramatic pause before the tutti'. Link the drama to structure (marking new sections) or to a story or emotion.","listen":["Listen for sudden extremes in volume, texture or register.","Notice silences or pauses that build anticipation."],"example":"A **dramatic** contrast occurs at bar 30, where a pp solo violin is cut off by an sfz tutti chord, which announces the start of the development.","quote":[{"text":"Dramatic changes in dynamics from pianissimo to sforzando","source":"HSC 2023"}]},"Phrasing and character>languid":{"what":["Languid describes music that is relaxed, slow-moving and lazy, as if lacking energy. It usually comes from a slow tempo, long legato phrases, soft dynamics and sometimes a slight stretching of the rhythm.","It is a character word, so support it with evidence from tempo, articulation and dynamics."],"use":"Use languid for slow, relaxed melodies, often on strings, cor anglais or saxophone. Name the evidence (slow tempo, legato, sustained notes, soft dynamics) and link it to a dreamy, warm or melancholy mood.","listen":["Listen for slow, unhurried phrases that seem to drift.","Notice long legato notes with little rhythmic drive."],"example":"The cor anglais plays a **languid** melody, slow and legato over sustained strings, with notes slightly stretched at the ends of phrases, which creates a drowsy, dreamy atmosphere.","quote":[{"text":"a languid, legato bowed melody","source":"HSC 2022"}]},"Phrasing and character>expressive":{"what":["Expressive playing shapes the music with feeling: small changes of volume, tempo (rubato), vibrato and tone across each phrase. The Italian direction is espressivo (espress.).","It is a general word, so in an answer it needs specific evidence."],"use":"Do not leave 'expressive' on its own. Say how the performer is expressive: swells, vibrato, rubato, a warm tone, legato phrasing. Name the instrument and section, and link it to the emotion of the passage.","listen":["Listen for phrases that are shaped, swelling and relaxing.","Notice vibrato, rubato and changes of tone colour."],"example":"The upper woodwinds play an **expressive**, legato melody, shaping each phrase with small swells and vibrato, which gives the slow section a tender, singing quality.","quote":[{"text":"Expressive, legato upper woodwinds","source":"HSC 2022"}]},"Phrasing and character>boisterous / energetic":{"what":["Boisterous describes noisy, high-spirited, rowdy music. Energetic is more general: full of drive and activity.","Both usually come with fast tempo, loud dynamics, accents, short articulation and a busy texture."],"use":"Use these words for lively, high-energy passages and give the evidence: a fast tempo, f or ff, accents, busy rhythms in several parts. Link them to celebration, dance or fun.","listen":["Listen for loud, busy, high-spirited playing.","Notice strong accents and quick, bouncing rhythms."],"example":"The finale is **boisterous** and **energetic**, with ff accented quavers in the brass and a fast, syncopated rhythm in the percussion.","quote":[{"text":"boisterous and energetic","source":"Trial 2021"}]},"Phrasing and character>delicate / playful":{"what":["Delicate describes music that is light, fine and fragile: soft dynamics, high registers, light articulation and a thin texture. Playful describes light-hearted, teasing music, often with staccato, surprising accents, sudden stops and quick exchanges between instruments.","A scherzo (Italian for 'joke') is a movement that is often playful in character."],"use":"Use these words with evidence: soft dynamics, staccato, high register and thin texture for delicate; staccato, sudden rests and unexpected accents for playful. Link them to mood and to the style or movement type.","listen":["Listen for light, soft, high-pitched playing with little weight.","Notice musical 'jokes': sudden silences, unexpected accents, quick changes."],"example":"The **playful** woodwind exchanges, with short staccato figures passed between flute and bassoon and sudden rests, give the scherzo a **delicate**, teasing character.","quote":[{"text":"the delicate and 'playful' scherzo feel","source":"Trial 2025"}]},"Phrasing and character>majestic (maestoso)":{"what":["Majestic describes music that sounds grand, noble and stately, like a royal procession. The Italian direction is maestoso (majestically).","It usually comes from a moderate or slow tempo, loud dynamics, full texture, brass and timpani, and strong, steady rhythms, often dotted."],"use":"Use majestic with evidence: slow tempo, f or ff, full orchestra, brass fanfare figures, dotted rhythms, a strong steady beat. Link it to ceremony, triumph or a grand ending.","listen":["Listen for slow, steady, grand playing with full brass.","Notice dotted rhythms and strong chords on the main beats."],"example":"Marked **maestoso**, the final statement of the theme is **majestic**, played ff by full brass over timpani with broad, dotted rhythms.","quote":[{"text":"slowly and majestically","source":"Trial 2024"},{"text":"Maestoso (majestically)","source":"HSC 2022"}]},"Phrasing and character>forceful":{"what":["Forceful describes playing with strength and power: loud dynamics, heavy accents and strong attacks on the notes. The Italian equivalent is con forza.","Even short sounds like pizzicato can be forceful if they are plucked hard."],"use":"Use forceful with the instrument and the technique that makes it so (hard pizzicato, marcato bowing, accented brass). Link it to aggression, power or emphasis at a structural point.","listen":["Listen for heavy, strong attacks on the notes.","Notice loud plucked or hit sounds with a hard edge."],"example":"The cellos and double basses play **forceful** pizzicato notes on each downbeat, which give the passage a heavy, aggressive pulse.","quote":[{"text":"the forceful pizz. from the cello and double bass","source":"HSC 2020"}]},"Dynamics and expression>Special playing techniques":{"what":["These are particular ways of producing sound on an instrument: bowing techniques (spiccato, jeté, tremolo, sul ponticello, col legno), plucking techniques (snap pizzicato), wind techniques (slap tonguing) and ornaments or effects (trill, glissando, vibrato, laissez vibrer).","Many of them belong to both dynamics and expression and performing media, because they change the timbre as well as the way the note is shaped."],"use":"Naming a special technique correctly is an easy way to show precise knowledge. Always say which instrument plays it, where, and how it changes the tone colour or the mood. These techniques are common in 20th and 21st century art music and in film scores, so expect them in Music 2 and in Australian music excerpts.","listen":["Listen for a sound that does not seem 'normal' for the instrument, then work out how it is being made.","Ask whether the bow is bouncing, shaking, scraping or tapping the string.","Listen for slides, wobbles in pitch and notes left to ring."],"example":"The cellos use **col legno** to tap out a dry, percussive ostinato while the violins play **sul ponticello tremolo**, which gives the passage a glassy, unsettling tone colour.","fig":[{"file":"rm_s5_string_techniques.png","caption":"String techniques: tremolo (slashes through the stem), double stop, harmonic, col legno and ord."}]},"Special playing techniques>jeté bowing":{"what":["Jeté (French for 'thrown', also called ricochet) is a string bowing technique. The player throws the bow onto the string and lets it bounce, so several quick notes are played in one bow stroke.","It is written with dots under a slur, usually with the word jeté or ricochet."],"use":"Use jeté for a fast, bouncing group of notes in one bow, and say which string instrument and where. Link it to a light, sparkling or skittish tone colour. Do not confuse it with spiccato, where each note has its own bow stroke.","listen":["Listen for a quick burst of bouncing notes that seem to tumble out together.","Notice a light, sparkling string sound with small gaps between notes."],"example":"The violins use **jeté** bowing in b
