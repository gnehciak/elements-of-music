aver triplets as 'tri-pl-et' or '1-trip-let' so all three notes are even."],"use":"Triplets give a rolling, flowing feel and are common in Romantic piano music, film scores, rock ballads and drum fills. Jazz swing is based on the triplet feel. When you compose, use one triplet in a line of straight quavers to make a moment stand out, or a crotchet triplet to make a phrase feel stretched.","listen":["Tap the beat and check whether three equal notes fit into each tap.","Listen for a smooth, rolling pattern that sounds different from the straight quavers around it.","Drummers often play triplets across the toms in a fill."],"example":"In the second phrase the melody moves into quaver **triplets**, three even notes to each beat, which makes it flow more smoothly than the straight quavers in the opening."},"Complex note and rest values>Duplet":{"what":["A duplet is two notes played in the time normally taken by three of the same kind. It turns up in compound time such as 6/8, where each beat is a dotted crotchet split into three quavers.","A duplet splits that dotted crotchet beat into two equal halves instead. It is written as two quavers with a small 2 above them. It is the opposite of a triplet."],"use":"Composers use duplets to break the lilting three-feel of compound time for a moment, so a phrase sounds briefly straight or held back. You find them in jigs, folk tunes in 6/8 and classical music. When you compose in 6/8, try one duplet near the end of a phrase so the rhythm changes just before the cadence.","listen":["In music that skips along in threes (6/8), listen for a beat that suddenly splits into two even notes.","The duplet feels slightly slower and heavier than the three quavers around it."],"example":"In the last bar of the phrase the melody uses a **duplet**, two even notes across a dotted crotchet beat, which briefly breaks the lilting 6/8 feel and slows the phrase down."},"Complex note and rest values>Dotted rhythms":{"what":["A dot after a note adds half the note's value again. A dotted quaver is worth three semiquavers, so a dotted quaver followed by a semiquaver fills one crotchet beat with a long note and a short note.","Played one after another, these long-short pairs give the music a skipping or jerky feel. Count it as '1 (e and) a': the long note covers the first three quarters of the beat."],"use":"Dotted rhythms sound bold and energetic, so you hear them in marches, fanfares, national anthems, Baroque overtures and Scottish folk music (where the reversed short-long version is called a Scotch snap). When you perform, keep the short note really short and crisp. When you compose, use dotted rhythms for a proud or confident melody.","listen":["Listen for an uneven long-short, long-short pattern rather than even notes.","The short note sounds like it pushes into the next beat.","Dotted rhythms often go with a march feel and loud brass or snare drum."],"example":"The trumpet melody is built on **dotted rhythms**, crisp long-short pairs that give the opening a proud, march-like character.","fig":[{"file":"nv_dotted_crotchet.png","caption":"A dotted crotchet is worth a crotchet plus a quaver (one and a half beats)"}]},"Duration>Mixed and irregular metre":{"what":["Most music keeps the same metre all the way through, with bars of two, three or four even beats. This group covers music that breaks those habits.","Mixed (changing) metre means the time signature changes during the piece. Irregular (asymmetric) metre means each bar has beats of uneven length, grouped in 2s and 3s, as in 5/4 and 7/8."],"use":"These metres make music feel unpredictable, urgent or dance-like. They are common in Eastern European and Balkan folk music, progressive rock, film music and 20th-century classical music. Some music uses both at once. When you compose, try writing a riff in 7/8 or adding one 2/4 bar into a 4/4 song.","listen":["Count the beats in each bar. If the count keeps changing, the metre is mixed.","If the count is always five or seven, listen for long and short beats inside the bar.","If you can't tap your foot comfortably along, listen again for an uneven pattern."],"example":"The verse is in an **irregular metre** of 7/8, grouped 2 + 2 + 3, and the bridge uses **mixed metre** as the bars switch between 3/4 and 4/4, so the song never settles into a predictable pulse."},"Mixed and irregular metre>Mixed metre (changing metre)":{"what":["Mixed metre (also called changing metre) is when the time signature changes during a piece. A new time signature is written at the start of the bar where the change happens, for example 4/4, then 3/4, then 2/4.","The beat usually stays the same speed. Only the number of beats in each bar changes, so the strong first beat arrives earlier or later than you expect."],"use":"Composers use mixed metre to follow the natural rhythm of words, to surprise the listener or to make a riff feel restless. You hear it in folk songs, progressive rock, musical theatre and modern classical music such as Stravinsky. When you compose, add a bar with one beat fewer at the end of a phrase so the next phrase comes in early.","listen":["Count the beats from one strong beat to the next, and notice when the number changes.","Listen for a phrase that seems to arrive a beat early or late.","Watch for the strong accent (beat 1) shifting around."],"example":"In the chorus the music uses **mixed metre**, adding a single bar of 2/4 into the 4/4, so the next phrase arrives two beats early and catches the listener off guard."},"Mixed and irregular metre>Irregular (asymmetric) metre":{"what":["An irregular (asymmetric) metre has bars that cannot be split into equal beats. The beats fall into uneven groups of 2s and 3s, so some beats are longer than others.","5/4 (3 + 2) and 7/8 (2 + 2 + 3) are the most common. Unlike mixed metre, the time signature does not change. Every bar has the same uneven pattern."],"use":"Irregular metres give music a limping, driving or dance-like feel. They are normal in many Balkan, Greek, Turkish and Indian traditions, and turn up in jazz (Dave Brubeck's Take Five is in 5/4), progressive rock and film music. When you compose, write a drum or bass pattern in 7/8 and loop it so the uneven grouping becomes the groove.","listen":["Count the beats in each bar. Five or seven is a strong clue.","Listen for a beat that feels slightly longer than the others.","Notice where the accents fall inside the bar: they show the grouping."],"example":"The piano riff is in an **irregular metre** of 5/4, grouped 3 + 2, which gives the music a lopsided, limping feel."},"Irregular (asymmetric) metre>5/4":{"what":["5/4 has five crotchet beats in every bar. Five can't be split evenly, so the beats are usually felt as 3 + 2 (count 1 2 3 4 5 with accents on 1 and 4) or 2 + 3 (accents on 1 and 3).","The accents tell you which grouping is being used."],"use":"5/4 gives a lopsided, swaying feel. The most famous jazz example is Dave Brubeck's Take Five, and it is used in film scores and progressive rock. When you perform, count all five beats out loud at first and lean on the accented beats. When you compose, write an ostinato that groups 3 + 2 and keep it steady under the melody.","listen":["Count steadily from one strong beat to the next and see whether you land on 5.","Listen for one long and one short half to the bar.","The piano or bass often repeats a riff that makes the 3 + 2 grouping clear."],"example":"The piano vamp is in **5/4**, grouped 3 + 2, so each bar feels one beat too long and the groove sways unevenly."},"Irregular (asymmetric) metre>7/8":{"what":["7/8 has seven quavers in every bar. The quavers are grouped into uneven beats, most often 2 + 2 + 3, but also 3 + 2 + 2 or 2 + 3 + 2.","The beams in the notation show the grouping, and the accent falls on the first quaver of each group. Count it '1 2, 1 2, 1 2 3' so you feel three beats, with the last one longer."],"use":"7/8 has a driving, slightly breathless feel. It is common in Bulgarian, Macedonian and Greek dances, and turns up in progressive rock and film music. When you perform, say the counting aloud and clap the first note of each group. When you compose, set up a drum pattern in 2 + 2 + 3 and keep it the same every bar.","listen":["Count quavers from one strong beat to the next and see whether you reach seven.","Listen for two short beats and one long beat (or another uneven mix).","Notice that the music never settles into an even 'left, right' pulse."],"example":"The dance tune is in **7/8**, grouped 2 + 2 + 3, so the long third beat gives every bar a small hitch that drives the music forward."},"Duration>Rhythmic devices":{"what":["Rhythmic devices are particular tricks composers use with rhythm. Some are about where the music starts (anacrusis), some are about layers of rhythm clashing (polyrhythm, cross-rhythm), some are about style (swing) and some are about changing the length of an idea (augmentation, diminution).","Each one changes how the rhythm feels against the beat."],"use":"These devices give music its groove and energy. Polyrhythms and cross-rhythms are central to West African drumming and Latin music, swing is the basis of jazz and augmentation and diminution are used to develop themes in classical music. When you compose, try layering two rhythms that clash, or repeat a rhythm twice as fast.","listen":["Listen for layers of rhythm that don't line up with each other.","Listen for a familiar rhythm that comes back faster or slower.","Listen for whether quavers are played evenly or long-short."],"example":"Under the swung melody the percussion sets up a **cross-rhythm** of 3 + 3 + 2, and the main rhythm returns in **augmentation** at the end, which slows the music down for the final bars."},"Rhythmic devices>Up-beat / anacrusis":{"what":["An anacrusis (or up-beat, sometimes called a pick-up) is one or more notes that come before the first full bar. The music starts on a weak beat and leads into the strong first beat of bar 1.","To keep the total right, the last bar is usually shortened by the same amount. If the piece starts with one beat in 4/4, the final bar has only three beats."],"use":"Many songs and hymns start with an anacrusis because the first word is unstressed. Composers use it to give the opening a sense of lift into the first strong beat. When you perform, count in the full bar so you come in on the right beat. When you compose song lyrics, check whether the first syllable is weak. If it is, start on an up-beat.","listen":["Listen for whether the first note feels like a strong 'landing' or a lead-in.","Count along: if the singer starts on 'and' or beat 4, it is an anacrusis.","The first strong beat often comes on an important word."],"example":"The melody begins with an **anacrusis** on beat 4, so the first strong beat lands on the important word in bar 1 and the phrase lifts into its opening."},"Rhythmic devices>Polyrhythm":{"what":["A polyrhythm is two or more different divisions of the beat played at the same time. The most common is 3 against 2: one part plays three even notes while another plays two even notes in the same space of time.","Both parts start together and land together at the end of the span, but the notes in between don't line up. A useful way to say 3 against 2 is 'not-diff-i-cult'."],"use":"Polyrhythm is at the heart of West African drumming and Afro-Cuban music, and is also used in jazz, Romantic piano music and progressive rock. Pianists often play triplets in one hand and quavers in the other. When you perform, practise each layer alone, then put them together slowly. When you compose for percussion, give each instrument its own division of the beat.","listen":["Listen for two layers that start together but drift apart in the middle of each beat.","Tap along with each layer in turn: one will feel in threes and one in twos.","In drumming, listen for one drum pattern that seems to fight another."],"example":"In the drumming section the bell plays a **polyrhythm** of three against the two of the bass drum, so the layers keep clashing and the texture sounds busy and exciting."},"Rhythmic devices>Cross-rhythm":{"what":["A cross-rhythm is an accent pattern that cuts across the metre. The music stays in 4/4, but accents are placed in groups that don't match the beats, such as 3 + 3 + 2 quavers.","It differs from polyrhythm because the notes themselves can be even and line up with the beat. What changes is where the accents fall, so you hear a second pulse fighting the main one."],"use":"Cross-rhythms are very common in Latin music, pop, dance music and African drumming. The 3 + 3 + 2 pattern is sometimes called the tresillo. A guitar or synth riff often accents 3 + 3 + 2 while the drums keep a straight beat. When you compose, take eight quavers and accent the 1st, 4th and 7th.","listen":["Tap the main beat, then listen for accents that fall between your taps.","Listen for a pattern that feels like it groups in threes over a beat of four.","Check whether the drums stay steady while another part pulls against them."],"example":"The synth riff is accented in a 3 + 3 + 2 **cross-rhythm** against the steady four-beat kick drum, which makes the groove feel pushy and syncopated."},"Rhythmic devices>Swung (swing)":{"what":["Swing (swung quavers) means playing pairs of quavers long-short instead of evenly. The first quaver takes about two thirds of the beat and the second takes one third, like a triplet with the first two notes tied together.","The music is still written as normal even quavers. A note at the top of the score such as 'Swing' or a little picture of quavers equalling a triplet tells the player to swing them."],"use":"Swing is the basic feel of jazz, blues, boogie-woogie and rock 'n' roll, and is also used in some hip hop and shuffle grooves. Drummers swing the ride cymbal pattern and the whole band follows. When you perform, think 'doo-ba, doo-ba' with a long first note. When you compose in a jazz or blues style, write even quavers and mark the piece 'Swing'.","listen":["Listen to quaver runs: are they even like a clock or lopsided like 'long-short, long-short'?","Listen to the ride cymbal or hi-hat in a jazz band.","Swung music feels relaxed and bouncy rather than stiff."],"example":"The saxophone plays **swung** quavers, long-short pairs over the walking bass, which gives the solo a relaxed, bouncy jazz feel."},"Rhythmic devices>Diminution":{"what":["Diminution is when a rhythm or theme is repeated using shorter note values, usually half as long. Crotchets become quavers and minims become crotchets.","The pitches and the shape stay the same, so you can still recognise the idea, but it now moves twice as fast against the beat. The tempo itself does not change. Diminution is the opposite of augmentation."],"use":"Composers use diminution to build excitement or urgency, often near a climax or in the development of a theme. It is common in Baroque fugues and in film music where a theme speeds up during a chase. When you compose, take your main motif and halve every note value, then use the faster version to build towards a big moment.","listen":["Listen for a tune you already know that suddenly sounds twice as fast.","Check the beat: if the beat stays steady but the idea rushes, it is diminution, not a faster tempo.","It often appears just before a climax."],"example":"Near the climax the opening motif returns in **diminution**, in quavers instead of crotchets, so it sounds twice as fast and drives the music towards the final chord."},"Rhythmic devices>Augmentation":{"what":["Augmentation is when a rhythm or theme is repeated using longer note values, usually twice as long. Quavers become crotchets and crotchets become minims.","The pitches and the shape stay the same, so the idea is still recognisable, but it now sounds slower and broader against the beat. The tempo itself does not change. Augmentation is the opposite of diminution."],"use":"Composers use augmentation to make a theme sound grand, solemn or final, often in the bass or brass near the end of a piece. In fugues it lets a slow version of the subject sit under faster parts. When you compose, take your motif, double every note value and give it to a low instrument under the original.","listen":["Listen for a familiar tune that sounds stretched out and slower.","Keep tapping the beat: if the beat is steady but the tune has slowed, it is augmentation.","It is often in low, loud instruments near the end."],"example":"In the final section the brass play the main theme in **augmentation**, with every note twice as long, which makes it sound grand and final."},"Elements of Music>Structure":{"what":["Structure is how a piece of music is organised. It includes the big sections and the overall form (the macrostructure), the small building blocks such as motifs, phrases and riffs (the microstructure) and the ways an idea is developed as the piece goes on.","In Stage 5 you learn larger forms like sonata form and theme and variations, and the techniques composers use to change an idea, such as sequence, inversion and fragmentation."],"use":"Structure gives music balance between unity (things coming back) and variety (new or changed things). Every style has its typical forms: verse-chorus in pop, 12-bar blues, head-solos-head in jazz, colotomic cycles in gamelan. When you compose, plan your sections first with letters (A A B A) and decide how each one will be different.","listen":["Listen for when something new starts and give each section a letter.","Notice which ideas come back, and whether they come back changed.","Listen for the signals of a new section: cadences, drum fills, changes in texture or key."],"example":"The piece is in **sonata form**: the first theme returns in the **recapitulation**, but this time it is **fragmented** into short bursts, which builds tension before the final cadence."},"Structure>Link structure to style":{"what":["This tip is about using what you know of a style to predict its structure. Most styles have a typical way of being put together. A blues usually follows a 12-bar chord pattern repeated over and over, a Classical symphony has several movements and often uses sonata form and a gamelan piece is built on repeating gong cycles.","If you can name the style, you already have a good guess about the form."],"use":"In a listening exam, work out the style first from the instruments and sound, then check whether the structure matches the usual pattern for that style. If it does, say so. If it doesn't, say what is different, because that is often the most interesting thing to write about. When you compose in a style, borrow its usual structure as your plan.","listen":["Identify the style from the instruments and sound before you think about form.","Check the structure against what is normal for that style.","Point out anything unusual, such as a blues that changes key."],"example":"As expected in **blues**, the excerpt follows the **12-bar blues** chord pattern, repeated for each verse and then for the guitar solo."},"Structure>Macrostructures":{"what":["Macrostructures are the large-scale forms of whole pieces or movements: how the big sections are arranged and which ones return. In Stage 4 you met binary, ternary, rondo and verse-chorus.","Stage 5 adds strophic, through-composed, theme and variations, sonata form and multi-movement works. Sections are labelled with capital letters, and a letter that comes back means that section returns."],"use":"Composers choose a form to suit the music's purpose. Songs that tell a story might be through-composed, hymns are strophic and a symphony uses several movements with sonata form in the first. When you analyse, label the sections with letters as you listen, then name the form. When you compose, decide your form before you start writing.","listen":["Write a letter each time a new section starts, and reuse a letter when a section returns.","Count how many times the main idea comes back and whether it is changed.","Listen for long pauses that may separate movements."],"example":"The song is **strophic**, with the same music for every verse, whereas the second piece is **through-composed** and the music keeps changing to follow the story."},"Macrostructures>Strophic":{"what":["A strophic song uses the same music for every verse, while the words change each time. It is labelled A A A A, and each verse (or stanza) is called a strophe.","There may be a short introduction or an instrumental break between verses, but the main tune does not change. A strophic song may also have a refrain, a line of words that comes back at the end of each verse."],"use":"Strophic form suits songs where people need to learn the tune quickly and sing many verses: hymns, folk songs, nursery songs, many ballads and protest songs. Performers keep it interesting by changing the dynamics, accompaniment or instruments from verse to verse. When you write lyrics with several verses, a strophic setting is the simplest plan.","listen":["Listen for the same tune with new words each time.","Check for a contrasting section such as a chorus or bridge: if there isn't one, it is probably strophic.","Notice what the performers change between verses to add variety."],"example":"The folk song is **strophic**, with every verse sung to the same melody, so the focus stays on the story in the words while the guitar accompaniment becomes busier in each verse."},"Macrostructures>Through-composed":{"what":["A through-composed piece has new music for each section, with little or no return of earlier material. It could be labelled A B C D and so on.","Instead of repeating a tune, the music follows the words or the story, changing its mood, key or tempo as the events change. It is the opposite of strophic form."],"use":"Through-composed form suits music that tells a story or follows a changing scene, so it turns up in art songs (such as Schubert's Erlkönig), opera, film scores and some progressive rock songs. When you compose music for a story or a film clip, plan new music for each event instead of repeating a chorus.","listen":["Listen for whether any section comes back. If none does, it may be through-composed.","Notice how the music changes when the words or story change.","Listen for changes of key, tempo or mood that follow the drama."],"example":"The art song is **through-composed**: the piano music changes with each part of the story and never returns to the opening, which keeps the drama moving forward."},"Macrostructures>Theme and variations":{"what":["In theme and variations, a theme (the main tune) is played first, then repeated several times with changes. Each repeat is a variation, labelled A, A1, A2, A3 and so on.","Something stays the same in every variation (usually the melody's outline or the chord pattern) so you can still recognise the theme. Something else changes: the melody may be decorated, the rhythm or metre altered, the key changed to minor or the texture and instruments changed."],"use":"This form shows off a composer's imagination and a performer's skill, and is common in Classical and Baroque music, jazz standards (each solo chorus is a kind of variation) and film music. When you compose, write a simple 8-bar theme, then make three variations that each change one element: rhythm, key, then texture.","listen":["Learn the theme well the first time you hear it.","In each variation, ask what has stayed the same and what has changed.","Listen especially for a change to the minor key or a big change in tempo."],"example":"In the third variation the **theme** moves into the minor key and the tempo slows, so the cheerful tune becomes sad while its melodic shape stays recognisable."},"Macrostructures>Sonata form":{"what":["Sonata form is a large form used in Classical and Romantic music, often for the first movement of a symphony, sonata or string quartet. It has three main sections. The exposition presents two contrasting themes, the first in the home key and the second in a new key.","The development takes those themes and changes them, breaking them up and moving through different keys. The recapitulation brings both themes back, this time both in the home key. A coda may round it off."],"use":"Sonata form lets a composer build tension and then resolve it, because the key contrast set up in the exposition is settled in the recapitulation. Haydn, Mozart and Beethoven used it constantly. When you listen, the development is usually the most unstable and dramatic part. To compose a mini version, write two contrasting themes, mix them up in the middle, then bring both back in the home key.","listen":["Listen for two different themes near the start, often a bold first theme and a gentler second theme.","In the middle, listen for the themes being broken up and passed between instruments and keys.","Listen for the first theme coming back clearly: that is the start of the recapitulation."],"example":"In the **development** the first theme is broken into short fragments that pass through several keys, so when it returns whole in the **recapitulation** it sounds like arriving home."},"Macrostructures>Multi-movement works":{"what":["A multi-movement work is a large piece made up of several complete, separate pieces called movements. Each movement has its own tempo, character and often its own form, and there is usually a short pause between movements.","A Classical symphony usually has four movements (fast, slow, dance, fast). A concerto, a work for a soloist and orchestra, usually has three (fast, slow, fast). Sonatas and suites are multi-movement works too."],"use":"Composers use several movements to give a big work contrast and balance, so the listener moves through different moods. A Baroque suite is a set of dance movements, while a film soundtrack album works in a similar way. When you compose a set of short pieces, plan them so each has a different tempo and mood.","listen":["Listen for complete endings followed by silence and a fresh start.","Notice how tempo and mood change from one movement to the next.","In a concert, audiences usually wait until the last movement has finished before they clap."],"example":"The concerto is a **multi-movement work** in three movements, and the slow, lyrical second movement contrasts with the fast, brilliant outer movements."},"Structure>Microstructures":{"what":["Microstructures are the small building blocks inside a section: motifs, phrases, riffs, ostinatos and call and response from Stage 4, plus sequence, the jazz head and colotomic structure in Stage 5.","Bigger sections are made by joining and repeating these small units, so spotting them helps you explain how a whole piece is built."],"use":"Composers build whole pieces out of a few small ideas. A riff can hold a rock song together, a sequence can stretch a melody and a gong cycle organises a gamelan piece. When you compose, start with one strong motif or riff and build your sections from it.","listen":["Listen for short ideas that keep coming back.","Notice whether an idea repeats at the same pitch (riff, ostinato) or moves higher or lower (sequence).","Listen for regular markers that divide the music into cycles."],"example":"The verse is built on a two-bar **riff** in the bass, and the vocal melody climbs in a **sequence** that leads into the chorus."},"Microstructures>Sequence":{"what":["A sequence is a short melodic pattern repeated straight away at a different pitch, usually higher or lower by a step each time. The shape and rhythm stay the same, only the starting note moves.","It is different from a riff or ostinato, which repeat at the same pitch. A sequence usually has two or three steps before the music moves on."],"use":"Sequences are used to build tension (rising) or relax it (falling), and to stretch a short idea into a longer phrase. They are everywhere in Baroque music and are common in pop choruses and film music. When you compose, write a one-bar motif, then repeat it a step higher, then another step higher.","listen":["Listen for the same short shape played again a little higher or lower.","Listen for a melody that seems to climb or fall in steps of a pattern.","Count how many times the pattern repeats before it breaks off."],"example":"In the bridge the melody climbs in a **sequence**, repeating the same four-note shape a step higher each time, which builds tension towards the final chorus."},"Microstructures>Head":{"what":["In jazz, the head is the main tune of the piece. A typical small-band performance has the shape head, solos, head.","The band plays the head first, then players take turns to improvise solos over the same repeating chord pattern (each time through the chords is called a chorus), then the band plays the head again to finish. The head is usually played by the front-line instruments such as trumpet and saxophone."],"use":"The head gives the listener a tune to hold on to, and the chord pattern under it gives soloists a map for improvising. It is the basic plan of most bebop, swing and modern jazz performances. When you perform in a jazz ensemble, learn the head well, then improvise your solo using notes from the chord pattern.","listen":["Listen for a clear, composed melody at the start, often played by two instruments together.","Notice when one player starts to improvise while the chords keep repeating.","Listen for the opening tune returning at the end."],"example":"The performance follows the jazz form of **head**, solos, head: trumpet and saxophone play the head in unison, then each takes an improvised solo over the same chords before the head returns."},"Microstructures>Colotomic structure":{"what":["Colotomic structure is the way Indonesian gamelan music organises time. The music runs in repeating cycles of beats, and different gongs mark different points in each cycle.","Smaller gongs mark the smaller divisions and the largest gong (the gong ageng) marks the end of each cycle. Because the final beat of the cycle is the most important, the music feels like it is heading towards that big gong stroke."],"use":"Colotomic structure holds a gamelan ensemble together. The balungan (core melody) and the elaborating instruments all fit inside the gong cycle. When you compose a gamelan-style piece, choose a cycle length such as 16 beats, decide which beats each gong plays and keep the big gong for the last beat.","listen":["Listen for a deep gong that comes back regularly at the end of each cycle.","Listen for smaller gongs that divide the cycle into equal parts.","Notice that the strongest point lands at the end of the cycle, not the start."],"example":"The piece has a **colotomic structure** in which the kenong divides each 16-beat cycle into four and the large gong sounds on the final beat, so the music always feels like it is heading towards that stroke."},"Microstructures>From Stage 4":{"what":["These are the microstructures you already learnt in Stage 4. A motif is a short, recognisable musical idea. A phrase is a musical 'sentence' that ends with a feeling of rest. A riff is a short repeated pattern in popular music, and an ostinato is a repeated pattern in any style.","Call and response is when one part plays or sings a phrase and another answers it."],"use":"In Stage 5 you are expected to use these terms accurately in longer answers and link them to the new ideas, for example a motif that is developed by sequence or inversion. When you compose, use a riff or ostinato as a foundation and build a motif-based melody on top.","listen":["Listen for short ideas that repeat exactly (riff, ostinato).","Listen for melodies that seem to ask and answer.","Listen for where phrases end and the performers breathe."],"example":"The bass plays an **ostinato** throughout, while the singer and backing vocals use **call and response** in the chorus."},"Structure>Developing musical material":{"what":["Developing musical material means taking an idea, usually a motif or theme, and doing something to it as the piece goes on. A composer can repeat it, vary it, contrast it with something new, move it to a new pitch (sequence) or key (modulation), change its note lengths (augmentation and diminution), use only part of it (fragmentation) or turn it upside down (inversion).","These techniques let a whole piece grow from a small idea."],"use":"Development balances unity and variety: the listener recognises the idea but keeps hearing it in a new way. It is central to Classical sonata form, film music leitmotifs, minimalism and even pop songs. When you compose, write one short motif, then make every new section from a changed version of it.","listen":["Learn the main idea first, then follow it through the piece.","Each time it returns, ask what has changed: pitch, rhythm, key, direction or length.","Listen for small pieces of the idea being passed between instruments."],"example":"The opening motif is first **repeated**, then played in **sequence** a step higher and in the development it is **fragmented** into its first three notes, which keeps the music unified but builds excitement.","fig":[{"file":"rm_s5_inversion.png","caption":"One motif, and the same motif turned upside down (inversion)"}]},"Developing musical material>Repetition":{"what":["Repetition is when a musical idea is heard again exactly as it was, with the same notes and the same rhythm. It can be immediate (straight after the first time) or come back later in the piece.","Repetition gives music unity. It helps the listener remember an idea and gives them something familiar to hold on to."],"use":"Repetition is everywhere: riffs and choruses in pop, ostinatos in film music, repeated phrases in folk songs and the long repeated patterns of minimalist music. Composers balance it with change, because too much sounds boring and too little sounds confusing. When you compose, repeat your main motif at least once so the listener remembers it.","listen":["Listen for an idea you have already heard coming back exactly the same.","Check whether anything at all has changed, such as the instrument or dynamics. If something has, it is variation, not repetition.","Notice repeated chorus sections in songs."],"example":"The opening motif is heard twice in **repetition**, exactly the same each time, which fixes it in the listener's memory before the melody moves on.","fig":[{"file":"rm_s5_repetition.png","caption":"Repetition: the motif is heard again exactly the same"}]},"Developing musical material>Variation":{"what":["Variation is when an idea comes back with something changed but is still recognisable. The melody might be ornamented with extra notes, the rhythm changed, the chords underneath changed (reharmonised) or the tune given to a different instrument.","The difference from repetition is that something has changed. The difference from contrast is that you can still recognise the original."],"use":"Variation keeps a familiar idea fresh. It is the basis of theme and variations form, jazz improvisation and the way singers decorate later choruses of a song. When you compose, bring back your motif with one change, for example a new rhythm or extra passing notes, so the listener recognises it but hears something new.","listen":["Listen for a familiar tune that sounds slightly different.","Work out what has changed: notes, rhythm, chords, instrument, dynamics or tempo.","Work out what has stayed the same, so you can still recognise it."],"example":"When the theme returns it is a **variation** of the opening: the violin decorates the melody with extra passing notes while the chords underneath stay the same.","fig":[{"file":"rm_s5_variation.png","caption":"Variation: the motif with a new rhythm and extra notes, still easy to recognise"}]},"Developing musical material>Contrast":{"what":["Contrast is when the music brings in something clearly new and different from what came before. It might be a new melody, a different key, a new tempo, a change from loud to soft or a completely different texture.","Contrast gives variety and usually marks the start of a new section. In letter form, a contrasting section gets a new letter (A, then B)."],"use":"Composers use contrast to keep the listener interested and to show the shape of the music. A song's bridge, the B section of ternary form and the second theme of sonata form are all contrasting sections. When you compose, make your B section different in at least two ways from your A section, such as pitch range and dynamics.","listen":["Listen for a moment where the music suddenly sounds new.","Name what has changed: melody, key, tempo, dynamics, texture or instruments.","Ask whether the new music is related to the old (variation) or completely different (contrast)."],"example":"The B section provides **contrast**, with a slow, soft melody in long notes after the busy, loud quavers of the A section.","fig":[{"file":"rm_s5_contrast.png","caption":"Contrast: after the loud, stepwise motif comes a soft new idea with long notes and a leap"}]},"Developing musical material>Sequence":{"what":["A sequence is when an idea is repeated straight away at a higher or lower pitch. The shape and rhythm stay the same and the whole pattern moves up or down, usually by a step each time.","It is a quick way to develop a motif: the listener recognises it, but the change of pitch gives a sense of movement."],"use":"A rising sequence builds tension and excitement and a falling sequence relaxes it. Sequences are very common in Baroque music, pop choruses, film music and jazz solos. When you compose, take your motif and repeat it twice more, each time a step higher, then finish the phrase with something new.","listen":["Listen for the same shape repeated a little higher or lower.","Notice whether it is climbing (building) or falling (relaxing).","Count the repeats: usually two or three."],"example":"The motif is developed by **sequence**, repeated three times, each a step higher, so the melody climbs and the tension rises.","fig":[{"file":"s5_sequence.png","caption":"Sequence: the same four-note shape, each time one step higher"}]},"Developing musical material>Augmentation / diminution":{"what":["Augmentation is when an idea comes back with longer note values, usually doubled, so it sounds slower and broader. Diminution is when an idea comes back with shorter note values, usually halved, so it sounds faster.","In both, the pitches and shape stay the same and the beat does not change speed. Only the note lengths change."],"use":"Augmentation makes a theme sound grand or solemn and is often heard in low brass near the end of a piece. Diminution makes a theme sound urgent and excited and is often used to build to a climax. Both are common in fugues and film music. When you compose, double or halve every note of your motif and use it in a new section.","listen":["Listen for a familiar idea that sounds stretched out or squashed up.","Keep tapping the beat to check that the tempo hasn't changed, only the note lengths.","Augmented themes are often in the bass, diminished ones often in fast high parts."],"example":"At the climax the trombones play the theme in **augmentation** under the strings, who play it in **diminution**, so the same idea is heard slow and fast at once.","fig":[{"file":"s5_dim_aug.png","caption":"The same four-note idea in its original values, in diminution (halved) and in augmentation (doubled)"}]},"Developing musical material>Fragmentation":{"what":["Fragmentation is when a composer takes only part of an idea, often its first few notes or its most memorable bit, and repeats or develops that fragment on its own.","The fragment is short enough to pass quickly between instruments or be repeated over and over, but still recognisable as coming from the original motif."],"use":"Fragmentation builds tension and excitement, especially in the development section of sonata form and in film music before a big moment. Beethoven often breaks his themes into small fragments. When you compose, take the first two or three notes of your motif and repeat them, passing them between instruments, before bringing back the whole motif.","listen":["Listen for just the start (or end) of a familiar idea, repeated on its own.","Notice short pieces of the tune bouncing between instruments.","Fragmentation often comes just before a big return or climax."],"example":"In the development the motif is **fragmented**, with only its first four notes passed back and forth between the flute and the violins, which builds tension before the full theme returns.","fig":[{"file":"rm_s5_fragmentation.png","caption":"Fragmentation: the first four notes are repeated on their own, then the last two notes"}]},"Developing musical material>Inversion":{"what":["Inversion is when a melody is turned upside down. Every step or leap that went up now goes down by the same amount, and every one that went down now goes up.","The rhythm stays the same and the contour (shape) is mirrored, so a motif that climbs and then drops becomes one that falls and then jumps up."],"use":"Composers use inversion to make a new idea that is closely related to the original, so it sounds fresh but belongs. It is common in Baroque fugues, Classical development sections and 20th-century music. When you compose, draw the shape of your motif as a line, flip the line over and write the new notes to fit it.","listen":["Listen for a familiar rhythm whose melody moves the opposite way.","Follow the direction of the tune: where it used to rise, does it now fall?","Inversion is easiest to hear when the original and the inverted version are played one after the other."],"example":"In the second phrase the motif returns in **inversion**, falling where it first rose, so it sounds related to the opening but gives the melody a new direction.","fig":[{"file":"rm_s5_inversion.png","caption":"Inversion: the motif steps up then drops a 3rd; the inversion steps down then jumps up a 3rd"}]},"Developing musical material>Modulation":{"what":["Modulation is when the music moves from one key to another, so a familiar idea comes back with a new home note. You can often spot it in the score from new sharps, flats or naturals, or a new key signature.","It is different from sequence: in a sequence only a short pattern moves, while in a modulation the whole music settles in the new key."],"use":"Modulation gives a piece a sense of moving somewhere new. Pop songs often modulate up a semitone or tone for the last chorus, and in sonata form the second theme is in a new key. When you compose, try repeating your last chorus or theme one tone higher to make the ending more exciting.","listen":["Listen for the music suddenly sounding brighter, darker or 'lifted'.","Notice whether the home note seems to have changed.","In pop songs, listen for a key change at the last chorus."],"example":"For the final chorus the song **modulates** up a tone, so the familiar melody comes back higher and brighter, which lifts the energy for the ending.","fig":[{"file":"s5_modulation.png","caption":"Modulation: the music moves from C major to G major; the new key signature (F sharp) confirms it"}]},"Structure>What signals a new section":{"what":["These cards list the clues that tell your ear a new section has started. When one section ends and another begins, composers usually mark it with one or more changes: a cadence, a key change, a drum fill, a change of texture, instruments, dynamics or tempo, a pause or the return of a familiar theme.","Spotting these signals is how you work out the structure of a piece you have never heard before."],"use":"In a listening exam, write down the time or bar each time you hear one of these signals, then label the sections with letters. Composers often use several signals at once to make the change clear. When you compose, mark the start of each new section with at least two changes.","listen":["Listen for the music coming to a point of rest (a cadence).","Listen for drum fills, pauses and sudden changes in volume or instruments.","Listen for a familiar tune coming back."],"example":"The chorus is signalled by a **drum fill**, a sudden **change of dynamics** from mp to f and a **thicker texture** as the full band enters."},"What signals a new section>A cadence":{"what":["A cadence is the end of a phrase, where the music comes to a point of rest, like a full stop or comma in a sentence. It is made by two chords. A perfect cadence (V-I) sounds finished and an imperfect cadence (ending on V) sounds unfinished, like a comma.","A strong perfect cadence, often followed by a short silence or a held note, is one of the clearest signs that a section has ended."],"use":"Composers end sections with a perfect cadence and use imperfect or interrupted cadences inside sections to keep the music moving. When you are working out a structure, listen for the strongest cadences: they usually mark the edges of sections. When you compose, end each section with a perfect cadence in the key you are in.","listen":["Listen for the music settling on the home chord with a feeling of 'finished'.","Listen for a held note or slowing down at the end of the phrase.","Notice whether the next phrase starts with new material."],"example":"The A section ends with a **perfect cadence** in the home key, held for a full bar, before the contrasting B section begins.","fig":[{"file":"s5_cadences.png","caption":"The four cadences in C major"}]},"What signals a new section>A modulation":{"what":["A modulation is a change of key. When the music moves into a new key, the home note changes and the music sounds brighter, darker or lifted.","Because a new key feels like a new place, composers often change key at the start of a new section. A contrasting middle section in the relative minor or the dominant key is very common."],"use":"In Classical forms the second theme or B section is often in a new key, and in pop songs the last chorus may jump up a tone. When you compose, try putting your B section in a related key (such as G major after C major, or A minor) and coming back to the home key for the final A section.","listen":["Listen for a change in the feel of the music, such as major to minor or a sudden lift higher.","Try humming the home note: if it no longer fits, the key has changed.","Notice whether the key change lines up with new melodic material."],"example":"The B section begins with a **modulation** to the relative minor, so the music turns darker and the new section is clearly marked.","fig":[{"file":"s5_modulation.png","caption":"Modulation: the music moves from C major to G major; the new key signature (F sharp) confirms it"}]},"What signals a new section>A drum fill":{"what":["A drum fill is a short burst of drumming, usually one bar or less, that breaks away from the regular groove. The drummer often moves around the snare and toms, and the fill usually ends with a crash cymbal on beat 1 of the next section.","Fills come at the end of a phrase or section, so they act as a signpost that something new is about to start."],"use":"Fills are used in rock, pop, funk, jazz and marching bands to link sections and build energy into a chorus or solo. A crash cymbal right after the fill confirms the new section. When you write or play a drum part, put a fill in the last bar of a section and a crash on the first beat of the next one.","listen":["Listen for the drums breaking out of the steady beat, often with fast notes on the toms.","Listen for a crash cymbal straight after the fill.","Notice what changes when the new section starts."],"example":"A **drum fill** around the toms at the end of the verse, finished with a crash cymbal, signals the start of the chorus.","fig":[{"file":"rm_s5_drum_fill.png","caption":"A one-bar groove, then a fill on snare and toms, then a crash cymbal on beat 1 of the new section"}]},"What signals a new section>A change of texture or instrumentation":{"what":["Texture is how many layers of sound there are and how they fit together. Instrumentation is which instruments are playing. A new section often starts with a clear change in one or both, such as a thin texture with one instrument becoming a full band.","Even when the melody stays the same, a change of instruments or layers tells the listener the music has moved on."],"use":"Pop songs usually thicken the texture for the chorus and thin it out for a breakdown or bridge. Orchestral music hands the theme to a new instrument family in a new section. When you compose or arrange, add or remove instruments at section boundaries rather than in the middle of a phrase.","listen":["Count the layers: does the music suddenly get fuller or emptier?","Listen for new instruments coming in or others dropping out.","Notice whether the melody passes to a different instrument."],"example":"The chorus is marked by a **thicker texture** as the drums, bass and backing vocals all enter at once after the thin, guitar-and-voice verse.","fig":[{"file":"ex_texture_graph.png","caption":"A texture graph of a pop song: count the layers in each section to see the texture get thicker and thinner"}]},"What signals a new section>A change of dynamics or tempo":{"what":["A sudden change in volume (dynamics) or speed (tempo) is one of the easiest signals to hear. A section might end with a ritardando (slowing down) and the next start at a new tempo, or the music might jump from soft to loud.","These changes are written in the score with new tempo words (such as Allegro) and dynamic markings (such as p or f) at the start of the section."],"use":"Composers use these changes to give each section its own mood: a fast loud chorus after a soft verse, or a slow middle section in a fast piece. When you compose, give your B section a different tempo or dynamic level, and mark it clearly in the score.","listen":["Listen for the music slowing down at the end of a phrase.","Listen for a sudden jump in loudness or speed.","Notice whether the new tempo or dynamic stays for the whole new section."],"example":"Section A slows with a **ritardando** and pauses, then Section B bursts in at a faster tempo and a louder **dynamic** (f), so the start of the new section is unmistakable.","fig":[{"file":"rm_s5_section_change.png","caption":"Section A ends softly with a rit. and a pause; Section B starts fast (Allegro) and loud (f)"}]},"What signals a new section>A pause or silence":{"what":["A pause or silence between phrases tells the listener that one part of the music has finished. It might be a rest, a held note marked with a fermata (pause sign) or a full silence for the whole ensemble, called a general pause (G.P.).","The break gives the ear a moment to reset, so whatever comes next sounds like a new start."],"use":"Composers use silence for drama: a sudden stop before the final chorus, or a held chord before a new section. Silence between movements also separates the parts of a multi-movement work. When you compose, try stopping everyone for a beat or a bar before the new section starts.","listen":["Listen for a moment where all the instruments stop.","Listen for a held note or chord that seems to freeze the music.","Notice what is different when the music starts again."],"example":"A held chord with a **pause** (fermata) and a moment of silence separates the slow introduction from the fast main section.","fig":[{"file":"art_fermata.png","caption":"Fermata (pause): hold the note longer"}]},"What signals a new section>The return of a familiar theme or riff":{"what":["When a theme or riff you heard earlier comes back, it tells you a section has returned. This is how you spot the second A in ternary form (A B A), the refrain in rondo (A B A C A) or the chorus in a pop song.","The return can be exact, or it may be changed slightly but still recognisable."],"use":"Bringing back a familiar idea gives music a feeling of unity and homecoming. Composers often build up to a return with a drum fill, a rise in pitch or a pause so it has more impact. When you compose, bring back your opening idea near the end so the piece feels complete.","listen":["Remember the opening theme or riff so you can recognise it later.","When it comes back, note the time and give it the same letter as before.","Check whether it has come back exactly or changed."],"example":"The **return** of the opening guitar **riff** marks the start of the final A section, so the piece has a ternary (A B A) shape."},"Elements of Music>Performing media and timbre":{"what":["Performing media are the sound sources in a piece: voices, acoustic instruments, electronic instruments and technology such as samplers and computers. Timbre (say 'tam-ber') is the colour or quality of a sound. It is why a flute and a violin playing the same note at the same volume still sound different.","In Stage 5 you go further than naming instruments. You describe how they are combined, which part of their range they use and what special techniques the players are asked for."],"use":"Composers choose performing media to suit the mood and the job of each part. A dark, low cello might carry a sad melody while a bright trumpet announces a theme. When you arrange or compose, decide who plays the melody, who accompanies and whether anything changes timbre during the piece, then write those choices into the score.","listen":["Name every instrument or voice you can hear and group them into families.","Notice whether the instruments are playing low, middle or high in their range.","Listen for special sounds such as plucking, muting, bending or electronic effects."],"example":"In the opening the melody is given to a solo **cello** in its warm low **register**, then it moves to the violins playing **pizzicato**, so the **timbre** becomes lighter and brighter."},"Performing media and timbre>Combinations":{"what":["Combinations means the way voices and instruments are grouped to make an ensemble. Ensembles come in two broad sizes. In a small ensemble each part has one player. In a large ensemble several players share each part.","The combination you choose changes the overall timbre, the volume, the texture and even the need for a conductor."],"use":"Composers pick a combination to fit the setting: a jazz trio for a small club, a symphony orchestra for a concert hall, a rock band for a stadium. Inside an ensemble they also mix instruments to make new colours, such as flute and clarinet together on a melody. When you compose, start by listing exactly which instruments you have, then write for their strengths.","listen":["Count roughly how many performers you can hear.","Listen for whether each line sounds like one player (clear and exposed) or many (fuller and blended).","Notice which families are present and which are missing."],"example":"This excerpt is played by a **small ensemble** of piano, double bass and drums, so each line is exposed and clear, unlike the full blended sound of a **large ensemble** such as an orchestra."},"Combinations>Small ensembles":{"what":["A small ensemble is a group where each part is played by one performer. Common examples are a duo (two players), a trio (three), a quartet (four) and a quintet (five). A piano trio is piano, violin and cello. A jazz combo is usually a few soloists with a rhythm section of piano, bass and drums.","Because nobody else is doubling your line, every note can be heard. Small ensembles usually play without a conductor and follow each other by eye contact and breathing."],"use":"Small ensembles suit intimate music where detail matters: chamber music, jazz clubs, folk groups, rock bands and a cappella vocal groups. Players must listen closely to balance and stay together. When you compose for one, give each player a clear role (melody, harmony, bass or rhythm) and let the melody pass between them so everyone is interesting.","listen":["Try to follow each separate line. In a small ensemble you usually can.","Listen for small differences in timing or tuning, which show there is only one player per part.","Notice the players taking turns on the melody or soloing."],"example":"The piece is performed by a **small ensemble** (a **string quartet**), so the thin texture lets you hear the cello's bass line clearly under the first violin's melody."},"Small ensembles>String quartet":{"what":["A string quartet is two violins, a viola and a cello, with one player on each part. The score has four staves. First violin usually plays the highest line and often the melody, second violin and viola fill in the harmony and the cello plays the bass.","The viola reads the alto clef, where the middle line of the stave is middle C. The cello mostly reads bass clef."],"use":"The string quartet became a favourite form for classical composers such as Haydn, Mozart and Beethoven, and it is still used today in film, pop covers and contemporary music. All four instruments are the same family, so the sound blends well. If you write for a quartet, keep the melody in the first violin at first, then try handing it to the cello or viola for contrast.","listen":["Listen for four separate lines, all with a bowed string sound.","Pick out the cello as the low line and the first violin as the highest.","Notice when the melody moves to a lower instrument such as the viola or cello."],"example":"In the second section the melody passes from the first violin to the cello, so the **string quartet** texture becomes darker and warmer while the upper strings accompany.","fig":[{"file":"viola.jpg"},{"file":"cello.png"}]},"Combinations>Large ensembles":{"what":["A large ensemble has several players on each part, so a line is played by a whole section rather than one person. Examples are the symphony orchestra, chamber orchestra (a smaller orchestra), concert band (woodwind, brass and percussion), big band (saxophones, trumpets, trombones and a rhythm section), choir and musical theatre pit band.","Because many players blend on each line, the sound is fuller and louder, and a conductor usually keeps everyone together."],"use":"Large ensembles are used for big, powerful music such as symphonies, film scores, marching music and musicals. Composers can create huge contrasts by moving from one section playing alone to the whole ensemble playing together (called a tutti). When you arrange for a large group, think in sections: give the melody to one section and the accompaniment to another.","listen":["Listen for a full, blended sound where you cannot pick out single players.","Notice whole sections taking over the melody, such as all the violins or all the trumpets.","Listen for big changes when the whole ensemble joins in (tutti)."],"example":"In the climax the full **large ensemble** plays **tutti**, with brass and timpani added to the strings, so the sound becomes much louder and thicker than the opening."},"Performing media and timbre>Range and register":{"what":["Range and register describe pitch for a particular voice or instrument. Range is the full span of notes it can play, from lowest to highest. Register is the part of that range being used at a given moment: low, middle or high.","The same instrument can sound very different in different registers, so register affects timbre as well as pitch."],"use":"Composers choose registers carefully. A low flute is soft and breathy, while a high trumpet is bright and can cut through a whole orchestra. When you compose, check each note is inside the instrument's range and pick the register that gives the mood you want.","listen":["Ask whether the instrument sounds low, middle or high for that instrument.","Listen for the timbre changing as a melody climbs or falls."],"example":"The clarinet begins in its low **register**, which sounds dark and hollow, then climbs to the top of its **range** for a bright, piercing climax."},"Range and register>Range":{"what":["Range is the distance from the lowest note to the highest note an instrument or voice can produce. Larger instruments usually have lower ranges. A piccolo plays very high, and a double bass or tuba plays very low. The piano has one of the widest ranges, with 88 keys.","Voices have ranges too: soprano and alto (higher), tenor and bass (lower)."],"use":"Composers must keep each part inside its range or the player simply cannot play it. Notes near the top or bottom of a range are often harder, so they are saved for special moments. When you write a part, check the range for that instrument first and stay mostly in the comfortable middle.","listen":["Notice the lowest and highest notes a part reaches.","Listen for strain or extra brightness when a singer or player reaches the top of their range."],"example":"The melody covers a wide **range**, from the bottom of the alto voice to its top notes, which builds tension as it climbs.","fig":[{"file":"ex_voice_ranges.png"}]},"Range and register>Register":{"what":["Register is which part of an instrument's range is being used: low, middle or high. The same instrument has a different colour in each register. A clarinet is dark and woody down low (its low register is called the chalumeau) and bright and piercing up high.","Register is about the instrument itself. A high note for a cello may still be lower than a low note for a flute."],"use":"Composers use register to change the mood without changing instruments. A melody repeated an octave higher sounds brighter and more intense. Guitarists move up the neck for a sweeter, higher sound. When you perform or compose, try playing the same idea in a different register and listen to how the feeling changes.","listen":["Listen for a familiar melody coming back higher or lower.","Notice changes in brightness or darkness on the same instrument.","Ask whether the part sounds relaxed (middle) or strained and intense (very high)."],"example":"When the theme returns it is played in the flute's high **register**, so it sounds brighter and more urgent than the soft, breathy low register used at the start."},"Performing media and timbre>Directions for techniques":{"what":["Directions for techniques are words, abbreviations and symbols in a score that tell a player how to make the sound. Many are Italian. Examples include pizz., con sord., flz., 8va, harmonics and P.M.","A direction stays in force until another one cancels it. For example, pizz. continues until the music says arco."],"use":"Composers write technique directions to get special timbres from ordinary instruments, so one violin can sound plucked, muted or glassy. Performers need to spot these quickly when sight-reading. When you compose, add one or two directions to change the colour of a repeated section.","listen":["Listen for a sudden change of timbre on the same instrument.","Notice plucked, muted, buzzing or glassy sounds that are not the instrument's normal tone."],"example":"In the middle section the violins play **pizzicato** and the trumpet uses a mute (**con sord.**), so the timbre becomes lighter and more distant than the full sound of the opening."},"Directions for techniques>pizz. / arco":{"what":["pizz. is short for pizzicato, Italian for 'plucked'. The string player plucks the string with a finger instead of using the bow. arco means 'bow'. It tells the player to go back to bowing.","A pizzicato note dies away quickly, so it sounds short and dry. Bowed notes can be held as long as the bow lasts."],"use":"Pizzicato is used for light, playful or tiptoeing music, and double bass players use it all the time in jazz to play walking bass lines. Arco gives a smooth, sustained sound for melodies. If you write for strings, try a pizzicato accompaniment under a bowed melody.","listen":["Listen for short, plucked notes from a string instrument that would normally be smooth.","Notice the moment the sound becomes long and connected again (arco).","In jazz, listen for the double bass plucking a walking bass line."],"example":"In the B section the cellos play **pizzicato**, so the accompaniment is short, light and plucked, before returning to **arco** for a smooth, sustained ending."},"Directions for techniques>con sord. / senza sord.":{"what":["con sord. (con sordino) means 'with mute'. senza sord. (senza sordino) means 'without mute'. A mute is a small device that changes the sound.","String players clip a mute onto the bridge, which makes the tone soft and veiled. Brass players push a mute into the bell. Brass mutes come in types: a straight mute sounds thin and buzzy, a cup mute softer and a harmon mute has the nasal 'wah' sound used in jazz."],"use":"Muted strings are used for gentle, dreamy or sad passages in film and orchestral music. Muted trumpets are common in jazz and cartoon music. Players need a few seconds to fit or remove a mute, so composers leave rests before each change. Remember to do the same when you compose.","listen":["Listen for a string sound that is softer, hazier and further away.","Listen for a brass sound that is thinner, buzzier or nasal.","Notice the normal, open sound returning after senza sord."],"example":"The trumpet plays the melody **con sordino**, which gives a thin, nasal timbre that sounds distant, then removes the mute (**senza sord.**) for a bright, full climax."},"Directions for techniques>8va":{"what":["8va (from the Italian ottava) tells you to play the notes an octave higher than written. It is shown by '8va' with a dashed line over the notes. When the line ends, you go back to normal.","Composers use it to avoid lots of ledger lines. 8vb (or 8va written below the notes) means an octave lower, and 15ma means two octaves higher."],"use":"You see 8va in piano music, flute and violin parts and any part that goes very high. It makes reading easier. When you compose with notation software, use 8va for very high passages so the performer can read them quickly.","listen":["Listen for a passage jumping up an octave while keeping the same shape.","Notice the melody returning to its normal register when the 8va ends."],"example":"The final statement of the melody is marked **8va**, so it is played an octave higher, which makes it brighter and more exciting than the first time."},"Directions for techniques>flz. (flutter-tongue)":{"what":["flz. is short for the German word Flatterzunge, which means flutter-tongue. While blowing, a wind or brass player rolls an 'rrr' with the tongue (like a rolled R) or gargles in the throat. The note is written with tremolo slashes through the stem and the word flz.","It makes a buzzing, growling, fluttering sound."],"use":"Flutter-tonguing is used for special effects: insects, birds, scary or comic moments in film music and wild sounds in jazz and contemporary music. Flute is the most common, but trumpet, trombone and saxophone also use it. If you play a wind instrument, try a rolled R on a long note and listen to the timbre change.","listen":["Listen for a buzzing or rattling texture inside a wind or brass note.","Notice that the pitch stays the same while the sound flutters."],"example":"In the scary section the flutes play **flutter-tongued** notes, which give a buzzing, unsettled timbre that sounds like insects swarming."},"Directions for techniques>Harmonic (small circle)":{"what":["A harmonic is a note made by lightly touching a string at a special point (such as halfway along) instead of pressing it down to the fingerboard. This makes the string vibrate in sections and gives a high, pure, glassy note.","Harmonics are shown by a small circle (o) above the note. Guitar and string players both use them."],"use":"String players use harmonics for shimmering, eerie or magical sounds, and guitarists use them for bell-like notes in intros and ballads. Bass players use harmonics in solos too. If you play guitar, try lightly touching the 12th fret on any string and plucking it.","listen":["Listen for very high, pure notes with almost no buzz or roughness.","Notice a bell-like or flute-like quality from a string instrument."],"example":"The violins play **harmonics** high above the melody, and their glassy, shimmering timbre makes the music sound mysterious."},"Directions for techniques>P.M. (palm mute)":{"what":["P.M. stands for palm mute. A guitarist rests the side of the picking hand (the palm) lightly on the strings just near the bridge, then picks. This stops the strings ringing freely.","The result is a short, tight, chunky sound. It is written as 'P.M.' with a dashed line over the notes, in both staff notation and TAB."],"use":"Palm muting is heard everywhere in rock, punk and metal, especially on low power chords that chug along in quavers or semiquavers. Players often switch between muted and open chords to make the chorus sound bigger. Try palm muting the verse of a song and playing open chords in the chorus.","listen":["Listen for short, chugging guitar notes that do not ring on.","Notice the guitar opening up to full ringing chords for contrast."],"example":"In the verse the electric guitar plays **palm muted** power chords in steady quavers for a tight, chugging sound, then opens up to ringing chords in the chorus."},"Directions for techniques>sul pont. / sul tasto":{"what":["These tell string players where to put the bow. sul ponticello (sul pont.) means 'on the bridge': bowing very close to the bridge gives a thin, glassy, scratchy sound. sul tasto means 'on the fingerboard': bowing over the end of the fingerboard gives a soft, airy, flute-like sound.","ord. (ordinario) tells the player to go back to the normal bowing position."],"use":"Composers use sul pont. for tense, eerie or creepy moments, especially in horror and thriller film scores, often combined with tremolo. Sul tasto is used for gentle, distant or dreamy passages. If you write for strings, try a tremolo sul pont. under a scary scene.","listen":["Listen for a string sound that is thin, metallic or whistly (sul pont.).","Listen for a string sound that is very soft and breathy (sul tasto).","Notice the normal, fuller tone returning (ord.)."],"example":"Under the tense build-up the violins play tremolo **sul ponticello**, which gives a thin, glassy, scratchy timbre that makes the scene feel uneasy."},"Directions for techniques>Vocal techniques":{"what":["Singers change their timbre with different techniques. Falsetto is a light, airy voice above the normal range, used a lot by male singers. Belt is a powerful, loud sound carried up from the chest voice, common in musicals and pop. Scat is improvised singing on nonsense syllables such as 'doo-bah-dee', from jazz. Vibrato is a regular wobble in pitch on held notes.","These are choices about how to sing, not what notes to sing."],"use":"Singers pick techniques to suit the style and the emotion. Falsetto can sound gentle and fragile, belting sounds strong and confident, scat lets a jazz singer improvise like an instrument and vibrato adds warmth to long notes. When you sing, try a phrase straight and then with vibrato, or in chest voice and then falsetto.","listen":["Listen for a sudden switch to a lighter, breathier high voice (falsetto).","Listen for loud, strong high notes that sound pushed from the chest (belt).","Notice nonsense syllables improvised over a jazz band (scat).","Listen for a wavering pitch on long notes (vibrato)."],"example":"In the chorus the singer **belts** the high notes with a strong chest voice, then switches to **falsetto** in the bridge, which makes that section sound softer and more fragile."},"Elements of Music>Dynamics and expression":{"what":["Dynamics is how loud or soft the music is. Expression is how each note is shaped and performed: short or long, accented or smooth, sweet or fiery.","In Stage 5 you add more extreme levels (ppp, fff), sudden changes (sfz, fp, subito), finer articulation marks (tenuto, marcato, portato), techniques for particular instruments and electronic ways of changing sound such as compression and looping."],"use":"Composers use dynamics and expression to shape the mood and build towards climaxes. Performers bring the music to life by following these markings carefully, and often add small changes of their own. When you compose, write dynamics and articulation into every part, including the accompaniment.","listen":["Listen for how loud the music is and whether it changes suddenly or gradually.","Notice whether notes are short, smooth or accented.","Listen for special techniques and electronic effects that change the sound."],"example":"The section begins **pianissimo** with smooth **legato** strings, then a sudden **sforzando** chord in the brass shocks the listener before a long crescendo to **fff**."},"Dynamics and expression>Gradations of dynamics":{"what":["Gradations of dynamics are the different levels and changes of volume. Stage 5 adds the extremes (ppp and fff, even niente for silence), sudden changes (sfz, fp, subito) and words that tell you how much or how fast to change (molto, poco a poco).","Dynamics are relative. A forte for a solo flute is much quieter than a forte for a full brass band."],"use":"Composers combine these markings to build tension and surprise. A long crescendo from ppp to fff over many bars creates a huge build-up, while a subito piano after a loud passage catches the listener off guard. When you compose, mix gradual and sudden changes.","listen":["Listen for whether volume changes slowly over many bars or all at once.","Notice the very softest and loudest moments.","Listen for single notes that jump out (sfz) or loud attacks that drop away (fp)."],"example":"The music grows **poco a poco** from **ppp** to **fff** over the whole section, which builds a long, steady tension."},"Gradations of dynamics>niente (n)":{"what":["niente is Italian for 'nothing'. It means silence. 'dim. al niente' tells the player to fade away gradually until the sound disappears completely. It is shown by a diminuendo hairpin that ends in a small circle, or by the letter 'n'.","A hairpin can also start from niente, so the sound appears out of silence."],"use":"Niente is used for endings that vanish into silence and for sounds that grow out of nothing, which is common in film music and contemporary concert music. It needs great breath or bow control. In your own compositions, try ending a quiet piece with a long note marked dim. al niente.","listen":["Listen for a note that fades so gradually you cannot tell when it stops.","Notice sounds that seem to appear out of silence."],"example":"The piece ends with a long violin note marked **dim. al niente**, which fades so gradually into silence that the listener is left hanging."},"Gradations of dynamics>sforzando (sfz)":{"what":["sforzando (written sfz or sf) means 'forced'. It is a sudden, strong accent on one note or chord. After the accent, the music goes straight back to the dynamic it was at before.","An sfz is stronger than a normal accent and is relative to the surrounding volume. An sfz in a piano passage is a sharp jolt, not necessarily fortissimo."],"use":"Composers use sforzandos to surprise the listener, to stress an important chord or to make rhythms sound jagged and aggressive. They are common in Classical and Romantic music, especially Beethoven, and in film music for shocks. When you compose, place one sfz on an off-beat in a quiet passage to make it jump out.","listen":["Listen for a single loud, forced note in an otherwise softer passage.","Notice that the music returns to its previous volume immediately afterwards."],"example":"In the quiet middle section a **sforzando** chord on the off-beat suddenly jolts the listener before the music settles back to piano."},"Gradations of dynamics>fortepiano (fp)":{"what":["fortepiano (fp) means loud then immediately soft. The note starts with a strong attack (forte), then the volume drops straight to piano while the note is still sounding.","Do not confuse it with the instrument called the fortepiano (an early piano). In a score, fp under a note is a dynamic."],"use":"Fortepiano is often used on a long held note or chord, followed by a crescendo, so the note punches in, drops away and then swells again. You hear it a lot in brass and string parts, marches and film music. Wind players can do it by starting with a strong breath and relaxing at once.","listen":["Listen for a loud attack that drops away straight after the start.","Notice whether the held note then grows louder again (fp with a crescendo)."],"example":"The brass hold a long chord marked **fortepiano** with a crescendo, so it punches in, drops away and then swells to a loud climax.","fig":[{"file":"rm_s5_fp_context.png","caption":"fp then a crescendo: a loud attack that drops straight to soft, then swells back up to f"}]},"Gradations of dynamics>ppp and fff":{"what":["ppp (pianississimo) means extremely soft, softer than pp. fff (fortississimo) means extremely loud, louder than ff. Each extra letter takes the dynamic one step further.","Full order from softest to loudest: ppp, pp, p, mp, mf, f, ff, fff."],"use":"These extreme dynamics are saved for special moments: the softest, most hushed opening or ending, and the biggest climax of a piece. You often see them in Romantic orchestral music and film scores. When you compose, keep ppp and fff rare so they have real impact.","listen":["Listen for music so soft you need to lean in to hear it.","Listen for the loudest point of the whole piece, often with the full ensemble and percussion."],"example":"The opening is marked **ppp**, with barely audible strings, but the climax reaches **fff** with the whole orchestra, which makes the contrast enormous."},"Gradations of dynamics>subito":{"what":["subito is Italian for 'suddenly'. It is placed in front of a dynamic to show an instant change with no gradual build or fade. 'subito p' (or 'sub. p') means drop to soft at once. 'subito f' means become loud at once.","It is often used straight after a crescendo, where the listener expects the music to get even louder."],"use":"Composers use subito to surprise listeners. A subito piano at the top of a crescendo creates a sudden hush that grabs attention. It is common in Classical music, film scores and choir music. When performing, make the change exactly on the marked note, not before.","listen":["Listen for a sudden drop in volume right after the music has been building.","Notice there is no gradual change: the new dynamic arrives straight away."],"example":"After a long crescendo the strings drop **subito piano**, which surprises the listener and makes the next phrase sound intimate."},"Gradations of dynamics>poco a poco":{"what":["poco a poco means 'little by little'. It is added to a gradual change (cresc., dim., accel., rit.) to show it happens slowly over a long passage.","You often see 'poco a poco cresc.' with a dashed line over several bars. The change is spread across the whole dashed line, not done all at once."],"use":"Composers use poco a poco to build long, steady tension, such as a crescendo across a whole section. Ravel's Bolero is a famous example: one long crescendo that keeps growing for the whole piece. When you perform it, start the change very gently so there is room to keep growing.","listen":["Listen for a change that is so gradual you only notice it after several bars.","Compare the start and end of a section to check whether the volume or speed has slowly shifted."],"example":"The section is marked **poco a poco crescendo**, so the music grows gradually across eight bars, which builds tension towards the chorus."},"Gradations of dynamics>molto":{"what":["molto means 'very' or 'much'. It makes another direction stronger. molto cresc. means a big crescendo, molto rit. means slow down a lot and Allegro molto means very fast.","Its opposite is poco, meaning 'a little', so poco rit. is just a slight slowing."],"use":"molto appears with tempo words, dynamics and expressive words. Composers use it when they want a change to be really obvious, such as a dramatic slowing at the end of a piece. When you perform a molto marking, exaggerate the change more
