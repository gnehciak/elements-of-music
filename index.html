ar 14, with the bow bouncing through four quick notes at a time, which gives the passage a light, sparkling tone colour.","quote":[{"text":"Jeté bowing, bouncing the bow on the strings to create a light tone colour","source":"HSC 2024"}]},"Special playing techniques>tremolo":{"what":["A tremolo is a rapid repetition of one note, or a rapid alternation between two notes. On strings, bowed tremolo is played with very fast, short bow strokes and written with slashes through the note stem. On mallet instruments and timpani it is a roll.","Fingered tremolo alternates quickly between two notes without changing bow."],"use":"Use tremolo for a shimmering or trembling sound, and say which instrument and at what dynamic. Soft tremolo strings sound mysterious or suspenseful; loud tremolo sounds excited or stormy. Mention its effect on texture, such as filling out a background.","listen":["Listen for a shimmering, trembling sound instead of separate notes.","Notice whether it is soft and eerie or loud and agitated."],"example":"The upper strings hold a pp **tremolo** chord under the solo horn, which adds a shimmering, suspenseful background and fills out the texture.","quote":[{"text":"The tremolo of the strings... enhances the full textures","source":"HSC 2021"},{"text":"Gentle tremolo vibraphone","source":"Trial 2023"}],"fig":[{"file":"rm_s5_string_techniques.png","caption":"Tremolo is written with slashes through the stem"}]},"Special playing techniques>snap pizzicato / Bartók pizz.":{"what":["Snap pizzicato (also called Bartók pizzicato, after the composer Béla Bartók, who used it a lot) is a very strong pluck. The player pulls the string up away from the fingerboard and lets go, so it snaps back and hits the wood with a loud crack.","It is written with a small circle with a vertical line through the top."],"use":"Name the instrument and the bar, then link the sound to effect: a percussive, violent or surprising accent. It is common in 20th century and contemporary art music. Contrast it with ordinary pizzicato, which is a gentle pluck.","listen":["Listen for a plucked note with a sharp, cracking slap.","Notice whether it falls on accents or in a percussive rhythm."],"example":"The cellos play **snap pizzicato** on the downbeat of bar 24, and the loud crack of the string against the fingerboard adds a sudden, percussive accent.","quote":[{"text":"snap pizzicato (bar 24)","source":"HSC 2024"},{"text":"Bartok pizz.","source":"HSC 2020"}]},"Special playing techniques>glissando / glissandi":{"what":["A glissando (gliss.) is a slide between two notes. On instruments like the trombone, strings or voice the slide passes smoothly through every pitch between. On harp and piano it is a rapid sweep through the notes of a scale.","It is written with a straight or wavy line between the two notes, often with 'gliss.'"],"use":"Name the instrument and the direction (upward or downward), and link the glissando to effect: a dramatic sweep, a comic slide, a smear in jazz, or a magical, shimmering harp effect. Glissandi often lead into a new section or a climax.","listen":["Listen for a smooth slide or a fast sweep between two pitches.","Notice whether it goes up or down and where it lands."],"example":"The harp plays an upward **glissando** into the climax, sweeping across the strings in a rapid rush of notes, which adds a shimmering lift to the entry of the full orchestra.","quote":[{"text":"The Harp plays a glissando","source":"HSC 2025"}],"fig":[{"file":"ex_gliss.png","caption":"Glissando: slide from one note to the other"},{"file":"harp.jpg","caption":"Harp: the glissando sweeps a finger across the strings"}]},"Special playing techniques>slap tonguing":{"what":["Slap tonguing is a technique for single-reed instruments, mainly saxophone and clarinet. The player creates suction between the tongue and the reed and then pulls the tongue away sharply, so the reed slaps against the mouthpiece with a popping sound.","It is common in jazz, funk and contemporary music. The notation varies between composers, so it is usually labelled 'slap' in the part."],"use":"Name the instrument and the place, and describe the sound (a percussive pop or click). Link it to rhythm and to a funky, playful or aggressive character, or to the use of extended techniques in contemporary music.","listen":["Listen for a short, percussive 'pop' or 'thwack' from a saxophone or clarinet.","Notice whether the sound is almost unpitched, like a drum hit."],"example":"The tenor saxophone uses **slap tonguing** in bar 12, and the dry, popping attacks act almost like percussion, which adds rhythmic punch to the groove.","quote":[{"text":"slap tonguing (bar 12)","source":"HSC 2019"}],"fig":[{"file":"saxophone.jpg","caption":"Saxophone: slap tonguing is a single-reed technique"}]},"Special playing techniques>vibrato":{"what":["Vibrato is a small, regular wavering of pitch around a note. String players make it by rocking the finger on the string; singers and wind players use the breath and throat.","Its speed and width can vary: slow and wide sounds rich and emotional, fast and narrow sounds intense. Senza vibrato means without it."],"use":"Use vibrato to describe the warmth and emotion of a tone, and say whether it is wide or narrow, fast or slow, or changing. A shift between vibrato and senza vibrato is a strong detail. Link it to expressive, romantic or intense character.","listen":["Listen for a gentle wobble on long notes.","Notice whether it gets faster or wider at emotional high points."],"example":"The solo violin uses a wide **vibrato** on the long notes at the climax, which makes the tone warm and intensely expressive.","quote":[{"text":"expressive vibrato and legato bowing","source":"Trial 2021"},{"text":"Use of vibrato with varying speeds","source":"Trial 2007"}],"fig":[{"file":"rm_s4_vibrato.png","caption":"Senza vib. means without vibrato. Vib. means add vibrato"}]},"Special playing techniques>trill":{"what":["A trill is an ornament where the written note and the note a step above alternate very quickly. It is written as 'tr' above the note, often followed by a wavy line showing how long it lasts.","Trills are common in Baroque and Classical music, often near a cadence, and are used for shimmering effects in later music."],"use":"Name the instrument and bar, and link the trill to effect: decoration, expressive tension before a cadence, or a bird-like or sparkling colour. A trill on a long note at the end of a phrase often signals the cadence.","listen":["Listen for a fast, shimmering alternation between two neighbouring notes.","Notice whether it decorates a cadence or a long held note."],"example":"The flute decorates the held note before the cadence with a **trill**, which adds tension and brightness just before the phrase resolves.","quote":[{"text":"a trill notated in bar 2... adding expressive interest","source":"HSC 2021"}],"fig":[{"file":"rm_s5_trill.png","caption":"Trill: the written note and the note above alternate quickly"}]},"Special playing techniques>sul ponticello / sul tasto / col legno":{"what":["Sul ponticello (sul pont.) means bow very close to the bridge, which brings out high overtones and gives a glassy, metallic, eerie sound. Sul tasto means bow over the fingerboard, which gives a soft, flute-like, airy sound. Col legno means play with the wood of the bow instead of the hair, either tapping the string (battuto) or drawing it across, for a dry, percussive sound.","'Ord.' (ordinario) tells the player to return to normal."],"use":"Name the technique, the instrument and the effect on tone colour: sul ponticello for harsh, eerie colour; sul tasto for soft, ethereal colour; col legno for dry, clicking percussion. These are signs of 20th century and film music, so link them to style and mood.","listen":["Sul ponticello: a glassy, whistling, metallic edge.","Sul tasto: a soft, breathy, almost flute-like sound.","Col legno: dry tapping or clicking with very little pitch."],"example":"The violas play **sul ponticello** tremolo while the cellos tap **col legno** quavers, which creates an eerie, brittle tone colour in the opening.","quote":[{"text":"sul ponticello gives the string tone a harsh, almost metallic edge","source":"Trial 2009"},{"text":"sul tasto for a very ethereal sound","source":"Trial 2023"},{"text":"Col legno, percussive wooden sound","source":"Trial 2009"}],"fig":[{"file":"rm_s5_sul_pont_tasto.png","caption":"sul pont. (near the bridge), ord. (normal), then sul tasto (over the fingerboard)"}]},"Special playing techniques>spiccato":{"what":["Spiccato is a string bowing technique where the bow bounces off the string for each note, so the notes are short, light and crisp. Each note has its own bow stroke, usually near the middle of the bow.","It is written with staccato dots, sometimes with 'spicc.', and used in fast passages. Jeté is similar but bounces several notes in one stroke."],"use":"Use spiccato for light, bouncing string passages, and say which instrument and where. Link it to a light, crisp, energetic or playful character. Contrast it with legato bowing in another section.","listen":["Listen for quick, light string notes that sound bounced rather than pressed.","Notice a crisp, dry texture in fast string passages."],"example":"The second violins play light **spiccato** semiquavers under the melody, and the bouncing bow keeps the accompaniment crisp and energetic.","quote":[{"text":"light spiccato bowing","source":"Trial 2025"}],"fig":[{"file":"rm_s6_dynamics_spicc_jete.png","caption":"spicc.: one bounce per bow stroke. Jeté: several bounces in one stroke"}]},"Special playing techniques>laissez vibrer":{"what":["Laissez vibrer (French for 'let vibrate', written l.v.) tells the player not to damp the note but let it ring until it fades. It is written with short ties that lead to nothing.","It is used for instruments whose sound decays naturally: harp, piano, guitar, vibraphone, cymbals and gongs."],"use":"Name the instrument and describe the ringing, overlapping sound. Link it to a resonant, hazy or atmospheric effect, and to texture, because the ringing notes overlap and blend into a wash of sound.","listen":["Listen for notes that keep ringing and overlap after they are played.","Notice a slow, natural fade at the end of a phrase or piece."],"example":"The vibraphone's final chord is marked **laissez vibrer**, so it rings on and fades naturally into silence, which leaves the excerpt with a hazy, open ending.","quote":[{"text":"Let the sound ring and decay without stopping","source":"HSC 2024"}]},"Elements of Music>Structure":{"what":["Structure is the organisation of music over time: phrases, sections and the whole form. At HSC level it also covers how ideas are treated: repeated, developed, contrasted and brought back.","Markers look for answers that explain how a composer achieves unity (through repetition and return) and variety (through contrast and development), with evidence from the other concepts."],"use":"Describe the overall shape first (sections, form), then the devices that build it (motifs, development, imitation, repetition). Support each point with evidence from pitch, texture, dynamics or tone colour, and explain how it produces unity, variety, tension or a sense of arrival.","listen":["Listen for where sections begin and end: cadences, pauses and changes of texture.","Notice which ideas come back and whether they come back changed.","Track the climax and how the music builds to it."],"example":"The excerpt is in **sectional** form, unified by a **recurring** two-bar motif that is **fragmented** and **sequenced** in the middle section before **returning** in its original form at the end."},"Structure>Balance and symmetry":{"what":["Balance and symmetry describe how parts of the music match each other. Balanced phrases are equal in length (often four bars answered by four bars). Symmetry can apply to a whole piece, where the second half mirrors the first.","Balance gives a sense of order and predictability, and composers often break it on purpose to surprise the listener."],"use":"Count bars and compare phrase lengths, then say what the balance (or lack of it) achieves: stability, a Classical feel or, when broken, surprise and forward motion.","listen":["Count the bars in each phrase.","Notice whether a question phrase is matched by an answer of the same length.","Check whether one phrase is noticeably longer than the others."],"example":"The theme is made of **balanced** four-bar phrases that give it a stable, Classical feel, but the final phrase is **extended** to six bars to delay the cadence."},"Balance and symmetry>symmetrical":{"what":["A symmetrical structure has parts that mirror each other. It can mean two halves of the same length, phrases that match in pairs or a form that reads the same forwards and backwards, such as ABA or ABCBA (arch form).","Symmetry is about proportion, so give bar counts to prove it."],"use":"Show the symmetry with bar numbers or section labels and link it to order, balance and a sense of completion. Note any part that breaks the symmetry, since that is often where the interest lies.","listen":["Compare the length of the first and second halves.","Listen for sections returning in reverse order.","Notice whether phrases come in matching pairs."],"example":"The piece is **symmetrical**, with an ABA plan in which the outer sections are both sixteen bars long, which gives a strong sense of proportion and completion.","quote":[{"text":"Two halves roughly the same length which gives structural symmetry","source":"Trial 2024"}]},"Balance and symmetry>balanced / balance":{"what":["Balance is when phrases or sections feel equal in weight, usually because they have the same number of bars. A four-bar question answered by a four-bar answer is the classic balanced phrase pair.","Balanced phrasing is typical of Classical period music, and also of most pop songs."],"use":"Count the bars to prove balance and link it to predictability, stability or a Classical style. Contrast it with an unbalanced or extended phrase if the composer breaks the pattern.","listen":["Count bars in each phrase and compare them.","Listen for a phrase that ends unfinished, then a matching one that resolves.","Notice whether the pattern is ever broken."],"example":"The melody is built from **balanced** four-bar phrases, each question answered by a phrase of equal length, which gives the theme a poised, Classical character.","fig":[{"file":"ex_phrases.png","caption":"Phrases in Beethoven's Ode to Joy: a 'question' phrase that sounds unfinished, then an 'answer' phrase that ends on the home note"}],"quote":[{"text":"three four-bar phrases, providing balance","source":"HSC 2018"},{"text":"Balanced phrases were a feature of the Classical period","source":"HSC 2025"}]},"Balance and symmetry>even phrase length":{"what":["Even phrase length means each phrase has the same number of bars, most often two, four or eight. It is the most common way music is organised in Western styles.","Uneven lengths (three, five or seven bars, or a phrase that is extended) stand out against it."],"use":"Give the bar counts as evidence. Link even lengths to regularity and predictability, and point out where a phrase is uneven, since that usually marks extension, a cadence delay or a special moment.","listen":["Count bars from one breath or cadence to the next.","Notice if the phrases feel regular, like lines of a poem.","Listen for a phrase that runs on longer than expected."],"example":"The first three phrases have **even phrase lengths** of four bars, which makes the irregular six-bar final phrase sound like a deliberate stretch towards the cadence.","quote":[{"text":"The first 2 phrases are even in length, while the third is significantly longer","source":"Trial 2008"}]},"Structure>Contrast / variety":{"what":["Contrast is a clear difference between ideas or sections, and variety is the overall interest produced by change. Composers create contrast by changing any concept: key, tempo, texture, dynamics, tone colour or melodic shape.","Contrast balances unity. Too much repetition becomes dull, and too much change loses the listener."],"use":"When you say a section contrasts, give the concepts that change and how. Link contrast to interest, a new mood or section, or tension. Pair it with unity in essay answers.","listen":["Listen for a sudden change in tempo, key, texture or instruments.","Notice ideas placed side by side without a transition.","Check which concepts stay the same, since they give unity."],"example":"The B section **contrasts** with the A section through a shift to the minor key, a slower tempo and a **sparse** texture, which gives **variety** before the opening material returns."},"Contrast / variety>alternating":{"what":["Alternating means two ideas, textures, instruments or sections take turns. It may be a quick back-and-forth, such as bars of block chords alternating with a solo line, or larger sections, as in a rondo (A B A C A).","Alternation combines contrast (the two ideas differ) with unity (each one keeps coming back)."],"use":"Name the two things that alternate and how often they swap. Link it to contrast, conversation or a sense of pattern, and describe any change in the pattern, such as the swaps getting quicker.","listen":["Listen for two clearly different ideas swapping.","Notice the length of each turn.","Check whether the swaps speed up or the ideas start to overlap."],"example":"The opening **alternates** between loud brass fanfares and quiet string chords every two bars, which sets up a strong contrast in dynamics and tone colour.","quote":[{"text":"alternates between block chords and a monophonic texture","source":"HSC 2021"}]},"Contrast / variety>varied / variety / variation":{"what":["Variety is the interest a composer creates through change. Variation is the process of changing material while keeping it recognisable: new rhythm, ornaments, harmony, key, texture or instrument. A varied repeat is a repeat with changes.","These words help explain how unity and interest work together."],"use":"Say what is varied and how, naming the concepts that change and those that stay the same. Link variation to interest, development and a sense of growth while unity is kept.","listen":["Listen for a familiar tune with something different about it.","Notice whether the rhythm, harmony or instrument has changed.","Check what stays the same so you can still recognise it."],"example":"When the theme returns it is **varied**, with the melody now in the horn and decorated with triplet figures, so the music feels familiar but fresh.","fig":[{"file":"rm_s5_variation.png","caption":"Variation: the motif with a new rhythm and extra notes, still easy to recognise"}],"quote":[{"text":"Variety is achieved through the composer manipulating different concepts","source":"HSC 2018"}]},"Contrast / variety>juxtaposed":{"what":["Juxtaposition is placing contrasting ideas directly next to each other, with no gradual change between them. The contrast is sudden and sharp: a block of woodwind followed straight away by a block of percussion, or one scale type followed straight away by another.","It is a feature of music by composers such as Stravinsky and of much film and contemporary music."],"use":"Name the two ideas and what makes them different. Link juxtaposition to surprise, sharp contrast and a fragmented or block-like structure, and compare it with music that uses smooth transitions.","listen":["Listen for sudden switches with no build-up.","Notice blocks of sound in different timbres or scales.","Check whether the blocks return in a new order."],"example":"Short blocks of muted brass are **juxtaposed** with high string harmonics, so the sudden switches in tone colour make the structure sound fragmented and unpredictable.","quote":[{"text":"woodwind/strings/percussion juxtaposed","source":"HSC 2016"},{"text":"Juxtaposition... of the whole tone scale and pentatonic scale","source":"Trial 2024"}]},"Contrast / variety>contrasting":{"what":["Contrasting ideas or sections differ clearly in one or more concepts, such as dynamics, texture, tempo, key or tone colour. A contrasting section helps the listener hear the structure, because the change signals something new.","Contrast is relative: always say what it contrasts with."],"use":"Name both things being compared and the concepts that differ. Link contrast to a new section, mood change, tension or relief.","listen":["Listen for a clear change in mood.","Notice which concepts change and which stay the same.","Check whether the change lines up with a new section."],"example":"A **contrasting** lyrical oboe melody follows the aggressive opening, its legato line and soft dynamic giving a moment of calm.","fig":[{"file":"rm_s5_contrast.png","caption":"Contrast: after the loud, stepwise motif comes a soft new idea with long notes and a leap"}],"quote":[{"text":"contrasted with the string chordal writing","source":"HSC 2016"}]},"Structure>Development of ideas":{"what":["Development is how a composer takes a short idea and transforms it to build more music. Common techniques are fragmentation, sequence, inversion, retrograde, augmentation, diminution, extension and elaboration.","Naming the exact technique is far stronger than saying 'the idea is changed'."],"use":"Identify the original idea, name the technique and say where it happens. Then explain the effect: unity because the material is related, variety because it is transformed and often tension as the development builds.","listen":["Learn the opening motif well so you can recognise it later.","Listen for it shortened, stretched, flipped or moved up and down.","Notice whether the development builds to a climax."],"example":"The opening motif is **fragmented** to its first three notes, then **sequenced** upwards in the strings, which builds tension while keeping the music unified."},"Development of ideas>fragmented / fragmentation":{"what":["Fragmentation is breaking a theme into smaller pieces and developing one piece on its own. Often the fragment is the first few notes or the last few notes of the theme, repeated or passed between parts.","Because the fragment is short, it can be repeated more often, which tends to increase urgency."],"use":"Say which part of the theme is used and how it is treated (repeated, sequenced, passed between instruments). Link fragmentation to tension, urgency and development while keeping unity with the original theme.","listen":["Listen for the start or end of the theme heard on its own.","Notice a short figure repeated many times.","Check whether the fragment is passed between instruments."],"example":"The theme is **fragmented** to its two-note head motif, which is passed between flute and clarinet in quick succession and drives the music towards the climax.","quote":[{"text":"Question/answer fragmentation of melody","source":"HSC 2016"}]},"Development of ideas>elaborated":{"what":["Elaboration adds notes to a melody to make it more decorated or detailed. The main notes stay in place, but passing notes, repeated notes, ornaments or faster rhythms fill the spaces between them.","It is a way of varying a theme so it is recognisable but more active."],"use":"Name the original melody, the instrument and what has been added (passing notes, repeated notes, trills, runs). Link elaboration to variety, rising energy or virtuosity, especially when a theme returns.","listen":["Listen for a familiar tune with more notes in it.","Notice ornaments or runs filling gaps between the main notes.","Check whether the main notes still fall in the same places."],"example":"On its return the melody is **elaborated** with semiquaver passing notes and trills in the violin, which adds momentum while keeping the shape of the theme.","fig":[{"file":"rm_s6_structure_elaborated.png","caption":"Elaboration: the plain melody, then the same outline filled in with passing notes and repeated notes"}],"quote":[{"text":"Melodic line elaborated with the addition of repeated notes","source":"HSC 2016"}]},"Development of ideas>extended / extension":{"what":["Extension makes a phrase, theme or motif longer than expected. The composer may repeat its ending, add a sequence or delay the cadence. A four-bar phrase extended to six bars is a common example.","Extension delays resolution, so it often builds tension or emphasises an ending."],"use":"Say what is extended, by how much and how (repetition, sequence, a delayed cadence). Link it to tension, anticipation or a stronger sense of closure.","listen":["Listen for a phrase that goes on past where you expect it to end.","Notice the ending being repeated before the cadence.","Count bars to see if the phrase is longer than its partner."],"example":"The final phrase is **extended** by two bars as the cadence is delayed with a rising sequence, which heightens anticipation before the resolution.","fig":[{"file":"rm_s6_structure_extended.png","caption":"Extension: the two-bar phrase is stretched to four bars by delaying the final C"}],"quote":[{"text":"Theme is repeated and extended","source":"HSC 2017"},{"text":"Motivic extension","source":"Trial 2021"}]},"Development of ideas>sequential / sequence":{"what":["A sequence is the immediate repetition of a melodic or harmonic idea at a different pitch, usually moving up or down by step. A rising sequence often increases tension and a falling sequence often relaxes it.","Sequences are a core technique in Baroque and Classical music and in many pop chord progressions."],"use":"Name the motif, the direction of the sequence and how many times it repeats. Link rising sequences to building tension and falling ones to winding down, and mention the instrument and bar numbers.","listen":["Listen for the same shape heard again a step higher or lower.","Count how many times the shape repeats.","Notice whether it builds towards a climax."],"example":"The violins repeat the three-note motif in a rising **sequence**, each statement a step higher, which builds tension into the climax.","quote":[{"text":"Sequential on-the-beat solo line writing","source":"HSC 2025"}]},"Development of ideas>inverted / inversion":{"what":["Melodic inversion flips a melody so that every interval goes in the opposite direction. If the original rises a third, the inversion falls a third. The rhythm usually stays the same, so the idea is still recognisable.","Inversion is common in fugues, serial music and development sections."],"use":"Name the original motif, the instrument and where the inversion appears. Link it to development and unity: the material is related but transformed. Compare it with retrograde if both appear.","listen":["Listen for the rhythm of a familiar motif with the shape upside down.","Notice a rising idea answered by a falling version.","Check if it appears in the bass or another part."],"example":"The bass presents the main motif in **inversion**, falling where the original rose, which develops the idea while keeping the texture unified.","quote":[{"text":"Melodic Inversion","source":"HSC 2016"},{"text":"Inversion (bass bar 61)","source":"Trial 2021"}]},"Development of ideas>augmented / diminution":{"what":["Augmentation stretches a motif by making its note values longer, usually doubling them, so crotchets become minims. Diminution compresses it by making note values shorter, usually halving them. The pitches stay the same.","Augmentation makes a motif sound broader and grander. Diminution makes it sound quicker and more urgent."],"use":"Name the motif, the instrument and whether it is augmented or diminished. Link augmentation to grandeur, weight or a climactic statement, and diminution to energy and urgency.","listen":["Listen for a familiar motif that sounds slower or faster but has the same notes.","Notice it in the bass or brass for augmentation.","Check whether the tempo itself has changed or only the note values."],"example":"The tuba states the four-note motif in **augmentation** beneath the busy strings, so the slow, broad version sounds grand and weighty.","quote":[{"text":"augmentation of four-note tuba motif","source":"HSC 2020"},{"text":"Augmentation and Diminution","source":"Trial 2021"}]},"Development of ideas>motivic / motif":{"what":["A motif is a short musical idea, often two to six notes, with a distinctive rhythm or shape. Motivic writing builds a piece from one or more motifs by repeating and developing them.","The opening of Beethoven's Fifth Symphony is the best-known example: a four-note motif that drives the whole movement."],"use":"Describe the motif (rhythm, interval, instrument) when it first appears, then trace what happens to it. Link motivic writing to unity, because so much comes from one small idea.","listen":["Listen for a short, catchy idea in the opening bars.","Notice it coming back in other instruments and at other pitches.","Check whether it is changed by a development technique."],"example":"The movement is **motivic**, built from a three-note dotted figure that appears in every section, which gives strong unity to the whole excerpt.","fig":[{"file":"ex_motif.png","caption":"Motif: the famous four-note idea from Beethoven's Symphony No. 5, then repeated a step lower"}],"quote":[{"text":"Repetition of short fragments of motivic material","source":"Trial 2025"}]},"Development of ideas>developed / development":{"what":["Development is the process of transforming musical material through techniques such as fragmentation, sequence, inversion, augmentation, modulation and changes of texture. In sonata form, the development is also the name of the middle section where this happens most.","'Developed' is a general word, so follow it with the specific technique."],"use":"Say what is developed, then name the techniques and where they occur. Link development to tension, instability and variety while keeping unity with the original material.","listen":["Listen for the main theme in pieces or changed forms.","Notice the music moving through different keys.","Check whether the tension builds before the theme returns."],"example":"In the middle section the theme is **developed** through **fragmentation** and **sequence**, moving through several keys, which builds instability before the return.","fig":[{"file":"rm_s4_str_motif_dev.png","caption":"One motif developed: repeated, moved higher, then given a new ending"}],"quote":[{"text":"The theme is fragmented and developed","source":"HSC 2017"},{"text":"developed into a sequential pattern","source":"Trial 2021"}]},"Development of ideas>retrograde":{"what":["Retrograde is a melody or motif played backwards: the last note becomes the first. Usually both the pitches and the rhythm are reversed. Retrograde inversion plays the inverted version backwards.","Retrograde is harder to hear than inversion, so it is often shown in a score extract. It is common in serial music and in some Baroque and Renaissance counterpoint."],"use":"Use 'retrograde' when you can identify the reversed order in the score or clearly by ear. Name the original idea and where it appears reversed, and link it to unity through related material and to the intellectual design of the piece.","listen":["Listen for the end of a motif becoming its beginning.","Check a score for the note order reversed.","Notice if a rhythm sounds familiar but backwards."],"example":"In bar 20 the cello plays the opening motif in **retrograde**, its notes reversed, which links the closing section to the opening through related material."},"Structure>Imitative / canonic devices":{"what":["These devices create structure through copying. Imitation, canon and fugal writing repeat material between parts. Antiphonal writing and staggered entries organise when groups play.","The same words appear under Texture, because they shape both the layers and the way the music unfolds over time."],"use":"When writing about structure, focus on how these devices organise the music over time: the order of entries, the gap between them and how they lead to a climax or new section.","listen":["Listen for a theme entering in one part after another.","Notice groups taking turns.","Track how long the copying continues."],"example":"The section opens with **staggered** **imitative** entries that grow into a **canon**, so the structure builds from a single line to a full climax."},"Imitative / canonic devices>antiphonal":{"what":["Antiphonal writing alternates phrases between two groups of performers. As a structural device it divides the music into a regular pattern of statement and answer.","The groups may answer with the same material or a varied reply, and the spacing between entries can change to vary the tension."],"use":"Describe the pattern of alternation and how it changes over the excerpt (longer or shorter gaps, overlapping, both groups combining). Link it to dialogue, contrast of timbre and building intensity.","listen":["Listen for two groups taking turns.","Notice how long each turn lasts.","Check whether the groups end up playing together."],"example":"The two choirs sing **antiphonally**, and as their entries get closer together the passage gathers momentum until both choirs join for the final cadence.","fig":[{"file":"rm_s6_texture_antiphonal.png","caption":"Antiphonal: Group 1 and Group 2 take turns with the phrase, then both play together"}],"quote":[{"text":"Spacing of antiphonal entries varies","source":"Trial 2024"}]},"Imitative / canonic devices>staggered":{"what":["Staggered entries happen when parts begin one after another rather than together. As a structural device, staggering spreads the build-up of a section over several bars.","The entries may imitate each other or each part may bring new material."],"use":"Give the order and timing of entries with bar numbers, and link the staggering to gradual growth in density, tension or volume across the section.","listen":["Count the entries and their spacing.","Notice if each entry copies the first.","Check where the full ensemble finally arrives."],"example":"The four horns enter in **staggered** entries a bar apart, each imitating the first, so the section builds steadily to a full chord at bar 9.","fig":[{"file":"rm_s6_texture_staggered.png","caption":"Staggered entries: flute, then clarinet, then bassoon come in a bar apart, so the texture thickens one layer at a time"}],"quote":[{"text":"staggered entries that imitate different bells","source":"HSC 2017"}]},"Imitative / canonic devices>canonic / canon":{"what":["A canon is strict imitation in which a melody is copied exactly by one or more parts entering after a set gap. As a structure, a canon can shape a whole piece or section, and it builds up as each part enters.","Canons can be at the unison, the octave or other intervals, and can loop like a round."],"use":"Say how many parts, the gap between entries and the interval. Link canon to unity, because one melody generates everything, and to growing density as the parts accumulate.","listen":["Listen for a whole melody copied, not just its opening.","Count the parts and the gap between entries.","Notice how the density grows."],"example":"The excerpt is a three-part **canon** at the octave, so one melody shapes the whole passage and the texture thickens with each entry.","fig":[{"file":"s5_tex_canon.png","caption":"Canon: Voice 2 copies Voice 1 exactly, two bars later (Frère Jacques)"}],"quote":[{"text":"the canonic entries of the choir parts","source":"HSC 2017"},{"text":"a 6-part canon","source":"Trial 2025"}]},"Imitative / canonic devices>fugal / fugue-like":{"what":["A fugue is a contrapuntal form built on a subject that enters in each part in turn (the exposition), followed by episodes and further entries in related keys. Fugal or fugue-like writing borrows this structure.","An episode is a linking passage, often built from fragments of the subject, between entries."],"use":"Describe the entries of the subject and any episodes. Link fugal writing to structured growth, density and a Baroque influence, and to unity because the subject generates the material.","listen":["Listen for a theme stated alone, then in other parts.","Notice passages between entries that use fragments of the theme.","Check whether the entries move through different keys."],"example":"The middle section is **fugal**, with the subject entering in turn in cellos, violas and violins, and the linking episodes built from its first four notes.","quote":[{"text":"a fugal episode based on theme 1","source":"HSC 2018"}]},"Imitative / canonic devices>imitation / imitative":{"what":["Imitation is when one part repeats material from another soon after it is heard. It need not be exact and may only copy the opening. As a structural device it links sections and parts through shared material.","Imitation running throughout a passage gives it strong unity."],"use":"Identify the idea, the parts and the gap, and say whether the copy is exact. Link imitation to unity, dialogue and the gradual build-up of a section.","listen":["Listen for a recent idea coming back in a different part.","Notice whether it is higher or lower.","Check whether the copy changes after a few notes."],"example":"The trumpet **imitates** the clarinet's rising figure two beats later, and this pattern of **imitation** continues throughout the section, which gives the passage strong unity.","fig":[{"file":"s5_tex_imitation.png","caption":"Imitation: Voice 2 copies the opening shape a bar later and a 5th higher, then goes its own way"}],"quote":[{"text":"Imitation of melodic material","source":"HSC 2017"},{"text":"Imitation between parts throughout","source":"Trial 2025"}]},"Structure>Phrase and form shape":{"what":["These words describe the larger shape of the music: whether it is in sections, through-composed or built as a theme and variations, and how individual phrases are shaped. They also cover special sections such as cadenzas and codas, and the climax.","Form words tell the reader how the excerpt is organised from beginning to end."],"use":"Name the form or shape, then support it with evidence: where the sections begin, what changes and which material returns. Link the shape to unity, contrast and the building of tension towards the climax.","listen":["Listen for cadences, pauses and changes that mark new sections.","Notice whether earlier material returns.","Track the highest point of intensity."],"example":"The excerpt is **sectional**, with three contrasting sections that build to a **climax** before a short **coda** brings back the opening motif."},"Phrase and form shape>through-composed":{"what":["A through-composed piece keeps moving on to new material rather than repeating sections. It could be labelled A B C D. Motifs may still return, but whole sections do not.","It is common in art songs, opera, film music and some contemporary works that follow a story or text."],"use":"Use 'through-composed' when no section returns, and point to the changes of material as evidence. Link it to forward motion, narrative or unpredictability, and mention any motifs that unify it.","listen":["Listen for whether any section comes back.","Notice the music changing to follow the words or story.","Check for a small motif that links the sections."],"example":"The song is **through-composed**, with new music for each verse that follows the story, so the drama keeps moving forward.","quote":[{"text":"the excerpt is through composed creating interest","source":"Trial 2023"}]},"Phrase and form shape>sectional / sections":{"what":["Sectional music is divided into clear sections, often labelled with letters (A, B, C). Sections are separated by cadences, pauses or changes in several concepts at once.","Common sectional forms include binary (AB), ternary (ABA), rondo (ABACA) and verse-chorus."],"use":"Name the sections and give the bar numbers where each one starts, with the changes that mark the boundaries. Link the sectional plan to contrast and unity.","listen":["Listen for a strong cadence followed by something new.","Notice changes in several concepts at the same moment.","Label each section with a letter as you listen."],"example":"The excerpt is **sectional**, with a loud A section, a contrasting soft B section from bar 17 and a return of A at bar 33.","fig":[{"file":"form_rondo.png","caption":"Rondo: A keeps returning between new sections"}],"quote":[{"text":"Three main sections","source":"HSC 2018"}]},"Phrase and form shape>theme and variations":{"what":["Theme and variations is a form where a theme is presented and then repeated a number of times, each time changed. Each variation may alter the melody, rhythm, harmony, key, tempo, texture or instrumentation, while keeping the theme recognisable.","The form shows how much a composer can do with one idea."],"use":"Identify the theme, then describe what changes in each variation. Link the form to unity (one theme) and variety (constant change).","listen":["Learn the theme well in its first statement.","Listen for what changes each time it returns.","Notice the variations often growing more elaborate."],"example":"The excerpt is in **theme and variations** form: the second variation keeps the melody but moves it to the minor key with a slower tempo, which gives a darker mood.","quote":[{"text":"Theme and variations","source":"HSC 2018"}]},"Phrase and form shape>cadenza / codetta / coda":{"what":["A cadenza is a free, virtuosic passage for a soloist, usually near the end of a concerto movement, where the accompaniment stops. A coda is a section added at the end of a piece to round it off. A codetta is a short coda, often at the end of a section rather than the whole piece.","Cadenzas are often marked with a pause and may be improvised or written out."],"use":"Name the passage and where it occurs. For a cadenza, describe the soloist's virtuosity and freedom of tempo. For a coda or codetta, explain how it confirms the ending, often by returning to earlier material or repeating a cadence.","listen":["Listen for the accompaniment stopping while a soloist plays freely.","Notice extra material after the final statement of a theme.","Check whether the ending repeats a cadence several times."],"example":"The movement closes with a short **coda** that brings back the opening motif over a tonic pedal, which confirms the ending and unifies the excerpt.","fig":[{"file":"sign_coda.png","caption":"The coda sign: marks the jump to the ending section"}],"quote":[{"text":"extends it into a cadenza","source":"HSC 2021"},{"text":"leading to the codetta","source":"Trial 2024"},{"text":"In the Coda","source":"HSC 2025"}]},"Phrase and form shape>question-and-answer / call-and-response":{"what":["Question and answer phrases come in pairs: the first sounds unfinished (often ending on an imperfect cadence) and the second completes it. Call and response is a related idea in which a leader's call is answered by a group or another instrument.","Call and response is central to African, African-American, gospel, blues and jazz traditions."],"use":"Name who calls and who answers, and whether the answer copies or contrasts. Link it to dialogue, balance and, in jazz or gospel styles, to tradition and audience involvement.","listen":["Listen for a phrase that sounds unfinished followed by one that resolves.","Notice a solo voice answered by a group.","Check whether the answers overlap the calls."],"example":"The trumpet and saxophones work in **call and response**, the saxophones answering each two-bar trumpet call with a syncopated riff, which gives the passage a lively, conversational feel.","fig":[{"file":"rm_s5_call_response.png","caption":"Call and response between a leader and a group: each call gets an answer"}],"quote":[{"text":"Question and answers section between strings and brass/wind","source":"HSC 2018"},{"text":"Use of rests in call and response passages","source":"Trial 2025"}]},"Phrase and form shape>arch / arc-shaped":{"what":["Arch or arc-shaped can describe a phrase that rises to a high point in the middle and falls back down. It can also describe a whole form where sections return in reverse order, such as ABCBA, so the middle section is the centre of the arch.","Both meanings involve symmetry around a central peak."],"use":"Say whether you mean a phrase contour or an overall form, and give the evidence (pitches or sections). Link an arch form to unity and symmetry, and an arc-shaped phrase to a natural sense of rise and release.","listen":["Listen for a phrase that climbs to a peak and falls away.","Notice sections returning in the reverse order.","Check where the central high point or middle section sits."],"example":"The piece has an **arch** structure (ABCBA), with the slow central C section framed by returns of B and A, which gives a strong sense of symmetry.","fig":[{"file":"mel_arch.png","caption":"Arch contour: up, then down"}],"quote":[{"text":"a unifying arch structure","source":"HSC 2016"},{"text":"The first phrase is arc shaped","source":"Trial 2008"}]},"Phrase and form shape>climactic / climax":{"what":["The climax is the point of greatest intensity in a passage or piece. Composers build to it by combining several concepts: rising pitch, crescendo, thickening texture, faster rhythms, more dissonance or a sequence. A climactic section is one where this peak happens.","After the climax, the tension usually releases."],"use":"Locate the climax with bar numbers and show how the concepts combine to build to it. Then describe what happens afterwards. This is a strong way to show how concepts work together.","listen":["Listen for the loudest, highest or thickest moment.","Notice several concepts building at once beforehand.","Check how the tension is released afterwards."],"example":"The **climax** at bar 48 is reached through a rising sequence, a crescendo to ff and the **staggered** entry of the full brass, after which the texture suddenly thins.","quote":[{"text":"used to build to a climax","source":"HSC 2018"},{"text":"the textural density of this climactic section","source":"HSC 2025"}]},"Structure>Repetition and recurring material":{"what":["Repetition is the main source of unity in music. These words describe material that is repeated, keeps recurring, echoes or mirrors other parts, or repeats continuously as an ostinato.","Recognising what comes back is the first step to explaining structure."],"use":"Name what repeats, how often and where. Say whether it is exact or changed, and link it to unity, familiarity, momentum or a hypnotic quality.","listen":["Listen for ideas you have already heard.","Notice short patterns that keep going underneath.","Check whether repeats are exact or changed."],"example":"A two-bar **ostinato** in the bass **recurs** throughout, while the opening phrase is **echoed** by the flutes, which ties the excerpt together."},"Repetition and recurring material>repeated / repetition":{"what":["Repetition is playing a phrase, motif, section or pattern again. It may be exact or slightly changed. Repetition is how listeners recognise and remember musical ideas.","It operates at every level, from a repeated note to a repeated section."],"use":"Say what is repeated, where and how often, and whether it is exact. Link repetition to unity and memorability, and contrast it with new or varied material.","listen":["Listen for a phrase or section you have just heard.","Notice repeat signs or identical bars in a score.","Check whether anything changes in the repeat."],"example":"The four-bar phrase is **repeated** exactly in the clarinet, which reinforces the main idea before the contrasting section begins.","fig":[{"file":"rm_s5_repetition.png","caption":"Repetition: the motif is heard again exactly the same"}],"quote":[{"text":"Repetition of phrases in Sections B and C","source":"HSC 2018"}]},"Repetition and recurring material>ostinato":{"what":["An ostinato is a short musical pattern (rhythmic, melodic or chordal) that repeats continuously, usually throughout a section. A bass ostinato is often called a ground bass, and in popular music a riff is a type of ostinato.","Ostinatos give a stable foundation while other parts change above them."],"use":"Describe the ostinato (rhythm, pitch, instrument, length) and say how long it continues. Link it to unity, momentum, a hypnotic effect or tension when other parts change above it.","listen":["Listen for a pattern that repeats without stopping.","Notice whether it stays the same while the melody changes.","Check whether it returns in a later section."],"example":"A one-bar **ostinato** in the low strings continues through the whole section, providing a driving foundation as the brass and woodwind melodies change above it.","quote":[{"text":"the ostinato first heard in the strings is heard again","source":"HSC 2019"}]},"Repetition and recurring material>echoed / mirrored":{"what":["An echo is an immediate repetition of a short idea, often softer, as if it bounces back. Mirrored can mean one part copies another closely, or that a shape is reflected, such as a rising idea answered by a falling one.","Echo effects were popular in Baroque music and are common in orchestral writing between sections."],"use":"Name the instruments and the idea that is echoed or mirrored, and describe any change (dynamics, register, timbre). Link it to dialogue, space and unity.","listen":["Listen for a short idea repeated immediately, often quieter.","Notice it moving to a different instrument or register.","Check whether the shape is reflected in the reply."],"example":"The trumpet's fanfare figure is **echoed** softly by the flutes, which gives a sense of distance and links the two sections of the orchestra.","quote":[{"text":"are echoed by flutes and 1st clarinet","source":"HSC 2020"},{"text":"mirrored by woodwinds","source":"HSC 2018"}]},"Repetition and recurring material>recurring":{"what":["Recurring material returns at several points in a piece, sometimes after long gaps. A recurring motif or theme can link different sections and give the piece an identity.","Recurring material may be exact or changed each time."],"use":"Identify the recurring idea and where it appears, and whether it changes. Link it to unity, cohesion and structure, and to a leitmotif if it represents a character or idea.","listen":["Listen for an idea you heard much earlier.","Notice it in different instruments or keys.","Check whether it marks the start of new sections."],"example":"The rising four-note motif is a **recurring** idea, returning in the horns at the start of each section, which gives the excerpt cohesion.","quote":[{"text":"It then is used as a recurring motif","source":"HSC 2024"}]},"Structure>Unity / cohesion":{"what":["Unity is the sense that a piece belongs together. Cohesion is the way its parts connect. Composers achieve unity through repetition, return of material, consistent rhythms or textures and motifs that link sections.","Unity is usually balanced against contrast, and many HSC questions ask how a composer achieves both."],"use":"Name the specific feature that creates unity and give evidence from the excerpt. Link it to coherence and contrast it with the features that give variety.","listen":["Listen for ideas that return.","Notice features that stay the same throughout.","Check whether sections share motifs or rhythms."],"example":"A **consistent** quaver accompaniment and the **return** of the opening melody at the end give the excerpt **unity**, which balances the contrast of the middle section."},"Unity / cohesion>returning / return":{"what":["A return is when earlier material comes back after something different. In ternary form (ABA) the return of A is the defining feature. A return may be exact or varied.","Returning material gives a sense of homecoming and completion."],"use":"Say what returns, where and whether it is changed. Link the return to unity, closure and a sense of balance in the form.","listen":["Listen for the opening melody coming back.","Notice whether it returns in the same key and instrument.","Check whether the return marks the end of the piece."],"example":"The **return** of the opening piano melody in the final bars, now in a lower register, rounds off the excerpt and gives a strong sense of unity.","fig":[{"file":"form_ternary.png","caption":"Ternary: the A section comes back"}],"quote":[{"text":"Brief return of the opening sax solo melody... creates a sense of unity","source":"Trial 2025"}]},"Unity / cohesion>unifying / unity / unified":{"what":["Unity is the feeling that a piece is one whole. A unifying feature is something that links the parts, such as a repeated motif, a constant rhythm pattern, an ostinato or a consistent texture.","Unity does not mean sameness. It means the different parts are clearly related."],"use":"Name the unifying feature specifically and give evidence of where it appears. Link it to cohesion, and balance it against the features that give contrast.","listen":["Listen for a pattern or motif that never quite goes away.","Notice what stays constant while other things change.","Check whether sections share material."],"example":"A dotted-rhythm figure in the cellos runs through every section and acts as the main **unifying** feature, linking the contrasting melodies above it.","quote":[{"text":"a unifying arch structure","source":"HSC 2016"},{"text":"Unity is achieved through the constant semiquaver pattern","source":"HSC 2017"},{"text":"Unity is achieved by the use of repeated motifs","source":"Trial 2021"}]},"Unity / cohesion>consistent":{"what":["A consistent feature stays the same across a passage or piece. It may be a steady rhythm, a repeated phrase length, an unchanging texture or a constant dynamic.","Consistency supports unity and balance, and makes any change more noticeable."],"use":"Name what is consistent and over which bars, then link it to unity, stability or balance. If something breaks the consistency, point it out as a contrast.","listen":["Listen for a feature that does not change.","Notice steady patterns in the accompaniment.","Check whether the phrase lengths stay the same."],"example":"The **consistent** four-bar phrasing and steady crotchet bass give the excerpt balance, so the sudden pause at bar 24 is especially striking.","quote":[{"text":"Consistent phrasing and rhythm patterns create balance","source":"HSC 2018"}]}}};
let MORE=MORES[4];


/* ---------- build ---------- */
const stage=document.getElementById("stage"), world=document.getElementById("world"), bar=document.getElementById("bar");
const SVGNS="http://www.w3.org/2000/svg";
const svg=document.createElementNS(SVGNS,"svg"); world.appendChild(svg);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* The expand/collapse tween always plays: many Windows machines disable OS
   "Animation effects", which Chrome reports as reduce-motion, and the diagram
   reads as broken without it. Other flourishes still respect the setting. */
const DUR=520;
const nodes=[];
let root, narrow=window.innerWidth<720;
const mk=(tag,cls,text)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e};

function build(src,parent,depth,branch){
  const o={t:src.t,d:src.d,k:src.k,parent:parent,depth:depth,branch:branch,side:1,children:[],open:false,vis:false,cx:0,cy:0,tx:0,ty:0};
  nodes.push(o);
  const el=mk("button","node d"+Math.min(depth,3)+(src.k?" "+src.k:"")+(src.c.length?" has":""));
  el.type="button";
  el.style.setProperty("--b",depth?"var(--c"+(branch+1)+")":"var(--ink)");
  el.style.setProperty("--o",depth?"var(--o"+(branch+1)+")":"var(--paper)");
  const card=mk("span","card"), body=mk("span","body");
  body.appendChild(mk("span","t",src.t));
  if(depth===0){ const st=mk("span","stave"); for(let i=0;i<5;i++) st.appendChild(mk("i")); body.appendChild(st) }
  if(src.d) body.appendChild(mk("span","def",src.d));
  const files=parent?IMG[parent.t+">"+src.t]:null;
  if(files){
    o.files=files; el.classList.add("pics"); let maxW=0;
    files.forEach(file=>{
      const m=META[file], r=m[0]/m[1];
      let w=Math.max(100,Math.min(300,Math.sqrt(17000*r))); w=Math.round(Math.min(w,150*r)); const hh=Math.round(w/r);
      maxW=Math.max(maxW,w);
      const pic=mk("span","pic"); pic.style.width=w+"px"; pic.style.height=hh+"px";
      const im=mk("img"); im.src="thumbs/"+file.replace(/\.\w+$/,".webp"); im.alt=m[2]; im.loading="lazy"; im.decoding="async"; im.draggable=false;
      pic.appendChild(im); body.appendChild(pic);
      pic.addEventListener("click",e=>{ e.stopPropagation(); if(!dragged) openPics(o,file) });
      if(m[4]){ const pb=playButton(file,"play"); pb.addEventListener("click",e=>{ e.stopPropagation(); if(!dragged||e.detail===0) playAudio(file) }); pic.appendChild(pb) }
      if(m[3]){ const c=mk("span","credit",m[3]); c.style.maxWidth=Math.max(w,150)+"px"; body.appendChild(c) }
    });

/* ---------- layout ---------- */
const vgap=d=>d<=1?30:d===2?14:8;
const hgap=d=>d===0?(narrow?44:96):d===1?(narrow?48:64):44;
function sub(o){
  if(!o.open||!o.children.length){o.ch=0;return o.sh=o.h}

  o.ch=s; return o.sh=Math.max(o.h,s);
}
function place(o,edge,top,dir,list){

  if(o.open&&o.children.length){
    let y=top+(o.sh-o.ch)/2;
    const far=(dir>0?edge+o.w:edge-o.w)+dir*hgap(o.depth);
    o.children.forEach((c,i)=>{ if(i) y+=vgap(c.depth); place(c,far,y,dir,list); y+=c.sh });
  }
}
let vis=[], first=true, mapBox={x:0,y:0,w:1,h:1};
const leaving=new Set();
function layout(){
  const list=[root];
  root.tx=-root.w/2; root.ty=-root.h/2;
  [1,-1].forEach(dir=>{
    const kids=root.open?root.children.filter(c=>c.side===dir):[];
    let total=0; kids.forEach((c,i)=>{total+=sub(c)+(i?vgap(1):0)});
    let y=-total/2;
    kids.forEach((c,i)=>{ if(i) y+=vgap(1); place(c,dir*(root.w/2+hgap(0)),y,dir,list); y+=c.sh });
  });
  const now=new Set(list);
  nodes.forEach(o=>{
    const v=now.has(o);
    if(v&&(!o.vis||first)){
      const p=o.parent, idx=p?p.children.indexOf(o):0;
      if(leaving.has(o)) leaving.delete(o);
      else if(first||!p){ o.cx=o.tx; o.cy=o.ty }
      else { o.cx=p.cx+(p.w-o.w)/2; o.cy=p.cy+(p.h-o.h)/2 }

      o.el.style.setProperty("--delay",delay+"ms"); if(o.link) o.link.style.setProperty("--delay",delay+"ms");
      o.el.classList.remove("off","leaving"); if(o.link) o.link.classList.remove("off","leaving");
      if(o.files&&!o.eager){ o.eager=true; o.el.querySelectorAll("img").forEach(im=>im.loading="eager") }
    } else if(!v&&(o.vis||first)){
      if(first||!DUR){ o.el.classList.add("off"); if(o.link) o.link.classList.add("off") }
      else {
        let a=o.parent; while(a&&!now.has(a)) a=a.parent; a=a||root;
        o.tx=a.tx+(a.w-o.w)/2; o.ty=a.ty+(a.h-o.h)/2;
        o.el.classList.add("leaving"); if(o.link) o.link.classList.add("leaving");
        leaving.add(o);

    }
    o.vis=v;
    o.el.classList.toggle("open",v&&o.open&&o.children.length>0&&o!==root);
    if(o.countEl) o.countEl.textContent=o.open?"−":o.children.length;

}

/* ---------- view + animation ---------- */

const KMIN=.08, KMAX=2.4, zlabel=document.getElementById("zlabel");
function applyView(){

  let s=120*vc.k; while(s<70) s*=2; while(s>260) s/=2;
  stage.style.setProperty("--ps",s+"px"); stage.style.setProperty("--px",vc.x+"px"); stage.style.setProperty("--py",vc.y+"px");
  zlabel.textContent=Math.round(vc.k*100)+"%";
  stage.classList.toggle("far",vc.k<0.3);   /* pictures are specks this far out: skip painting them */
  drawMini();
}
function drawNode(o){
  o.el.style.transform="translate("+o.cx+"px,"+o.cy+"px)";

    const p=o.parent, dir=o.side;
    const x1=dir>0?p.cx+p.w:p.cx, y1=p.cy+p.h/2, x2=dir>0?o.cx:o.cx+o.w, y2=o.cy+o.h/2, mx=x1+dir*hgap(p.depth)/2;

function draw(){ vis.forEach(drawNode); leaving.forEach(drawNode); applyView() }
function startAnim(){

}

  for(const o of vis){o.cx=o.tx;o.cy=o.ty}

function frame(now){

function bbox(list){

}
const topInset=()=>22;
function fit(list,instant){
  const W=stage.clientWidth,H=stage.clientHeight,pad=narrow?16:40,top=topInset(),bot=narrow?70:30,b=bbox(list||vis);

function nudge(list){

function panBy(dx,dy){

/* ---------- minimap ---------- */
const mini=document.getElementById("mini"), minic=document.getElementById("minic"), mctx=minic.getContext("2d");
let palette=null, miniT=null;
function readPalette(){
  const cs=getComputedStyle(document.documentElement), g=n=>cs.getPropertyValue(n).trim();

new MutationObserver(()=>{palette=null;drawMini()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function drawMini(){
  if(!mini.offsetWidth||!vis.length) return;
  { // only show the overview when part of the map is off screen
    const k=vc.k, l=vc.x+mapBox.x*k, t=vc.y+mapBox.y*k;
    const allIn=l>=-4&&t>=-4&&l+mapBox.w*k<=stage.clientWidth+4&&t+mapBox.h*k<=stage.clientHeight+4;

  if(minic.width!==W*dpr){ minic.width=W*dpr; minic.height=H*dpr }
  const b=mapBox, pad=10, s=Math.min((W-2*pad)/b.w,(H-2*pad)/b.h), ox=W/2-s*(b.x+b.w/2), oy=H/2-s*(b.y+b.h/2);

    mctx.fillStyle=o.depth?palette.c[o.branch]:palette.ink;
    mctx.globalAlpha=o.depth<=1?1:o.depth===2?.8:.5;
    mctx.fillRect(ox+o.cx*s,oy+o.cy*s,Math.max(1.5,o.w*s),Math.max(1.5,o.h*s));
  }

  const vx=ox+(-vc.x/vc.k)*s, vy=oy+(-vc.y/vc.k)*s, vw=stage.clientWidth/vc.k*s, vh=stage.clientHeight/vc.k*s;

}
function miniGo(e){
  if(!miniT) return;

let miniDown=false;

function onNodeKey(o,e){

/* drag to pan (with a little glide), pinch on touch screens */

      if(Math.hypot(q.x-down.x,q.y-down.y)<5) return;
      dragged=true; stage.classList.add("grabbing"); hideHint();
      try{stage.setPointerCapture(e.pointerId)}catch(_){}
      panBy(q.x-down.x,q.y-down.y); lastMove=performance.now(); return;
    }
    const now=performance.now(), dt=Math.max(1,now-lastMove); lastMove=now;
    vel.x=.6*vel.x+.4*(dx/dt*16); vel.y=.6*vel.y+.4*(dy/dt*16);
    panBy(dx,dy);
  } else if(pts.size===2&&pinch){
    const s=pinchState();
    zoomAt(s.mx,s.my,s.d/pinch.d,false); panBy(s.mx-pinch.mx,s.my-pinch.my); pinch=s;
  }
});
function up(e){
  const was=pts.size; pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(!pts.size){
    stage.classList.remove("grabbing");
    if(was===1&&dragged&&!reduce&&performance.now()-lastMove<70&&Math.hypot(vel.x,vel.y)>2){
      const step=()=>{ vel.x*=.93; vel.y*=.93; panBy(vel.x,vel.y); glide=Math.hypot(vel.x,vel.y)>.35?requestAnimationFrame(step):0 };
      glide=requestAnimationFrame(step);
    }
  }
}
stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
/* trackpad: two-finger scroll moves the map, pinch (or ctrl/cmd + scroll) zooms */
stage.addEventListener("wheel",e=>{
  e.preventDefault(); stopGlide(); hideHint();
  if(e.ctrlKey||e.metaKey){
    const q=local(e), d=Math.max(-40,Math.min(40,e.deltaY*(e.deltaMode===1?16:1)));
    zoomAt(q.x,q.y,Math.exp(-d*.011),false);
  } else {
    let dx=e.deltaX, dy=e.deltaY;
    if(e.deltaMode===1){dx*=16;dy*=16}
    if(e.shiftKey&&!dx){dx=dy;dy=0}
    panBy(-dx,-dy);
  }
},{passive:false});
/* Safari sends its own pinch events */
let gk=1;
stage.addEventListener("gesturestart",e=>{e.preventDefault();gk=1});
stage.addEventListener("gesturechange",e=>{e.preventDefault();const q=local(e);zoomAt(q.x,q.y,e.scale/gk,false);gk=e.scale});
stage.addEventListener("gestureend",e=>e.preventDefault());
stage.addEventListener("dblclick",e=>{ if(e.target===stage||e.target===world){const q=local(e);zoomAt(q.x,q.y,1.6,true)} });
stage.addEventListener("scroll",()=>{stage.scrollTop=0;stage.scrollLeft=0});

const centre=()=>[stage.clientWidth/2,stage.clientHeight/2];
document.getElementById("zin").onclick=()=>zoomAt(...centre(),1.35,true);
document.getElementById("zout").onclick=()=>zoomAt(...centre(),1/1.35,true);
document.getElementById("fit").onclick=()=>fit();

function setAll(open){ nodes.forEach(o=>{o.open=open&&o.children.length>0}); root.open=true }
document.getElementById("openAll").onclick=()=>{ clearSearch(true); setAll(true); layout(); fit() };
document.getElementById("closeAll").onclick=()=>{ clearSearch(true); setAll(false); layout(); fit() };
const quizBtn=document.getElementById("quiz");
quizBtn.onclick=()=>{
  quiz=!quiz; quizBtn.setAttribute("aria-pressed",quiz?"true":"false");
  world.classList.toggle("quiz",quiz);
  if(!quiz) nodes.forEach(o=>o.el.classList.remove("shown"));
};

/* element chips: show one element on its own */
const chips=document.getElementById("chips");
function makeChips(){ chips.textContent=""; root.children.forEach((c,i)=>{
  const b=mk("button","chip",c.t); b.type="button";
  b.style.setProperty("--b","var(--c"+(c.branch+1)+")"); b.style.setProperty("--o","var(--o"+(c.branch+1)+")");
  b.onclick=()=>{
    clearSearch(true); hideHint();
    const solo=c.open&&root.children.every(x=>x===c||!x.open);
    setAll(false); c.open=true;
    if(solo) c.children.forEach(x=>x.open=true);   // second press opens one level deeper
    layout();
    fit([root,c].concat(collect(c)));
  };
  chips.appendChild(b);
}) }
function collect(o){ let a=[]; if(o.open) o.children.forEach(c=>{a.push(c);a=a.concat(collect(c))}); return a }

/* search */
const q=document.getElementById("q"), qcount=document.getElementById("qcount");
let snapshot=null;
function clearSearch(keepState){
  if(!snapshot&&!q.value) return;
  q.value=""; qcount.textContent="";
  world.classList.remove("searching");
  nodes.forEach(o=>{o.el.classList.remove("hit","onpath")});
  if(snapshot&&!keepState) nodes.forEach((o,i)=>o.open=snapshot[i]);
  snapshot=null;
}
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();
  if(s.length<2){ const had=snapshot, v=q.value; clearSearch(false); q.value=v; if(had){layout();fit()} return }
  if(!snapshot) snapshot=nodes.map(o=>o.open);
  setAll(false);
  let hits=0;
  nodes.forEach(o=>o.el.classList.remove("hit","onpath"));
  nodes.forEach(o=>{
    if(o===root||!(o.t+" "+o.d).toLowerCase().includes(s)) return;
    hits++; o.el.classList.add("hit");
    for(let p=o.parent;p;p=p.parent){p.open=true;p.el.classList.add("onpath")}
  });
  world.classList.add("searching");
  qcount.textContent=hits?hits+(hits===1?" match":" matches"):"No matches";
  layout();
  const focus=vis.filter(o=>o===root||o.el.classList.contains("hit")||o.el.classList.contains("onpath"));
  fit(hits?focus:vis);
});
q.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const had=snapshot; clearSearch(false); if(had){layout();fit()} } });

/* ---------- go ---------- */
function boot(){
  if(raf){cancelAnimationFrame(raf);raf=0}
  leaving.clear(); measure(); first=true; layout(); fit(null,true);
}
/* Stage 4 / Stage 5: each stage is its own bill, printed fresh */
let stageNow=0;
const stageBtns={4:document.getElementById("stage4"),5:document.getElementById("stage5"),6:document.getElementById("stage6")};
function mount(stage){
  if(stage===stageNow) return;
  stageNow=stage;
  if(raf){cancelAnimationFrame(raf);raf=0}
  leaving.clear(); snapshot=null; q.value=""; qcount.textContent=""; world.classList.remove("searching");
  nodes.forEach(o=>{ o.el.remove(); if(o.link) o.link.remove() }); nodes.length=0; vis=[];
  IMG=IMGS[stage]; MORE=MORES[stage]||{};
  root=build(STAGES[stage],null,0,0);
  root.children.sort((a,b)=>ORDER.indexOf(a.t)-ORDER.indexOf(b.t));
  root.open=true; applySides(); makeChips(); boot();
  for(const s in stageBtns) stageBtns[s].setAttribute("aria-pressed",String(+s===stage));
  try{ localStorage.setItem("eom-stage",String(stage)) }catch(_){}
  if(location.hash!=="#stage"+stage){ try{ history.replaceState(null,"","#stage"+stage) }catch(_){} }
}
stageBtns[4].onclick=()=>mount(4);
stageBtns[5].onclick=()=>mount(5);
stageBtns[6].onclick=()=>mount(6);
let startStage=4;
try{ const st=localStorage.getItem("eom-stage"); if(st==="5"||st==="6") startStage=+st }catch(_){}
if(/^#stage[456]$/.test(location.hash)) startStage=+location.hash.slice(6);
mount(startStage);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(boot);
/* refit whenever the press bed changes size (also catches a pane that opens small and then grows) */
let rz=0, lastW=stage.clientWidth, lastH=stage.clientHeight;
new ResizeObserver(()=>{
  if(stage.clientWidth===lastW&&stage.clientHeight===lastH) return;
  lastW=stage.clientWidth; lastH=stage.clientHeight;
  clearTimeout(rz); rz=setTimeout(()=>{
    const n=window.innerWidth<720;
    if(n!==narrow){ narrow=n; applySides(); finish(); measure(); layout() }
    fit(null,!touched);
  },120);
}).observe(stage);
</script>
