r or a comparison with another section."],"use":"Name the tempo early in your duration paragraph, then refine it. 'Fast' is fine, but 'a lively tempo of about 130 bpm' earns more. Say whether the tempo stays the same or changes, and how it shapes the mood.","listen":["Tap along and estimate the bpm against a clock: 60 bpm is one tap every second.","Decide whether the speed comes from the beat itself or from busy short notes over a slower beat."],"example":"The excerpt is set at a **quick** tempo of around 140 bpm, and the short detached notes in the woodwind give the opening a light, playful character."},"Speed (tempo)>lively":{"what":["Lively describes a tempo that is fairly fast and feels energetic. It says something about character as well as speed, so it suits music with bouncy rhythms, short notes and clear accents.","It sits close to Allegro or Vivace. A fast piece with long, smooth notes can be fast without being lively."],"use":"Pair lively with a bpm estimate and the rhythms that create the energy, such as short detached notes, dotted rhythms or syncopation in a named instrument. Then link it to a mood (joyful, excited) or to a style such as a dance.","listen":["Listen for a fast pulse together with bouncy, short rhythms.","Check whether the accompaniment pushes forward with off-beats or a strong backbeat."],"example":"The chorus moves at a **lively** tempo of about 130 bpm, and the staccato synth chords on the off-beats make it feel buoyant and ready to dance to.","quote":[{"text":"the tempo is 128 bpm which is a lively and quick tempo","source":"HSC 2025"}]},"Speed (tempo)>quick":{"what":["Quick means fast. In HSC answers it describes the overall tempo, but also how fast individual events happen, such as notes that alternate quickly or chords that change quickly.","That second use matters: a piece can have a moderate beat with quick note values on top, and saying so shows you can tell the two apart."],"use":"Say exactly what is quick: the tempo, the note values or the rate of chord change (harmonic rhythm). Name the instrument, for example 'quick alternating semiquavers in the marimba', and link it to excitement, agitation or virtuosity.","listen":["Separate the beat from the notes: is the beat quick, or only the notes over it?","Listen for quick alternation between two notes, which often sounds like shimmering."],"example":"Over a moderate crotchet pulse the flute plays **quick** alternating semiquavers, which make the texture shimmer and give the passage a nervous energy.","quote":[{"text":"the notes alternate quickly","source":"HSC 2024"},{"text":"a lively and quick tempo","source":"HSC 2025"}]},"Speed (tempo)>rapid":{"what":["Rapid means very fast. It is most often used for note values and passages rather than the tempo marking: rapid notes, rapid scalic runs, rapid repeated notes.","It is a step up from quick. Use it when the notes are fast enough to blur together or to sound virtuosic."],"use":"Pair rapid with the note value (semiquavers, demisemiquavers, sextuplets) and the instrument playing it. Link it to tension, excitement or a display of technique, and contrast it with any slower material around it.","listen":["Listen for runs and repeated notes too fast to count one by one.","Notice whether the rapid notes come in short bursts (fragments) or keep going."],"example":"Short fragments of **rapid** semiquaver runs in the violins break through the sustained brass chords and unsettle an otherwise stately texture.","quote":[{"text":"Fragments of rapid-paced rhythm at first","source":"Trial 2007"},{"text":"rapid notes","source":"Trial 2019"}]},"Speed (tempo)>slow":{"what":["Slow describes a tempo with few beats per minute, roughly under 70 bpm. Italian terms in this range include Largo, Lento and Adagio.","A slow tempo does not mean nothing is happening. Faster note values can move inside a slow beat, so the music is slow but still flows."],"use":"State the tempo, then describe what moves within it, such as 'a slow tempo with a flowing quaver accompaniment'. Link slowness to mood (calm, solemn, grieving) and say whether the pulse is clear or vague.","listen":["Count the beat: slow music has long gaps between beats.","Listen for whether the accompaniment moves faster than the beat to keep things flowing."],"example":"The movement begins at a **slow** tempo in 4/4, but the cello's steady quaver line keeps it moving and stops the long melody notes from sounding static.","quote":[{"text":"commences in 4/4 time at a slow tempo","source":"HSC 2022"},{"text":"A slow tempo but with movement","source":"Trial 2025"}]},"Speed (tempo)>fast":{"what":["Fast describes a tempo with many beats per minute, roughly over 120 bpm. Italian terms in this range include Allegro, Vivace and Presto.","Fast is a starting word. Strong answers refine it ('very fast', 'fast and light') or support it with a bpm or an Italian term."],"use":"Say how fast and back it up with evidence. Then link the speed to its effect, such as excitement, urgency or lightness, and to the demands it puts on a named performer.","listen":["Tap along: if your taps feel hurried, the tempo is fast.","Listen for how the tempo affects articulation, since fast music often uses short, light notes."],"example":"The piece begins at a very **fast** tempo, and the light staccato quavers in the woodwind make the music sound nimble and full of energy.","quote":[{"text":"begins at a very fast tempo","source":"HSC 2016"},{"text":"Allegro Leggierissimo, fast and light as possible","source":"Trial 2025"}]},"Duration>Tempo change":{"what":["These words describe a change of tempo during the excerpt. A change can be gradual (over several bars) or sudden.","At HSC, also listen for a felt change: the beat stays the same but shorter note values make the music sound faster. This is called rhythmic acceleration."],"use":"Say where the change happens, whether it is gradual or sudden and what it does to the structure or mood, such as building towards a climax or winding down to an ending. Add the Italian term if you know it.","listen":["Tap the beat and notice when your taps need to speed up or slow down.","Listen for shorter or longer note values that change the sense of speed without changing the beat."],"example":"Towards the climax the music **gets faster** through a gradual accelerando, while the drum part adds its own **acceleration** by moving from quavers to semiquavers."},"Tempo change>getting faster":{"what":["Getting faster is the plain English for accelerando. The beat itself speeds up, so you have to tap faster to keep up.","It is usually gradual. A sudden jump to a faster speed is better described as a change of tempo or a new tempo marking."],"use":"Say where the music gets faster, how gradually and which parts lead it. Link it to tension, excitement or a build towards a climax, and mention any dynamics or texture changes that happen with it (a crescendo often does).","listen":["Keep tapping: if your taps fall behind the music, it is getting faster.","Listen for a crescendo or a thickening texture at the same time."],"example":"In the final section the ensemble is **getting faster** as it grows louder, and the combined accelerando and crescendo push the music towards the last chord.","quote":[{"text":"creating tension as they get faster","source":"HSC 2019"}]},"Tempo change>acceleration":{"what":["Acceleration means the music feels faster. It can be a real tempo change (accelerando) or a rhythmic acceleration, where the beat stays the same but the note values get shorter: crotchets, then quavers, then triplets, then semiquavers.","Rhythmic acceleration is a strong HSC point because it shows you can tell the pulse apart from the surface rhythm."],"use":"Make clear which kind you mean. For rhythmic acceleration, list the note values in order and name the instrument, then link it to rising intensity or to the approach of a new section.","listen":["Tap the beat: if your tapping stays the same while the notes get busier, it is rhythmic acceleration.","Listen for each new phrase or layer using shorter notes than the one before."],"example":"The drum part creates a **rhythmic acceleration**, moving from crotchets to quavers and then to semiquavers over an unchanging pulse, which builds intensity into the chorus.","fig":[{"file":"rm_s6_duration_acceleration.png","caption":"Rhythmic acceleration: the beat stays at 100 bpm, but each bar uses shorter notes, so the music feels faster"}],"quote":[{"text":"a sense of acceleration by gradually introducing shorter note values","source":"HSC 2020"},{"text":"rhythmic acceleration","source":"HSC 2024"}]},"Tempo change>slowing":{"what":["Slowing is the plain English for ritardando or rallentando. The beat gets gradually slower, so your tapping has to stretch out.","It often comes with a diminuendo and is common at cadences, at endings and at the end of a section before something new starts."],"use":"Say where the slowing happens and what it signals: the end of a phrase, a section or the whole piece. Mention what happens with it, such as the dynamics fading or the texture thinning, and whether the first tempo returns (a tempo).","listen":["Listen for the beat stretching out near a cadence or the ending.","Check whether the music also becomes softer and thinner."],"example":"In the final bars the music gradually **slows** and fades, so the piece winds down gently instead of stopping abruptly.","fig":[{"file":"ex_accel_rit.png","caption":"Tempo changes written into the music: accel. means gradually faster, rit. means gradually slower"}],"quote":[{"text":"Music gradually slows down and quietens","source":"Trial 2008"}]},"Duration>Tempo and rhythmic terms (Italian)":{"what":["These are the Italian terms written in scores to tell performers the speed, the character and how strictly to keep time. Some name a speed (Allegro, Lento), some a mood (maestoso, grazioso) and some a way of handling time (rubato, senza misura).","The right term, with a translation, is a quick way to show precise knowledge in an HSC answer."],"use":"Use an Italian term when you can hear that it fits or can see it in the score, and translate it in brackets. Then explain the effect. One accurate term linked to its effect is worth more than three guesses.","listen":["Decide the speed first, then the character (light, majestic, graceful).","Listen for whether the timing is strict or flexible."],"example":"The opening is **Lento maestoso** (slow and majestic), with broad brass chords that match its stately character, before the music breaks into a light **Allegro**."},"Tempo and rhythmic terms (Italian)>rubato":{"what":["Rubato (Italian for 'robbed') means the performer bends the tempo, pressing forward in some places and holding back in others, to shape a phrase. Time taken in one place is often given back in another.","It is an expressive choice rather than a written tempo change, and is strongly linked to Romantic piano music, solo singing and expressive ballads."],"use":"Say who uses rubato and where (phrase endings, the high point of a melody). Link it to expression: it makes the music sound personal, spontaneous or emotional. If the accompaniment keeps strict time while the melody floats, say so.","listen":["Try tapping a steady beat: with rubato your taps keep drifting away from the music.","Listen for a note held slightly longer at the top of a phrase, followed by a catch-up."],"example":"The pianist uses generous **rubato**, lingering on the highest note of each phrase before pressing on, which gives the melody a free, speech-like expressiveness.","quote":[{"text":"use of heavy rubato","source":"HSC 2019"},{"text":"Rhythmic 'push and pull' (rubato)","source":"HSC 2021"}]},"Tempo and rhythmic terms (Italian)>senza misura":{"what":["Senza misura means 'without measure'. The music has no regular beat or bar structure, so the performer decides how long each note and pause lasts.","It is often written with no time signature and few or no bar lines. It differs from rubato: with rubato a pulse exists and is stretched, but with senza misura there is no pulse to stretch."],"use":"Use it for free introductions, cadenzas, recitative-like solos and improvised passages. Name the instrument and say how it contrasts with any measured section that follows. Link it to a free, improvised or timeless effect.","listen":["Try to tap a beat: if you cannot find one at all, it may be senza misura.","Listen for held notes and pauses of uneven length."],"example":"The excerpt opens with a solo flute **senza misura**, with no clear pulse, before the strings enter in strict 3/4 and establish a regular metre.","fig":[{"file":"rm_s4_dur_free_rhythm.png","caption":"Free rhythm written down: no time signature and no bar lines, so the performer shapes the timing"}],"quote":[{"text":"performed senza misura (without measure)","source":"HSC 2022"}]},"Tempo and rhythmic terms (Italian)>metric modulation":{"what":["Metric modulation is a planned tempo change in which a note length from the old tempo becomes a different note value in the new one. For example, a triplet crotchet at 80 bpm lasts exactly as long as a crotchet at 120 bpm, so the new beat grows straight out of the old rhythm.","Because one length stays the same across the change, the shift sounds connected rather than abrupt."],"use":"Say what stays the same (the shared note length) and what changes (the speed of the beat or the metre). It appears in 20th-century and contemporary art music, film scores and some jazz and progressive rock. Link it to a smooth but surprising shift in momentum.","listen":["Listen for a rhythm in the old section (often triplets) that turns into the new beat.","Notice a tempo change that still feels linked to what came before."],"example":"A **metric modulation** joins the two sections, as the triplet quavers of the first become the plain quavers of the second, so the tempo rises without any break in continuity.","quote":[{"text":"Metric modulation keeps a commonality in tempo","source":"Trial 2024"}]},"Tempo and rhythmic terms (Italian)>Allegro / Allegretto grazioso / Allegro Vivace / Leggierissimo":{"what":["Allegro means fast and bright. Allegretto is a little slower than Allegro. Grazioso means gracefully, Vivace means lively (so Allegro Vivace is fast and lively) and Leggierissimo means as lightly as possible.","They are often combined: the first word gives the speed and the second gives the character."],"use":"Translate the marking, then show how the performers create it: very light staccato for leggierissimo, smooth elegant phrasing for grazioso, crisp accents for vivace. Link the character to the mood of the excerpt.","listen":["Decide the speed first: Allegro is clearly fast, Allegretto only moderately fast.","Listen to how light or graceful the articulation is."],"example":"The movement is marked **Allegretto grazioso**, and the strings' lightly detached quavers and gently shaped phrases give it an elegant, unhurried charm."},"Tempo and rhythmic terms (Italian)>Maestoso / Lento maestoso / Lento":{"what":["Maestoso means majestically: broad, stately and dignified. Lento means slow. Lento maestoso combines them, slowly and majestically.","Maestoso is about character as much as speed. It usually brings a moderate to slow tempo, firm accents and a full, weighty sound."],"use":"Translate the term, then point to the features that create the majesty: full brass, strong dotted rhythms, sustained chords and a firm, regular pulse. It suits ceremonial openings, anthems and grand endings.","listen":["Listen for broad beats with real weight on each one.","Notice full brass and timpani, often with dotted rhythms."],"example":"The final section is **Maestoso**, and the dotted brass rhythms and sustained chords over a firm timpani pulse give the ending a grand, ceremonial weight.","quote":[{"text":"Maestoso (majestically)","source":"HSC 2022"},{"text":"Lento maestoso, slowly and majestically","source":"Trial 2024"}]},"Tempo and rhythmic terms (Italian)>moto perpetuo":{"what":["Moto perpetuo (Italian for 'perpetual motion') describes music built on a continuous stream of fast notes of the same value, usually semiquavers, with almost no rests or long notes.","It can describe a whole piece (some virtuoso violin pieces carry the title) or just one passage or accompaniment figure."],"use":"Name the instrument and note value, and say how long the motion lasts. Link it to momentum, energy and virtuosity, and point out anything that interrupts or contrasts with it, such as sustained notes in another part.","listen":["Listen for one part that never seems to stop or take a breath.","Check that its note values stay even and fast the whole way through."],"example":"The piano accompaniment runs in **moto perpetuo** semiquavers for the whole section, and this gives the music an unstoppable momentum beneath the slower vocal line.","fig":[{"file":"rm_s6_duration_moto_perpetuo.png","caption":"Moto perpetuo: an unbroken stream of semiquavers with no rests or long notes"}],"quote":[{"text":"a 'moto perpetuo' style","source":"Trial 2025"}]},"Tempo and rhythmic terms (Italian)>accelerando / ritardando / ritenuto / rallentando / animando":{"what":["Accelerando (accel.) means gradually getting faster. Ritardando (rit.) and rallentando (rall.) both mean gradually slowing down. Ritenuto (riten.) means held back, usually an immediate slowing rather than a gradual one. Animando means becoming more animated, which usually brings a faster tempo too.","Poco (a little) and molto (a lot) show how big the change is."],"use":"Name the term, say exactly where it happens (a bar number, the end of a phrase) and how big the change is. Link it to structure (a phrase ending, a transition) or to building and releasing tension.","listen":["Tap the beat and feel whether it speeds up, slows gradually or pulls back at once.","Listen for a return to the original speed afterwards (a tempo)."],"example":"A sudden **ritenuto** at the end of the phrase holds the music back on the dominant chord, so the return to the original tempo for the main theme feels like a fresh start.","fig":[{"file":"ex_accel_rit.png","caption":"Tempo changes written into the music: accel. means gradually faster, rit. means gradually slower"}],"quote":[{"text":"accelerando/ritardando","source":"HSC 2017"},{"text":"a significant ritenuto in bar 32","source":"HSC 2025"},{"text":"poco accel, animando and molto rall","source":"HSC 2022"}]},"Duration>Metre and metre changes":{"what":["Metre is how beats are grouped into bars. Duple has two beats, triple three and quadruple four. Simple metres split each beat into two; compound metres split each beat into three.","Many HSC excerpts change metre, so you also need words for that: changing, mixed and multimetric."],"use":"Name the metre in full (simple triple, compound duple) and give the time signature if you can. Then say whether it stays the same or changes, and link any changes to unpredictability, variety or drive.","listen":["Find the strong beat and count how many beats until the next one.","Listen to how each beat divides: into twos (simple) or threes (compound)."],"example":"The excerpt opens in **simple quadruple** metre, but **changing metre** in the bridge (bars of 3/4 and 5/4) unsettles the pulse before the chorus returns to a steady 4/4."},"Metre and metre changes>simple triple":{"what":["Simple triple metre has three beats in each bar, and each beat divides into two equal halves. The most common time signature is 3/4 (three crotchet beats), but 3/8 and 3/2 are also simple triple.","It gives a strong-weak-weak pattern. The waltz and the minuet are both in simple triple."],"use":"Give the full name rather than just 'triple', and the time signature if you know it. Link it to a dance feel (waltz, minuet) and say whether the triple feel is clear or disguised by syncopation or hemiola.","listen":["Count 1-2-3 and check that 1 is the strongest beat.","Listen to the beat divisions: in simple triple each beat splits into two quavers."],"example":"The waltz is in **simple triple** metre, with the bass on beat 1 and chords on beats 2 and 3 giving a clear strong-weak-weak swing.","fig":[{"file":"ex_34_quavers.png","caption":"3/4 holds six quavers grouped in three pairs: three beats, each split into two"}],"quote":[{"text":"shifting from simple triple to compound duple","source":"Trial 2024"}]},"Metre and metre changes>triple / duple / quadruple":{"what":["These words give the number of beats in a bar. Duple is two (2/4, 6/8), triple is three (3/4, 9/8) and quadruple is four (4/4, 12/8).","On its own the word does not tell you how each beat divides, so add simple or compound. 6/8 is compound duple, not triple, because its six quavers group into two dotted-crotchet beats."],"use":"Use the full name (simple quadruple, compound duple). Say which parts make the metre clear, such as an ostinato or a bass drum on the strong beats, and whether anything disguises it.","listen":["Count the beats from one strong beat to the next.","Be careful with 6/8: it usually sounds like two big beats, not six."],"example":"The bass and kick drum land firmly on beat 1 of every bar, which makes the **duple** metre of the 2/4 verse very clear.","fig":[{"file":"ts_24.png","caption":"2/4: two crotchet beats per bar (simple duple)"},{"file":"ts_34.png","caption":"3/4: three crotchet beats per bar (simple triple)"},{"file":"ts_44.png","caption":"4/4: four crotchet beats per bar (simple quadruple)"}],"quote":[{"text":"to further disguise the triple metre","source":"HSC 2023"},{"text":"a strong duple 6/8 type rhythm","source":"HSC 2023"},{"text":"Timpani ostinato gives strong quadruple metre","source":"Trial 2007"}]},"Metre and metre changes>compound":{"what":["In compound metre each beat is a dotted note that divides into three. 6/8 has two dotted-crotchet beats of three quavers each, so it is compound duple. 9/8 is compound triple and 12/8 is compound quadruple.","Compound metre has a rolling, lilting feel, often heard as crotchet-quaver patterns."],"use":"Name it in full (compound duple) and describe the rhythms that show it, such as crotchet-quaver patterns or groups of three quavers. Link it to a lilting, rocking or dance-like character, as in jigs and many lullabies.","listen":["Count the big beats, then check whether each one splits into three ('1-and-a').","Listen for long-short crotchet-quaver patterns."],"example":"The melody is in **compound** duple time, and its crotchet-quaver patterns give the song a gentle rocking motion, like a lullaby.","fig":[{"file":"rm_s4_dur_compound_beat.png","caption":"Compound time: each dotted-crotchet beat splits into three quavers, counted 1-&-a 2-&-a"}],"quote":[{"text":"in compound duple time... crotchets and quavers","source":"Trial 2023"}]},"Metre and metre changes>multimetric":{"what":["Multimetric music uses several different time signatures that change often. It is close to mixed metre and changing metre, but usually describes a whole piece or section built around frequent changes.","It is common in 20th-century art music, progressive rock and some folk music from Eastern Europe and the Balkans."],"use":"Give examples of the time signatures you hear or see, and say how often they change. Link the changes to variety, unpredictability or a feeling that the music resists a regular pulse.","listen":["Try counting the same number of beats in every bar: if it keeps failing, the music may be multimetric.","Listen for accents arriving at irregular distances apart."],"example":"The section is **multimetric**, moving between 5/8, 7/8 and 3/4, so the accents never settle into a pattern and the music feels restless.","quote":[{"text":"Multimetric changes create variety","source":"HSC 2025"},{"text":"many alterations of metre","source":"Trial 2019"}]},"Metre and metre changes>mixed metre":{"what":["Mixed metre means bars of different lengths follow each other, so the time signature keeps changing. For example, a bar of 3/4 might be followed by 4/4 and then 2/4.","Some writers also use mixed metre for time signatures such as 7/8 that combine groups of 2 and 3 (2+2+3)."],"use":"Name the time signatures in order if you can, and where each change happens. Link mixed metre to irregular phrase lengths, surprise or the natural rhythm of the words in a song.","listen":["Count each bar from its strong beat: some bars will be longer or shorter than others.","Listen for phrases that do not fit into equal-sized bars."],"example":"The composer uses **mixed metre**, adding a 2/4 bar at the end of each 4/4 phrase, so the vocal line follows the natural rhythm of the lyrics.","fig":[{"file":"s5_mixed_metre.png","caption":"Mixed metre: 4/4, then 3/4, then 2/4, then back to 4/4"}],"quote":[{"text":"use of mixed metre: 3/4 at the start to 4/4... then 2/4","source":"HSC 2017"}]},"Metre and metre changes>changing metre":{"what":["Changing metre means the time signature changes during the piece. It can be a single change between sections (4/4 in the verse, 6/8 in the bridge) or frequent changes from bar to bar.","Rapid changes make the pulse harder to follow. A single change usually marks a new part of the structure."],"use":"Say whether the changes are frequent or occasional, and where they happen. Link occasional changes to structure (a new section) and frequent ones to unpredictability or tension. Mention any part that keeps a steady pulse through the changes.","listen":["Listen for the strong beat arriving earlier or later than you expect.","Notice whether a new section brings a new grouping of beats."],"example":"The **changing metre** in the bridge, with 3/4 bars slipped between the 4/4 bars, makes the downbeat arrive early and unsettles the listener before the final chorus.","quote":[{"text":"Rapid change in metre","source":"HSC 2020"},{"text":"despite the changing metre","source":"HSC 2019"}]},"Duration>Steadiness / regularity":{"what":["These words describe music where the pulse or a rhythmic pattern stays the same over time. They are useful for accompaniments, ostinatos and grooves.","Each has its own shade. Steady and regular describe the pulse, constant and continuous describe an unbroken stream of notes and pervasive describes an idea that turns up everywhere."],"use":"Say what is steady (the pulse, the note values, a motif or the harmonic rhythm), which part provides it and for how long. Steadiness is most useful as a contrast, such as a steady bass under a syncopated melody.","listen":["Listen for a part that never changes its rhythm.","Notice whether that steadiness anchors freer parts around it."],"example":"A **steady** crotchet pulse in the bass and a **constant** quaver pattern in the hi-hat hold the groove together while the vocal line is freely syncopated."},"Steadiness / regularity>pervasive":{"what":["Pervasive means spreading through everything. A pervasive rhythm or motif keeps appearing throughout the excerpt, often in different instruments and registers.","It is stronger than 'repeated': it suggests the idea is woven through all the parts and holds the piece together."],"use":"Name the idea (for example a dotted quaver motif), then show that it turns up in several places: different instruments, sections or registers. Link it to unity and to the music's identity.","listen":["Pick out a short rhythmic idea and listen for it coming back in other parts.","Notice whether the idea is passed around the ensemble."],"example":"The short-short-long motif is **pervasive**, passing from the clarinets to the horns and finally the double basses, which unifies the whole movement.","quote":[{"text":"The main quaver motif is pervasive","source":"Trial 2019"}]},"Steadiness / regularity>even":{"what":["Even means equal. Even rhythms use notes of the same length, such as a run of straight quavers, rather than long-short patterns like dotted rhythms or swing.","It can also describe how often something changes. Even harmonic rhythm means the chords change at regular intervals, for example once every bar."],"use":"Say what is even: the note values, quavers that are not swung or the harmonic rhythm. It works well as a contrast, such as even quavers in the strings against dotted rhythms in the brass. Link it to stability or smoothness.","listen":["Listen for notes that all seem the same length.","Count how often the chords change and check whether it is regular."],"example":"The accompaniment's **even** quavers contrast with the dotted rhythms of the melody, so the tune stands out clearly against a smooth background.","quote":[{"text":"even harmonic rhythm","source":"HSC 2018"}]},"Steadiness / regularity>balanced":{"what":["Balanced describes phrases or rhythmic patterns of equal length that match each other, such as a 2-bar idea answered by another 2-bar idea.","Balanced phrases make music sound orderly and predictable. They are common in Classical music and in pop songs built on 4- and 8-bar phrases."],"use":"Give the phrase lengths (2 + 2 bars, 4 + 4 bars) and say which part or section has them. Link balance to order or a question-and-answer feel, and point out any unbalanced phrase that breaks the pattern.","listen":["Count the bars in each phrase and compare them.","Listen for one phrase that seems to answer the one before it."],"example":"The melody is built from **balanced** 4-bar phrases, each answered by a similar 4-bar phrase, which gives the opening a clear and orderly shape.","quote":[{"text":"2-bar balanced syncopated ascending patterns","source":"Trial 2007"}]},"Steadiness / regularity>maintained":{"what":["Maintained means kept going without change. It usually describes a tempo, pulse or pattern that stays the same while other things around it change.","It is most useful when other elements are changing, because it shows you noticed what stays the same as well as what changes."],"use":"Say what is maintained, for how long and despite what (new instruments, a key change, louder dynamics). Link it to unity, stability or continuity across sections.","listen":["Compare the start and end of the excerpt: is the speed the same?","Notice a pattern that carries on while other parts change."],"example":"Although the texture thins and the key changes, the tempo is **maintained** throughout, so the new section still feels connected to the first.","quote":[{"text":"a similar tempo is maintained throughout","source":"HSC 2019"}]},"Steadiness / regularity>consistent":{"what":["Consistent means reliably the same. A consistent rhythm or pulse feel keeps its character through the excerpt.","It is close to steady and constant, but it suggests the overall feel stays the same even if small details vary."],"use":"Say what is consistent (a pulse feel, a groove, a rhythmic pattern) and which part creates it. Link it to stability and to a foundation for the other parts, especially when the melody is more varied.","listen":["Listen for a groove that keeps its character.","Check whether the metre feel is the same at the end as at the start."],"example":"The bass repeats a **consistent** pattern of crotchet, two quavers, crotchet in every bar, which grounds the more irregular rhythms of the guitar riff.","quote":[{"text":"establishes a consistent rhythm","source":"HSC 2019"},{"text":"a consistent quadruple pulse feel","source":"Trial 2025"}]},"Steadiness / regularity>constant":{"what":["Constant means unchanging and never stopping. A constant semiquaver pattern or constant quaver pulse runs without rests and keeps the same note value.","Use it for a part that never lets up, such as a busy accompaniment figure or a hi-hat pattern."],"use":"Name the note value and the instrument, and say how long it lasts. Link constant motion to drive, tension or momentum, and contrast it with any part that moves more slowly.","listen":["Listen for one part that never pauses.","Check that its note values stay the same."],"example":"The **constant** semiquavers in the second violins push the music forward beneath the long held notes of the horn melody.","fig":[{"file":"rm_s6_duration_moto_perpetuo.png","caption":"Moto perpetuo: an unbroken stream of semiquavers with no rests or long notes"}],"quote":[{"text":"the constant semiquaver pattern","source":"HSC 2017"},{"text":"Constant quaver pulse throughout","source":"HSC 2023"}]},"Steadiness / regularity>continuous":{"what":["Continuous means going on without gaps. Continuous semiquaver passages or a continuous pulse run on with no rests, held notes or breaks.","It is very close to constant. Continuous stresses the lack of breaks; constant stresses that nothing changes."],"use":"Say which part is continuous, its note value and how long it lasts. Link it to flow, momentum or a moto perpetuo character, and mention whatever finally interrupts it.","listen":["Listen for a line with no rests or breaths.","Notice the moment the continuous motion stops, because that is often a structural point."],"example":"The harp plays **continuous** broken-chord semiquavers throughout the verse, a flowing background that only stops at the cadence.","quote":[{"text":"continuous steady pulse","source":"Trial 2021"},{"text":"Continuous semiquaver passages","source":"Trial 2025"}]},"Steadiness / regularity>regular":{"what":["Regular means recurring at equal time intervals. A regular pulse has evenly spaced beats, and a regular pattern repeats the same way each time.","Its opposite is irregular: uneven bar lengths or accents at unpredictable points."],"use":"Say what is regular and name the instrument. It is especially useful as a contrast, so say whether metre changes or syncopation disrupt the regular pulse.","listen":["Tap along and see whether your taps stay in step.","Notice whether the accents fall at the same point in every bar."],"example":"The **regular** crotchet pulse in the bass is broken up in the middle section by syncopated accents, so its return at the end feels settled.","fig":[{"file":"metronome.jpg","caption":"A metronome clicks a perfectly regular beat at the bpm you set"}],"quote":[{"text":"Changes in time signature that prevent a regular pulse","source":"HSC 2024"},{"text":"the regular crotchet pulse","source":"Trial 2009"}]},"Steadiness / regularity>steady":{"what":["Steady describes a pulse or tempo that does not speed up or slow down. It is the basic word for a stable beat.","A steady pulse can still carry busy, syncopated or complex rhythms on top. Saying so shows you can separate the pulse from the rhythm."],"use":"Pair steady with the instrument that keeps the pulse and its note value, such as a steady crotchet bass drum. Link it to stability, a dance feel or a foundation for freer parts.","listen":["Tap along: if your taps stay with the music the whole time, the pulse is steady.","Listen for the instrument that holds the beat."],"example":"A **steady** quaver pulse in the bass guitar holds the band together while the lead guitar plays loosely around the beat.","quote":[{"text":"maintain a steady pulse","source":"HSC 2016"},{"text":"steady, rapid pulse is established","source":"Trial 2007"}]},"Duration>Irregularity / syncopation":{"what":["These words describe rhythms that go against the expected pattern of strong and weak beats: syncopation, off-beats, cross-rhythm, polyrhythm, hemiola and displacement. Uneven and ambiguous describe the overall effect.","Most of them only make sense against a steady pulse, so find the beat first, then notice what pulls against it."],"use":"Name the device precisely, the instrument playing it and what it works against (often a steady beat in another part). Link it to the effect: excitement, tension, unpredictability or a blurred sense of metre.","listen":["Tap the beat and listen for accents that miss it.","Listen for two parts that seem to be in different metres."],"example":"**Syncopated** brass accents and a three-against-two **cross-rhythm** in the piano make the pulse **ambiguous** until the drums re-enter firmly on beat 1."},"Irregularity / syncopation>polyrhythm / polyrhythmic":{"what":["A polyrhythm is two or more contrasting rhythms played at once, usually with conflicting divisions of the same time span, such as three even notes against two.","Polyrhythm and cross-rhythm overlap. Polyrhythm usually means independent layers that keep going together; cross-rhythm usually means one pattern cutting across the main beat."],"use":"Name the layers and the ratio if you can (3 against 2, 4 against 3). Polyrhythm is central to many West African and Afro-Cuban styles and to minimalism. Link it to complexity, interlocking layers or rhythmic interest.","listen":["Tap two parts separately: if they divide the same time span differently, it is polyrhythmic.","Listen for interlocking percussion patterns that never quite line up."],"example":"The percussion layers are **polyrhythmic**, with the shaker in groups of three against the drum's groups of two, which gives the texture a busy, interlocking energy.","fig":[{"file":"s5_polyrhythm.png","caption":"Polyrhythm: 3 against 2. Clap the top line with one hand and the bottom with the other"}],"quote":[{"text":"detailed use of... polyrhythm","source":"HSC 2016"},{"text":"Polyrhythmic ideas in continuous steady pulse","source":"Trial 2021"}]},"Irregularity / syncopation>uneven":{"what":["Uneven means not equal. It can describe bars of different lengths (from changing metre), phrases of irregular length or uneven beat groups such as 3 + 2 in 5/4.","It can also describe unequal note lengths, as in swung quavers, so make clear which you mean."],"use":"Say what is uneven: bar lengths, phrase lengths or beat groupings. Give an example, such as '3 + 3 + 2' or a 5-bar phrase among 4-bar phrases. Link it to unpredictability, tension or a limping, off-balance feel.","listen":["Count the beats in each bar or phrase and compare them.","Listen for beat groups of 2 and 3 mixed together."],"example":"The **uneven** grouping of 3 + 3 + 2 quavers in each bar gives the riff a lopsided, off-balance feel.","quote":[{"text":"the uneven lengths of each bar","source":"HSC 2022"}]},"Irregularity / syncopation>ambiguous":{"what":["Ambiguous means it can be heard in more than one way. A pulse or metre is ambiguous when syncopation, ties, rests or cross-rhythms hide the strong beats, so you cannot tell where beat 1 is or which metre the music is in.","It describes an effect, so always name the device that causes it."],"use":"Name the cause (syncopation, notes tied over the bar line, hemiola, missing downbeats) and the part playing it. Link the ambiguity to tension, suspense or a floating feel, and say when the metre becomes clear again.","listen":["Try tapping along: if you keep losing the beat, the metre is ambiguous.","Listen for the moment a clear downbeat finally arrives."],"example":"With nothing sounding on the downbeats and the melody tied across the bar lines, the metre is **ambiguous** until the bass enters and confirms a 3/4 pulse.","quote":[{"text":"syncopation used to make the pulse ambiguous","source":"HSC 2022"},{"text":"make the time signature ambiguous","source":"HSC 2023"}]},"Irregularity / syncopation>shifting / displaced":{"what":["Displacement moves a rhythm or motif so it starts at a different point in the bar, for example a quaver later, so its accents fall in new places. Shifting accents move around from bar to bar instead of staying on the same beats.","Both keep the idea recognisable but change how it sits against the pulse."],"use":"Say what is displaced, by how much (a quaver, a beat) and where. Link it to surprise, syncopation or the development of a motif. It is common in minimalism, jazz, funk and rock grooves.","listen":["Listen for a familiar motif that suddenly lands off the beat.","Follow the bass drum or the accents and notice whether they move around within the bar."],"example":"When the riff returns it is **displaced** by a beat, so its accented notes now fall on beats 2 and 4 and the familiar idea suddenly sounds unstable.","quote":[{"text":"the bass drum uses shifting accents","source":"HSC 2019"},{"text":"rhythmically displaced by a quaver","source":"HSC 2023"}]},"Irregularity / syncopation>cross-rhythm":{"what":["A cross-rhythm is a rhythm that conflicts with the main pulse, such as accents every three quavers in a 4/4 bar (3 + 3 + 2), or a pattern of three against a beat of two.","The main beat keeps going and the cross-rhythm pulls against it. A hemiola is one particular kind of cross-rhythm."],"use":"Name the parts involved, for example a cross-rhythm between the piano and the strings, and describe the grouping. Link it to tension, energy or rhythmic complexity.","listen":["Tap the main beat and listen for accents that cut across it.","Listen for groups of three in music that is otherwise in twos or fours."],"example":"The marimba's accents in groups of three quavers set up a **cross-rhythm** against the steady 4/4 drum pattern, which gives the groove a restless push.","fig":[{"file":"s5_cross_rhythm.png","caption":"Cross-rhythm: accents every 3 + 3 + 2 quavers pull against the steady crotchet beat underneath"}],"quote":[{"text":"Cross-rhythms created in 2nd section","source":"HSC 2019"},{"text":"a cross-rhythm between piano and strings","source":"HSC 2024"}]},"Irregularity / syncopation>off-beat":{"what":["Off-beats are the points between the main beats: the 'and' of each beat, or the weaker semiquavers within a beat. An off-beat rhythm places its notes or accents there instead of on the beat.","Off-beat chords are the basis of reggae and ska, and off-beat accents are one of the most common kinds of syncopation."],"use":"Say which instrument plays off-beat and the note value (off-beat quavers, off-beat semiquavers). Link it to a bouncy, offset or syncopated effect, and point to the on-beat part it contrasts with.","listen":["Tap the beat: off-beat notes land in the gaps between your taps.","Listen for short chops or stabs between the bass drum hits."],"example":"The guitar plays short **off-beat** chords between each crotchet of the bass, which gives the verse its bouncy, skipping feel.","fig":[{"file":"rm_s6_duration_off_beat.png","caption":"Off-beat quavers: every note falls between the crotchet beats underneath"}],"quote":[{"text":"syncopated off-beat semiquavers","source":"HSC 2019"}]},"Irregularity / syncopation>syncopated":{"what":["Syncopation moves the accent from strong beats to weak beats or off-beats, often by starting a long note between beats or tying a note across the beat.","A syncopated part only sounds syncopated against a sense of the steady beat, so listen for both."],"use":"Say which part is syncopated, how heavily and against what steady part. Link it to energy, groove or tension. Syncopation is central to jazz, funk, Latin music and much pop, and is also used in art music to unsettle the metre.","listen":["Listen for accents or long notes arriving just before or after the beat.","Check whether another part keeps the beat steady underneath."],"example":"The horn line is heavily **syncopated**, anticipating each downbeat by a quaver, which pushes the music forward against the steady kick drum.","fig":[{"file":"ex_syncopation.png","caption":"Syncopation: bar 2 accents the notes that fall between the beats"}],"quote":[{"text":"Heavy use of syncopation","source":"HSC 2020"},{"text":"heavily syncopated and independent","source":"Trial 2007"}]},"Irregularity / syncopation>hemiola / hemiolic":{"what":["A hemiola regroups the beats so that two bars of triple time (3 + 3) are felt as three groups of two (2 + 2 + 2), usually through long notes or accents across the bar line. The time signature does not change.","Hemiolic describes any grouping that works this way, even when it is not a full textbook hemiola."],"use":"Say where it happens (often just before a cadence) and which parts create it. Link it to a broadening of the phrase, a sense of arrival or a deliberately blurred metre. It is typical of Baroque dances but turns up in later music and Latin American styles too.","listen":["Count in 3 and notice when your counting suddenly fights the music.","Listen for minims or accents crossing the bar line before a cadence."],"example":"In the two bars before the cadence the strings play a **hemiola**, regrouping the 3/4 into three groups of two, which broadens the phrase and signals its end.","quote":[{"text":"Hemiolic rhythmic grouping","source":"HSC 2018"},{"text":"Makes use of a hemiola effect","source":"Trial 2021"}]},"Duration>Note-value character":{"what":["These words describe the note values in use: long or short, dotted or tied, tuplets such as triplets and quintuplets, and techniques that lengthen or shorten a motif (augmentation and diminution).","Precise note-value words are some of the easiest marks to earn, because they describe exactly what you hear."],"use":"Name the note values and the instrument playing them, then link them to an effect. Track how note values change across the excerpt, because a move from long notes to short (or the reverse) is often a key point.","listen":["Compare the note lengths in different parts.","Listen for groupings that do not fit evenly into the beat, which are often tuplets."],"example":"The **sustained** notes in the cellos contrast with the **dotted** rhythms of the trumpets, and the later move to **triplets** in the woodwind brings a new layer of movement."},"Note-value character>snap":{"what":["A snap rhythm (also called a Scotch snap or Lombard rhythm) is a short note on the beat followed by a longer one, usually a semiquaver then a dotted quaver. It is the reverse of a dotted rhythm.","The accent falls on the short first note, which gives a sharp, jerky kick."],"use":"Name the instrument and the note values (semiquaver then dotted quaver). Snaps are a feature of Scottish fiddle music, Baroque music and some pop vocal lines. Link the snap to a jerky, spirited or folk-like character.","listen":["Listen for a quick, clipped note right on the beat followed by a held note.","Compare it with a dotted rhythm, which is long first and short second."],"example":"The melody begins each phrase with a **snap**, a semiquaver on the beat followed by a dotted quaver, which gives the tune a sharp, folk-like kick.","quote":[{"text":"the violin I and II, which play a 'snap' rhythm","source":"HSC 2022"}]},"Note-value character>anacrusis / duplet":{"what":["An anacrusis is a note or group of notes before the first strong beat of a phrase, a pick-up that leads into the downbeat. A duplet is two equal notes in the time normally taken by three, used in compound time such as 6/8.","They go together here because a short duplet figure often leads into the next strong beat, so it works like an anacrusis."],"use":"For an anacrusis, say how long it is and that it leads into the downbeat, and link it to forward motion. For a duplet, say which compound metre it breaks and link it to a moment that sounds straighter or held back.","listen":["Listen for whether the melody starts before the strong beat.","In 6/8, listen for a beat split into two instead of three."],"example":"Each phrase begins with a crotchet **anacrusis** that leads strongly into the downbeat, and a **duplet** in the final bar briefly breaks the lilting 6/8 feel.","fig":[{"file":"s5_anacrusis.png","caption":"Anacrusis: the piece starts on beat 4; the final bar has only 3 beats"},{"file":"s5_duplet.png","caption":"Duplet in 6/8: two quavers take the time of three"}],"quote":[{"text":"Semi-quaver duplets give the effect of anacrusis patterns","source":"Trial 2007"}]},"Note-value character>quintuplet":{"what":["A quintuplet is a group of five equal notes played in the time normally taken by four of the same kind. It is written with a small 5 above or below the group.","Because five does not divide the beat neatly, quintuplets sound slightly rushed or blurred next to ordinary semiquavers."],"use":"Say which instrument plays quintuplets and what they change from (often ordinary semiquavers). Link them to rising intensity, a sense of acceleration or a free, flowing quality in runs.","listen":["Listen for a run that does not line up neatly with the beat.","Compare it with the groups of four around it: the quintuplet sounds slightly faster."],"example":"Over a steady crotchet pulse the piano's **quintuplet** runs blur the beat slightly, which gives the passage a free, rhapsodic flow.","quote":[{"text":"semiquavers that change to quintuplets","source":"HSC 2024"}]},"Note-value character>dotted":{"what":["A dot adds half the note's value. Dotted rhythms pair a dotted note with a shorter one, such as a dotted quaver and a semiquaver, to make a long-short pattern.","They range from gentle (dotted crotchet then quaver) to sharp and crisp (dotted quaver then semiquaver, or double-dotted)."],"use":"Name the exact pattern and the instrument, such as dotted quaver-semiquaver in the trumpets. Link it to a march-like, majestic, jaunty or energetic effect. Dotted rhythms are typical of marches, fanfares and French overtures.","listen":["Listen for a long-short, long-short skipping pattern.","Compare it with a snap (short-long) and with swing."],"example":"The trumpets enter with crisp **dotted** rhythms, which give the music a proud, march-like quality.","fig":[{"file":"s5_dotted.png","caption":"Dotted rhythms: dotted quaver + semiquaver (long-short), then dotted crotchet + quaver"}],"quote":[{"text":"dotted rhythms at bar 213","source":"HSC 2018"},{"text":"dotted quaver-semiquaver-pair quaver pattern","source":"HSC 2025"}]},"Note-value character>augmented / augmentation":{"what":["Augmentation repeats a melody or rhythm with its note values lengthened, usually doubled, so quavers become crotchets. The pitches and shape stay the same, but it sounds slower and broader.","It is a development technique, so it shows the composer working with an idea already heard."],"use":"Name the original motif, the instrument playing the augmented version and how much it is lengthened. Link it to development, unity and a broad, weighty or climactic effect.","listen":["Listen for a familiar idea that comes back slower in one part.","Notice it in low or heavy instruments, where it often sounds grand."],"example":"Near the climax the trombones state the opening motif in **augmentation**, in doubled note values, so the familiar idea sounds broad and powerful.","fig":[{"file":"s5_dim_aug.png","caption":"The same four-note idea in its original values, in diminution (halved) and in augmentation (doubled)"}],"quote":[{"text":"augmentation of four-note tuba motif","source":"HSC 2020"},{"text":"Augmentation of rhythm in harp","source":"Trial 2009"}]},"Note-value character>triplet":{"what":["A triplet is three equal notes played in the time normally taken by two of the same kind. It is written with a small 3 above or below the group.","In simple time, triplets bring in the three-way split of compound time, so they briefly change the rhythmic feel."],"use":"Name the instrument and the note value (triplet quavers, triplet crotchets). Link triplets to rhythmic variety, a rolling or swung feel or a contrast with straight quavers.","listen":["Listen for a beat that suddenly splits into three instead of two.","Count '1-trip-let' along with it."],"example":"The bass moves from straight quavers to **triplet** quavers in the bridge, which loosens the groove and gives the section a rolling feel.","fig":[{"file":"s5_triplets.png","caption":"Triplets: the small 3 and bracket show three notes in the time of two"}],"quote":[{"text":"Rhythmic variety is created by using new triplets","source":"HSC 2018"}]},"Note-value character>diminution":{"what":["Diminution repeats a melody or rhythm with its note values shortened, usually halved, so crotchets become quavers. The shape stays the same, but it sounds faster and more urgent.","It is the opposite of augmentation and is another development technique."],"use":"Name the motif, the instrument and how much it is shortened. Link it to urgency, momentum or excitement, often in a build-up or a development section.","listen":["Listen for a familiar idea that returns quicker and more compressed.","Notice whether it is used to build excitement towards a climax."],"example":"The motif returns in **diminution** in the woodwind, in quavers instead of crotchets, which adds momentum heading into the final section.","fig":[{"file":"s5_dim_aug.png","caption":"The same four-note idea in its original values, in diminution (halved) and in augmentation (doubled)"}],"quote":[{"text":"Diversity of rhythmic motifs and use of diminution","source":"HSC 2024"}]},"Note-value character>sextuplet":{"what":["A sextuplet is a group of six equal notes played in the time normally taken by four of the same kind, often six semiquavers in one crotchet beat. It is written with a small 6.","It sounds like two fast triplets in a row, so it is faster and smoother than ordinary semiquavers."],"use":"Name the instrument and what the sextuplets replace. Link them to flowing, rippling movement, more activity or virtuosity, especially in piano and harp writing.","listen":["Listen for very fast runs that split the beat into a rippling stream.","Compare them with the groups around them: sextuplets feel smoother and faster than semiquavers."],"example":"The harp's **sextuplet** arpeggios ripple across each beat and give the accompaniment a shimmering, liquid quality.","quote":[{"text":"Introduction of sextuplet groupings","source":"HSC 2025"}]},"Note-value character>tied":{"what":["A tie is a curved line joining two notes of the same pitch, so they are played as one note lasting their combined value. Ties hold a note across a bar line or across a beat.","Tying a note over the beat removes the attack on that beat, which creates syncopation."],"use":"Say what is tied and where (over the beat, across the bar line). Link ties to syncopation, a held-back feel or long sustained notes such as a pedal note.","listen":["Listen for a note that starts off the beat and is held through the next beat.","Notice long held notes that carry across the bar lines."],"example":"The melody's **tied** notes across the bar lines remove the downbeat accents, so the line seems to float above the steady accompaniment.","fig":[{"file":"rm_s6_duration_tied_over_beat.png","caption":"Notes tied over the beat: nothing new is played on beats 3 or 1, so the accent moves off the beat"}],"quote":[{"text":"dotted quavers tied over the beat","source":"Trial 2021"},{"text":"tied note durations like a pedal note","source":"Trial 2019"}]},"Note-value character>short / shorter":{"what":["Short refers to brief note values (quavers, semiquavers or shorter) or to notes played detached. Shorter describes change: a move to shorter note values makes the music feel busier and faster even when the tempo stays the same.","Make clear whether you mean the written length or the articulation (staccato)."],"use":"Name the note values and the instrument, and say whether they get shorter over time. Link short notes to energy, lightness or urgency, and shorter values to rhythmic acceleration.","listen":["Listen for detached, clipped notes.","Compare sections: does the rhythm become busier?"],"example":"The second section uses **shorter** note values, with semiquavers replacing the quavers of the opening, which raises the energy without any change of tempo.","quote":[{"text":"shorter note values","source":"HSC 2019"},{"text":"Mostly short note values","source":"HSC 2023"}]},"Note-value character>long / sustained":{"what":["Long or sustained notes are held for a long time, such as minims, semibreves or tied notes. They often end phrases, form pedal notes or sit as held chords under a moving melody.","Sustained also suggests the sound is kept alive, by the bow, the breath or the sustain pedal."],"use":"Name the instrument and what the long notes do: end phrases, form a pedal point or support a busier melody. Link them to calm, stability, tension (a long held pedal) or a contrast with faster parts.","listen":["Listen for notes held under or around faster moving parts.","Notice where the held notes come: at phrase endings or underneath a whole section."],"example":"The cellos hold **sustained** notes beneath the busy violin figures, which anchors the harmony and gives the texture a calm foundation.","quote":[{"text":"Longer held notes... at the ends of phrases","source":"HSC 2017"},{"text":"Sustained long sounds (pedal point)","source":"HSC 2025"}]},"Duration>Drive / momentum":{"what":["These words describe rhythm that pushes forward and keeps the music moving. Drive usually comes from steady, busy note values (driving quavers, relentless semiquavers), ostinatos and repeated patterns.","They describe an effect, so always point to the rhythms that cause it."],"use":"Name the part providing the drive, its note values and how long it lasts. Link it to energy, tension or excitement, and to other elements such as dynamics (a crescendo) or texture (layers added).","listen":["Listen for the part that never stops moving.","Notice whether the drive builds through added layers or shorter note values."],"example":"The **driving** quaver pulse in the bass and the **relentless** semiquavers in the strings give the music unstoppable **momentum** towards the climax."},"Drive / momentum>boisterous / energetic":{"what":["Boisterous means rowdy, noisy and high-spirited. Energetic means full of energy. Both describe the overall character of the rhythm and the performance: a fast tempo, strong accents, loud dynamics and busy rhythms.","Boisterous suggests a slightly unruly, rough-and-tumble energy."],"use":"Back them up with evidence: tempo, accents, syncopation, loud dynamics and a full texture. Link them to a celebratory, playful or wild mood.","listen":["Listen for loud, accented, busy rhythms.","Notice whether the energy feels controlled or a little wild."],"example":"The full ensemble's accented syncopations and fast tempo make the final section **boisterous** and celebratory.","quote":[{"text":"boisterous and energetic","source":"Trial 2021"}]},"Drive / momentum>relentless":{"what":["Relentless describes a rhythm that keeps going without a break or a change, so it feels unstoppable and intense. Constant semiquavers or a driving ostinato are often relentless.","It is stronger than constant, because it adds a feeling of pressure."],"use":"Name the part and its note values. Link the relentless rhythm to tension, anxiety or excitement, and mention anything else that builds the pressure (a crescendo, rising pitch).","listen":["Listen for a rhythmic pattern that never gives way.","Notice whether it makes the music feel tense or urgent."],"example":"The **relentless** quaver ostinato in the low strings runs through the entire section and builds tension until it finally breaks off at the climax.","quote":[{"text":"The accompanying semiquavers are relentless","source":"HSC 2023"}]},"Drive / momentum>busy":{"what":["Busy describes rhythm with a lot going on: many short notes, many rhythmic layers or several parts moving at once.","It links duration to texture, since busy rhythms often make a thick, active texture."],"use":"Say which parts are busy and with what note values. Link busyness to energy, excitement or a crowded soundscape, and contrast it with slower parts or sections.","listen":["Listen for many short notes or many layers moving at once.","Compare it with any slower, simpler sections."],"example":"The percussion becomes increasingly **busy**, layering semiquaver patterns over the groove, which thickens the texture and lifts the energy into the chorus.","quote":[{"text":"create a busy soundscape","source":"HSC 2025"},{"text":"more rhythmically busy accompaniment layers","source":"Trial 2009"}]},"Drive / momentum>propelling":{"what":["Propelling means pushing forward. A propelling note or rhythm drives the music strongly into the next beat or phrase, for example an anacrusis, a syncopated push or an extra note added just before the downbeat.","It describes the forward motion of a specific moment."],"use":"Point to the exact note or rhythm that propels the music and say where it leads. Link it to forward motion, anticipation or energy.","listen":["Listen for a short note or figure leading hard into a downbeat.","Notice anticipations, where a note arrives just before the beat."],"example":"A quick semiquaver pick-up before each downbeat **propels** the melody into the next bar.","quote":[{"text":"the addition of a G propels the rhythm forward","source":"HSC 2024"}]},"Drive / momentum>perpetual":{"what":["Perpetual means continuous and never-ending. Perpetual motion is a rhythm of continuous even notes that never stops, like a machine.","It is the English for moto perpetuo."],"use":"Name the part, its note values and how long the motion lasts. Link it to momentum, virtuosity or a mechanical effect, and point out how other parts contrast with it.","listen":["Listen for a part that seems to run without any break.","Notice whether it sounds mechanical or exciting."],"example":"The marimba's **perpetual** semiquaver motion runs under the whole excerpt and gives the music a mechanical, ticking quality.","fig":[{"file":"rm_s6_duration_moto_perpetuo.png","caption":"Moto perpetuo: an unbroken stream of semiquavers with no rests or long notes"}],"quote":[{"text":"perpetual motion in the continuous rhythm","source":"Trial 2025"}]},"Drive / momentum>driving":{"what":["Driving describes a strong, steady rhythm that pushes the music forward, often a repeated quaver or semiquaver pulse in the bass, drums or rhythm guitar.","It is the standard word for a rhythm section that keeps the energy up."],"use":"Name the instrument and its note values. Link the driving rhythm to momentum, energy or urgency, and say what it supports (a melody, a riff, a build-up).","listen":["Listen for a strong repeated pulse, often low in the texture.","Notice whether it keeps going while the other parts change."],"example":"The bass guitar plays a **driving** semiquaver pattern on a single note under the chorus, which keeps the energy high.","quote":[{"text":"Driving quaver pulse providing momentum","source":"HSC 2017"}]},"Drive / momentum>momentum":{"what":["Momentum is the feeling that the music is moving forward and will keep going. It comes from steady, busy rhythms, ostinatos, repeated patterns and phrases that run into each other.","Momentum can build, be maintained or be interrupted, and each of these is worth describing."],"use":"Say what creates the momentum and whether it builds, holds or stops. Link interruptions (a pause, a sudden long note) to surprise or to a structural point.","listen":["Listen for what keeps the music moving forward.","Notice moments where the forward motion suddenly stops."],"example":"The repeated quaver ostinato builds **momentum** through the verse, so the sudden silence before the chorus has a strong dramatic effect.","quote":[{"text":"momentum is maintained with ostinato like rhythm","source":"Trial 2021"},{"text":"adds rhythmic momentum in a 'moto perpetuo' style","source":"Trial 2025"}]},"Drive / momentum>rhythmic drive":{"what":["Rhythmic drive is the forward push created by rhythm: steady pulses, repeated patterns, syncopation and accents that keep the music moving and full of energy.","Other elements can strengthen it, such as accents, louder dynamics or added percussion."],"use":"Name the parts and rhythms responsible and say how the drive increases or eases off. Link it to energy, excitement or a build to a climax.","listen":["Listen for the rhythm section or ostinato giving the forward push.","Notice whether accents and dynamics add to it."],"example":"Accented off-beats in the brass add **rhythmic drive** to the final section and push the music on to the climax.","quote":[{"text":"to give greater rhythmic drive","source":"HSC 2016"},{"text":"Expressive devices enhance the rhythmic drive","source":"HSC 2025"}]},"Duration>Rhythmic feel and character":{"what":["These words describe what a rhythm feels like, often by linking it to a kind of movement or style: dance, march, chant. They let you sum up the character of the duration as well as the note values.","Back each one up with the specific rhythms that create it."],"use":"Use a character word as a summary, then give the evidence: metre, note values, accents and tempo. For example, march-like should be supported by duple or quadruple metre, dotted rhythms and a steady crotchet beat.","listen":["Ask what kind of movement the rhythm suggests: dancing, marching, chanting or stamping.","Then find the details that create that feel."],"example":"The opening is **dance-like**, with a **lilting** melody in 6/8 over a steady bass, but the middle section turns **march-like** with dotted rhythms in a strong duple metre."},"Rhythmic feel and character>chant-like":{"what":["Chant-like describes a vocal or instrumental line that follows the rhythm of speech, often on one or a few repeated pitches. It can be in free rhythm with no strict pulse, or in a simple repeated rhythm.","The word comes from religious chant such as plainchant, and from ritual and community singing."],"use":"Say which voice or instrument is chant-like and whether it is free or measured. Link it to a ritual, solemn, hypnotic or speech-like effect.","listen":["Listen for word-led rhythms with little melodic movement.","Notice whether there is a steady beat or the rhythm follows the words."],"example":"The choir enters in a **chant-like** style on a single repeated pitch, following the rhythm of the text, which gives the opening a solemn, ritual quality.","quote":[{"text":"voices, chant-like","source":"Trial 2008"},{"text":"in a free chant-like rhythm","source":"Trial 2007"}]},"Rhythmic feel and character>lilting":{"what":["Lilting describes a light, gently swaying rhythm with a lift on each beat. It is often found in compound time (6/8) with crotchet-quaver patterns, or in a gently swung simple time.","It is close to dance-like, but gentler and more graceful."],"use":"Back it up with the metre and rhythms, such as crotchet-quaver patterns in 6/8. Link it to grace, lightness or a folk or pastoral feel.","listen":["Listen for a gentle long-short rocking movement.","Notice light articulation and a lift on each beat."],"example":"The clarinet's **lilting** 6/8 melody, built on crotchet-quaver patterns, gives the section a gentle pastoral sway.","quote":[{"text":"a lilting dance-like (rondo) motive","source":"Trial 2023"}]},"Rhythmic feel and character>march-like / warlike":{"what":["March-like rhythm has a strong, regular duple or quadruple pulse, often with dotted rhythms, accents on the strong beats and snare drum patterns. Warlike pushes this further, with heavy percussion, brass and aggressive accents.","Both suggest moving in step, but warlike also suggests threat or conflict."],"use":"Give the evidence: duple or quadruple metre, dotted rhythms, a steady crotchet beat, snare or timpani. Link it to a military, triumphant or threatening effect.","listen":["Listen for a strong left-right beat you could march to.","Notice snare drum rolls, timpani and brass fanfare figures."],"example":"The timpani and snare drum hammer out a **march-like** rhythm in 2/4, and the accented dotted figures in the brass give the section a **warlike**, threatening character.","quote":[{"text":"fast tempo, march-like or warlike","source":"Trial 2008"}]},"Rhythmic feel and character>dance-like":{"what":["Dance-like describes rhythm that makes you want to move: a clear, regular pulse, a repeating pattern and accents that give the beat a lift. It may suggest a particular dance, such as a waltz in 3/4 or a jig in 6/8.","If you can name the dance style, do so, with evidence."],"use":"Support it with tempo, metre and specific rhythms. Link it to a joyful, high-spirited or celebratory mood, or to a style or tradition.","listen":["Listen for a strong, repeating beat in a regular pattern.","Notice whether the metre suggests a known dance."],"example":"The repeating bass ostinato and accented off-beats in the violins make the section **dance-like**, with the energy of a fast folk dance.","quote":[{"text":"a lilting dance-like (rondo) motive","source":"Trial 2023"},{"text":"This high spirited dance rhythm","source":"HSC 2018"}]},"Rhythmic feel and character>stamping":{"what":["Stamping describes a heavy, strongly accented rhythm on repeated notes or chords, often on every beat, like feet stamping on the ground.","It is often played by low strings, percussion or the full orchestra at a loud dynamic, with little change of pitch."],"use":"Name the instrument and the repeated note values, and say where the accents fall. Link it to a forceful, earthy, primitive or aggressive effect.","listen":["Listen for heavy, repeated, accented chords or notes.","Notice whether the accents fall in an irregular pattern, which makes the effect more violent."],"example":"The strings play a **stamping** pattern of heavy down-bowed quaver chords with unpredictable accents, and the passage sounds forceful and primitive.","quote":[{"text":"'stamping' pattern in strings","source":"Trial 2008"}]},"Elements of Music>Pitch":{"what":["At HSC level pitch covers everything to do with the notes themselves: the tonality and scale the music is built from, the shape and motion of melodies, the range and register of each part, the chords and how they move, how consonant or dissonant the harmony is and how phrases end at cadences.","Markers want precise pitch detail tied to a specific instrument and moment, not general statements such as 'the melody goes up and down'."],"use":"In an aural answer, name the tonality early, then describe the melody (contour, motion, range) and the harmony (chord types, progressions, cadences). Always say which instrument has the material and where it happens, then explain what the pitch choice does to the mood or the structure.","listen":["Start with the bass line: it usually tells you the key, the chords and the cadences.","Follow the main melody's shape and range, then check where it sits in the instrument's register.","Listen for moments of tension and release, such as dissonances that resolve or phrases that end on V."],"example":"The excerpt is in a **minor** tonality, with an **angular** violin melody in a **high register** over **dissonant block chords** in the brass, and the tension only eases at the final **perfect cadence**."},"Pitch>Cadence type":{"what":["A cadence is the harmonic punctuation at the end of a phrase, usually two chords. The type of cadence tells the listener whether the music has finished, paused or been held back.","At HSC you need to name the cadence and explain its effect on the structure, for example a phrase that sounds like a question answered by one that closes."],"use":"Mention cadences when you discuss structure as well as pitch: they mark the ends of phrases and sections. Say where the cadence falls (end of the A section, end of a four-bar phrase) and what it does, such as closing the section or pushing the music on.","listen":["Focus on the bass at the end of each phrase: 5 to 1 suggests a perfect cadence.","Ask whether the phrase sounds closed, open or delayed."],"example":"The first phrase ends on an **imperfect cadence**, so the melody is left open, and the second phrase closes with a **perfect cadence**, which rounds off the A section."},"Cadence type>perfect / imperfect / cadential":{"what":["A perfect cadence is chord V moving to chord I (G to C in C major). It sounds final. An imperfect cadence is any cadence that ends on chord V, often I to V or IV to V. It sounds open, like a comma.","Cadential describes anything belonging to the cadence: a cadential passage leads into one, and a cadential 6-4 is chord I in second inversion placed just before V."],"use":"Name the cadence and place it: end of the first phrase, end of the section, final bar. Then give the effect: the perfect cadence closes and confirms the key, the imperfect cadence leaves the phrase unresolved and leads on. Use 'cadential' for extended endings that delay the final chord.","listen":["Follow the bass: 5 down to 1 (or up a 4th) is a perfect cadence.","A phrase that stops on a chord that wants to move is imperfect.","A long build of repeated V chords before the end is a cadential passage."],"example":"The verse ends on an **imperfect cadence** that leaves the phrase hanging, and after an extended **cadential** passage over a dominant pedal the piece closes with a **perfect cadence** in the tonic.","fig":[{"file":"s5_cadences.png","caption":"The four main cadences in C major"}],"quote":[{"text":"with a perfect cadence","source":"Trial 2023"},{"text":"Use of imperfect cadence... unresolved","source":"HSC 2016"},{"text":"an extended cadential section","source":"HSC 2018"}]},"Pitch>Consonance / dissonance":{"what":["Consonance is when notes sound stable and blend together, such as the 3rds, 5ths and octaves in a major or minor triad. Dissonance is when notes clash and sound tense, such as seconds, sevenths and tone clusters.","Most music moves between the two: dissonance builds tension and consonance releases it."],"use":"Say which notes or instruments clash, how strong the clash is (mild, harsh, semitone) and whether it resolves. Link dissonance to tension, unease or energy and consonance to calm, stability or arrival.","listen":["Listen for chords that sound sour or crunchy against those that sound settled.","Check whether a clash moves to a stable chord or stays unresolved."],"example":"**Dissonant** **clusters** in the low piano build tension through the opening, and the move to a **consonant** major chord at the cadence brings a sense of release."},"Consonance / dissonance>semitone dissonance":{"what":["A semitone dissonance is a clash between two notes only a semitone apart, such as C against C sharp or E against F. It is the harshest interval in Western music. The same clash heard a major 7th or a minor 9th apart still sounds sharp, just less crowded."],"use":"Point out which two parts clash, for example a melody note rubbing a semitone against a pedal note in the bass. Link it to sharp tension, discomfort or menace, and say whether it resolves by step or is left hanging.","listen":["Listen for a grating, buzzing clash between two close notes.","Check whether one note slides away by a semitone to resolve it."],"example":"In the bridge the violins hold an F against the E in the bass, a **semitone dissonance** that grinds against the pedal and makes the passage sound uneasy.","fig":[{"file":"kb_semitone_tone.png","caption":"E to F is a semitone: the closest two notes can be"}],"quote":[{"text":"creates semitone dissonances against the tonic pedal point","source":"Trial 2007"}]},"Consonance / dissonance>dissonant / dissonance":{"what":["Dissonance is the sound of notes that clash and seem to want to move somewhere else. Seconds, sevenths, the tritone and clusters are dissonant. How harsh it sounds depends on the interval, the register and how loud and long it is.","In older styles dissonance is usually resolved; in much 20th and 21st century music it is left as part of the sound."],"use":"Grade the dissonance (slightly, strongly, harshly) and say where it comes from: a chord type, a clash between parts or a pedal. Link it to tension, instability, conflict or anxiety, and mention whether it resolves.","listen":["Listen for chords that sound sour or restless rather than settled.","Notice whether the clash eases into a stable chord or carries on."],"example":"The brass build increasingly **dissonant** chords over the timpani roll, and the lack of resolution keeps the tension high to the end of the section.","fig":[{"file":"s5_cons_diss.png","caption":"A consonant C major chord next to a dissonant cluster"}],"quote":[{"text":"much use of dissonance... to create tension","source":"HSC 2016"},{"text":"Predominance of slightly dissonant chords","source":"Trial 2024"}]},"Consonance / dissonance>clusters / cluster-like":{"what":["A tone cluster is a chord of three or more neighbouring notes, a tone or semitone apart, played together. On piano it can be played with the flat of the hand or the forearm. Cluster-like describes a chord that is not a strict cluster but packs close intervals together so it sounds thick and blurred."],"use":"Say who plays the cluster, its register and its dynamic, because a soft high cluster shimmers while a loud low cluster sounds heavy and threatening. Link it to dissonance, density and tension, and to texture as well as pitch.","listen":["Listen for a thick, smudged chord where you cannot pick out separate notes.","Notice whether the cluster is struck, held or built up note by note."],"example":"Soft, high **clusters** in the divided violins shimmer behind the solo flute, so the harmony sounds blurred and the opening feels suspended in time.","fig":[{"file":"s5_cons_diss.png","caption":"The right-hand chord is a cluster: neighbouring notes played together"}],"quote":[{"text":"Tone clusters","source":"HSC 2016"},{"text":"Very low cluster-like chords","source":"Trial 2023"}]},"Consonance / dissonance>consonant":{"what":["Consonant intervals and chords sound stable and blend well. Unisons, octaves, perfect 5ths and 4ths are consonant, and so are 3rds and 6ths, which is why major and minor triads sound at rest.","In tonal music the ear hears consonance as arrival or rest, so a consonant chord after dissonance feels like a release."],"use":"Use 'consonant' to describe stable passages and, most usefully, the moment dissonance resolves. Name the chord or interval and link it to calm, stability, warmth or a sense of arrival at the end of a section.","listen":["Listen for chords that sound smooth and finished.","Notice when a tense passage gives way to a clear major or minor chord."],"example":"After the clashing middle section, the strings settle on a **consonant** major triad, which gives a calm sense of arrival at the end.","fig":[{"file":"s5_cons_diss.png","caption":"The C major chord on the left is consonant"}],"quote":[{"text":"resolving to consonant chords","source":"HSC 2021"}]},"Pitch>Harmony and chord quality":{"what":["Harmony is the notes sounding together underneath or alongside the melody. Chord quality is the type of chord: major, minor, diminished, augmented, seventh or chords built in 4ths or 5ths.","This category also covers how chords are laid out (block or broken, root position or inverted) and how they behave (pedal points, suspensions, resolution)."],"use":"Do not stop at 'there are chords'. Name the chord types, who plays them and how they are set out, then link them to the mood. Major 7ths and quartal chords sound open and modern, diminished chords sound tense and suspensions delay the resolution.","listen":["Listen to the bass to hear when the chord changes.","Ask whether each chord sounds bright, dark, tense or hollow.","Notice whether the chords are struck together or spread out one note at a time."],"example":"The strings play **block chords** in **root position** over a **pedal point** in the cellos, and a **suspension** in the violas delays the resolution until the final bar."},"Harmony and chord quality>tonic-and-dominant based":{"what":["Tonic-and-dominant based harmony relies mainly on chord I (the tonic) and chord V (the dominant), switching between them. In C major that means C and G (often G7). It is the simplest way to set up a key and is common in folk songs, marches, early Classical music and many pop songs."],"use":"Say that the harmony is simple and centred on I and V, then link it to the effect: a clear key, stability and a light, straightforward character. It also pairs well with a comment on harmonic rhythm, such as one chord per bar.","listen":["Listen for the bass alternating between two notes
